 9、13 頁（作者簡介、前言）","title":"黃國松：從整脊走向經筋的路線","body":"本書主編黃國松（1944 年生，台中人）的學習路線，正好對應老師在課堂提到的「整脊＋經筋」系統。\n- 早年跟隨**苟亞博**研究脊椎與神經的病理變化。\n- 1990 年起覺得只看脊椎找不全病因，開始把《靈樞》的經筋系統和脊椎神經放在一起研究。\n- 之後陸續加入四肢結構與生物力學（1992）、結構工程與動態力學（1993）、血液流變學（1995），並整理出臟腑與經筋通道互相影響的臨床觀察。\n- 另著有《脊椎手療法》《四肢手療法》，本書是這一系列的第三本。\n**讀這本書的定位**：本書把經筋當「地圖」、解剖與力學當「零件說明」，治療幾乎都是軟組織手法（按、壓、推），關節矯正只出現在少數章節。它和課堂的骨盆三角度系統是互補，不是取代。\n!! 課堂整理的人名來自錄音辨識（見 k-lineage），可用本書作者簡介對照確認。","tags":["黃國松","苟亞博","經筋","整脊","流派","參考書"],"muscles":[],"points":[],"regions":[],"book":"jingjin"},{"id":"b-jingjin-principles","cat":"原則","src":"參考書《經筋手療法圖解》p.22","title":"經筋手療法的十條手法觀念","body":"作者在治療總論列出他的操作觀念，重點整理：\n- **從末端往中心看**：經筋起於四肢末端、內陰外陽，一層層往軀幹走，所以要用「動態結構力學」分析關節與軟組織損傷。\n- **酸脹痛是訊號**：酸、脹、痛和功能衰退，都代表結構出現不平衡。\n- **陽病先鬆陰、陰病先鬆陽**：要處理某條陽經筋，先放鬆它的陰面；反之亦然。\n- **小陰陽、大陰陽**：一手按一條經筋的筋結，或雙手同時按表裡兩條經筋的點；單手或單腳算小陰陽，兩手或兩腳算大陰陽。\n- **由遠而近**：順序從手腳往頭、軀幹。\n- **四種平衡**：左右、上下、前後、裡外都調平衡，功能自然跟上。\n這與課堂「一緊一鬆才會痛、先鬆縮短的那一側」是同一個邏輯。\n!! 本書一律由遠端往近端做；課堂膝痛是「先看上（骨盆）、再看下、最後局部」，見「衝突比對」。","tags":["手法觀念","陰陽","由遠而近","平衡","參考書"],"muscles":[],"points":[],"regions":[],"book":"jingjin"},{"id":"b-jingjin-forces","cat":"原則","src":"參考書《經筋手療法圖解》p.18–19","title":"垂直力學、交叉力學與對應力","body":"本書在「診斷」一章用三種力學解釋為什麼痛點常在遠處：\n- **垂直力學**（重力造成）：同側由下往上傳。例如右踝的軟組織問題，可往上影響右髖外側、右肩、右耳與右顴骨；右腳掌、右髖、右腹腔、右胸腔都可能牽動右頸後側。\n- **交叉力學**（走路擺動造成）：對角傳遞。例如右內踝可影響左肩與左頸內側；右腿影響左肩。\n- **對應力**：一側勞損，另一側會自動調節形成反向張力，例如右前側勞損，對應力出現在左後側。\n- 作者把頸部每側再分前、外、後三等分，用來描述是哪一路力量傳上來。\n**臨床用法**：肩頸痛除了看同側腳踝，也要檢查對側內踝，並左右對比找筋結。\n這與課堂「四大平衡的對角關係」（右肩胛 ↔ 左骨盆，經 [[m:lat]]、胸腰筋膜、[[m:glute_max]]）方向一致。\n[[fig:b-jingjin-fig-forces]]","tags":["垂直力學","交叉力學","對應力","對角","參考書"],"muscles":["lat","glute_max"],"points":[],"regions":["ankle","cspine","shoulder","hip"],"book":"jingjin"},{"id":"b-jingjin-exam","cat":"評估","src":"參考書《經筋手療法圖解》p.20–21","title":"經筋檢查：左右對比與分線推壓","body":"作者的檢查流程：先問主訴、望聞問切，再沿受阻的經筋**由下往上**找肌腱、韌帶上的異常點。\n**判讀原則**\n- 先「按」查淺層，再「壓」查深層，最後用按中帶推、壓中帶推看周圍組織。\n- 俯臥先檢查十二經筋在手腳的**起點**，同一條經筋左右對比：有問題的一側**較厚實、較飽滿或有壓痛**。仰臥再複檢一次。\n**分線推壓（從中心線往兩邊推）**\n- 大腿外側：以髂脛束為中線，前半往前推、後半往後推。\n- 大腿內側：以股薄肌為中線，同樣前後分推。\n- 小腿後側、腳底：分內外兩半，內半往內、外半往外。\n- 足背相反：內半往外拉、外半往內拉。\n- 臀部（含薦椎）用前臂推壓，留意髂嵴上緣；腰用拇指或肘尖；腹部用指腹或掌根。\n[[fig:b-jingjin-fig-split]]\n!! 課堂說橫向撥是「破壞」、之後要順纖維理順；本書的分線推壓多為橫向，見「衝突比對」。","tags":["觸診","左右對比","筋結","分推","參考書"],"muscles":["tfl_itb","adductors","gastroc","plantar"],"points":[],"regions":["hip","knee","foot"],"book":"jingjin"},{"id":"b-jingjin-checkpoints","cat":"經筋","src":"參考書《經筋手療法圖解》p.23–24、283–288","title":"足六經筋的通過點：踝、膝、恥骨對照","body":"本書把每條經筋經過的關節整理成「檢查與調整指標」，很適合當觸診地圖：\n|經筋|踝|膝|骨盆附近|往上|\n|---|---|---|---|---|\n|足太陽|外踝後|膝後|薦髂關節|腰背 → 枕骨、頭頂|\n|足少陽|外踝下|膝外側|髂骨外側|胸外側 → 頭側、顴骨外側|\n|足陽明|外踝前|膝前|恥骨上支、盆腔前|腹、胸前 → 頸、臉前|\n|足太陰|內踝下|膝內側|恥骨上支|腹胸前外側 → 頸外側|\n|足厥陰|內踝前|膝內前|恥骨上支|腹胸前外側 → 頸外側|\n|足少陰|內踝後|膝內後|恥骨下支|腰胸椎體內側 → 顱內|\n手三陰都經過腕、肘、肩進胸腔（太陰在前、厥陰在外側、少陰在後背）；手三陽經過腕、肘、肩上到頭面。\n- 用法：先在踝周找出哪一路較厚、較痛，再沿同一路往膝、恥骨、軀幹追。\n- 穴位參考（我們加的）：[[p:BL60]]、[[p:GB40]]、[[p:ST41]]、[[p:SP5]]、[[p:LR4]]、[[p:KI3]]。\n[[fig:b-jingjin-fig-checkpoints]]","tags":["經筋","觸診地圖","踝","恥骨","參考書"],"muscles":[],"points":["BL60","GB40","ST41","SP5","LR4","KI3"],"regions":["ankle","knee","pubis","sacrum","pelvis"],"book":"jingjin"},{"id":"b-jingjin-routes","cat":"經筋","src":"參考書《經筋手療法圖解》p.5–17","title":"作者對經筋範圍的現代延伸","body":"每條經筋都附「現代文詞解說」圖，作者把《靈樞》的循行換成肌肉與骨性標誌，也加了自己的臨床延伸：\n- **足陽明**：沿腓骨、膝外側、大轉子上行後，作者認為還會經腋下轉到**背部約第 6 胸椎到第 10 肋**一帶；前面由腹股溝韌帶、腹直肌經胸骨柄旁、胸鎖關節上到下頷角與耳前。\n- **足太陰**：從腹股溝韌帶經腹、胸前偏外側，**延伸到臉部**。\n- **足厥陰**：大腿內側上到髂前下棘；腹胸前側與外側的交界、**臉部前外側交界**也歸它。\n- **手少陰**：除了胸內、膈、臍，作者也把**背後的肋間肌**劃入。\n- **手陽明**：左手陽明跨過頭頂到右側下頷關節，與《靈樞》交叉到對側下頷一致。\n- 左側經筋管左半身，例如整片左後背都屬左足太陽。\n!! 足太陰、足厥陰延伸到臉部是作者的詮釋，《靈樞》原文與課堂筆記（k-sinew-foot-yin）都沒有；引用時請標明「本書觀點」。","tags":["經筋循行","足陽明","足太陰","足厥陰","手少陰","參考書"],"muscles":["rectus_abd"],"points":[],"regions":["tspine","head","pubis"],"book":"jingjin"},{"id":"b-jingjin-techniques","cat":"手法","src":"參考書《經筋手療法圖解》p.22–23","title":"經筋十法：按壓推滑勾扣撥轉捻擦","body":"作者強調手法本身不特殊，重點是在經筋理論指導下排除通道上的阻塞。十種基本手法：\n|手法|做法（重寫）|\n|---|---|\n|按|指腹或掌根垂直下壓，要有麻、痛、脹感|\n|壓|按的加深：體重由腰帶到接觸點；肌肉厚處用前臂|\n|推|壓點往一側慢慢移動，可按中帶推、壓中帶推|\n|滑|壓住後帶著體重往前送|\n|勾|壓住後帶著體重往後拉|\n|扣|指腹滑進纖維深層再往外壓，用在條索狀處|\n|撥|把纖維化的肌腱、條索由一側滑到另一側|\n|轉|活動關節，配合壓推扣撥，以動移痛|\n|捻|壓中帶轉，把壓痛瞬間帶過，多用在手掌腳掌|\n|擦|掌或魚際直線快速來回生熱|\n- 全身結構檢查以「按兼壓」為主；肋間等肌肉薄處也用按兼壓。\n- 肘尖只用在腳底與第 5 腰椎橫突附近。\n課堂對應：與「用身體重量垂直往下」（k-weight）相同，[[m:erector]] 旁用拇指或前臂。","tags":["手法","按法","壓法","推法","扣法","參考書"],"muscles":["erector"],"points":[],"regions":[],"book":"jingjin"},{"id":"b-jingjin-dose","cat":"手法","src":"參考書《經筋手療法圖解》p.33–40、152、156、284","title":"力道與時間：3–5 秒、不超過 30 秒","body":"本書幾乎每個手法都標了時間，可整理成「劑量表」：\n- 一般筋結：每次按壓 **3–5 秒**，可連續 2–3 次。\n- 經筋起點或筋結舒緩：單次**不超過 30 秒**。\n- 前臂整片下壓（如小腿前外側）：5–10 秒，2–3 次。\n- 足跟外側這種筋膜很厚的筋結：短刺激即可，**每次不超過 3 秒**。\n- 力道由輕而重、漸進施壓，以客人**不對抗又能承受**為準。\n**兩個檢驗標準**\n1. 按揉時會酸痛，但手一離開，**痛感不應殘留**；殘留就是手法錯了。\n2. 力量不要直接壓到軟組織下面的骨頭（足弓、脛骨旁最容易犯）。\n- 舒緩腋下 [[m:serratus]] 與肋間要慢慢滲透，太快容易讓客人呼吸困難。\n!! 課堂的標準是「很痠但不想逃」；本書更強調離手後不殘留痛，兩者可合併使用，見「衝突比對」。","tags":["力道","時間","劑量","安全","參考書"],"muscles":["serratus"],"points":[],"regions":[],"book":"jingjin"},{"id":"b-jingjin-chest-foot","cat":"經筋","src":"參考書《經筋手療法圖解》p.143–156","title":"胸背肌肉與腳上的對應點","body":"胸背章的每條肌肉，都先處理腳上的對應點，再做局部：\n|局部問題|先檢查的遠端點|經筋|\n|---|---|---|\n|[[m:pec_major]]|同側足弓|足太陰|\n|[[m:pec_minor]]|足背第 1、2 趾縫、第 1 蹠骨內側、股骨內髁上方|足厥陰|\n|胸骨柄旁肋軟骨|足背第 2–4 趾|足陽明|\n|前胸斜肋|足弓前段（第 1 蹠骨近端內側）|足太陰|\n|[[m:serratus]]|足背第 4、5 趾間|足少陽|\n|棘突旁（[[m:erector]]）|小腿後側深層|足太陽|\n|[[m:levator]]|同側足跟外側|足太陽|\n- 判斷都靠**左右對比**：局部有筋結的同側，腳上的對應點通常也較厚、較痛。\n- 腳上的點鬆開後再做局部，局部多半已鬆一些。\n- 穴位參考（我們加的）：[[p:LR2]]、[[p:GB41]]、[[p:SP4]]。\n[[fig:b-jingjin-fig-chest-foot]]","tags":["遠端取點","胸小肌","前鋸肌","足背","參考書"],"muscles":["pec_major","pec_minor","serratus","erector","levator"],"points":["LR2","GB41","SP4"],"regions":["tspine","foot","scap"],"book":"jingjin"},{"id":"b-jingjin-neck-distal","cat":"頸肩","src":"參考書《經筋手療法圖解》p.36、57–70","title":"頸部肌肉的遠端與交會處理點","body":"頸部章的特色：每條頸部肌肉都配一到兩個遠端或交會點。\n- [[m:scm]]：足太陰經過的**恥骨上支**——客人仰臥屈膝，前臂貼恥骨上支，把膝推向對側、前臂同時往恥骨聯合滑；另配足弓外後側。\n- [[m:trap_u]]：足太陽的**外踝下方**，加上手少陰、手厥陰的肘內上方。\n- [[m:levator]]：足少陽的肩胛骨內層（手指慢慢滑進肩胛骨底下），再配外踝下方。\n- 前斜角肌（[[m:scalene]]）：手太陰與足陽明的交會點——**胸鎖關節**。\n- 中斜角肌：腋下前鋸肌、小腿腓骨後下半、小腿前外側 1/4。\n- 後斜角肌：沿肋骨下緣處理，**不可用力往上推**，否則可能把肋骨推移位。\n**外踝下方的檢查**：食指、中指放兩側外踝下，拇指放內踝下，左右比較；頭頸的很多手法都從這裡開始。\n- 穴位參考：[[p:BL62]]、[[p:ST30]]。","tags":["頸部","斜角肌","胸鎖乳突肌","遠端取點","參考書"],"muscles":["scm","trap_u","levator","scalene"],"points":["BL62","ST30"],"regions":["cspine","pubis","ankle"],"book":"jingjin"},{"id":"b-jingjin-ribs","cat":"脊椎","src":"參考書《經筋手療法圖解》p.133–140","title":"肋骨移位：吸氣受限還是吐氣受限","body":"本書把胸椎小關節紊亂中的「肋骨移位（肋椎關節錯位或半錯位）」分三段：\n- **第 1、2 肋**：斜角肌從上面拉，多半**往上**移位。\n- **第 3–10 肋**：吸氣時往外上、吐氣時往內下，要分辨**吸氣受限**還是**吐氣受限**。\n- **第 11、12 肋**：多半**往下**移位。\n**檢查**：俯臥、雙手上舉；兩拇指放在胸椎橫突外側的肋骨上，用體重下壓，請客人深吸、深吐。出現滲透性的痛，吸氣痛大於吐氣痛 → 吸氣受限；吐氣痛較大 → 吐氣受限。\n**調整**：先推開表層軟組織，拇指橈側貼在橫突外約 2.5 cm 的肋骨邊緣，另一手豌豆骨疊上。帶客人同步呼吸 2–3 次，在**吐氣快吐完的瞬間**輕推：吸氣受限由下緣往上推，吐氣受限由上緣往下推。\n[[fig:b-jingjin-fig-ribs]]\n- 與課堂「吐氣時施力」（k-breath）一致；力量要輕，骨質疏鬆者不做。","tags":["肋骨","呼吸","胸椎","矯正時機","參考書"],"muscles":["scalene","diaphragm"],"points":[],"regions":["tspine","diaphragm"],"book":"jingjin"},{"id":"b-jingjin-lumbar","cat":"脊椎","src":"參考書《經筋手療法圖解》p.167、172–174","title":"腰肌勞損與側彎：橫突觸診與凹側處理","body":"**檢查**：客人俯臥，三指並排從腰椎橫突上方、橫突外側約 45° 的方向往下內按。\n- 腰肌勞損：橫突外側的軟組織較寬、較厚實。\n- 腰椎側彎：兩側橫突的高低落差變大。\n**作者對側彎的看法**：腰椎長期勞損時，[[m:iliopsoas]] 與 [[m:ql]] 互相拮抗、攣縮，把腰椎拉成側彎，所以重點放在**凹側**。\n**手法重點**\n- 側臥、凹側朝上，治療者用膝與前臂下壓，舒緩臀部周圍與髂腰肌。\n- 腰前側的筋結：拇指從腰前上方往腰後下方壓。\n- 遠端：凹側膝窩內側 1/3、外側 1/3 的深層筋結（足太陽）。\n- 另配兩側髂嵴上緣（足太陽、足少陽）、大腿內側膝上方（足三陰）。\n!! 課堂認為腰椎側彎多從骨盆、薦椎（第三角度）來，要先看底座；本書偏重腰大肌與腰方肌的拮抗，兩者可並用，見「衝突比對」。","tags":["腰椎","側彎","腰大肌","腰方肌","橫突","參考書"],"muscles":["iliopsoas","ql","erector"],"points":["BL40"],"regions":["lspine","pelvis","knee"],"book":"jingjin"},{"id":"b-jingjin-si","cat":"薦椎","src":"參考書《經筋手療法圖解》p.186–187、193–196","title":"薦髂關節錯位：受傷機轉與軟組織處理","body":"**為什麼會錯位**：薦髂關節是微動關節，耳狀面互相嵌插，平時只隨骨盆前傾後仰輕微轉動；懷孕、產後、韌帶鬆弛者活動範圍變大，超出範圍的扭轉才會錯位。\n- **向前錯位**：在**伸髖、屈膝**時發生（衝刺、跳遠、單腿屈膝用肩頂重物）。[[m:rectus_fem]] 等股四頭肌強力收縮把髂骨往前拉，加上後方韌帶牽制，關節面被反向扭轉。\n- **向後錯位**：在**屈髖、伸膝**時發生（跨溝、彎腰搬重物）。[[m:hamstrings]] 強力收縮，把坐骨往前帶。\n**檢查**：俯臥，兩拇指壓兩側薦髂關節，有問題側較厚實、飽滿或壓痛。\n**手法**（都是軟組織）：\n1. 仰臥，前臂壓髂前上棘內側、腹股溝內側（足陽明）。\n2. 小腿後側深層筋結（足太陽）。\n3. 俯臥前臂推薦髂周圍；或側臥、患側大腿架在治療者腿上，用前臂下壓。\n[[fig:b-jingjin-fig-si]]\n!! 機轉與課堂第一角度 A（股直肌）、P（膕繩肌）一致；但本書檢查不分 A/P/EX/IN，見「衝突比對」。","tags":["薦髂關節","錯位","股直肌","膕繩肌","參考書"],"muscles":["rectus_fem","hamstrings"],"points":[],"regions":["sacrum","pelvis"],"book":"jingjin"},{"id":"b-jingjin-pubic","cat":"骨盆","src":"參考書《經筋手療法圖解》p.58、189–192、203–206","title":"恥骨上支一高一低：高側鬆上緣、低側鬆下緣","body":"恥骨上支在本書出現很多次：腰骶關節損傷、椎間盤突出、產後腰腿痛、胸鎖乳突肌都會用到。\n**檢查**：客人仰臥，兩拇指放兩側恥骨上支，**指腹朝腳底方向**壓，比較兩側高低與軟組織張力。\n**手法**\n- 一高一低時：**高的一側舒緩上緣，低的一側舒緩下緣**。\n- 治療者坐在患側床邊，前臂貼恥骨上支（低側改貼下緣），雙手抱住客人屈起的膝。\n- 把膝由外往內慢慢推，前臂同時往恥骨聯合方向滑，約 3 次、由輕到重。\n- 恥骨下支的筋結（足三陰）用拇指從內側掃描，力量更輕、漸進。\n**和課堂的連結**：課堂第三角度提到「恥骨聯合高低、鼠蹊痛」，也記有「鎖骨 ↔ 恥骨」的對應；本書給了可以操作的手法。相關肌：[[m:adductors]]、[[m:rectus_abd]]。\n- 鼠蹊有股動脈、神經，避開搏動處；孕婦不做。","tags":["恥骨","恥骨聯合","產後","腰骶","參考書"],"muscles":["adductors","rectus_abd","scm"],"points":["ST30"],"regions":["pubis","pelvis"],"book":"jingjin"},{"id":"b-jingjin-hip-tests","cat":"評估","src":"參考書《經筋手療法圖解》p.212、214、218、228","title":"髖的三個快速檢查與髖肌分類","body":"**1. 屈髖受限**：仰臥，扶膝把大腿往腹部推；能靠近腹部為正常，離很遠為受限。\n**2. 伸髖受限**：俯臥，看兩側髂前上棘附近與床的間隙、兩腳跟高度；有問題側**髂前上棘外側間隙較大、腳跟較高**。\n**3. 內旋受限**：仰臥屈膝，把膝往腹部推並內旋，兩腿交換；受限側會不舒服或酸痛。\n**本書的髖肌分類（重點）**\n|動作|主要|輔助|\n|---|---|---|\n|屈髖|[[m:iliopsoas]]、[[m:rectus_fem]]、[[m:sartorius]]、[[m:tfl_itb]]|恥骨肌、內收肌群|\n|伸髖|[[m:glute_max]]、[[m:hamstrings]]、內收大肌後部|內收長短肌、臀中小肌後部|\n|外旋|臀後六肌（[[m:deep_rot]]）|臀中小肌後部、髂肌|\n|內旋|臀中、小肌前部|屈髖時闊筋膜張肌、伸髖時內收肌|\n!! 「腳跟較高」的意思要和課堂「A 側為長腳」對照確認，見「衝突比對」。","tags":["髖","屈髖","伸髖","內旋","肌肉分類","參考書"],"muscles":["iliopsoas","rectus_fem","sartorius","tfl_itb","glute_max","hamstrings","deep_rot"],"points":[],"regions":["hip","pelvis"],"book":"jingjin"},{"id":"b-jingjin-obturator","cat":"神經","src":"參考書《經筋手療法圖解》p.212","title":"閉孔神經：髖的問題常以膝痛表現","body":"髖部章點出一個很實用的鑑別線索：\n- 髖關節的感覺神經，前方來自股神經與閉孔神經，後方來自臀上神經與坐骨神經，但**大部分由閉孔神經支配**。\n- 閉孔神經同時也支配膝關節，所以**髖關節有問題的人常說膝蓋痛**。\n**臨床用法**\n- 膝痛但膝本身查不出明顯問題（不腫、彎曲不卡）時，回頭做髖的屈曲、伸展、內旋檢查（見「髖的三個快速檢查」），並摸 [[m:adductors]]、[[m:iliopsoas]] 是否緊。\n- 這和課堂膝痛的追查順序「1 上、2 下、3 局部」吻合：先看上面的股骨與骨盆。\n- 內收肌群（閉孔神經支配）緊時，膝內側也常一起不舒服；放鬆時從膝上往鼠蹊分段做，鼠蹊處力道放輕。\n- 年長者膝痛合併明顯跛行、夜間痛、休息不緩解，要想到髖關節本身病變（退化、股骨頭壞死），請轉介。","tags":["閉孔神經","轉移痛","髖","膝痛","參考書"],"muscles":["adductors","iliopsoas"],"points":[],"regions":["hip","knee"],"book":"jingjin"},{"id":"b-jingjin-sciatica","cat":"骨盆","src":"參考書《經筋手療法圖解》p.187、199–202","title":"梨狀肌型坐骨神經痛的經筋處理","body":"**機轉**：下肢過度外展、外旋，或從蹲姿突然站起時，[[m:piriformis]] 收縮不協調或被突然拉扯而受傷；病程久了或合併椎間盤突出、小面關節問題時，周圍循環變差、纖維化，形成無菌性發炎，出現下肢放射麻痛。\n**檢查**：俯臥，兩拇指壓在**薦椎與大轉子之間**的梨狀肌，有問題側較厚實、飽滿或壓痛。\n**手法順序（由遠到近）**\n1. 膝窩內外側（足太陽）：推開表層，舒緩深層筋結；膝窩有血管神經，要輕。\n2. 大腿後側中線兩側（足太陽）：推開表層肌束，處理深層。\n3. **健側**膝外側下方（足少陽）：兩側比較，健側筋結較明顯者就是主筋結點，先處理。\n4. 自體牽引（請先看「安全」條目）。\n- 穴位參考：[[p:BL40]]、[[p:BL37]]、[[p:GB34]]、[[p:GB30]]。\n!! 本書沒有直腿抬高等神經檢查；課堂的真假坐骨神經痛鑑別（k-slr）要先做，見「衝突比對」。","tags":["坐骨神經","梨狀肌","健側","膝窩","參考書"],"muscles":["piriformis","hamstrings","deep_rot"],"points":["BL40","BL37","GB34","GB30"],"regions":["hip","pelvis","knee"],"book":"jingjin"},{"id":"b-jingjin-knee-cross","cat":"膝","src":"參考書《經筋手療法圖解》p.246–254","title":"側副韌帶傷：先鬆健膝之陽，再解患膝之陰","body":"本書處理膝關節的特色是**從健側開始**，並遵守陰陽互補的順序。\n**內側副韌帶損傷**（多因膝外側受撞、小腿被迫外展）\n1. 先比較兩膝外側，若**健側**膝外側上緣的筋結比患側明顯，先舒緩健側（足三陽）——作者的說法是先鬆健膝之陽、再解患膝之陰。\n2. 再處理患膝內側下緣、內側上緣（足三陰），體重經拇指漸進下壓。\n**外側副韌帶損傷**：順序相反——先鬆健膝內側上緣（足三陰），再處理患膝外側上下緣（足少陽）。\n**半月板**：同樣先鬆陽、再解陰；內側半月板外緣由內往外推撞舒緩，外側半月板順序相反。\n**課堂對照**\n- 與「左病右治」（k-sinew-def）、「陽病先鬆陰」的原則一致。\n- 有斷裂疑慮（腫脹、不穩、外傷時有聲響）先轉介，只做周邊放鬆。\n- 相關：[[m:sartorius]]、[[m:hamstrings]]、[[m:popliteus]]；穴位 [[p:GB33]]、[[p:LR8]]。","tags":["膝","側副韌帶","健側","陰陽順序","參考書"],"muscles":["sartorius","hamstrings","popliteus"],"points":["GB33","LR8"],"regions":["knee"],"book":"jingjin"},{"id":"b-jingjin-meniscus","cat":"膝","src":"參考書《經筋手療法圖解》p.244–245","title":"半月板：內側易橫裂，外側承壓大","body":"本書對兩片半月板的描述：\n- **內側半月板**：C 形、前窄後寬、邊緣厚中央薄。後半部連著脛側副韌帶被固定、前半部較鬆，所以**前後交界處**一受扭轉就容易**橫向撕裂**。\n- **外側半月板**：接近 O 形、較小較厚，和腓側副韌帶之間隔著膕肌腱，**活動度比內側大**。作者認為正常膝有輕度外翻，脛骨外髁負重較大，股骨外髁前後滑動、旋轉時，外側也容易破裂。\n- 年長者半月板粗糙、纖維化，內側游離緣常見磨損。\n- 受傷時機：膝在屈伸中突然旋轉或內外翻，同時承受垂直壓力與剪力。\n**韌帶補充**：前十字在伸膝時最緊，防止脛骨前移；後十字在屈膝時最緊，防止脛骨後移；膕斜韌帶是半膜肌腱的反折，防止膝過度伸直。\n!! 課堂說「內側最容易受傷、外側很少」（k-meniscus）；本書認為外側承壓大也易破，見「衝突比對」。\n- 相關：[[m:popliteus]]、[[m:hamstrings]]。","tags":["半月板","十字韌帶","膝","解剖","參考書"],"muscles":["popliteus","hamstrings"],"points":[],"regions":["knee"],"book":"jingjin"},{"id":"b-jingjin-ankle","cat":"踝足","src":"參考書《經筋手療法圖解》p.266、270–272","title":"踝扭傷：筋結位置與「兩端先壓」","body":"**受傷機轉**：蹠屈加內翻最容易傷到外側的距腓前韌帶；單純內翻容易傷到跟腓韌帶；內側三角韌帶很強，外翻時較少斷，但可能拉傷下脛腓韌帶。\n**筋結位置（作者經驗）**\n- **外踝扭傷**：筋結常在**腓骨頭下方約三橫指**的腓骨長肌（[[m:peroneus]]）深層——不在腳踝本身。\n- **內踝扭傷**：筋結在小腿內側中下段的屈趾長肌（足太陰）。\n**手法**\n1. 治療者用彎腰帶出的推力，以拇指指腹舒緩筋結。\n2. 筋結嚴重時，先用兩拇指壓住筋結的**近端與遠端兩頭**約 30 秒，再舒緩筋結本身。\n3. 腓骨長短肌、[[m:gastroc]] 內外側頭也用同樣的「兩端先壓」。\n**課堂對照**：踝扭傷後角度變小，會往上傳到膝、腰、肩（k-ankle-chain）；本書的筋結位置是往上追查的第一站。\n- 外傷後腫脹、不能承重、骨頭壓痛，先排除骨折。\n- 穴位參考：[[p:GB34]]、[[p:GB40]]、[[p:SP6]]。","tags":["踝扭傷","腓骨長肌","筋結","兩端先壓","參考書"],"muscles":["peroneus","gastroc"],"points":["GB34","GB40","SP6"],"regions":["ankle"],"book":"jingjin"},{"id":"b-jingjin-foot","cat":"踝足","src":"參考書《經筋手療法圖解》p.40、182–183、277–280","title":"足弓與足底：推的方向與不垂直壓","body":"足部是本書全身手法的「起點」，眼睛、臉、胸大肌、腸胃問題都會先處理足弓或足背。\n**足弓（足太陰、足少陰）**\n- 先比較兩側足弓，用豌豆骨或前臂近肘處按揉。\n- 施力方向**由內下方往外上方**推。\n- 力量不可直接壓到下面的骨頭；按時酸痛，手離開後不該殘留痛。\n**足背**：腸胃功能弱的人足背蹠骨間常較緊；用雙手掌壓兩側足背比較。\n**足底筋膜深層筋結**\n- 先由上而下舒緩上段小腿肚，再處理足底。\n- 深層筋結**從旁邊推向另一側**，**避免垂直下壓**。\n**腳趾**：經筋起於指趾，先減輕足背張力，再一節一節捏揉趾基與趾節，每回合 3–5 次、由輕而重。\n- 相關：[[m:plantar]]、[[m:tib_post]]、[[m:gastroc]]；穴位 [[p:SP4]]、[[p:KI2]]、[[p:KI1]]。\n!! 課堂強調垂直對準、用體重往下（k-weight）；本書在足底深層改為側推，見「衝突比對」。","tags":["足弓","足底筋膜","足背","腳趾","參考書"],"muscles":["plantar","tib_post","gastroc"],"points":["SP4","KI2","KI1"],"regions":["foot","ankle"],"book":"jingjin"},{"id":"b-jingjin-pressure","cat":"原則","src":"參考書《經筋手療法圖解》p.18、23、31、34、41","title":"內壓觀念：經筋包住胸、腹、盆腔","body":"本書反覆出現的核心觀念：**經筋網住身體外周，也包住體內的壓力**。\n- 兩腿、兩腳掌的筋膜張力與支撐力不對稱 → 往上影響踝、膝、盆腔 → 盆腔筋膜、韌帶緊張形成**盆腔內壓** → 再影響腹腔、胸腔，甚至頭顱。\n- 所以很多頭、眼、肩的手法，會先做「胸腔壓力的消除」：左右對稱比較胸廓，找出壓力點的中心，用**柔和的重力加壓**慢慢放掉。\n- 腹部（足陽明、足少陰）由外往內漸進推按，碰到筋結時稍微減力。\n- 作者認為壓力放掉、血流順暢，軟組織才會自己修復。\n**課堂對照**：課堂筆記也有「骨頭支撐結構，造成腔壓」「髂腰韌帶會造成腹內壓」（k-iliolumbar），以及呼吸波、[[m:diaphragm]] 的觀念；本書提供了實際操作。\n- 胸腹加壓要配合呼吸、慢慢滲透；孕婦、腹部手術後、腹主動脈搏動處不壓。","tags":["內壓","胸腔","盆腔","筋膜","參考書"],"muscles":["diaphragm"],"points":[],"regions":["diaphragm","tspine","pelvis"],"book":"jingjin"},{"id":"b-jingjin-safety","cat":"安全","src":"參考書《經筋手療法圖解》p.178、181、188、207–210、276、283","title":"本書中需要謹慎看待的手法與說法","body":"本書是寫給推拿科、骨傷科醫生看的，有些內容不適合推拿師直接照做：\n- **腰椎滑脫的抱腿頓壓**：雙腿抬高 90°–120° 後配合吐氣瞬間往下頓壓。滑脫本身就是結構不穩，衝擊可能加重，**不建議操作**，先轉介影像評估。\n- **閉氣拍打的自體牽引**：客人腹部趴在椅上、手腳下垂，閉氣時拍打腰背臀。高血壓、心血管病、骨質疏鬆、椎間盤合併神經症狀者不做。\n- **膝窩放血**（足跟痛）：屬侵入性醫療行為，推拿師不做。\n- **骨盆腔內、恥骨下支的深層按壓**：私密且接近大血管與神經，需充分告知與同意；孕婦禁止。\n- **疾病宣稱**：書中認為恥骨聯合不對稱會導致子宮、卵巢病變與攝護腺肥大，高血壓者左胸腔壓力較大等，屬作者臨床觀點，**未經研究證實**，不能拿來向客人說明或取代就醫。\n- 本書幾乎沒有轉介準則，請搭配課堂的「需要先轉介的警訊」（k-redflag）使用。","tags":["安全","禁忌","轉介","腰椎滑脫","參考書"],"muscles":[],"points":[],"regions":["lspine","pelvis","knee"],"book":"jingjin"},{"id":"b-jingjin-intro","cat":"人物與流派","src":"參考書《經筋手療法圖解》","title":"參考書：《經筋手療法圖解》導讀","body":"**黃國松 主編**，人民衛生出版社（北京），2007（本掃描為 2017 年第 7 次印刷）。\n\n以《靈樞》經筋篇為綱，結合解剖、生物力學與作者的臨床經驗，把十二經筋當成全身的力學與觸診地圖。全書以照片示範各部位軟組織損傷的「檢查方式＋治療手法」，特色是左右對比找筋結、由四肢遠端往軀幹處理，以及用腳上的經筋起點處理頭頸胸背問題。另有高血壓、更年期、鼻過敏的附篇。\n\n### 章節地圖\n- **第一篇 總論・第一章 概論**（p.3–4）：經筋一詞的來源與歷代醫籍中的經筋病記載。\n- **第一篇・第二章 經筋**（p.5–17）：十二經筋的《靈樞》原文、白話解剖說明，以及作者的現代循行圖與延伸範圍。\n- **第一篇・第三章 診斷**（p.18–21）：垂直力學、交叉力學、對應力的病因觀，以及望聞問切與分線推壓的檢查法。\n- **第一篇・第四章 治療手法**（p.22–24）：十條手法觀念、十種基本手法（按壓推滑勾扣撥轉捻擦）與各經筋的通過點。\n- **第二篇 各論・第一章 頭部**（p.27–52）：頭痛分肌肉性、血管性；顳肌、枕下、頭頂、前額、下頷、眼耳鼻周肌群的檢查與遠端手法。\n- **第二篇・第二章 頸部**（p.53–70）：頸椎病的內外平衡觀；胸鎖乳突肌、斜方肌、提肩胛肌、夾肌、前中後斜角肌。\n- **第二篇・第三章 肩部**（p.71–100）：肩的懸掛結構與旋轉肌袖；棘上、棘下、大小圓、肩胛下、菱形、斜方、胸大、三角、前鋸肌。\n- **第二篇・第四章 肘腕部**（p.101–127）：網球肘、滑囊炎、橈管、旋前圓肌、肘尺管、腕隧道與手掌骨間肌問題。\n- **第二篇・第五章 胸背部**（p.128–164）：肋骨移位（吸氣／吐氣受限）、胸肋關節錯縫、胸背肌肉與腳上對應點。\n- **第二篇・第六章 腰腹部**（p.165–184）：急慢性腰扭傷、腰肌勞損與側彎、椎間盤突出、腰椎滑脫、腹部軟組織與腸胃功能。\n- **第二篇・第七章 臀部與骨盆腔**（p.185–210）：腰骶關節、薦髂關節錯位機轉、坐骨神經痛、產後恥骨聯合、盆腔與攝護腺相關手法。\n- **第二篇・第八章 髖部**（p.211–229）：髖肌六大分類表；屈髖、伸髖、外展、內收、外旋、內旋受限的檢查與手法。\n- **第二篇・第九章 大腿部**（p.230–241）：股四頭肌、內收肌群、膕繩肌、髂脛束的損傷機轉與手法。\n- **第二篇・第十章 膝部**（p.242–259）：膝的韌帶與半月板解剖；內外側副韌帶、半月板、伸膝裝置粘連，強調健側與陰陽順序。\n- **第二篇・第十一章 小腿部**（p.260–266）：腓腸肌痙攣、腓骨長短肌腱勞損，兩端先壓再舒緩筋結。\n- **第二篇・第十二章 踝足部**（p.267–280）：踝扭傷、跟腱、足跟痛、足背與足底筋膜勞損、扁平足。\n- **第三篇 附篇（高血壓、更年期綜合征、鼻過敏）**（p.283–290）：作者以經筋放鬆胸腔、盆腔、顏面筋膜處理內科與婦科問題的經驗（屬作者觀點）。\n\n### 本站整理的條目（23 則）\n- 黃國松：從整脊走向經筋的路線（PDF 第 9、13 頁（作者簡介、前言））\n- 經筋手療法的十條手法觀念（p.22）\n- 垂直力學、交叉力學與對應力（p.18–19）\n- 經筋檢查：左右對比與分線推壓（p.20–21）\n- 足六經筋的通過點：踝、膝、恥骨對照（p.23–24、283–288）\n- 作者對經筋範圍的現代延伸（p.5–17）\n- 經筋十法：按壓推滑勾扣撥轉捻擦（p.22–23）\n- 力道與時間：3–5 秒、不超過 30 秒（p.33–40、152、156、284）\n- 胸背肌肉與腳上的對應點（p.143–156）\n- 頸部肌肉的遠端與交會處理點（p.36、57–70）\n- 肋骨移位：吸氣受限還是吐氣受限（p.133–140）\n- 腰肌勞損與側彎：橫突觸診與凹側處理（p.167、172–174）\n- 薦髂關節錯位：受傷機轉與軟組織處理（p.186–187、193–196）\n- 恥骨上支一高一低：高側鬆上緣、低側鬆下緣（p.58、189–192、203–206）\n- 髖的三個快速檢查與髖肌分類（p.212、214、218、228）\n- 閉孔神經：髖的問題常以膝痛表現（p.212）\n- 梨狀肌型坐骨神經痛的經筋處理（p.187、199–202）\n- 側副韌帶傷：先鬆健膝之陽，再解患膝之陰（p.246–254）\n- 半月板：內側易橫裂，外側承壓大（p.244–245）\n- 踝扭傷：筋結位置與「兩端先壓」（p.266、270–272）\n- 足弓與足底：推的方向與不垂直壓（p.40、182–183、277–280）\n- 內壓觀念：經筋包住胸、腹、盆腔（p.18、23、31、34、41）\n- 本書中需要謹慎看待的手法與說法（p.178、181、188、207–210、276、283）\n\n條目都是用自己的話整理重點並標註頁碼，示意圖為依書中內容重新繪製；細節請對照原書。","tags":["參考書","經筋手療法圖解"],"book":"jingjin"},{"id":"b-jingjin-compare","cat":"原則","src":"參考書《經筋手療法圖解》比對","title":"《經筋手療法圖解》與課程的比對","body":"逐項比對《經筋手療法圖解》與課堂資料。共 26 項：高 3、中 8、低 15（嚴重度）。\n「衝突」＝說法相反；「程度差異」＝方向相同但做法或強度不同；「用詞不同」＝同一件事不同名稱；「補充」＝課堂沒提到或一致的地方。\n\n### 【高】滑脫椎體的衝擊手法（衝突）\n!! 滑脫屬結構不穩（峽部斷裂或退化），衝擊性手法可能加重滑移或壓迫神經根、馬尾；現代臨床指引不支持以徒手衝擊「歸位」。推拿師不操作，先轉介影像與醫師評估，推拿只做周邊肌肉放鬆。\n- **課堂：**「需要先轉介的警訊」、「各段脊椎的活動方向（小面關節）」（L4–L5 活動大、易出問題）、評估模式 「椎間盤型下背痛（慢性，痛側在上）」：避免強力扭轉與重壓腰椎，有疑慮先轉介。\n- **本書：**腰椎滑脫時把客人雙腿抱起抬高約 90°（L5）或 120°（L4），配合吐氣與治療者體重，瞬間往下頓壓使其歸位；另有閉氣拍打的自體牽引。（p.181（另見 p.178））\n\n### 【高】侵入性處置（膝窩放血）（衝突）\n!! 放血屬醫療行為，推拿師不得操作，也有感染與出血風險。可保留本書的觀察（足跟痛與膝窩、足太陽路線相關），改成輕柔的膝窩與小腿後側放鬆。\n- **課堂：**「操作禁忌與注意穴位」、「需要先轉介的警訊」：推拿以徒手為主，有疑慮先轉介；課堂沒有任何侵入性處置。\n- **本書：**足跟痛時讓客人踩在尖物上找痛點，在膝窩拍打找瘀點，再以放血針放血。（p.276）\n\n### 【高】骨盆不對稱與婦科、攝護腺疾病；骨盆腔深壓（程度差異）\n!! 課堂說的是「可能關聯」，本書寫成直接因果，沒有研究支持，不能用來對客人解釋病因。骨盆腔深壓接近髂血管、膀胱與生殖器官，涉及隱私，需事先說明並取得同意；孕婦、經期大量出血、腹部術後、疑似腫瘤者禁止。\n- **課堂：**「懷孕、產後與骨盆」、「子宮的四對韌帶」、「經痛的推拿思路」：骨盆、薦椎歪斜與經痛「可能有關」，屬老師臨床經驗，婦科問題應就醫；「操作禁忌與注意穴位」：孕婦避免腹部、腰薦部重按。\n- **本書：**認為恥骨聯合分離或角度不對稱會造成子宮、卵巢病變、肌瘤與攝護腺肥大，並示範從恥骨上方往骨盆腔內按壓「子宮肌」、沿恥骨下支掃描筋結。（p.188、207–210）\n\n### 【中】半月板哪一側容易受傷（衝突）\n- **課堂：**「半月板：越彎越痛，內側最常受傷」：內側半月板最容易受傷，外側很少；「膝關節補充：角度、半月板、膕肌、交鎖」：內側較易破裂。\n- **本書：**內側半月板因後半固定、前半鬆，交界處易橫裂；外側半月板活動度大，且作者認為正常膝輕度外翻使外側負重較大，在旋轉、前後滑動時也容易破裂。（p.245）\n- **怎麼看：**一般流行病學：整體與退化性撕裂以內側較多；急性運動扭傷（尤其合併前十字韌帶斷裂）外側並不少見。兩者描述的情境不同：慢性、年長者偏內側，急性扭轉不能排除外側。另外「外翻使外側受壓較大」的說法與一般認為內側腔室承重較多不同，以課堂為主。膝越彎越痛、卡住都先轉介影像。\n\n### 【中】經筋循行的範圍（衝突）\n- **課堂：**「足三陰經筋（腎、脾、肝）」（足太陰散胸中、著脊；足厥陰結陰器、絡諸筋）、經筋 ST 條目（斜外 → 轉子前外側 → 肋 → 屬脊）、「手三陰經筋（肺、心包、心）」（手少陰入胸中、繫臍）。\n- **本書：**作者的現代解說把足太陰、足厥陰延伸到臉部，足陽明延伸到背部約 T6 到第 10 肋，手少陰包含背後肋間肌。（p.9–16）\n- **怎麼看：**書中同一頁所引的《靈樞》原文並沒有這些延伸，屬作者以臨床觀察擴大的詮釋。背誦循行以《靈樞》與課堂筆記為準；觸診時可把本書範圍當「可能出現牽連的區域」，記錄時標明出處。足陽明到背部肋骨的部分，與課堂「轉子前外側 → 肋 → 屬脊」方向相符，算是補充。\n\n### 【中】伸髖受限側的腳跟高低 vs 長短腳（用詞不同）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」：A 側為長腳、P 側為短腿；「望診：站姿與俯臥的外觀」：俯臥足跟高的那側代表跟骨被帶高。\n- **本書：**屈髖肌緊（伸髖受限）的一側，俯臥時髂前上棘外側與床的間隙較大，腳跟「較高」。（p.218）\n- **怎麼看：**書沒有說明「高」指腳跟較靠頭側（看起來較短）還是離床較高。屈髖肌緊通常對應骨盆前傾（A），若「高」指較短，就和「A 側長腳」相反。建議實測：俯臥雙腳併攏比較內踝相對位置，同時以髂後上棘相對 S2 的高低判斷 A/P，以課堂量法為準，書的間隙觀察當補充。\n\n### 【中】骨盆評估要不要分方向（程度差異）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」、「骨盆第二角度：EX（外轉）與 IN（內轉）」、「骨盆第三角度：耳狀面外展（EX）與內收（IN）」、「處理順序：差最多的先做、最緊的先做」：量三個角度（A/P、EX/IN、耳狀面外展內收），先處理差最多的，每個角度先做最緊的肌肉，做完重量。\n- **本書：**薦髂關節只比較兩側厚實、飽滿、壓痛，再用足陽明（腹股溝內側）、足太陽（小腿深層、薦髂周圍）的軟組織手法處理，不判斷錯位方向。（p.193–196）\n- **怎麼看：**本書手法適合當課堂整復三步驟的第 2 步「創造空間」（「整復三步驟：找問題 → 創造空間 → 矯正」）；方向判斷與矯正仍用課堂三角度，處理後重新量。\n\n### 【中】腰椎側彎的來源（程度差異）\n- **課堂：**「薦椎是腰椎的底座」：側彎多從骨盆、薦椎來，只敲腰椎老師不認同；「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：第三角度造成腰椎直接側彎。\n- **本書：**長期勞損下腰大肌與腰方肌互相拮抗、攣縮形成側彎，處理凹側髂腰肌與凹側膝窩筋結。（p.167、172–174）\n- **怎麼看：**兩者不互斥：骨盆角度改變後，腰大肌、腰方肌會一長一短，反過來也會拉住骨盆。先量骨盆三角度與薦椎，再用本書的凹側處理放鬆軟組織，處理後重新評估。\n\n### 【中】椎間盤突出的轉介與手法（程度差異）\n- **課堂：**「椎間盤（慢性）與急性腰閃傷：痛側在上還是在下」、評估模式 「疑似神經根壓迫」、「椎間盤型下背痛（慢性，痛側在上）」：直腿抬高很低就放射、麻木、無力時先轉介；以周邊放鬆為主，避免強力扭轉與重壓。\n- **本書：**以軟組織手法處理：調整薦椎較高或較飽滿的一側、前上髂棘內側、恥骨上支，以及閉氣拍打的自體牽引；書中沒有列神經學的轉介條件。（p.175–178）\n- **怎麼看：**先用課堂的直腿抬高與警訊篩檢，有神經症狀先轉介；本書的遠端與恥骨手法可作為周邊放鬆。閉氣拍打不適合高血壓、心臟病、骨質疏鬆者。\n\n### 【中】坐骨神經痛的鑑別（補充）\n- **課堂：**「直腿抬高：真假坐骨神經痛」、評估模式 「梨狀肌症候群（假性坐骨神經痛）」：直腿抬高 45° 後痛、60–70° 最痛、超過 70° 不痛 → 梨狀肌；低角度放射伴麻木無力 → 神經根，轉介。\n- **本書：**只用觸診（薦椎與大轉子間的梨狀肌厚實、壓痛）判斷，再處理膝窩、大腿後側與健側膝外側下方。（p.199–202）\n- **怎麼看：**先做課堂的直腿抬高區分真假坐骨神經痛，再用本書的遠端手法；兩者互補。\n\n### 【中】高血壓與胸腔壓力（程度差異）\n- **課堂：**「內臟與胸椎：神經走短線、力學走長線」：T5–T7 與血壓的關聯為老師觀點，不是診斷；「需要先轉介的警訊」：心血管警訊先就醫。\n- **本書：**認為高血壓者左側胸腔壓力大於右側，未服藥者外壓大於內壓，並以多條經筋放鬆胸腔來改善血壓。（p.283–284）\n- **怎麼看：**屬作者觀點，可當放鬆胸廓的手法參考，但不可宣稱降壓、不可建議減藥或停藥；血壓未控制者避免長時間俯臥重壓與閉氣動作。\n\n### 【低】髖內外旋肌的分類（用詞不同）\n- **課堂：**「臀部深層肌群：外轉肌與內轉肌」：臀後六肌是股骨外轉肌；內轉肌為臀中肌前束、臀小肌、闊筋膜張肌；並提醒骨盆角度命名與股骨作用不同。\n- **本書：**p.212 表格與課堂一致（另把髂肌列為輔助外旋、伸髖時內收肌輔助內旋）；但 p.228 內旋肌插圖把髂腰肌、恥骨肌、內收肌、縫匠肌都畫進去，p.231 又說內收肌稍微外旋。（p.212、228、231）\n- **怎麼看：**書內前後不一。現代肌動學：縫匠肌是外旋肌，內收肌的旋轉作用隨髖角度改變。以 p.212 表格與課堂為準，p.228 插圖只當「內旋受限時常一起緊的肌群」。\n\n### 【低】髖關節的韌帶數目（用詞不同）\n- **課堂：**「髖關節的三條韌帶」：髂股（Y 字）、坐股、恥股三條。\n- **本書：**說髖關節韌帶共四條，並把「由髖臼進入股骨頭、供應血液」的那條稱為恥骨韌帶。（p.212）\n- **怎麼看：**書的描述其實是關節內的股骨頭韌帶（圓韌帶），不是關節囊外的恥股韌帶。現代解剖：囊外三條＋囊內股骨頭韌帶。課堂說法正確，書的命名疑有誤。\n\n### 【低】第一角度 P 的相關肌（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」：P＝半腱肌、半膜肌、股二頭肌長頭；評估模式 「骨盆後傾（第一角度 P）」 另提臀大肌、腹直肌。\n- **本書：**主要伸髖肌除臀大肌與膕繩肌外，還包含內收大肌後部。（p.212）\n- **怎麼看：**內收大肌後部起於坐骨結節、由坐骨神經支配，作用接近膕繩肌。P 側坐骨結節附近很緊時，可一起檢查大腿內後側。\n\n### 【低】薦髂錯位機轉與第一角度肌肉（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」：A 的主角是股直肌、髂腰肌；P 的主角是膕繩肌、臀大肌。\n- **本書：**向前錯位發生在伸髖屈膝，股四頭肌把髂骨往前拉；向後錯位發生在屈髖伸膝，大腿後側肌群把坐骨往前帶。（p.187）\n- **怎麼看：**一致，可以互相印證；問診時可用本書的受傷情境（衝刺、跳遠、彎腰搬重）推測是 A 還是 P。本書用「錯位」、課堂用「角度」，說法不同。\n\n### 【低】處理順序：遠端先還是骨盆先（程度差異）\n- **課堂：**「膝痛的追查順序：1 上、2 下、3 局部」（1 上、2 下、3 局部）、「評估流程：正面 → 臥姿，腳 → 骨盆 → 薦椎」（腳 → 骨盆 → 薦椎）、「從薦椎開始的全身檢查順序」（長期問題找遠端、短期找近端）。\n- **本書：**手法一律由遠端向近端，從手腳往頭身做；頭頸問題也先從外踝下方、足弓開始。（p.22、36、40）\n- **怎麼看：**課堂的「先上後下」是找原因的順序，本書的「由遠而近」是操作順序，可以並存：先依課堂找出主因，再用本書由遠端放鬆做準備。急性、短期問題依課堂原則先處理近端。\n\n### 【低】先鬆哪一側（補充）\n- **課堂：**「九成的痠痛是「被拉長的痛」」：一緊一鬆才會痛，先鬆縮短的一側；「整復三步驟：找問題 → 創造空間 → 矯正」：被拉長的肌肉不要再拉。\n- **本書：**陽經筋有病先鬆陰、陰經筋有病先鬆陽；膝傷先鬆健膝之陽，再解患膝之陰。（p.22、248）\n- **怎麼看：**都是「先處理拮抗側或對側，再處理痛處」的同一邏輯，可以對照記憶。\n\n### 【低】力道標準（程度差異）\n- **課堂：**「輕重之分：實則重、虛則輕」：痠就是有按到，找「很痠但不想逃」；虛弱、年長者減輕。\n- **本書：**按揉時有酸痛可以，但手離開後不可殘留疼痛，也不可直接壓到骨頭；單點 3–5 秒、不超過 30 秒。（p.33–40）\n- **怎麼看：**兩個標準可以合併：施壓時用課堂的主觀感受，結束後用本書的「不殘留痛」檢查是否過量。\n\n### 【低】推的方向：順纖維還是分推（程度差異）\n- **課堂：**「順纖維＝放鬆；橫向撥＝破壞」：順纖維推是放鬆，橫向撥是破壞，撥完一定要順纖維理順。\n- **本書：**檢查與疏通時從中心線往兩側分推（多為橫向），足背的方向與腳底相反。（p.20–21）\n- **怎麼看：**本書分推主要用在檢查與疏通；依課堂提醒，分推後再順纖維推一次。\n\n### 【低】足底深層筋結的施力方向（程度差異）\n- **課堂：**「用身體重量，垂直往下」：垂直對準要處理的組織，用體重往下。\n- **本書：**足底深層筋結要從旁邊推向另一側，避免垂直下壓；足弓由內下往外上推，不可壓到骨頭。（p.40、280）\n- **怎麼看：**足底骨頭淺、筋膜厚，垂直重壓容易壓到骨頭或造成瘀傷；在足底改用側推較安全，其他肌肉厚處仍照課堂垂直用體重。\n\n### 【低】交叉、對角傳導（補充）\n- **課堂：**「人體四大平衡：兩塊肩胛骨＋兩塊無名骨」：右肩胛與左骨盆經闊背肌、胸腰筋膜、臀大肌互相牽動；「踝扭傷後的代償：從腳傳到肩」：踝扭傷往上傳到膝、腰、肩。\n- **本書：**垂直力學（同側往上）與交叉力學（右內踝影響左肩、左頸），右前側勞損時對應力在左後側。（p.18–19）\n- **怎麼看：**一致；本書把腳踝也放進對角鏈，課堂的四大平衡可延伸到踝。\n\n### 【低】胸鎖乳突肌與恥骨（補充）\n- **課堂：**「臨床大原則：誰跟著誰走」：骨性對應「鎖骨 → 恥骨 → 腓骨 → 顴骨」；「髂腰橫韌帶與薦椎內壓：處理順序」：鎖骨的三角 ↔ 恥骨的三角。\n- **本書：**胸鎖乳突肌損傷的手法之一，是舒緩足太陰經筋經過的恥骨上支。（p.58）\n- **怎麼看：**與課堂骨性對應一致，本書提供了具體操作（仰臥屈膝、前臂沿恥骨上支往恥骨聯合滑）。\n\n### 【低】肋骨調整的呼吸時機（補充）\n- **課堂：**「配合呼吸做整復」：吸氣準備、吐氣時施力；「用呼吸測試椎體能不能動」：用呼吸測試椎體能不能動。\n- **本書：**帶客人同步呼吸 2–3 次，在吐氣快吐完的瞬間輕推肋骨；以吸、吐哪一邊較痛判斷受限方向。（p.133–140）\n- **怎麼看：**一致，本書把時機精確到「吐氣將盡」，並多了用呼吸痛分辨肋骨受限方向的方法。\n\n### 【低】健側優先（補充）\n- **課堂：**「經筋是什麼？」：左病右治、上病下治（參考足少陽維筋相交）。\n- **本書：**坐骨神經痛先找健側膝外側下方的主筋結；膝韌帶傷先鬆健膝。（p.202、248）\n- **怎麼看：**一致；書中的判斷標準是「健側筋結比患側明顯時，健側就是主筋結點」。\n\n### 【低】上頸椎與耳朵（補充）\n- **課堂：**「頸椎 8 對神經與症狀位置」：C2 對應顏面（眼耳口鼻）。\n- **本書：**C2 的交感神經會影響耳朵功能，耳周問題會處理頸椎兩側關節突。（p.48）\n- **怎麼看：**方向一致，屬臨床經驗；突發耳鳴、聽力驟降、眩暈要先就醫。\n\n### 【低】經筋的定義與寒熱病候（用詞不同）\n- **課堂：**「經筋是什麼？」、「經絡與經筋、營衛、痹症與四季」：經筋是經脈所濡養的肌肉軟組織；「經筋之病：寒熱與陰陽」：寒則反折筋急，熱則弛縱不收。\n- **本書：**經筋是經脈之氣結聚於筋肉關節的體系、經脈的外周連屬部分，作者特別把它看成力學結構；寒熱病候引用相同。（p.3、5、22）\n- **怎麼看：**內容一致，只是本書更強調「力學結構」與左右對稱。\n","tags":["參考書","衝突","比對"],"book":"jingjin"},{"id":"b-sizhi-method","cat":"評估","src":"參考書《四肢手療法（圖解）》p.18、179、205；前言 PDF 第 12 頁","title":"全書格式：兩側對比找筋結＋用體重按壓","body":"本書六章（肩、肘、腕與手、髖、膝、踝與足）都用同一套流程，讀熟了可以當成四肢的檢查清單。\n\n1. **先分位置或動作**：肩依「前、外、後方」與胸鎖、肩鎖、喙鎖、肩胛胸壁分區；髖、膝、踝依「哪個動作做不好」分節（屈、伸、內收、外展、內外旋）。\n2. **列出相關的肌肉、韌帶與神經節段**，一條一條查。\n3. **檢查**：客人放鬆，施術者兩手同時按在左右同一點比較；有問題那側會摸到筋結（硬結、條索）或壓痛。\n4. **手法**：每個點給兩種做法，常用肘前方（前臂靠肘處）、豆狀骨（掌根小指側）、掌根或拇指；上身微前傾，用體重往下，不用手臂硬推。\n5. **最後往上找神經源**（見「局部做完，往脊椎找神經源」）。\n\n|部位|每次按壓|次數|\n|---|---|---|\n|肩、肘、腕、手的小肌肉|3–5 秒|2–3 次|\n|臀部與髖周深層|5–10 秒|2–3 次|\n|膕繩肌（俯臥，把小腿往外轉讓肌肉浮出）|1–3 秒|2–3 次|\n\n前言另一個觀念：上肢的拮抗肌配置平均、偏重靈活；下肢偏重承重與穩定，所以髖的內收肌群明顯比外展肌強。\n這套「垂直、用體重、兩側比較」的做法與課堂一致，可直接套用。","tags":["檢查流程","兩側對比","筋結","按壓劑量","體重施力","參考書"],"muscles":[],"points":[],"regions":["shoulder","elbow","wrist","hip","knee","ankle"],"book":"sizhi"},{"id":"b-sizhi-nerve-source","cat":"神經","src":"參考書《四肢手療法（圖解）》p.11、77、117、175、182–183、244、299、304–305","title":"局部做完，往脊椎找神經源","body":"每一章解剖節的結尾都有同一段話：關節活動受限時，先把局部軟組織處理好，接著要往上找支配這群肌肉的神經根；神經根受壓就用脊椎手法解除，神經的營養順了，功能才會回來。\n\n下肢各章把它具體化成「受限動作 → 要查的節段」：\n\n|受限動作|書中要查的節段|\n|---|---|\n|髖外展、髖內旋|L4–S1|\n|髖內收|L2–L5|\n|髖屈曲|L2–L4|\n|髖伸直|L2–L5、S1–S2|\n|踝背伸|L4–S1|\n|踝蹠屈|L4–S3|\n\n- **觸診**：俯臥，兩拇指放在該節段棘突兩旁比較。書說神經根受影響的那側，L4、L5 橫突會偏向後方、旁邊肌肉繃緊；薦神經則摸薦骨外緣，問題側組織較緊、壓痛明顯。\n- **處理**：肘前方在腰旁壓放 5–10 秒；或側臥扭轉、用豆狀骨瞬間頓壓的腰椎扳法。\n[[fig:b-sizhi-fig-segments]]\n!! 課堂三分法把「主動無力、不痛」歸為神經問題並建議轉介，本書卻用手法處理神經根，見「衝突比對」。","tags":["神經根","腰薦節段","上尋神經源","脊椎手法","參考書"],"muscles":["multifidus","erector"],"points":["BL25","BL26","BL27"],"regions":["lspine","sacrum","hip","ankle"],"book":"sizhi"},{"id":"b-sizhi-sh-stability","cat":"頸肩","src":"參考書《四肢手療法（圖解）》p.4–8","title":"肩能動的兩個前提與三類肌肉","body":"書把肩的正常活動歸成兩個條件：\n1. **肩胛要穩**：肩胛骨靠肌肉固定在胸廓上。書特別提醒，**外展無力常是斜方肌或前鋸肌出問題**，不一定是三角肌或棘上肌。\n2. **肱骨頭要貼住關節盂**：靠旋轉肌袖完整。\n\n**肩周肌肉的三種角色**\n|類型|例子|出問題時|\n|---|---|---|\n|主要出力|胸大肌、斜方肌（纖維長）|動作變弱，但不太會脫位|\n|主要穩定|棘上、棘下、小圓、肩胛下肌（纖維短）|容易半脫位|\n|兩者兼具|三角肌|失去部分動力，也略有脫位傾向|\n\n其他重點：\n- 外展起始要靠棘上肌壓住肱骨頭，否則一抬手肱骨頭先往上頂；外展過 90° 後肱骨頭反而容易往下滑。外旋位外展比內旋位有力，因為肱二頭肌長頭也幫忙。\n- 胸大肌鎖骨部只幫前屈到水平，手舉過頭後反而變成後伸的角色。\n- 關節囊很鬆，穩定主要靠肌肉；肌腱帽靠近關節那層的內側纖維，年紀大後常出現不完全撕裂。\n- 喙肱韌帶外旋時繃緊；肩周發炎時它攣縮，讓肱骨停在內旋位，外展、外旋都卡住。","tags":["肩胛穩定","旋轉肌袖","外展無力","喙肱韌帶","參考書"],"muscles":["serratus","trap_m","trap_l","supraspinatus","deltoid","subscap","pec_major","biceps"],"points":["LI15","TE14"],"regions":["shoulder","scap"],"book":"sizhi"},{"id":"b-sizhi-sh-regions","cat":"頸肩","src":"參考書《四肢手療法（圖解）》p.12、15–68","title":"肩痛依位置分區的檢查清單","body":"書把肩分成七區，各列出要逐一按壓比較的結構：\n\n|受限位置|要查的結構|頁碼|\n|---|---|---|\n|肩前方|肩胛下肌（小結節）、肱二頭肌長頭、大圓肌、三角肌前內側；肱骨頭是否往前半脫位|p.15–30|\n|肩外側|棘上肌（大結節上 1/3）、棘下肌、闊背肌、三角肌、胸大肌；肱骨頭外側半脫位|p.31–42|\n|肩後方|棘下肌、小圓肌、三角肌後內側、肱三頭肌外側頭；肱骨頭上後方半脫位|p.43–50|\n|胸鎖關節|鎖骨下：胸大肌；鎖骨上：胸鎖乳突肌|p.51–52|\n|肩鎖關節|鎖骨外上：斜方肌附著；外下：三角肌|p.53–56|\n|喙鎖（喙突一帶）|胸小肌的肋骨起點與喙突附著處|p.57–62|\n|肩胛胸壁（俗稱「岔氣」）|棘上、三角、棘下、小圓、大圓、闊背、菱形、提肩胛、前鋸肌|p.63–68|\n\n- 胸鎖關節是肩帶接到軀幹的唯一關節，它卡住時整個肩都動不順（p.12）。\n- 前鋸肌觸診：仰臥、兩手上舉，兩掌平貼兩側腋下肋骨面比較（p.67）。\n- 小圓肌：俯臥兩手上舉，摸肩胛骨外緣上段的起點（p.43）。\n[[fig:b-sizhi-fig-shoulder]]","tags":["肩分區","半脫位","岔氣","胸鎖關節","觸診清單","參考書"],"muscles":["subscap","biceps","teres_major","deltoid","supraspinatus","infraspinatus","teres_minor","lat","pec_major","pec_minor","serratus","trap_u","scm","rhomboid","levator"],"points":["SI9","SI11","SI12","LI15"],"regions":["shoulder","scap"],"book":"sizhi"},{"id":"b-sizhi-biceps-lh","cat":"頸肩","src":"參考書《四肢手療法（圖解）》p.7、19–20","title":"肱二頭肌長頭腱滑出結節間溝","body":"長頭腱走在肱骨大、小結節之間的溝裡，上面有橫韌帶蓋住。手臂**過度外展加外旋**，或結節間溝因骨質增生變淺，再遇到突然用力收縮，肌腱可能滑出溝外。\n\n**檢查**：坐姿、兩手自然下垂；施術者站在背後，兩手食、中指放在肱骨頭前上方大小結節附近，兩側比較。滑脫側可摸到條索狀的肌腱在指下滑動。\n\n**書中的復位做法**\n- 仰臥，客人上臂擱在施術者大腿上並屈肘；施術者拇指頂住長頭腱的**內側**，另一手把前臂慢慢往下帶，藉前臂讓肱骨旋轉，讓肌腱滑回溝內。\n- 坐姿版：施術者從後方托住手腕往下拉，食、中指頂住肌腱內側。\n\n**背景**：長頭腱正常能承受很大的拉力（書寫約 70 kg），平時借助肌腱帽與喙肱韌帶，把肱骨頭往下、往內拉住；所以它滑脫時，肩前方會痛、也比較不穩。\n!! 課堂的肌肉資料提醒結節間溝只能輕柔橫撥；外傷後劇痛、上臂出現隆起或明顯無力（疑斷裂）時先轉介，不要做復位動作。","tags":["肱二頭肌長頭","結節間溝","肩前痛","肌腱滑脫","參考書"],"muscles":["biceps","subscap","pec_major"],"points":["LI15","LU2"],"regions":["shoulder"],"book":"sizhi"},{"id":"b-sizhi-elbow-radial","cat":"上肢","src":"參考書《四肢手療法（圖解）》p.77–103","title":"肘的三個關節與橈骨頭前後移位","body":"書把肘分成三個關節來查：\n- **肱尺關節**：查肱肌、肱橈肌、旋前圓肌、掌長肌、肱三頭肌、肘肌等；若鷹嘴明顯往後凸，要想到後脫位（p.78–91）。\n- **肱橈關節**：看**橈骨頭**有沒有往前或往後跑。仰臥，兩拇指同時按兩側橈骨頭比較，前移位那側摸起來明顯比較高；後移位則在後方較凸（p.92、94）。\n- **橈尺近側關節**：查環狀韌帶與肱二頭肌在橈骨粗隆的止點有沒有腫脹、壓痛（p.96–99）。\n\n**書中的橈骨頭矯正**：拇指扣住橈骨頭（前移往後推、後移往前推），另一手握腕上方往遠端牽引，一邊拉一邊慢慢屈肘（p.93、95）。\n\n書也提到橈骨頭本身不太穩：**屈肘時容易往後，伸肘時容易往前**跑；環狀韌帶完整時才不易脫出（p.77）。\n肱骨外上髁炎查伸腕肌總腱起點，內上髁炎查屈腕肌起點，與課堂的網球肘、高爾夫球肘說法一致（p.100–103）。\n!! 移位、脫位要先排除骨折；外傷後腫脹變形先轉介（課堂轉介原則），推拿只處理周圍軟組織。","tags":["橈骨頭","環狀韌帶","肱橈關節","網球肘","參考書"],"muscles":["biceps","brachialis","brachiorad","pronator","supinator","triceps","forearm_ext","forearm_flex"],"points":["LI11","HT3"],"regions":["elbow"],"book":"sizhi"},{"id":"b-sizhi-wrist-load","cat":"上肢","src":"參考書《四肢手療法（圖解）》p.106–115","title":"腕的承重路徑：舟月骨、第2–3掌骨到橈骨","body":"書從骨骼形狀解釋手上的力怎麼往上傳：\n- 橈骨遠端關節面正常**向掌側傾約 10–15°、向尺側傾約 20–25°**；橈骨下端是力學弱點，跌倒手撐地容易骨折（p.106）。\n- 手上的重量主要經**舟狀骨與月狀骨**傳到橈骨；尺骨頭與三角骨之間隔著三角纖維軟骨，不是主要傳力路線（p.112）。\n- 握拳打擊時，力多落在**第 2、3 掌骨**：它們最長最穩，第 2 掌骨經大多角骨、舟狀骨，第 3 掌骨經頭狀骨、月狀骨直通橈骨；第 4、5 掌骨只能沿頭狀骨間接傳（p.113）。\n- 第 2、3 腕掌關節幾乎不動，是手掌的中央支柱；第 4、5 可以屈伸，所以握棍、推車把手時特別有力（p.115）。\n- 頭狀骨是腕骨中最強壯的一塊，手受撞擊時力量經它傳到橈骨（p.108）。\n\n課堂說「腕部的力約 80% 走橈骨，經骨間膜再分給肱骨」，本書從腕骨排列補上了原因：撐地、推重物後的痛，常沿橈側一路往肘外側找。","tags":["承重路徑","舟狀骨","月狀骨","橈骨","掌骨","參考書"],"muscles":["forearm_ext","forearm_flex","brachiorad"],"points":[],"regions":["wrist","elbow"],"book":"sizhi"},{"id":"b-sizhi-wrist-limits","cat":"上肢","src":"參考書《四肢手療法（圖解）》p.118–135","title":"腕動不了，先到肘附近找肌肉","body":"書處理腕關節受限時，觸診點大多不在手腕，而在**前臂靠肘的肌腹與起點**：\n\n|腕的受限|要查的肌肉|頁碼|\n|---|---|---|\n|掌屈（彎腕）|橈側屈腕肌、尺側屈腕肌、掌長肌等屈肌群|p.118–121|\n|背伸|橈側伸腕長肌、橈側伸腕短肌|p.122–123|\n|尺偏|尺側屈腕肌、尺側伸腕肌|p.124–125|\n|橈偏|拇長展肌、拇短伸肌|p.126–129|\n|橈尺遠側關節痛|關節本身（跌倒手先著地，或長期揉麵、切菜）|p.134–135|\n\n- 觸診：兩手同時按左右前臂同一處比較。\n- 做法：客人手臂外展放在施術者大腿上，施術者用肘前方加體重揉壓；或拇指按 3–5 秒、2–3 次。\n- 橈尺遠側關節：兩手握腕、盡量背伸，再用拇指把橈骨往橈側推開（p.135）。\n\n這與課堂「旋前、旋後肌連到肱骨內外上髁」的觀念相通：手腕的問題常要往上到肘處理。","tags":["腕受限","前臂肌群","起點觸診","橈尺遠側關節","參考書"],"muscles":["forearm_flex","forearm_ext","pronator","brachiorad"],"points":["LI10","PC6"],"regions":["wrist","elbow"],"book":"sizhi"},{"id":"b-sizhi-dequervain","cat":"上肢","src":"參考書《四肢手療法（圖解）》p.130–133","title":"媽媽手：橈骨莖突狹窄性腱鞘炎","body":"**拇長展肌與拇短伸肌**的肌腱共用一個腱鞘，經過橈骨莖突上一條又窄又淺、底面不平的溝。出溝後肌腱會轉一個角度；**拇指內收加手腕往尺側彎**時角度最大、摩擦最多。長期反覆刺激，先是水腫滲液，久了腱鞘增厚、變窄，形成腱鞘炎。\n- 書提到女性的轉折角較大，發生率約為男性的 6 倍。\n- **Finkelstein 測試**：拇指握在拳內、手腕往尺側彎，莖突處明顯痛為陽性。\n- **檢查**：兩拇指同時按兩側橈骨莖突比較腫脹與壓痛。\n- **書中手法**：兩手牽引腕部到極限，在牽引狀態下兩拇指一起往下壓莖突處，鬆開筋結；另一種是兩拇指相對推揉。\n\n同一區還有**腱鞘囊腫**：多半沒有症狀，偶爾痠乏。書中有把囊腫用力壓破、再用硬紙板或硬幣加壓包紮 5–7 天的做法。\n!! 壓破囊腫、在腱鞘上大力按壓，與課堂「靠近肌腱附著處不可大力」的原則衝突，見「衝突比對」。","tags":["媽媽手","腱鞘炎","Finkelstein","腱鞘囊腫","參考書"],"muscles":["forearm_ext"],"points":["LI5","LU7"],"regions":["wrist"],"book":"sizhi"},{"id":"b-sizhi-hand","cat":"上肢","src":"參考書《四肢手療法（圖解）》p.115、136–153","title":"拇指、小指受限與扳機指","body":"- **拇指活動受限**（含大魚際）：長時間寫字、擰東西、握物，大魚際肌最容易疲勞。依序查**拇短展肌、拇短屈肌、拇對掌肌、拇收肌**；兩手握住客人兩腕，用拇指比較左右（p.136–143）。\n- **小指活動受限**（含小魚際）：查**掌短肌、小指展肌、小指短屈肌、小指對掌肌**（p.144–151）。\n- 做法：拇指按壓 3–5 秒、2–3 次；或兩手把腕往尺側背伸，同時兩拇指往橈側推壓患處。\n- **扳機指（屈指肌腱狹窄性腱鞘炎）**：多在拇指、中指、無名指。肌腱在腱鞘與掌骨之間長期摩擦，腱鞘增厚、管腔變窄，手指彎下去後要靠外力才「解鎖」。檢查掌指關節掌側有沒有腫脹、壓痛，按壓 3–5 秒、2–3 次（p.152–153）。\n- 第 5 腕掌關節因有小指對掌肌，活動度最大，第 4 次之；握力不足時小指側也要一起看（p.115）。\n\n手部肌肉大多屬正中神經與尺神經（拇短展、拇對掌等屬正中；小魚際、拇收肌屬尺神經），手麻合併肌無力時，仍要回頭依課堂的路線查頸、胸廓出口與腕隧道。","tags":["大魚際","小魚際","扳機指","手部肌肉","參考書"],"muscles":["forearm_flex"],"points":["LU10","HT8","PC7"],"regions":["wrist"],"book":"sizhi"},{"id":"b-sizhi-hip-limits","cat":"骨盆","src":"參考書《四肢手療法（圖解）》p.176–217","title":"髖六方向受限：肌肉與節段對照","body":"|受限動作|書中要查的肌肉|節段|頁碼|\n|---|---|---|---|\n|外展|臀中肌、臀小肌、闊筋膜張肌|L4–S1|p.176–183|\n|內收|內收大、長、短肌，恥骨肌，股薄肌|L2–L5|p.184–195|\n|屈曲|髂腰肌（小轉子處）、股直肌、縫匠肌、內收長肌、恥骨肌|L2–L4|p.196–201|\n|伸直|臀大肌、膕繩肌、內收大肌|L2–L5、S1–S2|p.202–205|\n|內旋|臀中、小肌前部，闊筋膜張肌|L4–S1|p.206|\n|外旋|臀大肌、閉孔外肌、股方肌、閉孔內肌、梨狀肌、上下孖肌|腰薦段|p.207–217|\n\n**手法重點**\n- 臀部多用側臥：施術者兩腿夾住客人膝蓋穩住，肘前方或豆狀骨加體重壓 5–10 秒。\n- 深層外旋肌：側臥、上腿抬高約 45°，施術者托住大腿，身體往旁傾，把腿的重量轉壓到大轉子後上方。\n- 膕繩肌：俯臥，一手握踝把小腿往外轉讓肌肉浮出，肘前方壓 1–3 秒。\n- 內收肌：仰臥屈膝外展，讓客人膝蓋微微上抬、施術者在上方抵抗 3–5 秒（等長收縮）。\n!! 本書以「股骨的動作」命名，與課堂以骨盆角度命名（② EX、② IN）不同，對照見下一則與「衝突比對」。","tags":["髖受限","臀肌","內收肌","外旋肌","側臥手法","參考書"],"muscles":["glute_med","glute_min","tfl_itb","adductors","iliopsoas","rectus_fem","sartorius","glute_max","hamstrings","deep_rot","piriformis"],"points":["GB29","GB30","BL37"],"regions":["hip","pelvis","lspine"],"book":"sizhi"},{"id":"b-sizhi-hip-pelvis-map","cat":"骨盆","src":"參考書《四肢手療法（圖解）》p.172–217","title":"髖動作肌群對照骨盆三角度","body":"本書沒有骨盆三角度系統，但它列的髖動作肌群，可以和課堂的肌肉表一一對照：\n\n|本書（股骨動作）|課堂（骨盆角度）|關係|\n|---|---|---|\n|屈髖：髂腰肌、股直肌、縫匠肌、內收長肌、恥骨肌|第一角度 A：股直肌、髂腰肌|一致，本書多列縫匠肌、恥骨肌|\n|伸髖：臀大肌、膕繩肌、內收大肌|第一角度 P：膕繩肌、臀大肌（＋腹直肌）|一致，本書多列內收大肌|\n|外展：臀中、臀小、闊筋膜張肌|② EX、③ EX|肌肉相同|\n|內收：內收大長短肌、恥骨肌、股薄肌|③ IN|肌肉相同|\n|內旋：臀中小前部、闊筋膜張肌|② EX 的處理肌|名稱方向相反|\n|外旋：臀後六肌、臀大肌|② IN 的處理肌|名稱方向相反|\n\n**讀法建議**\n- 書說「髖內旋受限」是**股骨**轉不進去；課堂的「骨盆 IN」是**髂後上棘靠近 S2**。參考的骨頭不同，不能直接互換。\n- 操作時先用課堂方法量骨盆角度、找差最多的角度與最緊的肌肉；本書的觸診點與做法（側臥夾膝、豆狀骨壓臀中肌、抬腿 45° 壓外旋肌）可以拿來當執行手法。\n!! 同一群肌肉（臀中、臀小、闊筋膜張肌）在書裡叫「內旋肌」、在課堂叫「② EX 要處理的肌肉」，見「衝突比對」。","tags":["骨盆三角度","髖動作","肌肉對照","EX/IN","參考書"],"muscles":["iliopsoas","rectus_fem","hamstrings","glute_max","glute_med","glute_min","tfl_itb","adductors","deep_rot"],"points":[],"regions":["hip","pelvis"],"book":"sizhi"},{"id":"b-sizhi-ischial-pubis","cat":"骨盆","src":"參考書《四肢手療法（圖解）》p.158–159","title":"坐骨結節與恥骨：坐與站的支點","body":"- **坐骨結節**是坐姿的承重點。從這裡起始的有半腱肌、半膜肌、股二頭肌長頭與**內收大肌坐骨部**；外緣有股方肌，內緣下部是薦結節韌帶。這幾條都是屈膝、伸髖的肌肉，長期拉扯會在結節上形成牽引性骨刺（p.158）。\n- **恥骨**：恥骨體與恥骨支是內收肌群的起點；恥骨上緣是腹直肌止點（p.158）。\n- **書的比喻**：坐著時，恥骨把兩側坐骨結節撐住，不讓它們往內靠或往外開；站著時重量經髂骨傳到股骨，恥骨上支像一根橫撐，防止兩塊髖骨往內塌——作用有點像鎖骨（p.158）。\n- **髖臼**上緣厚而堅實，是站立時把重量傳給股骨頭的支點；髖臼後下部到坐骨結節，則是坐姿的承重點（p.159）。\n- 坐骨神經就貼在髖關節後方，髖後脫位或坐骨結節附近重壓都要小心（p.159）。\n\n與課堂的連結：\n- 課堂把 P 角度的肌肉整理為「附著在坐骨結節」的膕繩肌，本書補上內收大肌坐骨部也在同一位置。\n- 課堂筆記「骨性對應：鎖骨 → 恥骨」，本書從力學角度給了同樣的類比。","tags":["坐骨結節","恥骨","承重","內收大肌","鎖骨類比","參考書"],"muscles":["hamstrings","adductors","deep_rot","rectus_abd"],"points":["BL36"],"regions":["pelvis","pubis","hip"],"book":"sizhi"},{"id":"b-sizhi-hip-nerves","cat":"神經","src":"參考書《四肢手療法（圖解）》p.166–167、172","title":"臀腿痛的三條神經線索","body":"1. **髖有病卻喊膝痛**：髖關節的感覺大部分由**閉孔神經**供應，而閉孔神經也分支到膝關節，所以髖的毛病常被感覺成膝蓋痛（p.172）。膝本身查不到問題時，要回頭檢查髖。\n2. **坐骨神經與梨狀肌**：坐骨神經多從梨狀肌下緣出骨盆；若在骨盆內就提早分成兩支，腓總神經那支常穿過梨狀肌。梨狀肌前方還有小血管網包著神經，被擠壓時神經鞘缺血、水腫，也會引起坐骨神經痛（p.166）。\n   - 體表定位：髂後上棘到坐骨結節連線的中點，連到大轉子尖，大約是梨狀肌下緣；這條線內、中 1/3 交界處是坐骨神經穿出點。\n3. **臀上皮神經**：來自上段腰神經後支，越過髂嵴時穿過豎脊肌與腰背筋膜在髂嵴上緣形成的骨纖維管。這條管變形、變窄，或急性閃腰時神經被拉扯，會出現臀部痛，可以一路串到膝窩（p.167）。\n\n**簡單分辨**\n- 痛到小腿、腳趾，合併麻木無力，比較像神經根（依課堂先轉介）。\n- 痛停在膝窩以上、按髂嵴上緣會誘發，要想到臀上皮神經。\n- 臀深部痛、直腿抬高在中段角度最痛，對照課堂的梨狀肌判讀。","tags":["閉孔神經","坐骨神經","臀上皮神經","轉移痛","參考書"],"muscles":["piriformis","deep_rot","erector","glute_max"],"points":["GB30"],"regions":["hip","lspine","knee"],"book":"sizhi"},{"id":"b-sizhi-rom","cat":"評估","src":"參考書《四肢手療法（圖解）》p.106、161、172–174、240–241、296–297","title":"四肢正常活動度速查（本書數字）","body":"|關節|書中的數字|頁碼|\n|---|---|---|\n|髖|屈曲 150°（屈膝時）；伸直 0°、過伸 15°；內收 30°、外展 45°；內旋 40°、外旋 60°。膝伸直時屈髖只到約 80°（膕繩肌限制）|p.172–173|\n|膝|屈曲約 135°（主動約 130°，被動可到約 160°）；過伸約 10°；坐姿小腿下垂時，內旋 0–30°、外旋 0–40°|p.240–241|\n|踝|背伸 26–27°、蹠屈 41–43°；男性背伸比女性大 5–15°，女性蹠屈比男性大 5–10°|p.296|\n|足|內翻約 35–40°、外翻約 20–25°（發生在距下關節）|p.297|\n|腕|橈骨遠端關節面掌傾 10–15°、尺傾 20–25°|p.106|\n|股骨|頸幹角成人約 127°|p.161|\n\n- 數字只是參考，重點是**左右比較**；書中所有檢查都是兩側同時按、同時看。\n- 髖的外旋肌比內旋肌多又強，書的解釋是人直立行走時採略呈外八的站姿以求穩定（p.174）。\n- 屈膝時膕繩肌放鬆，屈髖才能做到最大；伸膝時只剩約 80°。直腿抬高受限時，要分清楚是膕繩肌還是髖關節本身。","tags":["活動度","ROM","左右比較","正常值","參考書"],"muscles":["hamstrings"],"points":[],"regions":["hip","knee","ankle","foot","wrist"],"book":"sizhi"},{"id":"b-sizhi-knee-limits","cat":"膝","src":"參考書《四肢手療法（圖解）》p.245–276","title":"膝受限、X/O 腿、膝過伸的檢查清單","body":"|問題|書中要查的結構|頁碼|\n|---|---|---|\n|屈曲受限|膕繩肌、股薄肌、縫匠肌、膕肌|p.245–246|\n|伸直受限|股四頭肌為主，闊筋膜張肌、臀大肌輔助|p.247–250|\n|小腿內旋受限|半腱肌、半膜肌、股薄肌、縫匠肌、膕肌|p.251–254|\n|小腿外旋受限|股二頭肌（不負重時）；屈膝外旋時闊筋膜張肌也參與|p.255–256|\n|膝外翻（X 型腿）|內側：半膜肌、腓腸肌內側頭、內側副韌帶、後斜韌帶|p.257–262|\n|膝內翻（O 型腿）|外側：股二頭肌、膕肌、腓腸肌外側頭、髂脛束、外側副韌帶、弓形韌帶|p.263–270|\n|膝過伸|股四頭肌與其擴張部、腓腸肌、膕肌、膕斜韌帶|p.271–276|\n\n- 書明講：若是骨骼結構本身的缺陷，不是這套手法能改的。\n- 膝後的檢查多半俯臥，施術者站在腳的下方，兩拇指同時按兩側膝窩比較。\n[[fig:b-sizhi-fig-xo]]\n!! 課堂處理膝痛與 X/O 型腿是「先上（骨盆、股骨轉向）→ 再下（踝、距骨）→ 最後局部」，本書直接處理膝周軟組織，而且處理的是被拉開的那一側，見「衝突比對」。","tags":["膝受限","X型腿","O型腿","膝過伸","韌帶","參考書"],"muscles":["hamstrings","adductors","sartorius","popliteus","rectus_fem","vastus_lat","vastus_med","tfl_itb","gastroc","glute_max"],"points":["BL40","KI10","BL39","LR8"],"regions":["knee"],"book":"sizhi"},{"id":"b-sizhi-knee-mech","cat":"膝","src":"參考書《四肢手療法（圖解）》p.236–242","title":"膝的力學：髂脛束、旋轉與鎖膝","body":"- **髂脛束**：前部纖維是闊筋膜張肌的腱膜，後部延續臀大肌；它和股二頭肌之間有強韌的筋膜連結。書指出**膝彎 15–30° 時髂脛束最緊，也最容易受傷**（p.236）。\n- **膝只有彎著才能轉**：伸直時脛骨的髁間隆起卡在股骨兩髁之間，不能旋轉；屈膝後韌帶變鬆，才有內外旋（p.241）。\n- **鎖膝**：伸直最後一段，股骨以前十字韌帶為軸相對脛骨往內轉，外側髁連同外側半月板一起往前滑；股內側肌在伸直最後 10–15° 特別重要（p.240、242）。\n- **股直肌**只提供股四頭肌約 1/5 的力；屈髖伸膝時它相對放鬆，伸膝效率不如另外三頭（p.242）。\n- 伸膝肌力量約為屈膝肌的三倍；站立時膕繩肌與腓腸肌一起對抗股四頭肌來穩住膝。腓腸肌癱瘓容易出現膝反張（p.242）。\n- **膕肌**讓脛骨內旋，半屈加外旋時最緊；它和股四頭肌、後十字韌帶共同穩定膝的後方（p.237）。\n- **半月板**：內側較大、呈 C 形，和關節囊、內側副韌帶連得較緊，外傷時較易破；外側較圓，和關節囊之間隔著膕肌腱，活動較自由（p.238）。","tags":["髂脛束","鎖膝","膝旋轉","半月板","股內側肌","參考書"],"muscles":["tfl_itb","glute_max","hamstrings","vastus_med","rectus_fem","popliteus","gastroc"],"points":["GB33"],"regions":["knee"],"book":"sizhi"},{"id":"b-sizhi-fibula","cat":"膝","src":"參考書《四肢手療法（圖解）》p.230、277–284","title":"腓骨上端前後移位：上下樓膝軟","body":"書把腓骨頭的位置列為膝的問題之一：**腓骨上端往前或往後偏，會讓人上下樓梯時膝蓋痠軟無力**。\n- **原因**：腳與小腿長期承受運動應力，附著在腓骨上的肌肉（腓骨長短肌、伸趾長肌、伸拇長肌、比目魚肌）緊縮，把腓骨拉偏。\n- **檢查**：仰臥，施術者站在腳下方，兩掌同時按兩側腓骨小頭比較；再逐條查腓骨肌、伸趾長肌（小腿外上側）、伸拇長肌（小腿外下方）、比目魚肌（膝窩外下方）。\n- **手法**：掌根或拇指加體重壓 3–5 秒（較深處 5–10 秒），2–3 次。\n- 腓骨也分擔一部分體重：脛腓上關節面越斜，經腓骨往下傳的力就越大（p.230）。\n\n課堂的全身檢查順序提到「腓骨後移位、脛骨前移位」，本書提供了具體的觸診點與相關肌肉。\n!! 腓骨頸後方有腓總神經繞過，按壓時要避開，見「腓總神經」一則。","tags":["腓骨頭","上下樓","膝無力","腓骨肌","參考書"],"muscles":["peroneus","toe_ext","soleus"],"points":["GB34"],"regions":["knee","ankle"],"book":"sizhi"},{"id":"b-sizhi-peroneal","cat":"安全","src":"參考書《四肢手療法（圖解）》p.239–240、295","title":"腓總神經：膝外側按壓的安全區","body":"腓總神經沿股二頭肌腱內緣下行，繞過腓骨頭後面，**緊貼骨膜繞過腓骨頸**，再分成腓淺、腓深神經。這一段位置淺、貼著骨頭，是下肢最容易受壓傷的神經之一。\n- **書列的受傷原因**：外側副韌帶斷裂、腓骨頭撕脫骨折，甚至**久坐翹腳**的壓迫。\n- **受傷表現**：足背伸、外翻的肌肉無力 → 垂足、足內翻；走路要把膝抬高，腳尖下垂難離地，像在跨門檻；小腿前外側與足背感覺變差。\n\n**推拿時注意**\n- 陽陵泉在腓骨頭前下方，按的是肌肉與骨的交界，不要往腓骨頸後方持續深壓或橫撥。\n- 處理腓骨長肌、股二頭肌腱時，力量放在肌腹，遠離腓骨頸。\n- 客人按完出現小腿外側或足背發麻、腳背抬不起來，立即停手並轉介。\n- 膕窩內有脛神經與膕動靜脈，膝後的按壓同樣要輕。\n\n課堂的禁忌整理還沒有列這一點，可以補進「操作禁忌與注意穴位」。","tags":["腓總神經","垂足","膝外側","安全","參考書"],"muscles":["peroneus","hamstrings"],"points":["GB34","BL40"],"regions":["knee","ankle"],"book":"sizhi"},{"id":"b-sizhi-ankle-mortise","cat":"踝足","src":"參考書《四肢手療法（圖解）》p.288–298","title":"距骨前寬後窄：為什麼下樓容易扭到","body":"- 踝關節由脛骨、腓骨下端包住距骨滑車。**距骨體前寬後窄**。\n- **足背伸**時，寬的前部塞進踝穴，關節穩固，不能內收外展；**蹠屈**時（下樓梯、穿高跟鞋）窄的後部進入踝穴，關節變鬆、有側向活動，所以這時最容易扭傷（p.288、296）。\n- 外踝比內踝低，外踝蓋住距骨整個外側；內側至少約 1.5 cm 沒有被內踝蓋住（p.298）。\n- 足的內翻、外翻其實發生在**距下關節**（距跟、距跟舟關節）；內翻時前足一定同時內收，外翻時前足同時外展（p.297）。\n- 除了跟腱，踝周圍肌腱的止點都在橫跗關節前方；肌肉收縮時，脛腓骨下端有往前滑的傾向，踮腳站時更明顯，靠韌帶與骨形擋住（p.298）。\n- 小腿本身沒有旋轉肌，下肢的旋轉來自大腿肌（p.290）。\n\n這正是課堂「距骨影響最大」「踝扭傷後角度變小，上面要用旋轉補」的力學基礎：先恢復距骨在踝穴裡的滑動與背伸角度，再往上處理代償。\n[[fig:b-sizhi-fig-mortise]]","tags":["距骨","踝穴","踝扭傷","距下關節","參考書"],"muscles":["tib_ant","peroneus","tib_post","gastroc","soleus"],"points":["GB40","ST41"],"regions":["ankle","foot"],"book":"sizhi"},{"id":"b-sizhi-ankle-limits","cat":"踝足","src":"參考書《四肢手療法（圖解）》p.292、296、300–318","title":"踝足受限的檢查清單（含神經節段）","body":"|受限|書中要查的肌肉|節段|頁碼|\n|---|---|---|---|\n|背伸|脛骨前肌、伸拇長肌、伸趾長肌、第三腓骨肌|L4–S1|p.300–305|\n|蹠屈|腓腸肌、比目魚肌、蹠肌、脛骨後肌、腓骨長短肌、趾長屈肌、拇長屈肌|L4–S3|p.306–315|\n|內翻、內收|脛骨前肌、脛骨後肌、屈趾肌群|腰薦段|p.316–317|\n|外展、外翻|腓骨長肌、腓骨短肌|腰薦段|p.316–318|\n\n- 檢查同樣是兩側同時按壓比較；拇長屈肌在內踝後下方的肌腱通道處按（p.315）。\n- 局部做完，查 L4–S1 腰薦段兩側；書用側臥扭轉加頓力的腰椎扳法（p.304–305）。\n- 足弓靠脛骨前肌、脛骨後肌、腓骨長肌一起撐；腓骨長肌與脛骨前肌在足底形成一個環，維持橫弓（p.292、296）。\n[[fig:b-sizhi-fig-logic]]\n!! 課堂處理踝背屈不足是放鬆小腿後側與腓骨肌、恢復距骨滑動；本書則去查負責背伸的前側肌群與神經，兩者假設不同，見「衝突比對」。","tags":["踝受限","背伸","蹠屈","足弓","神經節段","參考書"],"muscles":["tib_ant","toe_ext","peroneus","gastroc","soleus","tib_post"],"points":["ST41","BL57","KI3"],"regions":["ankle","foot","lspine"],"book":"sizhi"},{"id":"b-sizhi-dislocation","cat":"安全","src":"參考書《四肢手療法（圖解）》p.27–30、90–91、218–226、319–320","title":"書中的脫位整復：認得就好，不自己做","body":"本書收錄了幾種脫位的徒手整復與固定（肩 p.27–30、肘 p.90–91、髖 p.218–226、腳趾 p.319–320），例如肩復位後屈肘 90° 用三角巾吊住、上臂綁在胸壁；髖復位後夾板固定 3–4 週，以免變成習慣性脫位。\n\n**要認得的外觀**\n|脫位|書中描述|\n|---|---|\n|肩前脫位|肩失去圓弧、肩峰突出、肩峰下空虛，喙突下或腋窩摸得到肱骨頭|\n|肘後脫位|鷹嘴明顯往後凸|\n|髖後脫位|髖屈曲、內收、內旋，患腿變短，大轉子上移，被動外展外旋時有彈性卡住感|\n|髖前脫位|外展、外旋、輕度屈曲，被動內收內旋時有彈性卡住感|\n\n**推拿師的做法**：脫位可能合併骨折與血管神經損傷，需要影像與醫師處理。看到上述外觀，或外傷後劇痛、變形，固定患肢、冰敷並轉介。復位後的韌帶鬆弛期，避免把關節推向容易再脫的方向（肩：外展加外旋）。\n!! 與課堂「外傷後變形、腫脹先轉介」的原則衝突，見「衝突比對」。","tags":["脫位","轉介","肩脫位","髖脫位","參考書"],"muscles":[],"points":[],"regions":["shoulder","elbow","hip","foot"],"book":"sizhi"},{"id":"b-sizhi-sinew-tips","cat":"經筋","src":"參考書《四肢手療法（圖解）》p.69、104、154、285","title":"各章末的「兩點輕壓」經筋提示","body":"本書四章的結尾各有一張照片：客人仰臥或俯臥，施術者兩手分別輕放在兩個點上，旁邊一句話說明可緩解哪條經筋的筋結，並提醒相關臟腑。\n\n|章節|書中提到的經筋|臟腑提醒|頁碼|\n|---|---|---|---|\n|肩|足少陽|膽|p.69|\n|肘|手少陰|心|p.104|\n|腕與手|足太陽（原文）|脾的運化|p.154|\n|膝|足少陰|腎|p.285|\n\n- 書沒有說明兩個點的確切位置與原理；從照片只看得出軀幹與下肢各取一點，屬作者經筋系統的延伸（詳見同作者《經筋手療法》）。\n- 肩章提到足少陽：課堂整理的足少陽經筋走「腋前乳後」到缺盆，與肩、腋下相連，說得通。\n- 膝章提到足少陰：足少陰經筋上行到脛骨內髁下、沿大腿內側，與膝內側相關。\n- 肘章提到手少陰：手少陰經筋結於肘內側，與肘內側（內上髁一帶）相關。\n!! 腕手章把「足太陽經筋」和「脾」寫在一起，與課堂「脾屬足太陰」不同，可能是誤植，見「衝突比對」。","tags":["經筋","章末提示","兩點輕壓","臟腑","參考書"],"muscles":[],"points":[],"regions":["shoulder","elbow","wrist","knee"],"book":"sizhi"},{"id":"b-sizhi-intro","cat":"人物與流派","src":"參考書《四肢手療法（圖解）》","title":"參考書：《四肢手療法（圖解）》導讀","body":"**黃國松 編著**，人民衛生出版社（北京），2009（第 1 版第 1 次印刷；書內序文寫於 1997 年，應有更早的版本）。\n\n以圖解方式，從解剖與生物力學逐一介紹肩、肘、腕與手、髖、膝、踝與足六個關節的結構、運動與神經支配，再依「受限的位置或動作」列出要檢查的肌肉、韌帶與神經節段。檢查一律兩側同時按壓比較找筋結，治療多用肘前方、豆狀骨加體重按壓，局部處理後再往上找脊神經源；另收錄數種脫位整復。\n\n### 章節地圖\n- **序與前言**（PDF 第 6–12 頁）：作者簡歷（師從苟亞博）；上肢重靈活、下肢重穩固，內收肌強於外展肌。\n- **第一章 肩關節**（p.1–69）：肩的五個關節與三類肌肉；依前、外、後方與胸鎖、肩鎖、喙鎖、肩胛胸壁分區檢查，含肱二頭長頭腱滑脫與肩脫位。\n- **第二章 肘關節**（p.70–104）：肱尺、肱橈、橈尺近側三關節的檢查；橈骨頭前後移位、肱骨內外上髁炎。\n- **第三章 腕關節與手**（p.105–154）：腕骨與掌骨的承重路徑；腕各方向受限到前臂近肘處找肌肉；媽媽手、腱鞘囊腫、扳機指、大小魚際。\n- **第四章 髖關節**（p.155–226）：髖骨、臀部肌肉與神經；六個動作受限對應的肌肉與腰薦節段；髖脫位。\n- **第五章 膝關節**（p.227–285）：膝的韌帶、半月板與運動；屈伸、內外旋受限，X／O 型腿、膝過伸、腓骨上端移位。\n- **第六章 踝關節與足**（p.286–320）：距骨與踝穴、足部運動；背伸、蹠屈、內外翻受限與 L4–S3 神經檢查；腳趾脫位。\n\n### 本站整理的條目（23 則）\n- 全書格式：兩側對比找筋結＋用體重按壓（p.18、179、205；前言 PDF 第 12 頁）\n- 局部做完，往脊椎找神經源（p.11、77、117、175、182–183、244、299、304–305）\n- 肩能動的兩個前提與三類肌肉（p.4–8）\n- 肩痛依位置分區的檢查清單（p.12、15–68）\n- 肱二頭肌長頭腱滑出結節間溝（p.7、19–20）\n- 肘的三個關節與橈骨頭前後移位（p.77–103）\n- 腕的承重路徑：舟月骨、第2–3掌骨到橈骨（p.106–115）\n- 腕動不了，先到肘附近找肌肉（p.118–135）\n- 媽媽手：橈骨莖突狹窄性腱鞘炎（p.130–133）\n- 拇指、小指受限與扳機指（p.115、136–153）\n- 髖六方向受限：肌肉與節段對照（p.176–217）\n- 髖動作肌群對照骨盆三角度（p.172–217）\n- 坐骨結節與恥骨：坐與站的支點（p.158–159）\n- 臀腿痛的三條神經線索（p.166–167、172）\n- 四肢正常活動度速查（本書數字）（p.106、161、172–174、240–241、296–297）\n- 膝受限、X/O 腿、膝過伸的檢查清單（p.245–276）\n- 膝的力學：髂脛束、旋轉與鎖膝（p.236–242）\n- 腓骨上端前後移位：上下樓膝軟（p.230、277–284）\n- 腓總神經：膝外側按壓的安全區（p.239–240、295）\n- 距骨前寬後窄：為什麼下樓容易扭到（p.288–298）\n- 踝足受限的檢查清單（含神經節段）（p.292、296、300–318）\n- 書中的脫位整復：認得就好，不自己做（p.27–30、90–91、218–226、319–320）\n- 各章末的「兩點輕壓」經筋提示（p.69、104、154、285）\n\n條目都是用自己的話整理重點並標註頁碼，示意圖為依書中內容重新繪製；細節請對照原書。","tags":["參考書","四肢手療法（圖解）"],"book":"sizhi"},{"id":"b-sizhi-compare","cat":"原則","src":"參考書《四肢手療法（圖解）》比對","title":"《四肢手療法（圖解）》與課程的比對","body":"逐項比對《四肢手療法（圖解）》與課堂資料。共 22 項：高 2、中 7、低 13（嚴重度）。\n「衝突」＝說法相反；「程度差異」＝方向相同但做法或強度不同；「用詞不同」＝同一件事不同名稱；「補充」＝課堂沒提到或一致的地方。\n\n### 【高】神經根問題用脊椎扳法處理（衝突）\n!! 以觸診橫突位置判斷神經根受壓缺乏可靠性，真正的神經根病變（椎間盤突出、狹窄）用扭轉衝擊手法可能加重，馬尾症狀更是急症。推拿師遇到放射痛、麻木無力、反射改變時依課堂轉介；腰旁軟組織放鬆可以做，扳法交給有執照且經影像評估的人員。\n- **課堂：**「三分法：肌肉、骨頭、還是神經？」（主動不足、不痛屬神經，請轉介）、評估模式 「疑似神經根壓迫」（疑似神經根壓迫先轉介）、「椎間盤型下背痛（慢性，痛側在上）」（避免強力扭轉與重壓腰椎）、「需要先轉介的警訊」。\n- **本書：**局部處理後若判斷神經根受壓，就用脊椎手法把它「推開」；示範為側臥扭轉腰椎、用豆狀骨瞬間頓壓的扳法，並以 L4、L5 橫突偏後、薦骨外緣緊痛判斷問題側。（p.11、182–183、304–305）\n\n### 【高】脫位的徒手整復（衝突）\n!! 脫位常合併骨折、血管神經損傷，復位前需要影像，髖脫位更需醫院處理。課堂原則較站得住：推拿師只需認得外觀、固定並轉介，不操作復位。\n- **課堂：**「需要先轉介的警訊」（外傷後劇痛、變形、腫脹，局部骨壓痛 → 先就醫，推拿暫停）。\n- **本書：**示範肩前脫位（足蹬腋下牽引、外旋內收等多種方法）、肘後脫位、髖前後脫位（「問號」手法）、腳趾脫位的徒手復位與固定方式。（p.27–30、90–91、218–226、319–320）\n\n### 【中】受限時該處理哪一側的肌肉（衝突）\n- **課堂：**「九成的痠痛是「被拉長的痛」」（一緊一鬆才會痛，被拉長那側常是受害者）、「處理順序：差最多的先做、最緊的先做」（先做最緊的那條）、評估模式 「踝扭傷後遺（活動度下降、往上代償）」（背屈不足：放鬆小腿後側、腓骨肌，恢復距骨滑動）。\n- **本書：**每個受限動作都去查「執行這個動作的肌肉」與其神經節段，例如踝背伸受限查脛骨前肌、伸拇長、伸趾長、第三腓骨肌，再查 L4–S1；髖內旋受限查臀中小前部與闊筋膜張肌。（p.176、206、300–305（各章同一邏輯））\n- **怎麼看：**兩者假設不同：書假設是主動肌（或其神經）失能、出現筋結；課堂假設是拮抗肌縮短把動作卡住。可用課堂三分法分辨：主動做不到但被動角度正常 → 偏向主動肌或神經（書的情境）；被動也到不了 → 偏向對側縮短或關節卡住（課堂情境）。先做這個測試再選處理側。\n\n### 【中】X／O 型腿的處理方向（衝突）\n- **課堂：**「下肢旋轉、足內外翻與 O／X 型腿」（下肢內轉 → 足外翻 → X 型腿；外轉 → 足內翻 → O 型腿）、「膝痛的追查順序：1 上、2 下、3 局部」（先上、再下、最後局部）、「九成的痠痛是「被拉長的痛」」。\n- **本書：**膝外翻（X 型腿）查膝內側的半膜肌、腓腸肌內側頭、內側副韌帶、後斜韌帶；膝內翻（O 型腿）查外側的股二頭肌、膕肌、腓腸肌外側頭、髂脛束、外側副韌帶、弓形韌帶。骨骼結構缺陷則非手法能改。（p.257–270）\n- **怎麼看：**書處理的是被拉開、受力的那一側（容易出現筋結與壓痛），屬於止痛導向的局部處理；課堂則先修正骨盆、股骨旋轉與足的內外翻，並先放鬆縮短側。臨床可先依課堂順序處理上下游，再用書中的局部點緩解膝內／外側的痛；不要只在被拉長那側反覆加壓。\n\n### 【中】評估順序：局部 → 神經源，還是地基 → 局部（程度差異）\n- **課堂：**「有效矯正：先把地基擺正」（先把腳、踝、膝、骨盆擺正）、「評估流程：正面 → 臥姿，腳 → 骨盆 → 薦椎」（腳 → 骨盆 → 薦椎）、「痛的地方常是受害者：找出根源」、「膝痛的追查順序：1 上、2 下、3 局部」（局部最後）。\n- **本書：**每章以單一關節為單位：先按方位或動作查局部軟組織並處理，處理後再往上找支配這些肌肉的脊神經節段。幾乎不談骨盆、薦椎與其他關節之間的連鎖。（p.11、77、117、175、244、299）\n- **怎麼看：**書的「往上」是沿神經走（周邊 → 脊髓節段），課堂的「往上往下」是沿力學鏈走（足 → 膝 → 骨盆 → 脊椎）。兩者不互斥：可以先依課堂找出力學上的變因點，局部處理時參考書的清單，最後再檢查對應節段。\n\n### 【中】腱鞘囊腫壓破（衝突）\n- **課堂：**「順纖維＝放鬆；橫向撥＝破壞」（靠近肌腱附著處、骨頭表面不要大力橫撥）、「操作禁忌與注意穴位」（急性發炎腫脹處避免重手法）。\n- **本書：**把囊腫往肘的方向推擠、用力加壓將它壓破，之後用硬紙板或硬幣加壓包紮 5–7 天；另一法是腕掌屈讓囊腫凸出後猛力加壓。（p.132–133）\n- **怎麼看：**壓破法復發率高，也可能傷到腱鞘、腕背的神經血管；目前一般處理是觀察或由醫師抽吸、手術。推拿師可放鬆前臂伸肌群、減少腕部過度使用，囊腫本身請轉介，不要用力壓破。\n\n### 【中】髖內旋／外旋與骨盆 EX／IN 的命名方向（用詞不同）\n- **課堂：**「骨盆第二角度：EX（外轉）與 IN（內轉）」（② EX 處理臀中、臀小、闊筋膜張肌；② IN 處理臀後六肌）、「臀部深層肌群：外轉肌與內轉肌」（以骨盆角度命名，別和對股骨的作用混在一起）。\n- **本書：**以股骨動作命名：髖內旋受限查臀中小肌前部與闊筋膜張肌（股骨內旋肌）；髖外旋受限查臀大肌、閉孔內外肌、股方肌、梨狀肌、上下孖肌（股骨外旋肌）。（p.174、206–217）\n- **怎麼看：**同一群肌肉在書裡叫「內旋肌」、在課堂是「② EX 要處理的肌肉」；臀後六肌在書裡是「外旋肌」、在課堂是「② IN 的處理肌」。參考骨頭不同（股骨 vs 髂骨相對 S2），兩者不矛盾，但抄筆記時不要把「髖內旋受限」直接寫成「骨盆 IN」。\n\n### 【中】肩外展無力的來源（補充）\n- **課堂：**「盂肱關節（GH）：動作、肌肉、神經與滑動方向」（外展：三角肌中束、棘上肌）、「肩胛骨的六個動作與翼狀肩胛」（肩胛靠肌肉懸吊；翼狀肩胛多為前鋸肌無力）、評估模式 「網球肘（外上髁）」（肩不穩時手肘代償）。\n- **本書：**肩正常活動要先有穩定的肩胛；外展減弱常由斜方肌或前鋸肌損傷引起，而不是三角肌或棘上肌。（p.8）\n- **怎麼看：**與課堂一致且更明確：外展無力時先看肩胛（斜方肌下束、前鋸肌）能不能把肩胛上迴旋、貼住胸廓，再看盂肱關節的肌肉。\n\n### 【中】腓總神經的按壓安全（補充）\n- **課堂：**「操作禁忌與注意穴位」（列了頸前、缺盆、腋窩、膕窩、腹股溝等，未列腓骨頸）。\n- **本書：**腓總神經繞過腓骨頸、緊貼骨膜，位置淺，韌帶斷裂、腓骨頭撕脫骨折甚至久坐翹腳都能傷到它，造成垂足、足內翻與跨閾步態。（p.239–240）\n- **怎麼看：**建議把「腓骨頸後方（陽陵泉後下）不持續深壓、不橫撥」加進課堂的注意部位；按壓後出現足背麻、腳背抬不起來應立即停止並轉介。\n\n### 【低】外展、內收肌群與第二、三角度（補充）\n- **課堂：**「骨盆第二角度：EX（外轉）與 IN（內轉）」、「骨盆第三角度：耳狀面外展（EX）與內收（IN）」（② EX／③ EX：臀中、臀小、闊筋膜張肌；③ IN：內收大、長、短肌，恥骨肌，股薄肌）。\n- **本書：**髖外展受限查臀中肌、臀小肌、闊筋膜張肌（L4–S1）；髖內收受限查內收大肌、內收長肌、內收短肌、恥骨肌、股薄肌（L2–L5）。（p.176–195）\n- **怎麼看：**肌肉清單與課堂完全一致，書另外提供觸診點（大腿內側膝上方查內收大肌、鼠蹊旁查恥骨肌）與等長收縮做法，可直接補進第三角度的手法。\n\n### 【低】第一角度 P 的肌肉：內收大肌也附著坐骨結節（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」（P＝附著在坐骨結節的半腱肌、半膜肌、股二頭肌長頭；P 主角：膕繩肌、臀大肌、腹直肌）、評估模式 「骨盆後傾（第一角度 P）」。\n- **本書：**坐骨結節起始的有半腱肌、半膜肌、股二頭肌長頭與內收大肌坐骨部；髖伸直受限查臀大肌、膕繩肌與內收大肌。（p.158、202–205）\n- **怎麼看：**解剖上內收大肌的坐骨部（後部纖維）由坐骨神經支配，作用接近膕繩肌，是伸髖肌。把它列為 P 的候選肌合理；P 側膕繩肌處理後仍緊時，可往大腿內後側內收大肌查。\n\n### 【低】股直肌的份量（程度差異）\n- **課堂：**「股四頭肌：股直肌最重要」（股四頭肌中股直肌最重要，唯一跨髖）、「骨盆第一角度：A（前傾）與 P（後傾）」（A 的主角肌）。\n- **本書：**股直肌只提供股四頭肌約 1/5 的力，屈髖伸膝時相對放鬆，伸膝效率不如另外三頭。（p.242）\n- **怎麼看：**講的是不同事情：書談的是伸膝的力量，課堂談的是拉動骨盆前傾的槓桿（只有它跨過髖）。兩者都成立；評估骨盆 A 時仍以股直肌為重點，膝伸直無力時則要看股內側肌與股外側肌。\n\n### 【低】髂脛束最容易受傷的角度（補充）\n- **課堂：**「跑者膝：髂脛束不是元兇」（股骨內外轉改變角度才摩擦）、評估模式 「跑者膝（髂脛束摩擦）」。\n- **本書：**髂脛束與股二頭肌有強韌的筋膜連結；膝彎 15–30° 時髂脛束最緊，也最容易受傷。（p.236）\n- **怎麼看：**與課堂不衝突：跑步、騎車時膝正好反覆經過 15–30°，再加上股骨旋轉改變路徑，就容易摩擦。檢查時可在這個角度範圍內觀察疼痛。\n\n### 【低】膝的旋轉角度與鎖膝（補充）\n- **課堂：**「膕肌：膝彎 30° 開始旋轉」（膝彎約 30° 後脛骨開始旋轉）、「膝關節補充：角度、半月板、膕肌、交鎖」（伸直最後 30° 脛骨外轉約 10°）。\n- **本書：**膝只有在屈曲時才能軸向旋轉；坐姿小腿下垂時內旋約 0–30°、外旋約 0–40°。伸直最後一段股骨以前十字韌帶為軸相對脛骨內轉，股內側肌在最後 10–15° 特別重要。（p.240–242）\n- **怎麼看：**股骨相對脛骨內轉＝脛骨相對股骨外轉，與課堂描述的是同一個鎖膝機制，只是參考骨頭不同。數字可補進課堂膝的條目。\n\n### 【低】膝痛的神經來源：閉孔神經（補充）\n- **課堂：**「膝痛的追查順序：1 上、2 下、3 局部」（先看上面：股骨與骨盆）、「痛的地方常是受害者：找出根源」（膝是受害者）。\n- **本書：**髖關節的感覺大部分由閉孔神經供應，閉孔神經也支配膝關節，所以髖關節疾病的人常覺得膝痛。（p.172）\n- **怎麼看：**課堂從力學說「先看上面」，本書從神經支配補上另一個理由：膝痛可能是髖的轉移痛。長輩膝痛但膝檢查正常時，要檢查髖的內旋與屈曲角度，必要時轉介排除髖關節退化。\n\n### 【低】五十肩的限制來源（補充）\n- **課堂：**評估模式 「肩痛／旋轉肌袖、五十肩」（外旋受限明顯時考慮五十肩，肩胛下肌）。\n- **本書：**喙肱韌帶在外旋時繃緊；肩周發炎時它攣縮，讓肱骨停在內旋位，限制外展與外旋。（p.6）\n- **怎麼看：**肩胛下肌（肌肉）與喙肱韌帶、前上關節囊（非收縮組織）都會限制外旋。被動外旋時末端是硬的、放鬆肌肉後仍無改善，較像韌帶與關節囊；推拿以溫和的關節鬆動與肌肉放鬆為主，不要強拉。\n\n### 【低】腕的承重路徑（補充）\n- **課堂：**「肘：旋前、旋後的肌肉與骨間膜」（腕部的力約 80% 走橈骨，經骨間膜再傳到肱骨）。\n- **本書：**手上的重量主要經舟狀骨、月狀骨傳到橈骨；握拳時力多落在第 2、3 掌骨，經大多角骨、舟狀骨與頭狀骨、月狀骨直通橈骨。（p.108、112–113）\n- **怎麼看：**一致，書補上骨骼排列的原因。可用來解釋撐地受傷為何舟狀骨、橈骨遠端最常出事；撐地後鼻煙窩壓痛要先轉介排除舟狀骨骨折。\n\n### 【低】章末經筋提示：足太陽與脾（用詞不同）\n- **課堂：**「足三陰經筋（腎、脾、肝）」（脾屬足太陰經筋：起拇趾內側、結內踝、膝內）、「足三陽經筋（膀胱、胃、膽）」（足太陽屬膀胱）。\n- **本書：**腕與手一章的結尾寫「兩點輕壓可緩解足太陽的經筋筋結；脾的運化紊亂不能忽略這個體系」。其他三章（肩 → 足少陽／膽、肘 → 手少陰／心、膝 → 足少陰／腎）經筋與臟腑相配。（p.154（對照 p.69、104、285））\n- **怎麼看：**依經絡理論，脾配足太陰；照片中施術者一手在腰臀、一手在大腿後側，位置較像足太陽。可能是經筋名或臟腑名其中一個誤植，無法從本書確認，引用時標明「原文如此」，以課堂與《經筋手療法》為準。\n\n### 【低】坐骨神經與梨狀肌的變異（補充）\n- **課堂：**「直腿抬高：真假坐骨神經痛」（坐骨神經從梨狀肌下方出來，少數穿過肌腹）、評估模式 「梨狀肌症候群（假性坐骨神經痛）」。\n- **本書：**坐骨神經在骨盆內就高位分支時，腓總神經那支常穿梨狀肌出骨盆；梨狀肌前方的小血管網受擠壓，會讓坐骨神經鞘缺血水腫，也是坐骨神經痛的原因。另附梨狀肌下緣與坐骨神經穿出點的體表定位。（p.166）\n- **怎麼看：**與課堂一致並補上機制（血管性因素）與體表定位線，可用來找環跳一帶的按壓點，同時提醒該處不要長時間重壓。\n\n### 【低】長短腳的判讀（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」（A 側長腳、P 側短腿）、「骨盆第三角度：耳狀面外展（EX）與內收（IN）」（③ EX 斜向上 → 短腿；要知道為什麼短再處理）、「薦椎檢查三步驟」。\n- **本書：**本書沒有從骨盆角度解讀長短腳；只在髖後脫位時描述患腿變短、大轉子上移，並在復位後比較兩腿是否等長、兩側大轉子是否對等。（p.218、226）\n- **怎麼看：**書的長短腳只用在急性脫位的判斷。客人外傷後突然一腿明顯變短、外轉或內轉固定，是轉介訊號，不要套用骨盆角度去「調」。\n\n### 【低】恥骨與鎖骨的類比（補充）\n- **課堂：**「臨床大原則：誰跟著誰走」（骨性對應：鎖骨 → 恥骨 → 腓骨 → 顴骨）。\n- **本書：**恥骨上支在站立時像一根橫撐，防止兩塊髖骨往內塌；坐著時固定兩側坐骨結節；作者說它的作用與鎖骨有些相似。（p.158）\n- **怎麼看：**一致。課堂的對應較偏全身結構的觀察，本書從承重力學說明，兩者可以互相印證：恥骨聯合歪斜時，要想到它是骨盆環的「撐桿」。\n\n### 【低】踝的動作肌（補充）\n- **課堂：**「踝關節韌帶、足的分區與踝的動作肌」（背屈：脛前肌；內翻：脛後肌；外翻：腓骨長短肌；蹠屈：腓腸肌、比目魚肌）。\n- **本書：**背伸肌有脛骨前肌、伸拇長肌、伸趾長肌、第三腓骨肌；內翻主要為脛骨後肌與脛骨前肌；內外翻發生在距下關節，內翻時前足同時內收、外翻時前足同時外展。（p.296–297）\n- **怎麼看：**一致並補充：脛骨前肌同時是背屈與內翻肌（課堂肌肉資料也這樣寫），可補進 「踝關節韌帶、足的分區與踝的動作肌」 的表格。\n","tags":["參考書","衝突","比對"],"book":"sizhi"},{"id":"b-jingxue-cun-table","cat":"經絡穴位","src":"參考書《經穴大全》p.xxxvii–xxxix（PDF 第 39–41 頁）","title":"骨度分寸全表：把身體切成固定份數","body":"「寸」不是絕對長度，而是把兩個骨性標誌之間**固定分成幾份**：不論客人高矮，前臂一律算 12 寸，所以 1 寸會跟著體型伸縮。本書提到前臂實測約 12.5 寸，WHO 統一取 12 寸。\n|部位|起點 → 終點|寸|\n|---|---|---|\n|頭|前髮際 → 後髮際|12|\n|頭|眉間 → 前髮際|3|\n|頭|兩額角之間|9|\n|頭|兩乳突之間|9|\n|胸|頸靜脈切跡 → 胸骨體下端|9|\n|胸|兩乳頭之間|8|\n|腹|胸骨體下端 → 臍中|8|\n|腹|臍中 → 恥骨聯合上緣|5|\n|背|兩側肩胛骨內緣之間|6（中線到內緣 3）|\n|上肢|腋前／後紋頭 → 肘橫紋|9|\n|上肢|肘橫紋 → 腕橫紋|12|\n|下肢|恥骨聯合上緣 → 髕底|18|\n|下肢|大轉子最高點 → 膕橫紋|19|\n|下肢|臀溝 → 膕橫紋|14|\n|下肢|膕橫紋 → 外踝尖|16|\n|下肢|髕尖 → 內踝尖|15（髕尖→脛骨內髁下緣 2，內髁下緣→內踝尖 13）|\n|下肢|內踝尖 → 足底|3|\n**實用點**：背部「中線到肩胛骨內緣＝3 寸」就是膀胱經第二側線的位置；小腿外側 16 寸的一半（8 寸）就是 [[p:ST38]]、[[p:ST40]] 的高度。\n[[fig:b-jingxue-fig-cun]]","tags":["骨度分寸","取穴","WHO","寸","參考書"],"muscles":[],"points":["ST38","ST40"],"regions":[],"book":"jingxue"},{"id":"b-jingxue-tongshen","cat":"經絡穴位","src":"參考書《經穴大全》p.xxxix（PDF 第 41 頁）；指寸見 p.7、p.14","title":"同身寸三法：骨度量不到時才用","body":"本書的順序很清楚：**先用骨度分寸，量不準時才用同身寸**，而且一定用「客人自己的手」量。\n- **中指同身寸**（1 寸）：拇指與中指圈成環，中指中節兩端橫紋頭（橈側）之間的長度。\n- **拇指同身寸**（1 寸）：拇指指間關節處的寬度。\n- **四指幅（一夫法）**（3 寸）：食指到小指併攏伸直，在中指近側指間關節那條線量四指的寬度。\n**為什麼不能只靠手指**：手指寬度和軀幹、四肢的比例不一定一致，用同身寸量長距離（例如 [[p:ST36]] 的 3 寸還算短，[[p:ST40]] 的 8 寸就會累積誤差）。長距離優先用骨度或「等分法」，同身寸只拿來補短距離或確認。\n- 推拿師自己的手大小和客人不同：用自己的手指量客人，嬌小的客人會量得太遠、高大的會太近。\n- 指甲旁的井穴另用「指寸 0.1 寸」：從指甲邊緣的垂直線與指甲根部水平線的交點往外一點（如 [[p:LU11]]、[[p:LI1]]）。","tags":["同身寸","一夫法","取穴","指寸","參考書"],"muscles":[],"points":["ST36","ST40","LU11","LI1"],"regions":[],"book":"jingxue"},{"id":"b-jingxue-divide","cat":"經絡穴位","src":"參考書《經穴大全》p.5、p.51–52、p.63、p.87、p.133、p.147、p.159、p.202、p.208、p.249、p.266","title":"等分取穴：用連線的幾分之幾找穴","body":"本書很多穴位不寫「某處上幾寸」，而是畫一條兩個骨性標誌的連線，再切成幾等份。這種方法對不同體型最穩定，推拿時找穴也最快。\n|穴位|連線與比例|\n|---|---|\n|[[p:LU3]]|腋前紋頭 → [[p:LU5]] 的上 1/3（＝3 寸）|\n|[[p:SI11]]|肩胛岡中點 → 肩胛下角，靠岡側 1/3|\n|[[p:GB30]]|大轉子最高點 → 骶管裂孔，靠大轉子 1/3|\n|[[p:SP11]]|髕底內側端 → [[p:SP12]]，靠衝門 1/3|\n|[[p:LR5]]|髕尖 → 內踝尖，靠內踝 1/3（＝5 寸）|\n|[[p:PC4]]|[[p:PC3]] → [[p:PC7]] 中點再往下 1 寸（＝腕上 5 寸）|\n|[[p:ST38]]／[[p:ST40]]|膕橫紋 → 外踝尖（16 寸）的中點|\n|[[p:BL56]]|[[p:BL55]] → [[p:BL57]] 的中點（膕橫紋下 5 寸）|\n|[[p:CV12]]|胸骨體下端 → 臍中的中點|\n|[[p:GV20]]|前、後髮際中點再往前 1 寸；或兩耳尖連線中點|\n|[[p:GB21]]|C7 棘突 → 肩峰外緣的中點|\n練習時先用手指把兩端標誌按住，再目測比例，比一寸一寸量準確。","tags":["取穴","等分法","骨度分寸","參考書"],"muscles":[],"points":["LU3","SI11","GB30","SP11","LR5","PC4","ST38","BL56","CV12","GV20","GB21"],"regions":[],"book":"jingxue"},{"id":"b-jingxue-back-landmarks","cat":"經絡穴位","src":"參考書《經穴大全》p.70（專欄「如何藉由觸碰找出背部的骨骼位置」）、p.122","title":"背部骨性標誌：書上的觸診對照","body":"本書專欄列出背部最常用的定位線，可和課堂的 k-landmarks 互相對照：\n|標誌|對應棘突|\n|---|---|\n|低頭最突出、頸前屈旋轉時最好摸|C7（隆椎，[[p:GV14]]）|\n|兩側肩胛**上角**連線|約 T1（書的說法；其他資料多寫 T2，用 C7 往下數確認）|\n|兩側肩胛岡根部連線|T3（[[p:GV12]]、[[p:BL13]]）|\n|兩側肩胛下角連線|T7（[[p:GV9]]、[[p:BL17]]）|\n|第 12 肋尖端|L2（有時到 L3）；第 11、12 肋尖幾乎同高|\n|兩側髂嵴最高點連線（Jacoby line）|L4 棘突，或 L4／L5 之間|\n|兩側髂後上棘連線|第 2 後薦骨孔（S2，[[p:BL28]]、[[p:BL32]]）|\n**容易忽略的一點**：胸椎棘突往下斜，棘突尖大約和下一節的椎體同高（例如 T5 棘突尖約平 T6）。背俞穴都是取「棘突**下緣**」的水平再旁開，所以要先摸到棘突、再往下滑到兩個棘突之間的凹陷。\n- 八髎取法：把中指放在 [[p:BL32]]（PSIS 連線高度），食指、無名指、小指依序排開，四個指腹就是上、次、中、下髎。\n[[fig:b-jingxue-fig-back]]","tags":["骨性標誌","觸診","背俞穴","Jacoby line","八髎","參考書"],"muscles":["erector","multifidus"],"points":["GV14","GV12","BL13","GV9","BL17","BL28","BL32","BL31","BL33","BL34"],"regions":["tspine","lspine","sacrum","scap"],"book":"jingxue"},{"id":"b-jingxue-shu-mu","cat":"經絡穴位","src":"參考書《經穴大全》p.xxx（命名）、p.2、p.28、p.96–131、p.188、p.220、p.256–260","title":"背俞穴與募穴：一前一後對臟腑","body":"**背俞穴**在膀胱經第一側線（棘突下旁開 1.5 寸），以臟腑命名；**募穴**在胸腹前面，是臟腑之氣聚集處。本書把兩者都列為「要穴」，說明它們直接作用在臟腑。\n|臟腑|募穴|臟腑|募穴|\n|---|---|---|---|\n|肺|[[p:LU1]]|大腸|[[p:ST25]]|\n|心|[[p:CV14]]|小腸|[[p:CV4]]|\n|心包|[[p:CV17]]|三焦|石門（CV5）|\n|脾|[[p:LR13]]|胃|[[p:CV12]]|\n|肝|[[p:LR14]]|膽|[[p:GB24]]|\n|腎|[[p:GB25]]|膀胱|中極（CV3）|\n**第二側線的記憶法**：同一節段旁開 3 寸的穴名多和「五神」有關，和 1.5 寸的背俞穴一一對齊——魄戶（T3，肺藏魄，[[p:BL42]]）、神堂（T5，心藏神）、魂門（T9，肝藏魂）、意舍（T11，脾藏意）、志室（L2，腎藏志，[[p:BL52]]）。\n推拿應用：背部按到某節段特別硬或壓痛時，可以同時看前面對應的募穴有沒有緊或壓痛，作為臟腑相關的參考（不是診斷）。","tags":["背俞穴","募穴","五神","特定穴","參考書"],"muscles":["erector"],"points":["LU1","ST25","CV14","CV4","CV17","LR13","CV12","LR14","GB24","GB25","BL42","BL52"],"regions":["tspine","lspine"],"book":"jingxue"},{"id":"b-jingxue-five-shu","cat":"經絡穴位","src":"參考書《經穴大全》p.xxix（五行穴）；各章扉頁「要穴」欄 p.2、p.10、p.32、p.56、p.72、p.80、p.104、p.138、p.156、p.166、p.190、p.218","title":"五輸穴：井滎輸經合，從指尖走到肘膝","body":"十二經在指（趾）尖到肘、膝之間各有五個特定穴，順序是**井 → 滎 → 輸 → 經 → 合**，像水從泉源流成河、再匯入大海。本書另外標出五行屬性：陰經的井穴屬木（木火土金水），陽經的井穴屬金（金水木火土）。\n|經|井|滎|輸|經|合|\n|---|---|---|---|---|---|\n|肺|[[p:LU11]]|[[p:LU10]]|[[p:LU9]]|經渠（LU8）|[[p:LU5]]|\n|大腸|[[p:LI1]]|二間（LI2）|三間（LI3）|[[p:LI5]]|[[p:LI11]]|\n|胃|[[p:ST45]]|[[p:ST44]]|陷谷（ST43）|[[p:ST41]]|[[p:ST36]]|\n|脾|[[p:SP1]]|大都（SP2）|[[p:SP3]]|[[p:SP5]]|[[p:SP9]]|\n|心|[[p:HT9]]|[[p:HT8]]|[[p:HT7]]|靈道（HT4）|[[p:HT3]]|\n|小腸|[[p:SI1]]|前谷（SI2）|[[p:SI3]]|陽谷（SI5）|[[p:SI8]]|\n|膀胱|[[p:BL67]]|足通谷（BL66）|束骨（BL65）|[[p:BL60]]|[[p:BL40]]|\n|腎|[[p:KI1]]|[[p:KI2]]|[[p:KI3]]|[[p:KI7]]|[[p:KI10]]|\n|心包|[[p:PC9]]|[[p:PC8]]|[[p:PC7]]|間使（PC5）|[[p:PC3]]|\n|三焦|[[p:TE1]]|液門（TE2）|[[p:TE3]]|[[p:TE6]]|[[p:TE10]]|\n|膽|[[p:GB44]]|俠谿（GB43）|[[p:GB41]]|陽輔（GB38）|[[p:GB34]]|\n|肝|[[p:LR1]]|[[p:LR2]]|[[p:LR3]]|[[p:LR4]]|[[p:LR8]]|\n- 陰經的**輸穴同時是原穴**（以輸代原），例如 [[p:LU9]]、[[p:KI3]]、[[p:LR3]]。\n- 推拿上：井穴面積小，多用掐法（急救、醒神）；合穴在肘膝附近肌肉厚，適合按揉，也是四總穴中 [[p:ST36]]、[[p:BL40]] 的身分。","tags":["五輸穴","井滎輸經合","五行","特定穴","參考書"],"muscles":[],"points":["LU11","LU10","LU9","LU5","LI1","LI5","LI11","ST45","ST44","ST41","ST36","SP1","SP3","SP5","SP9","HT9","HT8","HT7","HT3","SI1","SI3","SI8","BL67","BL60","BL40","KI1","KI2","KI3","KI7","KI10"],"regions":[],"book":"jingxue"},{"id":"b-jingxue-yuan-luo-xi","cat":"經絡穴位","src":"參考書《經穴大全》p.xxxiv（要穴）；各章扉頁 p.2、p.32、p.58、p.138、p.156、p.166、p.190、p.218","title":"原穴、絡穴、郄穴：慢性、表裡、急性","body":"本書把原、郄、絡、募、俞合稱「五要穴」。三種四肢特定穴的用途可以這樣記：\n|經|原穴（臟腑原氣）|絡穴（連表裡經）|郄穴（急性、劇痛）|\n|---|---|---|---|\n|肺|[[p:LU9]]|[[p:LU7]]|[[p:LU6]]|\n|大腸|[[p:LI4]]|偏歷（LI6）|溫溜（LI7）|\n|胃|衝陽（ST42）|[[p:ST40]]|[[p:ST34]]|\n|脾|[[p:SP3]]|[[p:SP4]]|地機（SP8）|\n|心|[[p:HT7]]|通里（HT5）|陰郄（HT6）|\n|小腸|[[p:SI4]]|支正（SI7）|養老（SI6）|\n|膀胱|京骨（BL64）|[[p:BL58]]|金門（BL63）|\n|腎|[[p:KI3]]|大鐘（KI4）|水泉（KI5）|\n|心包|[[p:PC7]]|[[p:PC6]]|[[p:PC4]]|\n|三焦|[[p:TE4]]|[[p:TE5]]|會宗（TE7）|\n|膽|[[p:GB40]]|光明（GB37）|[[p:GB36]]|\n|肝|[[p:LR3]]|[[p:LR5]]|中都（LR6）|\n- 另有 [[p:SP21]]（脾之大絡）、鳩尾（CV15，任脈絡）、[[p:GV1]]（督脈絡）。\n- **郄穴**是經氣深聚的縫隙，課堂常用的 [[p:ST34]]（急性胃痛）、[[p:GB36]]（頸項強、胸脇痛）都屬此類；急性期先按遠端郄穴，再處理局部。","tags":["原穴","絡穴","郄穴","五要穴","特定穴","參考書"],"muscles":[],"points":["LU9","LU7","LU6","LI4","ST40","ST34","SP3","SP4","HT7","SI4","BL58","KI3","PC7","PC6","PC4","TE4","TE5","GB40","GB36","LR3","LR5","SP21","GV1"],"regions":[],"book":"jingxue"},{"id":"b-jingxue-confluent","cat":"經絡穴位","src":"參考書《經穴大全》p.xxxiii–xxxiv（奇經八脈、要穴）、p.32、p.190","title":"八脈交會穴與下合穴：遠端配穴的骨架","body":"**八脈交會穴**：四肢上八個穴各通一條奇經，本書以兩兩成對列出，上肢配下肢：\n|上肢穴|下肢穴|相通奇經|常用部位|\n|---|---|---|---|\n|[[p:PC6]]|[[p:SP4]]|陰維脈＋衝脈|心、胸、胃|\n|[[p:TE5]]|[[p:GB41]]|陽維脈＋帶脈|側頭、耳、肩、脇|\n|[[p:SI3]]|[[p:BL62]]|督脈＋陽蹻脈|後頭、頸項、腰背|\n|[[p:LU7]]|[[p:KI6]]|任脈＋陰蹻脈|咽喉、胸、肺|\n落枕時課堂按 [[p:SI3]]，可以再加同組的 [[p:BL62]]，一手一腳同時讓客人轉頭。\n**下合穴**：六腑在下肢的合穴，腑病多取：胃 [[p:ST36]]、大腸 上巨虛（ST37）、小腸 下巨虛（ST39）、三焦 [[p:BL39]]、膀胱 [[p:BL40]]、膽 [[p:GB34]]。\n**四總穴**：本書只列 [[p:ST36]]、[[p:BL40]]、[[p:LU7]]、[[p:LI4]] 四個；課堂筆記另加的內關、支溝是後人增補，用法不衝突。","tags":["八脈交會穴","下合穴","四總穴","奇經八脈","參考書"],"muscles":[],"points":["PC6","SP4","TE5","GB41","SI3","BL62","LU7","KI6","ST36","BL39","BL40","GB34","LI4"],"regions":["cspine","lspine"],"book":"jingxue"},{"id":"b-jingxue-meridian-overview","cat":"經絡穴位","src":"參考書《經穴大全》p.xxviii–xxxv（PDF 第 30–37 頁）","title":"經絡概論：經脈、絡脈與 361 穴","body":"本書概論把常被混用的名詞分得很清楚：\n- **經絡 ≠ 經脈**：經脈是縱走的主幹，絡脈是橫向連結、網狀分布的分支（含孫絡、浮絡）。\n- **經脈系統**：十二正經、奇經八脈、十二經別（從正經分出深入臟腑再回頭面）、經水、**十二經筋**（起於四肢末端、結聚在關節周圍、不連臟腑，病時表現為痺痛、拘攣等運動問題）。\n- **穴位三類**：經穴（14 經上，共 361 穴）、奇穴（位置固定但不在經上，WHO 列 48 個）、阿是穴（壓痛點，對應現代的壓痛點、激痛點）。\n|經|穴數|經|穴數|\n|---|---|---|---|\n|肺|11|大腸|20|\n|胃|45|脾|21|\n|心|9|小腸|19|\n|膀胱|67|腎|27|\n|心包|9|三焦|23|\n|膽|44|肝|14|\n|督|28|任|24|\n**流注方向**：想像雙手高舉「萬歲」——陰經都由下往上（足三陰從腳到胸、手三陰從胸到手），陽經都由上往下（手三陽從手到頭、足三陽從頭到腳）。推拿常說的「順經為補、逆經為瀉」就是以這個方向為基準（此句為通識補充，非本書內容）。","tags":["經絡","經脈","經筋","流注","361穴","參考書"],"muscles":[],"points":[],"regions":[],"book":"jingxue"},{"id":"b-jingxue-neck","cat":"頸肩","src":"參考書《經穴大全》p.88–89、p.111、p.177、p.201–202、p.246、p.287","title":"頸肩痠痛的穴位：位置下面是哪條肌肉","body":"本書每個穴都標出下針會經過的肌肉，等於告訴推拿師「按這個穴其實在處理哪條肌肉」：\n|穴|定位重點（本書）|底下的結構|\n|---|---|---|\n|[[p:GB20]]|枕骨下，胸鎖乳突肌與斜方肌起端之間|頭夾肌、頭半棘肌；深層枕下三角與**椎動脈**|\n|[[p:BL10]]|平 C2 棘突上緣，斜方肌外緣凹陷|頭半棘肌|\n|[[p:GV16]]|枕外隆凸正下方，兩側斜方肌之間|項韌帶|\n|[[p:GB21]]|C7 棘突與肩峰外緣連線中點|上斜方肌、棘上肌|\n|[[p:TE15]]|肩井與曲垣的中點（肩胛上角上方）|斜方肌、棘上肌|\n|[[p:SI13]]|肩胛岡內端上方|斜方肌、棘上肌內側端|\n|[[p:SI15]]、[[p:SI14]]|C7、T1 棘突下旁開 2、3 寸|斜方肌、提肩胛肌、菱形肌一帶|\n本書的配穴：**肩頸痠痛**用天柱、風池、肩井、膏肓、身柱、曲垣；**頸肩腕症候群**用風池、大椎、天鼎、肩貞、曲池；**胸廓出口**用天鼎、屋翳、中府、天柱、肩井。\n!! 風池深層就是椎動脈與枕下三角（見課堂 k-va、k-cervical），按壓方向朝對側眼睛、力道持續而輕，不要往內上方猛戳。","tags":["頸肩","風池","肩井","枕下肌群","胸廓出口","參考書"],"muscles":["trap_u","levator","splenius","subocc","supraspinatus","scalene"],"points":["GB20","BL10","GV16","GB21","TE15","SI13","SI15","SI14","GV14","BL43","GV12","LI17","ST15","LU1"],"regions":["occ","cspine","scap"],"book":"jingxue"},{"id":"b-jingxue-shoulder-muscle","cat":"頸肩","src":"參考書《經穴大全》p.20–21、p.176、p.287、p.292","title":"肩痛依肌肉選穴：五十肩與運動性肩痛","body":"本書附錄把「運動性肩關節痛」按受傷肌肉列穴，這和課堂「先判斷是哪條肌肉」的思路完全接得上：\n|肌肉|本書列的穴|\n|---|---|\n|三角肌|[[p:TE13]]、[[p:SI10]]、[[p:SI9]]、[[p:LI15]]、[[p:TE14]]|\n|肱二頭肌（長頭腱）|[[p:LU3]]、[[p:LU4]]、[[p:LI14]]、[[p:PC2]]|\n|棘上肌|[[p:SI13]]、[[p:SI12]]、[[p:LI16]]|\n|斜方肌|[[p:GB21]]、[[p:SI14]]、[[p:SI15]]、[[p:SI12]]、[[p:LI16]]、[[p:BL10]]、[[p:TE15]]|\n|闊背肌|[[p:BL23]]、[[p:BL52]]|\n**五十肩**：基本組是肩髃、肩髎、肩貞、巨骨、臂臑、天宗；偏「經絡型」再加 [[p:LI11]]、[[p:TE5]]，偏「經筋型」再加 [[p:ST38]]、[[p:GB34]]——後者正是課堂「條口透承山治肩痛」的同一思路。\n- 肩髃與肩髎的分辨：手臂外展時肩峰下出現前、後兩個凹陷，前面是 [[p:LI15]]（肩峰前端與大結節之間），後面是 [[p:TE14]]（肩峰角與大結節之間）。","tags":["五十肩","肩痛","三角肌","棘上肌","選穴","參考書"],"muscles":["deltoid","biceps","supraspinatus","trap_u","lat","infraspinatus"],"points":["TE13","SI10","SI9","LI15","TE14","LU3","LU4","LI14","PC2","SI13","SI12","LI16","GB21","BL23","BL52","SI11","ST38","GB34"],"regions":["shoulder","scap"],"book":"jingxue"},{"id":"b-jingxue-lumbar","cat":"脊椎","src":"參考書《經穴大全》p.208–209（環跳）、p.288","title":"腰腿痛選穴：太陽型與少陽型","body":"本書附錄把慢性腰痛分成「太陽型」與「少陽型」兩組處方（本書只列類型名稱，以下依經脈走向理解為**痛往哪裡傳**）：\n- **太陽型**（痛沿腰、臀、大腿後側往下，膀胱經路線）：[[p:BL23]]、[[p:GB30]]、[[p:BL25]]、[[p:BL40]]、[[p:BL60]]。\n- **少陽型**（痛在臀外側、大腿外側，膽經路線）：[[p:BL25]]、[[p:GB30]]、[[p:GB31]]、[[p:GB34]]、[[p:BL58]]。\n其他組合：\n|情況|本書列的穴|\n|---|---|\n|肌筋膜性、小面關節性腰痛|[[p:BL20]]、[[p:BL21]]、[[p:BL23]]、[[p:BL52]]、[[p:BL25]]、[[p:BL32]]|\n|坐骨神經痛|胞肓（BL53）、[[p:BL37]]、[[p:BL56]]、[[p:GB34]]、[[p:ST36]]、[[p:GB30]]|\n|急性腰痛（氣血阻滯）|[[p:BL23]]、[[p:BL40]]、[[p:GB30]]、[[p:BL25]]、[[p:GV3]]|\n|慢性腰痛（腎虛）|[[p:BL25]]、[[p:GB30]]、[[p:BL40]]、[[p:BL23]]、[[p:KI3]]、[[p:GV4]]|\n推拿時可以把這兩型和課堂的評估接起來：太陽型多伴隨膕繩肌緊、直腿抬高受限；少陽型多伴隨臀中肌、闊筋膜張肌與梨狀肌問題（[[p:GB30]] 底下就是梨狀肌上、下孔一帶）。\n!! 有麻木、無力或直腿抬高很低就放射時，先依課堂 p_radic、k-redflag 轉介。","tags":["腰痛","坐骨神經痛","太陽型","少陽型","選穴","參考書"],"muscles":["erector","ql","glute_med","piriformis","hamstrings","tfl_itb","lat"],"points":["BL23","GB30","BL25","BL40","BL60","GB31","GB34","BL58","BL20","BL21","BL52","BL32","BL37","BL56","ST36","GV3","KI3","GV4"],"regions":["lspine","sacrum","pelvis","hip"],"book":"jingxue"},{"id":"b-jingxue-knee-leg","cat":"膝","src":"參考書《經穴大全》p.49–51、p.133、p.145–147、p.211、p.288、p.292","title":"膝與小腿痛選穴：依肌肉與部位","body":"本書附錄的下肢處方，可以直接套進課堂「膝痛：先上、再下、後局部」的順序：\n|問題|本書列的穴|\n|---|---|\n|退化性膝關節炎（局部）|[[p:ST34]]、[[p:SP10]]、[[p:BL40]]、[[p:ST35]]|\n|膝痛（加強組）|[[p:ST36]]、[[p:ST35]]、[[p:ST34]]、[[p:GB34]]、[[p:GB33]]、[[p:SP9]]、膝關（LR7）、[[p:LR8]]、[[p:KI10]]、浮郄（BL38）、[[p:BL39]]、[[p:BL40]]|\n|跳躍膝（髕腱）|[[p:ST35]]|\n|股四頭肌|[[p:SP10]]、[[p:ST34]]、陰市（ST33）|\n|脛骨外側|[[p:ST36]]、[[p:GB34]]|\n|脛骨內側|[[p:SP9]]|\n|腓腸肌|[[p:BL56]]、[[p:BL57]]、[[p:BL55]]|\n|比目魚肌|[[p:BL58]]、[[p:KI9]]、[[p:SP6]]|\n|阿基里斯腱|[[p:BL60]]、[[p:KI3]]、[[p:KI7]]、跗陽（BL59）|\n膝周圍的穴剛好圍成一圈：前面內外膝眼、外側 [[p:GB33]]／[[p:GB34]]、內側 [[p:SP9]]／[[p:LR8]]、後面 [[p:BL39]]／[[p:BL40]]／[[p:KI10]]，正好對應課堂的鵝足、髂脛束、膕肌與半月板位置。\n[[fig:b-jingxue-fig-leg]]","tags":["膝痛","小腿","阿基里斯腱","股四頭肌","選穴","參考書"],"muscles":["rectus_fem","vastus_med","vastus_lat","tib_ant","gastroc","soleus","popliteus","hamstrings"],"points":["ST34","SP10","BL40","ST35","ST36","GB34","GB33","SP9","LR8","KI10","BL39","BL56","BL57","BL55","BL58","KI9","SP6","BL60","KI3","KI7"],"regions":["knee","ankle"],"book":"jingxue"},{"id":"b-jingxue-arteries","cat":"安全","src":"參考書《經穴大全》p.7、p.38、p.47、p.63、p.68（專欄：針刺胸部經穴的危險性）、p.74、p.201、p.222、p.226–227","title":"摸得到動脈的穴位：按壓要放輕","body":"本書在定位時特別標出「可觸得動脈搏動」的穴，這些地方推拿只用輕柔的指腹，不用肘尖或持續重壓：\n|穴|底下的血管|\n|---|---|\n|[[p:ST9]]|總頸動脈（胸鎖乳突肌前緣）|\n|[[p:HT1]]|腋動脈（腋窩中央）|\n|[[p:LU9]]|橈動脈|\n|[[p:ST30]]、[[p:SP12]]、[[p:LR10]]、[[p:LR11]]|股動脈（鼠蹊）|\n|[[p:SP11]]|股動脈（縫匠肌與內收長肌之間）|\n|[[p:LR3]]|足背動脈|\n- [[p:GB20]] 深層是枕下三角與椎動脈，頸部旋轉加重壓要避免。\n- 本書用一整頁專欄提醒：胸背部的穴（[[p:ST12]]、[[p:GB21]]、[[p:BL13]]、[[p:BL43]] 等）下面很淺就是胸膜與肺，這是**針刺**才有的氣胸風險；推拿雖然不會刺穿，但肋間與鎖骨上窩仍不宜用尖銳的肘尖硬鑽。\n可與課堂 k-caution-points 一起看。","tags":["安全","動脈","股動脈","頸動脈","禁忌","參考書"],"muscles":["scm","adductors","sartorius"],"points":["ST9","HT1","LU9","ST30","SP12","LR10","LR11","SP11","LR3","GB20","ST12","GB21","BL13","BL43"],"regions":["cspine","hip","foot"],"book":"jingxue"},{"id":"b-jingxue-intro","cat":"人物與流派","src":"參考書《經穴大全》","title":"參考書：《經穴大全》導讀","body":"**坂元大海、原島廣至 著；形井秀一、高橋研一 監修**，原著 NTS Inc.（日本，2011）；台灣中譯本（OCR 未能辨識出版社與譯者全名），2011（原著；台灣中譯版約同期）。\n\n以 WHO／WPRO 標準定位逐一解說 361 個經穴的彩色圖鑑，每個穴配實景照片＋3D 解剖合成圖，標出下針會經過的神經、肌肉、血管與深層結構，並附穴名字源。概論部分整理了經絡系統、特定穴、骨度分寸與同身寸，附錄有奇穴與依病症（含運動傷害依肌肉）列出的配穴範例。對推拿最有用的是「這個穴底下是哪條肌肉」與標準化的取穴法。\n\n### 章節地圖\n- **前言、本書架構、目錄、各部位索引**（PDF 第 1–29 頁）：監修者與作者序；說明每頁的顏色代表神經、肌肉、動脈、靜脈與深層結構。\n- **經絡經穴概論**（p.xxviii–xlvi（PDF 第 30–45 頁））：經穴、奇穴、阿是穴、五行穴、命名方式、經脈種類、要穴、流注、臟腑氣血、骨度法與同身寸、古典解剖名稱。\n- **第 1 章 LU 手太陰肺經**（p.1–7）：11 穴，扉頁列穴性與要穴，取穴頁附 3D 解剖圖。\n- **第 2 章 LI 手陽明大腸經**（p.9–23）：20 穴，含肘、肩、頸部穴與三角肌解說。\n- **第 3 章 ST 足陽明胃經**（p.25–53）：45 穴，胸腹與下肢前外側，附專欄（條口名稱、胸部下針風險）。\n- **第 4 章 SP 足太陰脾經**（p.55–70）：21 穴；專欄「針刺胸部經穴的危險性」與「背部骨骼觸診」。\n- **第 5–6 章 HT 心經、SI 小腸經**（p.71–91）：心經 9 穴、小腸經 19 穴，肩胛區穴位詳解。\n- **第 7 章 BL 足太陽膀胱經**（p.93–135）：67 穴，背俞穴、八髎、膝後與小腿後側；附胸腰筋膜、米氏菱形窩說明。\n- **第 8–10 章 KI 腎經、PC 心包經、TE 三焦經**（p.137–181）：腎經 27 穴、心包經 9 穴、三焦經 23 穴。\n- **第 11 章 GB 足少陽膽經**（p.183–215）：44 穴，側頭、肩井、臀外側、下肢外側；附枕下肌群與椎動脈說明。\n- **第 12 章 LR 足厥陰肝經**（p.217–228）：14 穴，大腿內側與脇肋；附鵝足肌腱。\n- **第 13–14 章 GV 督脈、CV 任脈**（p.231–273）：督脈 28 穴、任脈 24 穴；附胸骨裂、會陰解說。\n- **附錄：奇穴**（p.274–281）：WHO 列的 48 個奇穴，多數列出歷來的不同定位說法。\n- **附錄：各種病例與所使用的經穴範例**（p.282–292）：依現代醫學與中醫辨證分列處方，含肩頸、腰腿、膝、運動傷害依肌肉選穴。\n- **參考文獻、索引**（p.293 以後）：日中文獻與穴名索引。\n\n### 本站整理的條目（14 則）\n- 骨度分寸全表：把身體切成固定份數（p.xxxvii–xxxix（PDF 第 39–41 頁））\n- 同身寸三法：骨度量不到時才用（p.xxxix（PDF 第 41 頁）；指寸見 p.7、p.14）\n- 等分取穴：用連線的幾分之幾找穴（p.5、p.51–52、p.63、p.87、p.133、p.147、p.159、p.202、p.208、p.249、p.266）\n- 背部骨性標誌：書上的觸診對照（p.70（專欄「如何藉由觸碰找出背部的骨骼位置」）、p.122）\n- 背俞穴與募穴：一前一後對臟腑（p.xxx（命名）、p.2、p.28、p.96–131、p.188、p.220、p.256–260）\n- 五輸穴：井滎輸經合，從指尖走到肘膝（p.xxix（五行穴）；各章扉頁「要穴」欄 p.2、p.10、p.32、p.56、p.72、p.80、p.104、p.138、p.156、p.166、p.190、p.218）\n- 原穴、絡穴、郄穴：慢性、表裡、急性（p.xxxiv（要穴）；各章扉頁 p.2、p.32、p.58、p.138、p.156、p.166、p.190、p.218）\n- 八脈交會穴與下合穴：遠端配穴的骨架（p.xxxiii–xxxiv（奇經八脈、要穴）、p.32、p.190）\n- 經絡概論：經脈、絡脈與 361 穴（p.xxviii–xxxv（PDF 第 30–37 頁））\n- 頸肩痠痛的穴位：位置下面是哪條肌肉（p.88–89、p.111、p.177、p.201–202、p.246、p.287）\n- 肩痛依肌肉選穴：五十肩與運動性肩痛（p.20–21、p.176、p.287、p.292）\n- 腰腿痛選穴：太陽型與少陽型（p.208–209（環跳）、p.288）\n- 膝與小腿痛選穴：依肌肉與部位（p.49–51、p.133、p.145–147、p.211、p.288、p.292）\n- 摸得到動脈的穴位：按壓要放輕（p.7、p.38、p.47、p.63、p.68（專欄：針刺胸部經穴的危險性）、p.74、p.201、p.222、p.226–227）\n\n條目都是用自己的話整理重點並標註頁碼，示意圖為依書中內容重新繪製；細節請對照原書。","tags":["參考書","經穴大全"],"book":"jingxue"},{"id":"b-jingxue-compare","cat":"原則","src":"參考書《經穴大全》比對","title":"《經穴大全》與課程的比對","body":"逐項比對《經穴大全》與課堂資料。共 14 項：高 0、中 1、低 13（嚴重度）。\n「衝突」＝說法相反；「程度差異」＝方向相同但做法或強度不同；「用詞不同」＝同一件事不同名稱；「補充」＝課堂沒提到或一致的地方。\n\n### 【中】SP11 箕門的高度（衝突）\n- **課堂：**穴位資料 SP11：「血海與衝門連線上，血海上 6 寸」（約髕底上 8 寸）。\n- **本書：**髕底內側端與衝門（SP12）的連線上，距衝門 1/3 處（相當於髕底上約 12 寸），位於縫匠肌與內收長肌之間、可摸到股動脈搏動。（p.63）\n- **怎麼看：**「血海上 6 寸」是舊版中國教材寫法；WHO／WPRO 2008 與中國 2006 國標都改成「連線上 1/3 與下 2/3 交點」，兩者差約 4 寸。建議網站改成 WHO 定位，並註明此處是股動脈走行處，按壓要輕。\n\n### 【低】BL56 承筋的高度（衝突）\n- **課堂：**穴位資料 BL56：「委中與承山連線中點，腓腸肌肌腹中央」（＝膕橫紋下 4 寸）。\n- **本書：**腓腸肌兩肌腹之間，膕橫紋下 5 寸；取穴為合陽（BL55）與承山（BL57）的中點（承山在委中下 8 寸）。（p.133）\n- **怎麼看：**委中到承山的中點只有 4 寸，和 WHO 的 5 寸差 1 寸；改成「合陽與承山連線中點（膕橫紋下 5 寸）」即與本書和 WHO 一致。推拿上差 1 寸影響不大，但網站資料應統一。\n\n### 【低】SI4 腕骨：第 5 掌骨底與哪塊腕骨之間（衝突）\n- **課堂：**穴位資料 SI4：「手尺側，第 5 掌骨底與**鉤骨**之間凹陷」。\n- **本書：**手腕尺側後方，第 5 掌骨基部與**三角骨**之間的凹陷，赤白肉際處。（p.85）\n- **怎麼看：**WHO 與中國 2006 國標都寫三角骨；「鉤骨」是舊教材的說法。實際觸診：沿第 5 掌骨尺側往腕部推，掌骨底近端的第一個凹陷即是；WHO 描述此凹陷近端的骨為三角骨。建議改字。\n\n### 【低】KI6 照海：缺少距離（程度差異）\n- **課堂：**穴位資料 KI6：「內踝尖下方凹陷」。\n- **本書：**內踝尖往下 1 寸的凹陷處（深處為載距突）。（p.146）\n- **怎麼看：**網站沒寫距離，容易和緊貼內踝下緣的位置混淆；建議補上「內踝尖下 1 寸」。\n\n### 【低】LR9 陰包的基準點（用詞不同）\n- **課堂：**穴位資料 LR9：「股骨內上髁上 4 寸」。\n- **本書：**大腿內側，股薄肌與縫匠肌之間，**髕底**上 4 寸（取穴時髖微屈外旋、讓內收肌收縮以摸清縫匠肌）。（p.226）\n- **怎麼看：**WHO 以髕底為基準，舊教材用股骨內上髁；兩者高度相近但不完全相同，建議改用髕底並加上「股薄肌與縫匠肌之間」，推拿時更好找。\n\n### 【低】以乳頭為基準的胸部穴（CV17、PC1、LR14、GB24）（用詞不同）\n- **課堂：**穴位資料：CV17「兩乳頭連線中點」、PC1「第 4 肋間，乳頭外 1 寸」、LR14「乳頭直下第 6 肋間」、GB24「乳頭直下第 7 肋間」。\n- **本書：**一律用肋間與距前正中線的寸數：膻中＝前正中線平第 4 肋間；天池＝第 4 肋間、前正中線旁開 5 寸；期門＝第 6 肋間、旁開 4 寸；日月＝第 7 肋間、旁開 4 寸；女性改用鎖骨中線。（p.158、p.204、p.228、p.268）\n- **怎麼看：**男性乳頭約在第 4 肋間、旁開 4 寸，所以舊說法對男性大致相同；但女性乳頭位置差異大，照網站寫法會偏低偏外。建議改成肋間＋寸數（從胸骨角＝第 2 肋往下數肋間）。\n\n### 【低】GV26 水溝：上 1/3 或中點（用詞不同）\n- **課堂：**穴位資料 GV26：「人中溝上 1/3 與中 1/3 交點」。\n- **本書：**主說為人中溝的中點；「上 1/3」列為別說。（p.253）\n- **怎麼看：**WHO 2008 採中點，中國國標採上 1/3。急救掐人中時兩點相距很近，實務無礙；網站可加註兩說並存。\n\n### 【低】LI11、LI14、BL10、ST31 用傳統描述而非 WHO 寫法（用詞不同）\n- **課堂：**LI11「屈肘，肘橫紋外側端凹陷」；LI14「三角肌止點處」；BL10「後髮際正中旁開 1.3 寸，斜方肌外緣」；ST31「髂前上棘與髕底外緣連線上，平臀橫紋」。\n- **本書：**曲池＝尺澤與肱骨外上髁連線中點；臂臑＝三角肌前緣、曲池上 7 寸；天柱＝平第 2 頸椎棘突上緣、斜方肌外緣凹陷；髀關＝股直肌近端、縫匠肌、闊筋膜張肌三肌之間的凹陷。（p.19、p.20、p.48、p.111）\n- **怎麼看：**實際落點與網站相近，只是基準不同。本書寫法用的是摸得到的骨頭與肌肉，對推拿較好用；尤其天柱用 C2 棘突定高度，比找髮際穩定（髮際因人而異）。\n\n### 【低】SI11 天宗：「棘下窩中央」的字面（用詞不同）\n- **課堂：**穴位資料 SI11：「肩胛骨棘下窩中央（肩胛岡中點與下角連線上 1/3）」。\n- **本書：**肩胛岡中點與肩胛下角連線，分成三等份，靠肩胛岡 1/3 處的凹陷。（p.87）\n- **怎麼看：**括號內的寫法正確，但前面「棘下窩中央」會讓人按得太低。建議刪掉「中央」或改為「棘下窩上部」。\n\n### 【低】背部骨性標誌的對應節段（程度差異）\n- **課堂：**「背部定位的骨性標誌」：肋弓最下緣（第 12 肋）約平 L2；兩側髂嵴最高點約平 L4；PSIS＝S2。BL23 註「約平肋弓下緣」，BL25 註「約平髂嵴最高點」。\n- **本書：**第 12 肋尖約平 L2（有時 L3），第 11、12 肋尖幾乎同高；Jacoby line 通過 L4 棘突**或 L4／L5 之間**；S2 後孔在兩側髂後上棘連線上；另加「肩胛上角連線≈T1」，並提醒胸椎棘突往下斜。（p.70）\n- **怎麼看：**大致一致，但本書明確寫出個體差異。另外「肋弓」嚴格說是第 7–10 肋軟骨形成的前方弧線，第 12 肋是浮肋，網站把兩者寫在一起容易誤會；建議改成「第 12 肋尖」。用骨性標誌定位後，最好再從 C7 或 L5 往上下數棘突確認。\n\n### 【低】EX-B7 腰眼的位置（補充）\n- **課堂：**穴位資料 EX-B7：「第 4 腰椎棘突下旁開約 3.5 寸凹陷」。\n- **本書：**列出四種傳統說法：腎俞下 3 寸、脊旁 1.5 寸；L4–L5 兩側的凹陷；俯臥舉手時 L3 棘突旁開 3–4 寸的凹陷；舉手時腰兩側出現的凹陷。（p.277）\n- **怎麼看：**網站採中國國標寫法，本身沒錯；本書顯示奇穴的位置歷來不統一。推拿時以「L4 水平、腰方肌外緣的凹陷」為準即可。\n\n### 【低】骨度分寸與同身寸（補充）\n- **課堂：**「骨度分寸：怎麼量「寸」」：列出 8 段骨度與拇指 1 寸、四指 3 寸。\n- **本書：**寸數全部一致；另補頭部（前後髮際 12、眉間→髮際 3、兩額角 9、兩乳突 9）、胸部（頸靜脈切跡→胸骨體下端 9）、背部（兩肩胛內緣 6）、下肢（恥骨聯合→髕底 18、臀溝→膕 14、髕尖→內踝尖 15、內踝尖→足底 3）與中指同身寸；並強調先用骨度、量不到才用同身寸。（p.xxxvii–xxxix）\n- **怎麼看：**無衝突，可把本書補充的分段加進 「骨度分寸：怎麼量「寸」」（見條目 b-jingxue-cun-table）。\n\n### 【低】特定穴、四總穴與主治（補充）\n- **課堂：**「八會穴」（八會穴）、「四總穴與常用遠端配穴」（四總穴＋內關、支溝增補）、「背俞穴與脊椎節段對照」（背俞穴）與各穴的主治欄。\n- **本書：**八會穴、背俞穴、募穴、郄穴（如 ST34、GB36、PC4、LU6）、絡穴（SP21 為脾之大絡）的歸屬全部一致；四總穴只列四個；各穴以「穴性」（如陽陵泉：清肝膽、疏筋絡、利筋骨）而非症狀清單說明。（p.xxxiv、p.2、p.32、p.58、p.96、p.190、p.218–220）\n- **怎麼看：**網站主治欄與本書穴性方向一致，沒有發現誤導性的主治。內關、支溝是後世增補的「六總穴」，不是本書內容，網站已標「常見增補」即可。\n\n### 【低】穴位定位整體核對結果（補充）\n- **課堂：**穴位資料（共 208 筆：203 個經穴＋5 個奇穴）。\n- **本書：**本書依 WHO／WPRO 2008 標準定位（日本第二次經穴委員會版）。（p.2–273（各經取穴頁）、p.274–281（奇穴））\n- **怎麼看：**共核對約 200 個穴（203 個經穴中除 LI15 外都找到本書定位文字或圖，另比對 5 個奇穴）：課堂條目與評估模式實際用到的穴（GB20、GB21、BL10–BL28 背俞穴、八髎、BL40、BL57、BL60、GB30、GB34、GB39、ST36、SP6、LI4、SI3、SI11、LU7、PC6、TE5、GV14、GV20 等）全部與本書一致；其餘四肢、頭面、胸腹穴除上面列出的 SP11、BL56、SI4、KI6、LR9、胸部乳頭基準穴、GV26、LI11／LI14／BL10／ST31、SI11、EX-B7 外，經別、寸數與肌肉關係都一致。LI15 的定位文字 OCR 無法辨識，未列入逐字核對。\n","tags":["參考書","衝突","比對"],"book":"jingxue"},{"id":"b-jizhui-format","cat":"原則","src":"參考書《脊椎手療法圖解》p.1–12、38–39","title":"本書架構：每節脊神經的七欄格式","body":"本書把脊椎依神經節段逐一拆開：枕骨、C1–C8、高／中／低胸、L1–L5、S1–S5，最後是髂骨與尾骨。每一節都用同一組欄位整理，讀起來像一張張「節段卡」：\n1. **主管**：這節神經被認為管哪些器官、肌肉。\n2. **病症**：可能出現的症狀清單（多屬流派經驗對應）。\n3. **痛徵**：分三種——**局部痛**（該節棘突兩側）、**局部反射痛**（往上或往下跑到附近，例如 C1 痛到兩肩胛之間）、**皮神經節反射痛區**（皮節）。\n4. **運動受限**：哪個方向動不了，例如 C1 前彎後仰受限、C2 左右旋轉受限。\n5. **檢查方法**：按壓哪兩節之間會痛、哪幾條肌肉縮短變硬。\n6. **舒緩區域**：矯正前先放鬆的軟組織。\n7. **矯正手法**：附手法編號（手法-1 到手法-116）。\n**讀法建議**：評估時先用第 3、4、5 欄（可以摸、可以測），病症清單只當參考。課堂神經頁只列分布位置，本書多了「局部痛」與「檢查」兩欄，可以互補。\n!! 課堂（k-nerve-c、k-nerve-ls）把皮節當找節段的線索；本書認為皮節不能單獨決定節段，見「衝突比對」。","tags":["架構","脊神經","痛徵","檢查","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine","sacrum"],"book":"jizhui"},{"id":"b-jizhui-painsource","cat":"評估","src":"參考書《脊椎手療法圖解》p.5–6、320","title":"苟氏椎側痛源：用八大痛源找患椎","body":"作者的核心主張：**要找錯位的那一節，看脊椎旁的肌肉，不要只看遠處哪裡痛。**椎體、椎間盤、薦髂關節或小面關節錯位會刺激神經、影響局部循環，使旁邊的肌肉出現下列任一種「痛源」：\n|序|痛源|序|痛源|\n|---|---|---|---|\n|1|關節障礙（動不順）|5|勞損|\n|2|痙攣|6|腫脹|\n|3|僵硬|7|緊張|\n|4|損傷|8|觸痛|\n- **分兩區看**：低頸、上胸兩旁出現痛源 → 痛常反射到頸、肩、肘、腕、手；低胸、腰椎、薦髂關節兩旁 → 反射到腰、臀、膝、踝、足。\n- **觸痛點（tender point）**：按下去在肌肉深層出現尖銳的刺痛，範圍小於約 1 cm。作者說找到它，就等於找到該矯正的那一節。\n- **驗證**：矯正後遠處的反射痛應很快減輕；附錄也說做了幾次沒進步，就表示沒找對關節。\n[[fig:b-jizhui-fig-painsource]]\n與課堂「摸脊椎是否平滑、單側較厚較硬」（[[m:multifidus]]、[[m:erector]]）是同一方向的觸診，本書多了「痛源 → 節段 → 遠處痛」的推理順序。","tags":["觸診","痛源","觸痛點","患椎","參考書"],"muscles":["multifidus","erector"],"points":[],"regions":["cspine","tspine","lspine","sacrum"],"book":"jizhui"},{"id":"b-jizhui-dermatome","cat":"神經","src":"參考書《脊椎手療法圖解》p.4–6","title":"皮節圖：正推成立，倒推不一定","body":"書中收錄傳統的佛氏皮神經節圖（前、後各一張，原圖出自 Haymaker 與 Woodhall，經 Cyriax 的骨科手冊轉引），標出 31 對脊神經在皮膚上的對應區。作者肯定它的價值，卻反對整脊界常見的用法：\n- **正推成立**：某節（例如 C4）錯位，它的皮節區一定會有痛。\n- **倒推不成立**：C4 皮節區痛，不一定是 C4 錯位——皮節彼此重疊，肌肉轉移痛、周邊神經卡壓也會痛在同一區。\n- 所以「哪裡痛就矯正對應的那一節」被作者稱為不合邏輯的傳統做法，要改用椎旁痛源確認。\n**實用流程**\n1. 用皮節縮小範圍（例如小指、無名指麻 → 先想 C8、T1）。\n2. 到可疑節段兩旁按壓，找局部痛、硬塊與觸痛點。\n3. 再用三分法排除肌肉或周邊卡壓（胸廓出口、腕隧道）。\n4. 三者都指向同一節，才進一步處理。\n!! 課堂把皮節當「推估往哪一節找」的線索，方向一致；本書更明確反對只憑皮節決定矯正節段，見「衝突比對」。","tags":["皮節","佛氏皮神經節圖","反射痛","定節段","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine"],"book":"jizhui"},{"id":"b-jizhui-limb-map","cat":"神經","src":"參考書《脊椎手療法圖解》p.7","title":"苟氏四肢疼痛反射表：先摸哪一段","body":"第一章附一張全身側面圖，把常見的四肢痛對應到「該先去摸哪一段脊椎」。以下依部位重新整理：\n**上肢**\n- 手握不住、用手就痛、手指（含拇指）痛、從手腕竄到前臂的痛、腕背痛：低頸 C6–C8。\n- 肩痛、肩僵硬：低頸到上胸（C5–T3）。\n- 手臂痛：T4、T5（課堂提到 T5 與遊走性痠麻、手腕以下有關，可互相對照）。\n**下肢**\n- 坐骨神經痛：L4、L5 與薦髂關節。\n- 腳痛、腳僵硬腫脹，雙腳劇痛、彎腰更痛：L4、L5。\n- 腰痛合併膝痛、小腿肚痛腫抽筋：薦髂關節；膝痠：薦髂關節加 L3、L4。\n- 踝與小腿痛：L3–L5；腳跟痛：L3、L4 與薦髂關節。\n- 腰、腿、腳一起痛：低胸到高腰（T10–L2）。\n**怎麼用**\n- 這張表是「找哪一段」的清單，不是診斷。到那一段兩旁找痛源（見「苟氏椎側痛源」），也別忘了肌肉本身的激痛點，例如 [[m:gastroc]]、[[m:piriformis]]。\n- **薦髂關節**在下肢痛出現的次數最多，是本書很重視的源頭。","tags":["四肢痛","反射表","薦髂關節","節段","參考書"],"muscles":["gastroc","piriformis"],"points":[],"regions":["cspine","tspine","lspine","sacrum","knee","ankle"],"book":"jizhui"},{"id":"b-jizhui-listing","cat":"脊椎","src":"參考書《脊椎手療法圖解》p.42–47、54–57、62、198","title":"受限代號：怎麼決定邊與方向","body":"每個矯正法都先標出**受限代號**，讀懂它就知道站哪邊、壓哪裡、往哪推：\n|代號|意思|書中例子|\n|---|---|---|\n|R／L|右側／左側|—|\n|P|後方受限|RPC1：C1 右後方受限|\n|I|下方受限|RIC2：C2 右下方受限|\n|側方（第二字 L）|側方受限|RLC2：C2 右側方受限|\n**決定邊與方向（整理）**\n1. 椎旁觸診找出痛源、觸痛點較明顯的一側，就是受限側（患側）。\n2. 擺位讓**患側在上**，或術者站在患側（例：腰椎俯臥法右側受限就站右邊）。\n3. 先把患部旁的軟組織推開，再把接觸點（豆狀骨、指掌關節、食指或拇指腹）貼在**受限側**的橫突或關節突。\n4. 另一手輕微牽引，把關節帶到極限（鎖住）。\n5. 在**吐氣將盡**時短而快地發力，方向多半**由後向前**，再依節段加上斜向：上頸椎朝對側眼睛或對側肩鎖關節方向；側方受限則由患側推向健側。\n[[fig:b-jizhui-fig-listing]]\n!! 課堂用呼吸測試與轉折點找卡住的節（k-breath-test、k-turn），本書用觸痛點定邊，兩者可以交叉確認；吐氣時發力兩邊一致。","tags":["受限代號","RPC","方向","吐氣發力","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine"],"book":"jizhui"},{"id":"b-jizhui-relief","cat":"手法","src":"參考書《脊椎手療法圖解》p.12、15、39、49、61、71、89、99、115–116、136、165、196、203、217、223、245","title":"矯正前的舒緩區：同側、先鬆前面","body":"每一節都附一張「舒緩區域」圖：矯正前先放鬆的軟組織，**很多在身體前面或側面**，不只是背後那一節。規則是**右側受限就舒緩右側，兩側受限就兩側都做**；胸椎章另外建議舒緩前先熱敷 15–20 分鐘。\n|節段|書中列的舒緩區（摘要）|\n|---|---|\n|枕骨|同側 [[m:pec_major]]、[[m:pec_minor]]，三角肌與肱二頭肌之間|\n|C1|胸鎖關節附近、肩鎖關節、枕骨下緣（[[m:subocc]]）|\n|C2|上述再加胸大肌、胸小肌、[[m:levator]]|\n|C3|[[m:scm]] 等|\n|C4|腋下 [[m:serratus]]|\n|C6|[[m:teres_minor]]、[[m:teres_major]]|\n|C7|中、後斜角肌（[[m:scalene]]）、[[m:subscap]]、腋下前鋸肌|\n|高胸|胸大肌、胸骨柄旁胸橫肌、提肩胛肌、小圓肌|\n|中胸|胸骨柄旁胸橫肌、前胸肋骨內緣|\n|低胸|前胸肋骨內緣、腋下前鋸肌、肩胛骨下緣、第 12 肋下緣|\n|L1、L2|第 12 肋下緣、[[m:iliopsoas]]、[[m:sartorius]] 起點|\n|L4|第 12 肋下緣、[[m:tfl_itb]]|\n|L5|上述再加 [[m:gastroc]] 內側頭、大轉子外側肌群|\n|薦椎、髂骨|縫匠肌起點、坐骨結節內外緣、內收長肌止點附近、股直肌下的 [[m:adductors]]|\n這和課堂「先鬆縮短的前側、不要一直揉被拉長的後側」（k-stretch）與「先創造空間再矯正」（k-3steps）是同一個思路。","tags":["舒緩區","前側","同側","熱敷","參考書"],"muscles":["pec_major","pec_minor","subocc","levator","scm","serratus","teres_minor","teres_major","scalene","subscap","iliopsoas","sartorius","tfl_itb","gastroc","adductors"],"points":[],"regions":["cspine","tspine","lspine","pelvis","scap"],"book":"jizhui"},{"id":"b-jizhui-neck-safety","cat":"安全","src":"參考書《脊椎手療法圖解》p.26、30、35–37、40–50、323","title":"頸椎矯正前的禁忌與安全檢查","body":"**作者列的頸椎矯正禁忌（重點）**\n- 沒有照過 X 光不矯正。\n- 有血栓或血管硬化不矯正；肌肉正在痙攣時不矯正；沒先做舒緩不矯正。\n- 長者有頭暈或偏頭痛、類風濕關節炎且椎間孔狹窄者，不宜矯正。\n- 關節要先完全拉開或轉到極限才可發力；牽引不可過大，超過極限只容許約 2–5°。\n**四步安全檢查**\n1. 仰臥，頭頸懸出床外做完全後仰約 5–7 秒，問有沒有劇痛、暈、想吐。\n2. 後仰再轉向一側到極限，停 20–30 秒。\n3. 改坐姿重做後仰，再轉向一側。\n4. 在後仰姿勢下做旋轉到極限，都正常才算「通過」。\n附錄補充：觀察頭暈、眼球震顫、說話不清；上頸椎用前屈比後仰安全。\n**各手法的個別禁忌**：頭不能轉 90° 的人不用需要大角度旋轉的手法；骨質疏鬆者忌用部分手法；枕骨挫傷急性期不做；有些枕骨手法明寫不用頓力。\n!! 這套「後仰＋旋轉」測試通過也不能保證安全，測試本身也可能誘發症狀；推拿師不做頸部快速旋轉扳動，見「衝突比對」。","tags":["頸椎","禁忌","安全檢查","椎動脈","參考書"],"muscles":[],"points":[],"regions":["cspine","occ"],"book":"jizhui"},{"id":"b-jizhui-cervical","cat":"神經","src":"參考書《脊椎手療法圖解》p.38、48、60、70、80、88、98、104","title":"C1–C8：局部痛位置與檢查重點","body":"把各節「痛徵、運動受限、檢查方法」中能辨識的部分整理如下（症狀清單省略；OCR 不清的欄位已略過）：\n|節|局部／反射痛|皮節區|受限或檢查|\n|---|---|---|---|\n|C1|C0–C3 之間；有時往下到兩肩胛間|頭頂|前彎後仰受限；按 C0–C1 有壓痛，[[m:subocc]] 縮短、僵硬、觸痛|\n|C2|往上到耳後，往下到兩肩胛間|臉中部（額、眼、鼻、口）|左右旋轉受限；按 C1–C2 壓痛，[[m:levator]] 與枕下肌緊|\n|C3|往上反射到枕骨|顏面（牙、顎）|按壓對應棘突旁壓痛；提肩胛肌、枕下肌、[[m:trap_u]] 無力或縮短|\n|C4|痛區偏下頸；往下反射到 T5、T6|喉、頸|向右側彎受限（書中示例）|\n|C5|C4–C5 一帶；往下到胸椎兩側|肩頂沿橈側到腕|舉臂困難，[[m:deltoid]]、斜方肌|\n|C6|前鋸肌、肱二頭肌、胸大肌痛；上可到 C1|—|C5–C6 之間壓痛|\n|C7|C6–C7 之間，有時到肩或往下|上臂後側到中指|兩側壓痛，斜角肌、肱三頭肌無力或縮短|\n|C8|C7–T1 兩側；肘痛、肩痛、臂痠|前臂內側、無名指、小指|坐姿按壓 C7、T1 兩側有硬塊或緊繃|\n- 檢查順序：先找局部壓痛，再看肌肉是否縮短，最後對照皮節。\n!! 與課堂頸神經表（k-nerve-c）大致一致（C1 頭頂、C2 臉、C8 第 4、5 指）；C5 書寫橈側，課堂寫手臂陰面，見「衝突比對」。","tags":["頸神經","C1–C8","皮節","檢查","參考書"],"muscles":["subocc","levator","trap_u","deltoid"],"points":[],"regions":["occ","cspine","shoulder"],"book":"jizhui"},{"id":"b-jizhui-occiput","cat":"評估","src":"參考書《脊椎手療法圖解》p.14–15、24–31","title":"枕骨的檢查：耳垂、乳突與枕骨下緣","body":"本書把枕骨獨立成一章，檢查分三步：\n1. **正面看**：客人頭頸擺正，看兩側耳垂是否等高、對稱；不等高就懷疑枕骨問題。（X 光上則比較兩側乳突的大小與角度。）\n2. **仰臥摸**：術者坐在客人頭的上方，兩手掌托在枕骨下，用食指或中指指腹比較兩側枕骨下緣的高低、前後位置與肌肉彈性。\n3. **分辨受限方向**：\n   - 後側受限：單側枕骨卡在後方。\n   - 前屈受限：枕下軟組織緊，下巴很難貼近胸口。\n   - 後仰受限：枕骨前方的肌肉緊，下巴很難往上抬。\n**作者整理的枕骨異常**：局部痛在枕骨與 C1 之間，有時往下到兩肩胛之間；皮節痛在頭頂到枕骨；動作上前彎、後仰受限。舒緩時處理**同側**的 [[m:pec_major]]、[[m:pec_minor]]。\n- 處理前屈受限時，書中有持續推 30–60 秒、最後只輕輕一頓的做法，部分手法明寫不用頓力。\n- 推拿可用的部分：耳垂與枕骨下緣的對稱觸診、[[m:subocc]] 放鬆、同側胸肌放鬆。\n!! 課堂說頭前傾時枕下肌縮短（k-scm-lever），與本書「前屈受限＝枕下軟組織緊」可以對照。","tags":["枕骨","耳垂","乳突","枕下肌","參考書"],"muscles":["subocc","pec_major","pec_minor"],"points":[],"regions":["occ","head"],"book":"jizhui"},{"id":"b-jizhui-thoracic","cat":"脊椎","src":"參考書《脊椎手療法圖解》p.115、134、152–164、180–182","title":"胸椎三區：檢查、徵象與先後","body":"本書把胸椎分成**高胸 T1–T4、中胸 T5–T8、低胸 T9–T12**，三區用同一套檢查：\n1. 客人俯臥，術者兩拇指放在脊椎兩側，從 C7 往下一節一節壓。\n2. 先看棘突、橫突是否排在一直線上。\n3. 再找兩側肌肉有沒有硬塊、緊繃、損傷、腫脹、觸痛。\n**高胸的徵象（作者觀察）**\n- T1–T4 任一節往後旋轉，**同側肩膀會上升**。\n- T1 神經異常：手指不容易張開；T2 錯位：出現像落枕的痛。\n- T2–T4 會反射到前胸或肋間；T4 有時反射到臀部。\n**準備與先後**：舒緩前熱敷 15–20 分鐘；各區都建議**先矯正薦髂關節，再做患處，最後做 C1、C2**（作者的理由是放鬆交感、刺激副交感）。\n**手法類型**：俯臥配合有彈壓裝置的床用豆狀骨下壓；坐姿、站姿、跪姿從背後抱起的伸展型矯正——**肩關節有問題的人不能做**，客人後仰角度不能太大；棘突壓痛很強時不用某些衝擊法；兒童用的方法明寫不能用頓力。\n!! 課堂說 T1、T4、T12 最容易出狀況（k-principles2），高低肩要往下看骨盆（p_shhigh）；本書補上「胸椎後旋 → 同側肩高」這條線索。","tags":["胸椎","高胸","肩高","熱敷","參考書"],"muscles":["erector","trap_u"],"points":[],"regions":["tspine","scap"],"book":"jizhui"},{"id":"b-jizhui-tl","cat":"神經","src":"參考書《脊椎手療法圖解》p.164–167、195、323","title":"胸腰交界：腹側、髂嵴與臀部的轉移痛","body":"低胸與胸腰交界的神經痛常被誤認為腰、臀或腹部的問題。本書的轉移痛圖與附錄提示：\n- **T9–T12**：引起側腹、下腹部的疼痛（沿肋間神經斜向前下）。\n- **T12–L1**：痛在**髂嵴上緣與臀部上方**，很像腰痛或薦髂痛。\n- **T11、T12** 錯位：臀部與大腿後側痛（附錄第 55 條）。\n- **L1**：作者說神經根真正受壓的情況很少，但反射痛相當明顯；下腹、腰、鼠蹊到膝有麻痛，彎腰困難。\n[[fig:b-jizhui-fig-tl]]\n**推拿上的用法**\n1. 客人指著髂嵴或臀上方說痛，腰椎、薦髂又摸不出明顯問題時，往上摸 T11–L1 兩旁有沒有痛源。\n2. 舒緩區：第 12 肋下緣、[[m:iliopsoas]]、[[m:ql]] 一帶。\n3. 腹側痛要先排除內臟問題（見安全條目）。\n!! 課堂把 T12–L1 當成旋轉的轉折點（k-turn）；本書補上這一帶的轉移痛位置，兩者可合起來看。","tags":["胸腰交界","髂嵴痛","臀痛","轉移痛","參考書"],"muscles":["iliopsoas","ql"],"points":[],"regions":["tspine","lspine","pelvis"],"book":"jizhui"},{"id":"b-jizhui-lumbar-tests","cat":"神經","src":"參考書《脊椎手療法圖解》p.195、202、208、216、222、240","title":"L1–S1：肌力、反射與直腿抬高","body":"本書每節腰薦神經都附檢查法，整理如下：\n|神經|皮節／轉移痛（書中）|檢查（書中）|\n|---|---|---|\n|L1|下腹、腰、鼠蹊到膝|T12–L1 兩側緊、硬、觸痛；彎腰困難|\n|L2|鼠蹊到膝、大腿前外側|仰臥屈髖，術者給阻力；無力就懷疑 L2 神經根|\n|L3|大腿到小腿內側、膝前|俯臥屈膝誘發反射痛；直腿抬高時膝前痛；敲髕骨下方的膝反射|\n|L4|大腿外側經踝上到大腳趾|直腿抬高受限；腳背屈對抗無力（[[m:tib_ant]]）|\n|L5|大腿外側到踝、腳背、腳內側三趾|腓骨肌無力（外翻難，[[m:peroneus]]）、[[m:glute_med]] 無力（外展難）、伸大腳趾無力；直腿抬高陽性|\n|S1|大腿後側經膝、踝、腳跟到足底小趾|膕繩肌無力（屈膝難）、[[m:gastroc]] 無力（不能踮腳尖）、腓骨肌無力；敲腳跟上方|\n- 本書提醒 L5 椎間盤最複雜：可壓到 L5、S1 甚至 S2–S4，有時連腳背都麻；身體前傾時加重。\n!! 一般神經學把踝反射（敲跟腱）歸 S1；書中 L5 也用它，判讀時以 S1 為主。課堂 L4、L5、S1 的皮節走向與本書不同，見「衝突比對」。","tags":["腰神經","直腿抬高","反射","肌力","參考書"],"muscles":["tib_ant","peroneus","glute_med","gastroc","hamstrings"],"points":[],"regions":["lspine","sacrum","knee","ankle"],"book":"jizhui"},{"id":"b-jizhui-landmarks","cat":"評估","src":"參考書《脊椎手療法圖解》p.192","title":"椎體定位：轉頭分 C7、T1，不用髂嵴定 L4","body":"本書建議用幾個「基準節」定位：頸椎 C2、C4、C7；胸椎 T1、T4、T7、T12；腰椎 L2、L3、L5。\n- **C2**：枕骨下第一個明顯摸得到的棘突。\n- **C4**：頸椎的中段。\n- **C7 與 T1**：肩頸交界有兩個靠在一起的明顯棘突，請客人轉頭——**跟著轉動的是 C7，不動的是 T1**（比只用「低頭最突出」更好分辨，見 [[p:GV14]]）。\n- **T4**：兩側肩胛骨內緣最突點的水平連線。\n- **T7**：兩側肩胛下角連線（見 [[p:GV9]]）。\n- **T12**：第 12 肋的起點；**L2**：兩側第 12 肋尾端連線約對到 L2 的椎間盤。\n- **L3**：五節腰椎的中間；**L5**：薦椎上方第一個棘突，最好找。\n**作者特別反對**：用兩側髂嵴連線定 L4。理由是骨盆會上下移位，「會動的東西不能當標準」。\n**實用建議**：骨盆不對稱時，從 L5（薦椎上方）往上數、從 T12（第 12 肋）往下數，兩邊對一下；也別忘了移行椎的可能（k-transitional）。\n!! 課堂用「髂嵴最高點約平 L4、肩胛岡內端約平 T3」（k-landmarks），見「衝突比對」。","tags":["定位","C7","L4","骨性標誌","參考書"],"muscles":[],"points":["GV14","GV9"],"regions":["cspine","tspine","lspine"],"book":"jizhui"},{"id":"b-jizhui-locking","cat":"手法","src":"參考書《脊椎手療法圖解》p.210、218、224、322","title":"側臥腰椎：上下鎖定到目標節","body":"本書腰椎側臥矯正的關鍵是**把上下兩端「鎖」到目標節**，力量才會集中在那一節（以 L4 為例）：\n1. 客人側臥，患側在上；下面的腿伸直，上面的腿彎曲，腳背勾在下腿的膝窩。\n2. 術者一手中指放在目標棘突。\n3. **由下往上鎖**：用大腿慢慢把客人的上腿往頭的方向帶，中指一感覺到目標節開始動就停。\n4. **由上往下鎖**：拉客人下方的手臂，讓上身轉，中指感覺到動作從上面傳到目標節就停。\n5. 豆狀骨貼在患側橫突，吐氣將盡時以身體重量由後向前發力，角度要越過背部與床面的垂直線。\n附錄的原則：\n- 先側彎、再旋轉到極限，就會產生鎖定。\n- 頸部大多由上往下鎖，腰部大多由下往上鎖。\n- **骨質疏鬆或年長者**：停在第 4 步，維持牽引 30–60 秒、放鬆再重複，不做衝擊（書中 L3 深層肌舒緩法）；客人喘不過氣時先放鬆。\n[[fig:b-jizhui-fig-locking]]\n!! 呼應課堂「固定下面一節、轉上面一節」（k-turn）與 Fryette 耦合規則（k-facets）；本書把它變成可感覺的操作步驟。","tags":["鎖定","側臥","腰椎","持續牽引","參考書"],"muscles":["erector","multifidus","ql"],"points":[],"regions":["lspine"],"book":"jizhui"},{"id":"b-jizhui-ilium","cat":"骨盆","src":"參考書《脊椎手療法圖解》p.258–305","title":"髂骨 AS、P、IN、EX 與課堂三角度對照","body":"第六章有 24 種髂骨矯正法，都用代號標出移位方向。依書中**接觸點與發力方向**推回去，可以對到課堂的三個角度：\n|本書代號|移位|主要接觸點|發力方向|對照課堂|\n|---|---|---|---|---|\n|AS|向前上|坐骨結節|由後向前，並往床面壓|第一角度 A|\n|P、PI|向後（下）|髂後上棘|由後向前|第一角度 P|\n|IN|後側靠近中線|內側接觸|由內向外|第二角度 IN|\n|EX|後側遠離中線|外側接觸|由外向內|第二角度 EX|\n|ASEX|前上＋外|坐骨結節外側|後→前，外→內|③ EX（又高又遠）|\n|PIN|後下＋內|髂後上棘（內緣）|後→前，帶向外、向上|③ IN（又低又近）|\n- 書中的寫法常是「右側骨盆向前移位（即向後受限）」：**移位與受限方向相反**，閱讀時先確認寫的是哪一個。\n- 多數用側臥、患側在上，也有俯臥、仰臥抬腿的做法；仰臥法多用持續壓 30–60 秒。\n[[fig:b-jizhui-fig-ilium]]\n推拿師可以借用的是「判讀方向」與「接觸點」：課堂處理 A、P、EX、IN 用肌肉（[[m:rectus_fem]]、[[m:hamstrings]]、[[m:glute_med]]、[[m:deep_rot]]、[[m:adductors]]），本書則用衝擊推骨頭。\n!! IN、EX 的對應是由施力方向推得；外文整脊書對 IN／EX 的定義未必相同，見「衝突比對」。","tags":["髂骨","AS","PI","IN／EX","參考書"],"muscles":["rectus_fem","hamstrings","glute_med","deep_rot","adductors"],"points":[],"regions":["pelvis","sacrum","hip"],"book":"jizhui"},{"id":"b-jizhui-sacral","cat":"神經","src":
