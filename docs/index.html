"參考書《脊椎手療法圖解》p.240–244、306","title":"S1–S5 與尾骨：徵象與該轉介的訊號","body":"**S1**：坐骨神經痛從大腿後上端經膝、踝到腳跟，再沿足底到小趾；薦髂關節上半部緊、觸痛，臀肌有時收縮不良；踮腳尖、屈膝、外翻無力（見「L1–S1 檢查」）。\n**S2**：痛從臀部延伸到腳跟；L5–S1 椎間盤也可能同時壓到 S1、S2。\n**S3**：作者說很少單獨受影響，主要是大腿上內側麻痛、薦椎下半部兩側壓痛，動作不受限。\n**S4、S5**：肛門附近麻木、兩側坐骨神經反射痛、臀下內側痛，以及**排便失控、小便失禁**。\n!! S4–S5 的這組症狀（會陰／肛門麻木、大小便失控）在課堂屬於馬尾症候群的紅旗（k-redflag），要立刻轉介急診，不是矯正的適應症。\n**尾骨**\n- 作者區分：近期撞擊造成的尾骨痛才需要調整尾骨；不是近期撞擊造成的，放鬆尾骨內外側軟組織就能改善。\n- 新撞傷後坐姿要用中空的圓形軟墊，避免再移位。\n- 書中的尾骨矯正是戴手套從肛門內操作，屬侵入性處置，推拿不做（見「衝突比對」）；推拿只做臀部肌肉（[[m:glute_max]]）與薦尾關節兩側韌帶的外部放鬆。","tags":["薦神經","馬尾","尾骨","轉介","參考書"],"muscles":["glute_max","hamstrings","gastroc"],"points":[],"regions":["sacrum","pelvis"],"book":"jizhui"},{"id":"b-jizhui-brother","cat":"脊椎","src":"參考書《脊椎手療法圖解》p.112","title":"兄弟椎全表：胸椎也成對","body":"課堂學過頸、腰的兄弟椎（C1↔L5 到 C5↔L1）。本書的全表把整條脊柱上下對折配對：\n|上端|下端|\n|---|---|\n|蝶骨|尾椎|\n|枕骨（後頭骨）|薦椎|\n|C1–C5|L5–L1（與課堂相同）|\n|C6、C7|T12、T11|\n|T1、T2、T3|T10、T9、T8|\n|T4、T5|T7、T6|\n- 來源：書中說這是整脊界的「兄弟系統」（Lovett Brother System），由 Peter Leighton 提倡。\n- 用法：處理一端時連另一端一起矯正，作者說會產生「幫浦」般的加乘效果，多用在內科相關的問題。\n- 圖上把配對分成「同方向矯正」與「反方向矯正」兩組，掃描圖的分組線不夠清楚，細節以原書為準。\n**推拿上的用法**：頸部反覆緊繃時，去摸它的兄弟節段（例如 C2 緊 → 摸 L4 兩旁）；胸椎中段（T4–T7）彼此成對，可以互相檢查。\n!! 與課堂兄弟椎（k-family）一致，本書多了胸椎與頭骨—薦尾的配對。","tags":["兄弟椎","配對","Lovett","對折","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine","sacrum","head"],"book":"jizhui"},{"id":"b-jizhui-order","cat":"原則","src":"參考書《脊椎手療法圖解》p.115、322–323","title":"矯正順序：骨盆是地基，頸椎收尾","body":"本書在各章與附錄零散提到順序，整理成幾條：\n- **側彎合併薦椎移位**：先矯正薦椎，再處理脊椎側彎。\n- **骨盆功能失調先做**，再矯正腰椎；脊椎都做完後，要再回頭把「當作地基的骨盆」擺正，被矯正的脊椎才站得住。\n- **胸椎各區**：先做薦髂關節 → 再做患處 → 最後做 C1、C2。\n- **兩種方向各有目的**：從頸椎往下做到骨盆，是為了循環與神經功能；從骨盆往上做到頸椎，是為了結構。\n- **新舊病同時發作**：有經驗的人先處理舊病，再處理新病。\n- **治腰痛前先量兩腳是否等長**；長短腳沒處理，腰痛不可能好。\n**與課堂合起來的實用版本**\n1. 先排除紅旗與禁忌。\n2. 由下往上看地基（足踝 → 膝 → 骨盆 → 薦椎）。\n3. 選差最多、最有把握的那一處先做，做完重新量。\n4. 往上處理脊椎，最後回頭確認骨盆。\n!! 課堂從腳開始看（k-eval-0903、k-effective），且「差最多的先做」（k-order）；本書從骨盆、薦髂開始，不談足踝，見「衝突比對」。","tags":["順序","骨盆","地基","長短腳","參考書"],"muscles":[],"points":[],"regions":["pelvis","sacrum","lspine","cspine"],"book":"jizhui"},{"id":"b-jizhui-isometric","cat":"手法","src":"參考書《脊椎手療法圖解》p.320、322","title":"均抗療法：在極限位置做等長對抗","body":"附錄介紹「均抗療法」（isometric techniques），用來處理肌肉收縮、萎縮、痠痛：\n1. 把有問題的關節帶到**極限**（barrier，剛好有阻力的位置）。\n2. 請客人在這個位置**輕輕用力**往回推，術者給**大小相同、方向相反**的力，兩邊都不動。\n3. 客人不能出太多力。\n作者的分工觀：\n- 均抗作用在**肌肉**，不是關節；它讓緊張、萎縮、痠痛的肌肉得到治療。\n- 快速矯正（會「喀」一聲）用來消除肌肉緊張；均抗則幫助肌肉放鬆。\n- 附錄還說：痛是因為肌肉不能回到原來的長度。\n**操作提示（補充：一般肌肉能量技術的做法，非本書原文）**\n- 客人出力約兩成，維持 3–5 秒，放鬆、吐氣後把關節帶到新的極限，重複 3 次左右。\n- 用在不適合衝擊的客人（年長、骨鬆、怕痛）特別好用。\n!! 課堂沒有教等長對抗；它的目的和「先創造空間」（k-3steps、k-space）相同，可以當成不做衝擊時的選項。","tags":["均抗","等長收縮","極限","肌肉能量","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine","hip"],"book":"jizhui"},{"id":"b-jizhui-pelvis-signs","cat":"評估","src":"參考書《脊椎手療法圖解》p.322–323","title":"骨盆移位的外觀線索與長短腳","body":"附錄列出「骨盆移位」的外觀線索（以右側骨盆移位為例）：\n**臉部**：作者認為骨盆移位的人臉的左右會失去平衡——眼睛一大一小、上眼皮一雙一單、下眼皮一邊腫、鼻樑不正、鼻孔不等大、人中歪、嘴角或兩耳不在同一水平。\n**俯臥**：右側臀部較隆起；右腿比左腿短。\n**仰臥**：兩腳交疊時，左腿很自然地放到右腿上；左腳趾離床面較近、右腳趾較遠。\n**長短腳的幾條經驗**\n- 長短腳的客人中，右腿短的人約是左腿短的 2 倍。\n- 骨盆扭轉會造成長短腳，矯正薦髂關節後兩腿可以等長。\n- 長短腳的客人頸椎多半僵硬。\n- 治療腰痛前先檢查兩腳是否等長。\n**實用做法**：臉部線索只當輔助；長短腳要在俯臥（課堂 k-heel90、k-sacrum-check）與仰臥都看，再用髂後上棘與 S2 的關係判斷是哪一個角度造成。\n!! 課堂分得更細：A 側為長腳、P 側為短腿、③ EX 也會短腿（k-angle1、k-angle3）；本書只說「移位側較短」，沒有分方向，見「衝突比對」。","tags":["長短腳","骨盆移位","外觀","俯臥","參考書"],"muscles":[],"points":[],"regions":["pelvis","sacrum","head"],"book":"jizhui"},{"id":"b-jizhui-pathology","cat":"脊椎","src":"參考書《脊椎手療法圖解》p.32","title":"錯位如何變成症狀：苟氏病變機制圖","body":"第二章末有一張苟亞博的流程圖，說明「錯位 → 症狀」的路徑，可以當成判斷「為什麼這裡會痛」的框架：\n**原始病因（五類）**\n1. 椎間盤退化：間隙變窄、關節囊與韌帶鬆弛。\n2. 椎體周圍軟組織慢性勞損，造成兩側不平衡。\n3. 椎間盤突出後鈣化、骨化。\n4. 薦髂關節錯位。\n5. 職業或習慣造成的不良姿勢。\n**中間結果**：椎體失穩（作者估計約佔 75%）→ 黃韌帶肥厚、韌帶反覆拉扯出血後鈣化、骨刺增生、小面關節移位；頸椎骨刺可能壓到椎動脈。\n**孔道變窄的兩個門檻**：椎間孔面積窄到約 1/3 時，對神經根是化學性刺激；窄到約 1/2 時，變成骨性壓迫。\n**最後的表現**：交感神經 → 內臟功能；神經根 → 皮節反射痛；脊髓 → 無力、麻木、癱瘓等；椎動脈 → 供血不良。\n**推拿上的意義**：前兩類與第 5 類（勞損、姿勢）是推拿能介入的；出現脊髓或進行性神經症狀，就超出範圍要轉介。這也呼應課堂「姿態性 vs 損傷性」的分類（k-posture-injury）。","tags":["病變機制","椎體失穩","椎間孔","骨刺","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine","sacrum"],"book":"jizhui"},{"id":"b-jizhui-nonthrust","cat":"手法","src":"參考書《脊椎手療法圖解》p.24–27、108–110、210、230–236","title":"不做衝擊的選項：持續牽引與伸展","body":"本書雖以衝擊矯正為主，也收錄不少**不需要頓力**的方法，推拿師最用得上：\n- **頸椎伸展**：仰臥，兩手托住臉頰，中指推開枕骨下方的軟組織，輕輕反覆牽引；或用毛巾兜住枕骨底部，溫和持續拉 30–60 秒、重複數次再慢慢放下。\n- **枕骨前屈受限**：持續推 30–60 秒，部分手法明寫「不用頓力」。\n- **腰椎深層肌舒緩**：側臥鎖定後維持牽引 30–60 秒，給骨質疏鬆或年長、不能直接衝擊的人（客人覺得喘就放鬆）。\n- **俯臥分推伸展**：兩手掌根放在不同位置（肩與薦椎上緣、薦椎上緣與棘突等）向兩邊推開牽引；墊在腹下的圓墊要軟，硬物會傷肋骨。\n- **兩腕伸展**：仰臥，雙手上舉，左右交替慢慢拉，等背部放鬆再拉到極限。\n- **仰臥毛巾提腰**：毛巾穿過腰下，配合呼吸慢慢上提、放下，反覆數次。\n**怎麼選**：年長、骨鬆、怕痛、禁忌不確定的客人，都先用這些；做完重新量角度或摸排列，再決定要不要進一步處理。\n!! 課堂「創造空間」（k-space、k-3steps）就是這個用意；腰椎滑脫者不適用腰薦按壓法，見「衝突比對」。","tags":["牽引","伸展","骨鬆","非衝擊","參考書"],"muscles":["subocc","erector","multifidus"],"points":[],"regions":["cspine","occ","lspine"],"book":"jizhui"},{"id":"b-jizhui-contra","cat":"安全","src":"參考書《脊椎手療法圖解》p.152–158、180–182、321–322","title":"全身矯正禁忌、注意與次數","body":"附錄與各手法的「注意事項」整理：\n**作者列的矯正禁忌**\n- **骨質疏鬆**：骨頭脆弱，矯正有危險。\n- **僵直性關節病變**：韌帶鈣化失去彈性，強力矯正可能造成斷裂。\n- **血管硬化或動脈痙攣**：容易發生血管意外，少做為妙。\n- **開過刀的骨頭**：結構已改變，容易出錯。\n- **孕婦**：作者認為連輕微的頸部、上胸矯正都不適宜。\n**要特別小心**：高血壓、心臟病、80 歲以上、體質虛弱者。\n**個別手法的注意**：肩關節有障礙者不做站姿胸椎法；客人後仰角度不能太大；腹下墊物要軟；客人覺得喘就先放鬆；棘突壓痛很強時不做某些衝擊法；兒童不用頓力。\n**次數**：做多反而不好。急性初期每週約 3 次，過了急性期改每週 2 次，再降為每週 1 次；慢性每週 1–2 次，隔週一次也有效。\n!! 課堂紅旗（k-redflag）還包含夜間痛、發燒、體重減輕、癌症病史、馬尾症狀、進行性無力，以及抗凝血藥物、皮膚破損（k-caution-points），本書沒有寫，兩份要合併使用。","tags":["禁忌","骨鬆","孕婦","次數","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine","pelvis"],"book":"jizhui"},{"id":"b-jizhui-exercise","cat":"脊椎","src":"參考書《脊椎手療法圖解》p.308–312","title":"臀腰自我運動：急性期也能做的居家練習","body":"第七章是給客人回家做的腰臀運動，先做冷熱交替（熱敷與冷敷交互數回），再依序練習。書中強調：運動中疼痛變劇烈就停止並就醫；動作要慢、循序漸進。依書中順序摘要：\n1. **仰臥屈膝夾臀收腹**：腳跟靠近臀部，收縮下腹與臀部約 8 秒，重複數次（骨盆後傾）。\n2. **仰臥抬直腿**：腿伸直抬高後用雙手扶住，收縮臀腹再放鬆，兩腿各做。\n3. **俯臥抬腿**：膝伸直把小腿抬高，默數後放下。\n4. **俯臥收腰**：讓腰部肌肉收縮，慢數 6 下再放鬆，重複約 6 次。\n5. **仰臥側滑腿**：一腿沿床面往外滑，直到大腿內側有拉緊感，維持後收回。\n6. **橋式**：雙腳踩床，抬起臀部並收腹，依體力做 10–30 次。\n7. **雙膝左右倒**：上身不動，雙膝往一側床面靠，再換另一側，讓腰椎每一節都動到。\n8. **雙膝抱向胸口**：慢慢把兩腳往頭的方向帶，維持約 10 秒，重複 2–3 次。\n**推拿上的用法**：做完放鬆後給客人 2–3 個動作就好；骨盆 A（前傾）的人多做 1、6，腰部卡的人做 7、8。（這段的分類建議為補充，不是書中原文。）","tags":["居家運動","腰臀","急性期","橋式","參考書"],"muscles":["glute_max","rectus_abd","erector","adductors"],"points":[],"regions":["lspine","pelvis","hip"],"book":"jizhui"},{"id":"b-jizhui-caution","cat":"安全","src":"參考書《脊椎手療法圖解》p.35–37、230、244、306、319–321","title":"本書中需要謹慎看待的手法與說法","body":"本書整理了大量整脊經驗，也包含**推拿師不能照做**或**需要保留**的內容。閱讀時請對照：\n- **侵入性處置**：尾骨矯正要戴手套從肛門內推；激痛點處理提到乾針、注射液體（水針）——都屬醫療行為，推拿不做。\n- **疾病療效宣稱**：附錄說矯正可改善或治癒肝硬化（治癒率 85–90%）、帶狀皰疹、白血病、痛風（71–72%），矯正 T10–T12 可止鼻血、經血、吐血。這些沒有可靠證據，對外絕不能這樣宣稱，客人有這些病要就醫。\n- **椎間盤突出**：建議超過 8 個月者長期每週 4–5 次旋轉式矯正，甚至麻醉後再矯正——與課堂「避免強力扭轉、有神經症狀先轉介」相反。\n- **腰椎滑脫**：書中的腰薦按壓法寫明滑脫也適用，最後還加頓力；滑脫屬結構不穩，推拿不在滑脫節段施壓衝擊。\n- **頸椎旋轉衝擊**：依賴「後仰＋旋轉」安全檢查，這種檢查不能排除血管風險。\n- **S4–S5 大小便失控**：被列為神經異常的症狀之一，但這是馬尾紅旗，要立即轉介。\n- **X 光**：作者要求頸椎矯正前一定要有 X 光；推拿師不能開單，遇到需要影像判斷的情況就轉介。\n!! 各項的課堂依據、嚴重度與取捨，見「衝突比對」。","tags":["安全","侵入性","療效宣稱","轉介","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine","sacrum"],"book":"jizhui"},{"id":"b-jizhui-intro","cat":"人物與流派","src":"參考書《脊椎手療法圖解》","title":"參考書：《脊椎手療法圖解》導讀","body":"**苟亞博、黃國松 編著（作者序由黃國松執筆，苟亞博作推薦序）**，人民衛生出版社（北京），2009（第 1 版第 1 次印刷；書名頁全稱《脊椎手療法圖解》，作者序約寫於 2008 年）。\n\n以整脊（chiropractic）觀點，把枕骨、頸椎 C1–C8、胸椎三區、腰椎 L1–L5、薦椎神經與髂骨、尾骨逐節拆開，每節都依「主管、病症、痛徵（局部痛／局部反射痛／皮節反射區）、運動受限、檢查、舒緩區、矯正手法」的固定格式整理，配大量照片示範衝擊（thrust）矯正。核心主張是用「苟氏椎側痛源」在棘突旁找觸痛點來定錯位的那一節，而不是看遠處哪裡痛；附錄有 X 光判讀、禁忌與臨床提示，其中混有不少需要保留的療效宣稱。\n\n### 章節地圖\n- **推薦序、作者序與骨骼神經分布圖**（PDF 第 6–10 頁（無頁碼））：苟亞博推薦、黃國松說明本書整理自國際整脊教材與恩師講解，強調手技要配合解剖、神經學與同理心。\n- **第一章 概論**（p.1–12）：椎體錯位與內臟病變對照表、佛氏皮神經節圖與作者對它的批評、苟氏椎側痛源觸診（八大痛源）、四肢疼痛反射表、站姿與手掌發力區、舒緩部位編號表。\n- **第二章 枕骨**（p.13–32）：枕骨的對稱檢查、枕骨異常的症狀與受限方向、8 種枕骨矯正法，以及「椎體錯位引發病變」的機制圖。\n- **第三章 頸椎**（p.33–112）：頸椎矯正禁忌與四步安全檢查、C1–C8 各節的痛徵／檢查／舒緩區／矯正法、頸椎伸展與毛巾牽引、兄弟椎表。\n- **第四章 胸椎**（p.113–192）：高胸 T1–T4、中胸 T5–T8、低胸 T9–T12 的症狀、轉移痛與多種俯臥、坐姿、站姿、跪姿矯正法；最後是椎體定位標誌。\n- **第五章 腰椎**（p.193–237）：L1–L5 各節的痛徵、肌力與反射檢查、舒緩區、側臥鎖定與俯臥彈壓矯正，以及數種持續牽引、伸展與軟組織舒緩法。\n- **第六章 骶椎與髂骨**（p.238–307）：S1–S5 神經異常、薦椎與髂骨的相關舒緩區、薦椎矯正、24 種髂骨（AS／P／IN／EX 組合）矯正法與經肛門的尾骨矯正。\n- **第七章 臀部運動**（p.308–312）：冷熱交替後做的腰臀自我運動，含急性疼痛期的控制運動。\n- **附錄**（p.313–323）：X 光片判讀要點、65 條臨床提示（禁忌、矯正次數、鎖定、均抗療法、骨盆移位診斷、整脊口訣），其中含多項疾病療效宣稱。\n\n### 本站整理的條目（25 則）\n- 本書架構：每節脊神經的七欄格式（p.1–12、38–39）\n- 苟氏椎側痛源：用八大痛源找患椎（p.5–6、320）\n- 皮節圖：正推成立，倒推不一定（p.4–6）\n- 苟氏四肢疼痛反射表：先摸哪一段（p.7）\n- 受限代號：怎麼決定邊與方向（p.42–47、54–57、62、198）\n- 矯正前的舒緩區：同側、先鬆前面（p.12、15、39、49、61、71、89、99、115–116、136、165、196、203、217、223、245）\n- 頸椎矯正前的禁忌與安全檢查（p.26、30、35–37、40–50、323）\n- C1–C8：局部痛位置與檢查重點（p.38、48、60、70、80、88、98、104）\n- 枕骨的檢查：耳垂、乳突與枕骨下緣（p.14–15、24–31）\n- 胸椎三區：檢查、徵象與先後（p.115、134、152–164、180–182）\n- 胸腰交界：腹側、髂嵴與臀部的轉移痛（p.164–167、195、323）\n- L1–S1：肌力、反射與直腿抬高（p.195、202、208、216、222、240）\n- 椎體定位：轉頭分 C7、T1，不用髂嵴定 L4（p.192）\n- 側臥腰椎：上下鎖定到目標節（p.210、218、224、322）\n- 髂骨 AS、P、IN、EX 與課堂三角度對照（p.258–305）\n- S1–S5 與尾骨：徵象與該轉介的訊號（p.240–244、306）\n- 兄弟椎全表：胸椎也成對（p.112）\n- 矯正順序：骨盆是地基，頸椎收尾（p.115、322–323）\n- 均抗療法：在極限位置做等長對抗（p.320、322）\n- 骨盆移位的外觀線索與長短腳（p.322–323）\n- 錯位如何變成症狀：苟氏病變機制圖（p.32）\n- 不做衝擊的選項：持續牽引與伸展（p.24–27、108–110、210、230–236）\n- 全身矯正禁忌、注意與次數（p.152–158、180–182、321–322）\n- 臀腰自我運動：急性期也能做的居家練習（p.308–312）\n- 本書中需要謹慎看待的手法與說法（p.35–37、230、244、306、319–321）\n\n條目都是用自己的話整理重點並標註頁碼，示意圖為依書中內容重新繪製；細節請對照原書。","tags":["參考書","脊椎手療法圖解"],"book":"jizhui"},{"id":"b-jizhui-compare","cat":"原則","src":"參考書《脊椎手療法圖解》比對","title":"《脊椎手療法圖解》與課程的比對","body":"逐項比對《脊椎手療法圖解》與課堂資料。共 23 項：高 7、中 5、低 11（嚴重度）。\n「衝突」＝說法相反；「程度差異」＝方向相同但做法或強度不同；「用詞不同」＝同一件事不同名稱；「補充」＝課堂沒提到或一致的地方。\n\n### 【高】頸椎旋轉衝擊與「安全檢查」（程度差異）\n!! 本書比課堂多了禁忌清單，這部分值得保留。但後仰旋轉測試對頸動脈剝離、椎基底動脈問題的偵測力很差：通過不代表安全，持續的後仰旋轉本身也可能誘發症狀。頸部高速旋轉扳動有罕見但嚴重的中風風險，推拿師不做；頸部以軟組織放鬆、溫和牽引（本書的毛巾牽引）為限。出現頭暈、視覺異常、說話不清時停止並轉介。\n- **課堂：**「頸椎：椎動脈、交感神經與脊髓」：頸部不重壓前側，扳動前先放鬆周圍肌肉；「需要先轉介的警訊」：突發劇烈頭痛、口齒不清、單側無力先就醫。課堂未教頸部篩檢流程。\n- **本書：**頸椎矯正以頭轉到極限（常為 90°）、再超過 2–5° 的快速旋轉發力為主；用「懸頭後仰＋旋轉」的四步測試，沒有頭暈、想吐、眼球震顫、說話不清就算通過；另列八條禁忌（沒照 X 光、血栓、血管硬化、痙攣、長者頭暈或偏頭痛等）。（p.35–37、40–47、323）\n\n### 【高】S4–S5：大小便失控、肛門麻木（衝突）\n!! 這組症狀是脊椎急症的典型表現，延誤可能造成永久的大小便與性功能障礙，必須當天轉介急診。不能當成矯正的適應症。課堂的處理方式正確。\n- **課堂：**「需要先轉介的警訊」：大小便失禁或解不出來、會陰（鞍區）麻木＝馬尾症候群，先請客人就醫；「腰、薦、尾神經分布」 也提醒有大小便異常、會陰麻木時先轉介。\n- **本書：**把排便失控、小便失禁、肛門附近麻木列為 S4、S5 神經異常的病症與痛徵，放在薦椎與髂骨調整手法的章節中，沒有標示要轉介。（p.244）\n\n### 【高】經肛門的尾骨矯正（衝突）\n!! 屬侵入性處置，有感染、黏膜受傷與法律責任問題，在台灣不屬於推拿或民俗調理的範圍。同一頁作者也說：不是近期撞擊造成的尾骨痛，放鬆內外側軟組織就能改善。推拿只做臀部與薦尾韌帶的體外放鬆；近期撞傷或疑骨折要轉介。\n- **課堂：**「操作禁忌與注意穴位」、「需要先轉介的警訊」：推拿以體表手法為主；課堂說尾骨（Co）出問題時摸到都痛，未教任何體內操作。\n- **本書：**尾骨向前移位時，術者戴手套、塗凡士林，中指從肛門伸入，先放鬆肛門內兩側肌肉，再由內往外推頂尾骨，另一手拇指在外固定薦尾關節。（p.306）\n\n### 【高】乾針、水針處理激痛點（衝突）\n!! 針刺與注射屬醫療行為，推拿師不做。書中可直接採用的是拇指按壓 5 秒、冰塊橫推不超過 3 分鐘這類非侵入方法。\n- **課堂：**「阿是穴」、「順纖維＝放鬆；橫向撥＝破壞」：痛點以手法按壓、撥開後順理；課堂未教任何穿刺處置。\n- **本書：**處理反射痛點的方法除了拇指按壓（約 5–7 磅、5 秒）、冷噴霧、冰塊推壓外，還列出像針灸一樣刺入的乾針，以及注入少量營養液的水針。（p.321）\n\n### 【高】矯正可治癒內科疾病的宣稱（衝突）\n!! 這些說法沒有可靠的研究支持，照著說可能延誤客人就醫，也可能觸犯醫療廣告相關法規。網站與對客人說明時只能用課堂的口徑：「可能有關、當作找問題的線索」，並建議就醫。\n- **課堂：**「內臟與胸椎：神經走短線、力學走長線」：胸椎與臟腑的對應是老師的臨床觀點，用來提醒往哪裡找，不是醫學診斷，相關疾病仍應就醫。\n- **本書：**附錄臨床提示說：肝功能障礙、肝硬化大多因脊椎錯位引起，治癒率可達 85–90%；矯正帶狀皰疹上方 3–5 cm 的錯位椎體即可治癒；白血病矯正 T10–T12 有顯著療效；矯正 T10–T12 可止鼻血、經血、吐血；痛風主要誘因是薦椎右傾，治癒率約 71–72%。（p.319–321）\n\n### 【高】椎間盤突出：長期旋轉矯正與麻醉下矯正（衝突）\n!! 反覆高頻率的旋轉衝擊可能加重突出或神經根壓迫；麻醉下矯正失去病人的保護反應，是醫院內的醫療處置。推拿依課堂原則：有神經症狀先轉介，只做周邊放鬆與溫和牽引。\n- **課堂：**評估模式 「椎間盤型下背痛（慢性，痛側在上）」、「疑似神經根壓迫」：以周邊肌肉放鬆為主，避免強力扭轉與重壓腰椎；直腿抬高很低就放射、麻木或無力時先轉介。「椎間盤（慢性）與急性腰閃傷：痛側在上還是在下」 同。\n- **本書：**突出 8 個月以內用牽引與矯正；超過 8 個月建議長期每週 4–5 次旋轉式矯正；病人痛到無法矯正時可先麻醉再矯正（作者也提到有些書反對）。另說牽引對急性突出無效。（p.321–322）\n\n### 【高】腰椎滑脫的腰薦按壓法（衝突）\n!! 滑脫是峽部斷裂或退化造成的不穩定，從後往前壓會增加往前滑的力，再加頓力風險更高。與《經筋手療法圖解》的滑脫頓壓法同屬高風險，推拿師不在滑脫節段施壓；先轉介影像確認，只做周邊肌肉放鬆與核心訓練建議。\n- **課堂：**「需要先轉介的警訊」、評估模式 「椎間盤型下背痛（慢性，痛側在上）」：結構性問題避免重壓腰椎、有疑慮先轉介；「各段脊椎的活動方向（小面關節）」：L4–L5 活動大、易出問題。\n- **本書：**「腰椎與骶椎的關節活動」法寫明腰椎前凸過大與腰椎滑脫都適用：俯臥、腹下墊軟枕（滑脫者墊在滑脫節段前方），掌根在腰薦交界持續下壓並向尾側牽引 40–60 秒，最後再加一下輕的頓力。（p.230）\n\n### 【中】皮節能不能用來決定矯正節段（程度差異）\n- **課堂：**「頸椎 8 對神經與症狀位置」、「腰、薦、尾神經分布」：神經分布表用來推估要往哪一節找，不是醫學診斷；手麻還要先分辨斜角肌、胸小肌壓迫，三分法先判斷是不是神經。\n- **本書：**作者說皮節「正推成立、倒推不成立」：某節錯位一定痛在它的皮節，但皮節區痛不一定是那節錯位；只憑皮節決定矯正節段是不合邏輯的傳統做法，要改用椎旁痛源觸診（八大痛源、觸痛點）確認患椎。（p.4–6）\n- **怎麼看：**兩者方向一致，本書把邏輯講得更清楚，可以補進課堂：皮節縮小範圍 → 椎旁觸診確認 → 三分法排除周邊卡壓，三者都指向同一節才處理。與《四肢手療法》「局部做完再往脊椎找神經源」也一致。\n\n### 【中】L4、L5、S1 的皮節走向（衝突）\n- **課堂：**「腰、薦、尾神經分布」：L4 大腿內側 → 小腿內側 → 前 2 隻半腳趾；L5 大腿後側 → 小腿後側 → 中間 3 趾；S1 大腿外側 → 小腿外側 → 後 2 隻半腳趾。「神經節段快速檢查（C／T／L／S）」：L5 外展、S1 踮腳。\n- **本書：**L4 坐骨神經痛從大腿外側經踝上端到大腳趾，腳背屈無力；L5 從大腿外側到踝、經腳背到內側大腳趾，腳內側三趾麻，腓骨肌、臀中肌、伸大腳趾肌無力；S1 從大腿後上端經膝、踝到腳跟，再沿足底到小趾，膕繩肌、腓腸肌（不能踮腳）、腓骨肌無力。（p.216、222、240）\n- **怎麼看：**本書的 L5（小腿外側、腳背、大腳趾）與 S1（後側、腳跟、足底、小趾）較接近現代皮節圖；課堂筆記的 L5「後側」與 S1「外側」可能前後對調了，建議回頭與老師確認。L4 則是課堂的「內側」較接近現代皮節，本書寫外側。肌力檢查兩者一致（L5 外展、S1 踮腳）。另外本書把敲跟腱的反射也用在 L5，一般神經學歸 S1。\n\n### 【中】矯正前的 X 光（補充）\n- **課堂：**課堂未提影像；「三分法：肌肉、骨頭、還是神經？」 說外傷要先排除骨折；「需要先轉介的警訊」 列轉介條件。\n- **本書：**頸椎矯正禁忌第一條就是「沒照 X 光不矯正」；附錄用多張 X 光說明如何看椎間隙、滑脫、骨刺、旋轉、骨盆與大轉子高低，也附乳癌、攝護腺癌骨轉移的片子作為不能矯正的例子。（p.35、313–319）\n- **怎麼看：**推拿師不能開立或判讀影像，但這提醒了一件事：衝擊矯正前要先排除骨折、腫瘤、滑脫、骨鬆。對推拿而言的實際做法是：有外傷、癌症病史、夜間痛、年長骨鬆疑慮時，請客人先就醫，帶著醫師的評估再來。\n\n### 【中】孕婦能不能做脊椎調整（程度差異）\n- **課堂：**「懷孕、產後與骨盆」、「操作禁忌與注意穴位」：孕期避免重按 LI4、SP6、GB21、BL60、BL67 與腹部、腰薦部；課堂未說全面禁止脊椎調整。\n- **本書：**作者認為孕婦不宜做矯正；雖然有些書說可以做頸部或上胸部的輕微矯正，但依他的經驗並不適宜。（p.321）\n- **怎麼看：**本書比課堂保守。孕期韌帶受鬆弛素影響，衝擊手法風險較高，建議採本書的保守立場：孕婦只做溫和的軟組織放鬆、避開禁忌穴與腹部，不做任何衝擊矯正。與《經筋手療法圖解》對骨盆腔深壓的提醒一致。\n\n### 【中】評估與處理的順序（程度差異）\n- **課堂：**「評估流程：正面 → 臥姿，腳 → 骨盆 → 薦椎」：腳 → 骨盆 → 薦椎；「有效矯正：先把地基擺正」：先把腳、踝、膝、骨盆擺正再矯正頸椎；「處理順序：差最多的先做、最緊的先做」：先處理差最多的角度、最緊的肌肉；「坐→臥看肩胛：問題在肩還是在骨盆？」：坐臥看肩胛，再由足往上查。\n- **本書：**從骨盆、薦髂開始：側彎合併薦椎移位先矯正薦椎；先矯正骨盆功能失調再做腰椎；脊椎做完再回頭矯正當地基的骨盆；胸椎各區先做薦髂 → 患處 → C1、C2。另說由上往下做是為循環與神經，由下往上做是為結構；新舊病同時發作先處理舊病。（p.115、322–323）\n- **怎麼看：**兩者都把骨盆當地基；差別在課堂把足踝也算進地基、並以「差最多」決定先後，本書不談足踝，且固定以 C1、C2 收尾。實務上可用課堂流程，再加上本書「最後回頭確認骨盆」這一步。\n\n### 【低】背部骨性標誌與 L4 定位（衝突）\n- **課堂：**「背部定位的骨性標誌」：低頭最突出的棘突＝C7；兩側肩胛岡內端連線約平 T3；兩側肩胛下角約平 T7；第 12 肋下緣約平 L2；兩側髂嵴最高點連線約平 L4。「移行椎：腰椎薦椎化、薦椎腰椎化」 也以髂嵴連線約平 L4 作參考。\n- **本書：**C7 與 T1 用轉頭分辨（跟著轉的是 C7）；肩胛骨內緣最突點連線＝T4；肩胛下角＝T7；第 12 肋起點＝T12、尾端連線＝L2 椎間盤；L3 在腰椎中段、L5 在薦椎上方最好找。作者明確反對用髂嵴連線定 L4，因為骨盆會上下移位。（p.192）\n- **怎麼看：**T3、T4 的差異是因為參考點不同（課堂用肩胛岡內端，本書用內緣最突點），不算矛盾。髂嵴法在骨盆歪斜時確實可能差一節，與《經穴大全》的 WHO 標誌也只是近似值。建議：骨盆不對稱時，從 L5 往上、從 T12 往下雙向數節，並用本書的轉頭法確認 C7。\n\n### 【低】髂骨 IN／EX 的命名與三個角度（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」：A 時髂後上棘較 S2 高，P 時較低；「骨盆第二角度：EX（外轉）與 IN（內轉）」：EX 時髂後上棘遠離 S2、IN 時靠近；「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：③EX＝A＋EX（又高又遠），③IN＝P＋IN（又低又近）。\n- **本書：**髂骨以 AS、P（PI）、IN、EX 及其組合（ASIN、ASEX、PIN 等）標記移位；AS 接觸坐骨結節由後往前壓，P 接觸髂後上棘由後往前，IN 由內向外推，EX 由外向內推；ASEX 接觸坐骨結節外側，PIN 接觸髂後上棘內側。（p.258–278）\n- **怎麼看：**從施力方向推回去，本書的 AS、P 與課堂 A、P 一致，IN、EX 也與課堂「髂後上棘近／遠」一致，ASEX、PIN 恰好對到 ③EX、③IN，可互相印證。提醒：外文整脊文獻有時以髂骨前緣（ASIS）或 X 光上髂翼寬窄來命名 IN／EX，方向可能相反，查外文資料時先確認定義。本書處理用衝擊推骨頭，課堂用肌肉，屬做法不同，不算衝突。\n\n### 【低】長短腳的判讀（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」：A 側為長腳、P 側為短腿；「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：③EX 也會短腿，要先知道為什麼短再處理，不要直接拉腿；「俯臥屈膝 90°：足跟方向」、「薦椎檢查三步驟」：俯臥看足跟。\n- **本書：**俯臥時骨盆移位側臀部較隆起、腿較短；仰臥時兩腳交疊會自然把對側腿放上來；長短腳者右腿短約是左腿短的 2 倍；骨盆扭轉造成長短腳，矯正薦髂關節就能等長；長短腳者頸椎多半僵硬；治腰痛前先量腿長。（p.322–323）\n- **怎麼看：**本書沒有區分是哪一個角度造成短腳，課堂的分法較細，可以補本書的不足；「右短較多」「頸椎僵硬」可當觀察重點。與《四肢手療法》《經筋手療法圖解》都把長短腳歸到骨盆一致。\n\n### 【低】兄弟椎（補充）\n- **課堂：**「父母椎、兄弟椎與全家福力學」：兄弟椎 C1↔L5、C2↔L4、C3↔L3、C4↔L2、C5↔L1，頸部問題可往下找它的兄弟。\n- **本書：**全表把整條脊柱對折：除了頸、腰五對與課堂相同，還有 C6↔T12、C7↔T11、T1↔T10、T2↔T9、T3↔T8、T4↔T7、T5↔T6，以及枕骨↔薦椎、蝶骨↔尾椎；稱為 Lovett 兄弟系統，處理一端時連另一端一起做效果更好，多用於內科問題。（p.112）\n- **怎麼看：**與課堂一致，本書多了胸椎與頭骨—薦尾的配對（課堂頭骨網狀力學 「頭骨網狀力學：顱縫與身體的對應」、枕骨—薦椎 「髂腰橫韌帶與薦椎內壓：處理順序」 也有類似觀念）。「用於內科病變」屬經驗說法，不對客人宣稱療效。\n\n### 【低】胸椎節段與內臟的對應（補充）\n- **課堂：**「內臟與胸椎：神經走短線、力學走長線」：T1 血壓、T2–T3 肺、T4 膽、T5 肝、T6 胃、T7 胰與十二指腸、T8 皮膚抗體、T9 腎與副腎、T10–T12 造血；並註明不同頁筆記不一致，屬老師經驗。\n- **本書：**苟氏表：T1–T3 支氣管、肺、心；T4 黃疸、膽囊炎；T5 肝炎、易倦；T6 胃病；T7 胃潰瘍、肝膽胰；T8 肝病、糖尿病、抵抗力；T9 過敏、腎上腺；T10 腎；T11 皮膚病；T12 風濕、小腸。附錄另說右側骨盆移位偏副交感型（胃腸、婦科），左側偏交感型（肺、心、便秘）。（p.2–3、323）\n- **怎麼看：**T2–T3 肺、T4 膽、T5 肝、T6 胃、T7 胰的對應與課堂大致相同，顯示課堂資料與這個系統同源；T8–T12 有出入（例如課堂 T10–T12 造血、本書附錄則說矯正 T10–T12 對白血病有效）。兩者都只是「往哪裡找」的線索，任何臟腑症狀都請客人就醫。\n\n### 【低】頸神經 C1–C8 的分布（補充）\n- **課堂：**「頸椎 8 對神經與症狀位置」：C1 頭頂、高血壓、睡眠；C2 顏面；C3 喉嚨；C4 肩膀；C5 手臂陰面到掌心；C6 第 1、2 指與半個第 3 指；C7 第 2、3、4 指；C8 第 4、5 指與半個第 3 指。「神經節段快速檢查（C／T／L／S）」：C1、C2 點頭，C3 側彎，C4 聳肩，C5 肩外展。\n- **本書：**C1 皮節在頭頂，症狀含高血壓、失眠；C2 在臉中部（額、眼、鼻、口），左右旋轉受限；C3 牙、顎；C4 咳嗽、聲音沙啞，向右側彎受限，往下反射到 T5–T6；C5 從肩頂沿橈側到腕，舉臂困難；C7 上臂後側到中指；C8 前臂內側到無名指、小指。（p.38、48、60、70、80、98、104）\n- **怎麼看：**大致一致（C1 頭頂、C2 臉、C8 尺側），可互補：本書多了每節的受限動作與局部壓痛位置。C5 課堂寫「陰面」，本書與現代皮節都偏上臂外側（橈側），建議以橈側為準；C4 課堂寫肩膀、本書偏喉頸，兩者都屬經驗對應。\n\n### 【低】胸椎神經與手臂痛（用詞不同）\n- **課堂：**「胸椎神經與手臂：T1、T2、T3、T5」：T1 肩峰 → 肘內側 → 腕內側；T2 五指同時麻；T3 腋下 → 肘窩（網球肘）；T5 半身痠麻、遊走性痠痛；會影響手的有 C5–C8、T1、T2、T3、T5。\n- **本書：**T1 異常時手指張不開，局部反射痛為手無力、肩痛、手臂內側痠；T2 手麻、肩僵、心胸痛，T2 錯位會像落枕；T3 手軟無力、脖子痛；四肢疼痛反射表說手臂痛來自 T4、T5，肩痛來自 C5–T3。（p.7、115）\n- **怎麼看：**兩者都認為上胸椎會影響手，T1 手臂內側一致；本書多了「T2 像落枕」「T1–T4 後旋使同側肩上升」等線索。課堂的 T3 網球肘與本書 T3 脖子痛不同，屬流派經驗差異，臨床上手肘外側痛仍先查前臂伸肌。\n\n### 【低】胸腰交界的轉移痛（補充）\n- **課堂：**「腰、薦、尾神經分布」：L1 大腿上面一段；「脊椎旋轉的轉折點」：轉折點常在 T12–L1；評估模式 「腰方肌型下背痛」：腰側深層痛常與腰方肌有關。\n- **本書：**T9–T12 引起側腹、下腹痛；T12–L1 引起髂嵴上緣與臀上方痛；附錄說臀部與大腿後側痛是 T11、T12 錯位引起；L1 神經根很少真正受壓，但反射痛明顯。（p.164–167、195、323）\n- **怎麼看：**課堂沒有寫胸腰交界的轉移痛位置，可以補進：髂嵴、臀上方痛但腰薦摸不出問題時，往上摸 T11–L1。與《四肢手療法》以節段找神經源的方法一致。\n\n### 【低】肌肉在痛裡的角色與按摩方向（程度差異）\n- **課堂：**「九成的痠痛是「被拉長的痛」」：九成痠痛是被拉長的痛，一緊一鬆才會痛；「順纖維＝放鬆；橫向撥＝破壞」：順纖維推拉是放鬆，橫向撥是破壞，撥完一定要順回。\n- **本書：**附錄說痛是因為肌肉不能恢復原來的長度；按摩由輕到重、由淺到深，拇指要**橫向**推過肌束，慢、柔、深是要訣；觸摸緊張肌肉時橫推會有像跨過一束線的波狀感；口訣「整骨不整肌，根本不懂醫；整肌不整椎，病痛一大堆」。（p.321–323）\n- **怎麼看：**「肌肉長度改變才痛」與課堂一致，只是本書沒有分縮短側與拉長側。本書把橫推當主要按摩方式，課堂則強調橫撥後要順纖維理回，可把課堂的「撥完要理順」補上。口訣與課堂整合骨、肌、經筋的路線一致（「台灣整脊與推拿的幾條脈絡（老師分享）」、「神經、肌肉、骨頭互為因果」）。\n\n### 【低】鎖定與吐氣時發力（補充）\n- **課堂：**「脊椎旋轉的轉折點」：固定下面一節、轉上面一節；「各段脊椎的活動方向（小面關節）」：Fryette 規則（側彎與旋轉的耦合）；「配合呼吸做整復」：吸氣準備、吐氣施力。\n- **本書：**先側彎再旋轉到極限會產生鎖定；頸部多由上往下鎖、腰部多由下往上鎖；側臥腰椎用腿從下鎖、用手臂從上鎖，手指感覺到目標節開始動就停；幾乎所有矯正法都在「吐氣將盡」時發力。（p.218、322）\n- **怎麼看：**與課堂一致，本書把鎖定變成可以觸摸確認的步驟，值得補進手法篇。推拿師可以只做到鎖定後的持續牽引（本書 L3 深層肌舒緩法），不做最後的衝擊。\n\n### 【低】薦椎的移位命名（用詞不同）\n- **課堂：**「薦椎扭轉：Right on Right 的命名與自然擺動」、「非自然扭轉、單邊扭轉與薦椎的 10 種卡法」：薦椎扭轉分自然（Right on Right、Left on Left）與非自然（Left on Right、Right on Left），加上單邊點頭、反點頭共 10 種。\n- **本書：**薦椎用「向上向後移位」「向前向上移位」等位移描述配合側臥、俯臥、仰臥的矯正法；附錄提到薦椎以左側向前扭轉較多。（p.246–257、322）\n- **怎麼看：**本書沒有斜軸扭轉的分類，描述較粗；課堂的 10 種分類較細，可以把本書的「向後上」大致對應到單邊反點頭、「向前上」對應到單邊點頭，但不確定時以課堂的三步驟檢查為準。\n","tags":["參考書","衝突","比對"],"book":"jizhui"},{"id":"b-zhengji-author","cat":"人物與流派","src":"參考書《整脊醫學》PDF 第 2–16 頁、p.17、p.19–22、p.191、p.374–380","title":"苟亞博與《整脊醫學》：這本書從哪來","body":"苟亞博（英文名 Nai-Yen Kou）是課堂提到的台灣整脊源頭（k-lineage）。依自序，本書是從各國整脊學校使用的上百本參考書摘錄重點，加上他約十年的授課講義編成。\n- **版本**：自序寫於 1992 年底，1994 年增訂、2001 年再版。學生徐沐鑑的跋提到，老師把《整脊醫學》《整復醫學》兩本書的出版權交給他。\n- **系統來源**：英文代號明白寫出來自美國國立整脊學院（NCC）與 Palmer–Gonstead（P-G）兩派；薦椎、髂骨的 X 光判讀圖註明採自 Gonstead 的著作；也引用 Bourdillon 的《Spinal Manipulation》，參考書目列有 Fryette。\n- **作者自創**：苟氏椎側痛源觸診與四肢疼痛反射表，已在《脊椎手療法圖解》的條目整理，這裡不重複。\n- **背景**：前頁大量篇幅是國際替代醫學會議與學位、爵位證書；學位多由替代醫學體系的機構頒發，不等於正規醫學院學歷，網站引用時稱「整脊師」較恰當。\n- **與黃國松的關係**：《脊椎手療法圖解》由兩人合編，其中禁忌、臨床提示、骨盆移位徵象等附錄，與本書第十四章幾乎一樣，可以看成同一個來源。\n!! 課堂把《經穴大全》寫在苟亞博的著作附近；手邊的《經穴大全》作者是坂元大海等人，見「衝突比對」。","tags":["苟亞博","整脊","Gonstead","流派","參考書"],"muscles":[],"points":[],"regions":[],"book":"zhengji"},{"id":"b-zhengji-codes","cat":"脊椎","src":"參考書《整脊醫學》p.35–37","title":"兩套英文代號：NCC 與 Gonstead","body":"第三章先說明整脊書上的英文代號分兩派，讀其他整脊書前要先分清楚：\n|系統|多用在|寫法|例子|\n|---|---|---|---|\n|NCC（國立整脊學院派）|頸、胸、腰椎|第 1 個字母＝哪一側錯位（R、L）；後面的字母＝往哪裡錯位：S 上、I 下、A 前、P 後|RP＝右側往後；LPS＝左側往後上；LPI＝左側往後下|\n|P-G（Palmer–Gonstead 派）|全身，尤其骨盆|部位碼＋方向碼|部位：O 枕骨、C/T/L/S、P 骨盆、PSIS、ASIS、SIJ、LSJ；方向：AS 前上、PI 後下、IN 向內、EX 向外、L 外側、M 中間|\n- 施力方向也有寫法：P→A（由後往前）、L→M（由外往內）、S→I（由上往下）等。\n- 椎體部位代號：AP 關節突、TP 橫突、MP 乳突、SP 棘突。\n- **先問：代號記的是「錯位方向」還是「受限方向」？**本書的 NCC 代號記錯位方向；《脊椎手療法圖解》的 RPC1 之類記的是受限方向，兩者剛好相反，抄筆記時不要混用。\n- 骨盆的 AS、PI、IN、EX 怎麼對到課堂的三個角度，見「對照表：課堂三角度 ↔ 本書代號」。","tags":["代號","listing","NCC","Gonstead","參考書"],"muscles":[],"points":[],"regions":["cspine","tspine","lspine","pelvis"],"book":"zhengji"},{"id":"b-zhengji-ilium-xray","cat":"骨盆","src":"參考書《整脊醫學》p.180、186–191","title":"髂骨四型的 X 光線索：寬窄、薦尾與閉孔","body":"本書把髂骨錯位分成四個方向，兩兩可以組合（ASEX、ASIN、PIEX、PIIN）。判讀用骨盆正面 X 光，圖採自 Gonstead 的著作：\n|代號|作者的譯名|X 光上的線索|\n|---|---|---|\n|AS|前升（往前轉、往上移）|同側坐骨位置較高|\n|PI|後降（往後轉、往下移）|同側坐骨較低|\n|IN|向內|同側髂翼在片子上**較寬**；薦椎下端偏離 IN 側|\n|EX|向外|同側髂翼**較窄**；薦椎下端偏向 EX 側|\n- **閉孔形狀**（書中稱坐骨孔）：AS 上下變短、PI 上下拉長、IN 左右變窄、EX 左右變寬；所以 ASEX 最扁、ASIN 最小、PIEX 最大、PIIN 最長。\n- **薦椎還是髂骨的問題？**薦椎本身錯位時，下端會「彎」向錯位的一側；只有髂骨錯位時，薦椎下端只是歪，本身仍是直的。\n- 作者要求把兩側髂骨看成一體：一側往內、另一側就相對往外，兩髂骨之間的距離不變；圖上用薦椎中線到兩側的距離 a、b 表示。\n[[fig:b-zhengji-fig-ilium4]]\n推拿師看不到 X 光，可以借用的是「兩側坐骨高低」「薦椎下端偏向哪邊」這兩條摸得到的線索。\n!! 課堂用俯臥時髂後上棘離 S2 的遠近判斷 EX／IN，本書用 X 光的髂翼寬窄；兩種定義不一定指向同一側，見「衝突比對」。","tags":["髂骨","AS","PI","IN／EX","X光","參考書"],"muscles":[],"points":[],"regions":["pelvis","sacrum","hip"],"book":"zhengji"},{"id":"b-zhengji-map","cat":"骨盆","src":"參考書《整脊醫學》p.35–37、186–196","title":"對照表：課堂三角度 ↔ 本書代號","body":"本書沒有「三個角度」的說法，但代號可以這樣對到課堂（依書中定義與手法方向整理，部分是推論）：\n|課堂|髂後上棘（相對 S2）|本書|書中矯正方向（摘要）|課堂處理的肌肉|\n|---|---|---|---|---|\n|① A|較高|AS|仰臥把 ASIS 往床面推；或側臥把坐骨往前拉、ASIS 往後推|[[m:rectus_fem]]、[[m:iliopsoas]]|\n|① P|較低|PI|側臥固定或頂住髂骨後緣，往前、往頭側推|[[m:hamstrings]]、[[m:glute_max]]|\n|② EX／IN|同高，遠／近|EX／IN|沒有單獨的 IN、EX 矯正法|[[m:glute_med]]／[[m:deep_rot]]|\n|③ EX|又高又遠|ASEX|—|同 ② EX|\n|③ IN|又低又近|PIIN|—|[[m:adductors]]|\n|（急性腰閃 A＋IN）|—|ASIN|—|—|\n|（P＋EX 拉長髂腰韌帶）|—|PIEX|—|—|\n[[fig:b-zhengji-fig-map]]\n- 本書四種組合都有；課堂第三角度只取其中兩種，另兩種散在 p_acute 與 k-iliolumbar。\n- **課堂的 S2 參考點、三條橫軸、耳狀面斜軸，本書都沒有寫**；本書的參考是 X 光與 ASIS、PSIS、坐骨。這部分較可能來自老師、師叔或整骨學派的整合，不宜寫成苟亞博的原說法。\n!! IN／EX 的定義方向與長短腳的判讀，本書與課堂有出入，見「衝突比對」。","tags":["骨盆三角度","AS","PI","IN／EX","對照","參考書"],"muscles":["rectus_fem","iliopsoas","hamstrings","glute_max","glute_med","deep_rot","adductors"],"points":[],"regions":["pelvis","sacrum"],"book":"zhengji"},{"id":"b-zhengji-leg","cat":"評估","src":"參考書《整脊醫學》p.141、179、197–198、231、236","title":"長短腿：先看腳尖，再看髂骨 AS／PI","body":"本書列出長短腿的四種原因：大轉子（股骨）往內收或往外張的移位、患側髂骨錯位、患側頸椎錯位、先天。先天的不處理，只在短腳的鞋底加墊。\n|書中判讀|仰臥外觀|書中歸因|書中的處理順序|\n|---|---|---|---|\n|短腿|患側**腳尖向內**倒|大轉子「內收」；同側髂骨 **AS**|先以股骨當槓桿把髖往外轉，再矯正 AS，最後看頸椎|\n|長腿|患側**腳尖向外**倒|大轉子「外張」；同側髂骨 **PI**|先把髖往內轉並拉直，再矯正 PI，最後看頸椎|\n- 觸診圖也寫：髂骨上移時，同側大轉子、坐骨一起上移，L5 被肌肉拉歪；處理完髂骨要接著處理 L5。\n- 書中各處份量不一：一處說約 7% 的人兩腿差 1.2 公分，不一定是病源；另一處又說長短腿不處理，腰痛就好不了，右腿短的人約是左腿短的兩倍。\n- **推拿上的用法**：仰臥看腳尖、俯臥看足跟，再摸髂後上棘與坐骨的高低；把「哪邊短」和「為什麼短」分開記錄，不要直接拉腿（k-angle3）。\n[[fig:b-zhengji-fig-legs]]\n!! 課堂筆記記「A 側為長腳、P 側為短腿」，本書寫 AS 側短、PI 側長，方向相反，見「衝突比對」。","tags":["長短腿","大轉子","AS","PI","腳尖方向","參考書"],"muscles":["glute_med","deep_rot","adductors"],"points":[],"regions":["pelvis","hip","lspine"],"book":"zhengji"},{"id":"b-zhengji-which-first","cat":"薦椎","src":"參考書《整脊醫學》p.189、235","title":"薦椎、髂骨都歪時，以誰為基準","body":"作者說整脊師要有共識：薦椎和髂骨同時錯位時，看髂骨的型態決定「固定誰、先矯正誰」：\n|髂骨的型態|做法|\n|---|---|\n|AS、IN、ASIN；ASEX 而 AS 成分較大；PIIN 而 IN 成分較大|以**髂骨**為基準，先矯正**薦椎**|\n|PI、EX、PIEX；PIIN 而 PI 成分較大；ASEX 而 EX 成分較大|以**薦椎**為基準，先矯正**髂骨**|\n書中其他和順序有關的提示：\n- 脊椎側彎合併薦椎錯位：先矯正薦椎，再處理側彎。\n- 先處理骨盆功能失調，再處理腰椎；脊椎都做完，要回頭把骨盆擺正。\n- 新舊問題同時存在：先處理舊的關節。\n**和課堂的整合**：課堂是「先看薦椎有沒有歪；沒歪看 S2 對髂後上棘；有歪先看轉子對髂骨」（k-eval-order），角度則「差最多的先做，做完重量」（k-order）。本書的表可以當成「兩邊都有問題時」的補充：往前上、往內的型多半先從薦椎下手；往後下、往外的型先從髂骨下手。\n!! 這張表用的是 X 光代號，課堂的 IN／EX 定義可能和書不同，套用前先確認方向（見「衝突比對」）。","tags":["薦椎","髂骨","處理順序","Gonstead","參考書"],"muscles":[],"points":[],"regions":["sacrum","pelvis"],"book":"zhengji"},{"id":"b-zhengji-sacrum","cat":"薦椎","src":"參考書《整脊醫學》p.186、191、199–203、235","title":"本書的薦椎只有兩型：單側後旋與基底後移","body":"本書依 Gonstead 系統，把薦椎錯位分成兩大類：\n1. **單側往後旋（P-L、P-R）**；往後又帶往下的寫成 PI-L、PI-R。\n2. **薦椎基底往後（P）**：等於腰薦關節移位，是純粹往後，不分患側健側，要把整個骨盆當一個單位往前推。\n- 作者強調兩類的症狀一樣（同一個關節、同一組神經），**不能用症狀判斷是哪一類**，要看 X 光：薦椎本身錯位時下端會彎。\n- **不需頓力的腰薦伸展**（推拿師可以借用）：客人俯臥，術者一手掌根放在薦椎上端，另一手的肘疊上去，用上身體重往下壓，再往尾端推，兩個方向合起來把腰薦關節拉開。\n- 單側後旋的矯正接觸點在薦椎上、緊靠髂骨但不壓到髂骨，往前、往外推；帶「往下」的再加扭轉。基底後移沿 L5 椎間盤的平面往前推。\n- 書中另說：薦椎以左側往前扭轉較多。\n這兩型可以粗略對到課堂的「單邊反點頭」與「向後反點頭」。\n!! 課堂把薦椎卡法分成 10 種，並有 S1、S2、S3 三條軸（k-sac-10、k-sac-axes），本書都沒有，見「衝突比對」。","tags":["薦椎","腰薦關節","反點頭","Gonstead","參考書"],"muscles":["multifidus","erector"],"points":[],"regions":["sacrum","lspine"],"book":"zhengji"},{"id":"b-zhengji-sij-tests","cat":"評估","src":"參考書《整脊醫學》p.179–185","title":"薦髂關節的四個檢查","body":"作者認為薦髂關節的活動量極小，但一卡住就會影響骨盆功能，引起臀痛、腰痛，甚至影響整條脊椎。檢查方法：\n1. **站姿前彎**：客人站直、膝伸直、兩腳分開約 15 公分。術者坐在後面，兩拇指放在兩側髂骨內上緣（薦髂關節上端），食指放在髂骨外上緣。請客人慢慢彎腰：兩拇指移動不對稱時，**移動較多的那一側是患側**，也是要先處理的一側。\n2. **仰臥壓骨盆**：術者雙臂垂直，往下壓兩側髂骨的前外側；或雙手交叉壓兩側，用體重慢慢加。薦髂關節處出現痠痛，表示有問題。\n3. **仰臥屈髖晃動**：受檢側屈髖屈膝，術者用腋下壓住膝，往內、往外壓動；另一手的食指、中指放在薦髂關節上感覺。活動受阻時客人會不舒服。\n4. **觸診**：在薦髂關節上找硬塊與觸痛。\n[[fig:b-zhengji-fig-flexion]]\n**和課堂的搭配**：課堂的三步驟（俯臥托腿、看跟骨、抬小腿內外旋，k-sacrum-check）偏向找「薦椎往哪裡歪」；本書的檢查偏向找「哪一側的關節卡住」。可以先找卡住的一側，再量角度。\n- 壓骨盆用體重慢慢加；孕婦、骨質疏鬆者不做重壓。","tags":["薦髂關節","站姿前彎","檢查","觸診","參考書"],"muscles":["piriformis","multifidus"],"points":[],"regions":["sacrum","pelvis"],"book":"zhengji"},{"id":"b-zhengji-sij-relief","cat":"手法","src":"參考書《整脊醫學》p.153、157、181–183","title":"薦髂關節的舒緩：體重下壓與抱膝畫圈","body":"本書在矯正前一定先做薦髂關節的舒緩，每種做 5–6 次：\n- **雙手垂直下壓**：客人俯臥，骨盆墊在有彈性的墊子上。術者一手放在薦椎上，另一手的豆狀骨放在患側髂骨後上緣，用身體往下沉的重量壓，不是用手腕的力。\n- **單抱膝壓轉**：客人仰臥，患側屈髖屈膝。術者站在患側，抱住膝，前臂以約 45° 往下壓，同時帶髖做外展、內收；另一手放在患側髂骨下面摸痛點。\n- **腰部舒緩中的兩招**：仰臥雙手抱膝、術者前後搖；伏臥小腿稍抬、術者握雙踝左右轉到極限。作者標明用在腰薦、薦髂關節痛。\n- 書中還有一招是術者抬高客人雙腿、用腳踩薦椎——**推拿不採用**，見「本書中需要謹慎看待的手法與說法」。\n這些做法與課堂「先創造空間再矯正」（k-3steps、k-space）、「用身體重量垂直往下」（k-weight）一致。做完再用站姿前彎或課堂三步驟重測，看卡住的一側有沒有改善。\n相關肌：[[m:piriformis]]、[[m:glute_max]]、[[m:multifidus]]。","tags":["薦髂關節","舒緩","體重下壓","創造空間","參考書"],"muscles":["piriformis","glute_max","multifidus"],"points":[],"regions":["sacrum","pelvis","hip"],"book":"zhengji"},{"id":"b-zhengji-pubis","cat":"骨盆","src":"參考書《整脊醫學》p.204–205","title":"恥骨一高一低：壓或托，再做等長對抗","body":"作者認為恥骨移位會引起鼠蹊、臀下與大腿內側痛，嚴重時很痛。處理分兩型（以一側為例）：\n- **恥骨上升**：客人仰臥、患側靠床邊，患腿垂到床外。術者一手壓對側髂骨、一手壓患側膝上方，兩手一起往下壓。接著請客人把大腿往上抬、術者擋住不讓它動，對抗 5–6 次。\n- **恥骨下降**：客人仰臥、患側屈腿。術者用腋下壓住膝，手掌放在患側恥骨下方往上托。之後同樣請客人抬腿、術者擋住，對抗 5–6 次。\n- 書中說連做 7–8 天可好（療效說法僅供參考）。\n**和課堂的連結**：課堂第三角度提到恥骨聯合高低與鼠蹊痛（k-angle3），③ IN 處理 [[m:adductors]]。本書的「對抗」就是等長收縮後放鬆，可以和《經筋手療法圖解》的「高側鬆上緣、低側鬆下緣」搭配使用。\n- 鼠蹊處有股動脈與神經，避開搏動處、力道放輕；孕婦、產後恥骨聯合痛先就醫，不做下壓。","tags":["恥骨","等長對抗","鼠蹊痛","第三角度","參考書"],"muscles":["adductors","rectus_abd"],"points":[],"regions":["pubis","pelvis","hip"],"book":"zhengji"},{"id":"b-zhengji-endfeel","cat":"手法","src":"參考書《整脊醫學》p.41–44、83–87、235","title":"硬端與軟端：到了極限先試一下","body":"本書的頸椎、腰椎旋轉手法反覆用同一個判斷：**轉到極限時，再輕輕加一點力試試看。**\n- **軟端**：還有一點彈性、軟軟的 → 作者認為可以進行下一步。\n- **硬端**：硬硬地卡住 → **絕對不能再往前**，否則會造成傷害。\n- 即使是軟端，越過極限的量也只有約 2–5°。\n- 上頸椎（C1、C2）不鎖定，頸部保持中立、不前彎不後仰不側彎，做純旋轉；往右轉會痛，就往左做。\n- 鎖定的原則：先側彎、再旋轉到極限；頸部多由上往下鎖，腰部多由下往上鎖。\n**推拿師的用法**：不做衝擊也一樣適用。做被動旋轉、伸展或「創造空間」時，摸到硬端就停，回頭放鬆周圍軟組織；軟端才在極限做持續伸展，或配合吐氣慢慢帶。這和課堂用呼吸測試椎體能不能動（k-breath-test）是同一種「讓關節告訴你」的思路，也可當成每次操作前的安全確認。","tags":["硬端","軟端","極限","鎖定","安全","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine","occ"],"book":"zhengji"},{"id":"b-zhengji-palp","cat":"評估","src":"參考書《整脊醫學》p.228–231","title":"三指觸診：棘突與兩側橫突的十種排列","body":"附錄「整脊醫師手冊」教一種觸診：客人俯臥放鬆，術者**中指放棘突、食指與無名指放兩側橫突**，由頸往腰一節一節摸，比較相鄰三節（A 上、B 中、C 下）的距離與深淺：\n|型|摸到的樣子（以 B 為問題節）|\n|---|---|\n|正常|間距平均、排成一直線|\n|前升|B 靠近 C，而且比 C 深；沒有左右偏|\n|前降|B 靠近 A，與 A 一樣深；沒有左右偏|\n|側傾帶後旋|B 棘突歪向一側，對側橫突凸出且偏下|\n|旋轉|B 棘突歪向一側，對側橫突凸出、較不偏下|\n|前凹／後凸|B 比上下兩節深／淺|\n|橫移|整節平移，棘突仍是直的|\n|下陷|上下間距都變短，三節等深|\n|髂骨上移|同側大轉子、坐骨上移，L5 被拉歪|\n- 作者說「下陷」多見於 L4、L5，認為是椎間盤問題的線索。\n- 他強調肌肉異常 X 光照不出來，觸診比看片子重要；摸肌肉要輕推、輕壓，找僵硬、觸痛、痙攣、腫脹等。\n[[fig:b-zhengji-fig-palp]]\n與課堂「摸脊椎要平滑圓順」（k-smooth）同一方向，本書把「哪裡不順」分成可以描述的型，方便記錄。\n!! 觸診推測不是診斷，有神經症狀仍要轉介（p_disc）。","tags":["觸診","棘突","橫突","整脊把脈","參考書"],"muscles":["multifidus","erector"],"points":[],"regions":["cspine","tspine","lspine"],"book":"zhengji"},{"id":"b-zhengji-relief-rules","cat":"手法","src":"參考書《整脊醫學》p.78、141、143、237、347","title":"矯正前一定先舒緩：方向、時間與禁區","body":"作者把「舒緩」分成廣義（關節加軟組織，接近英文 mobilization、中醫的舒筋活骨）與狹義（只放鬆軟組織：揉、伸展、扣打、深層摩擦、持續壓、捏）。他說多年臨床的心得就是舒緩不能省。書中的規則：\n- **先熱敷**：軟組織舒緩前熱敷約 10–15 分鐘（書中也用超音波、微波，推拿用熱敷即可）。\n- **每個動作 30–60 秒**，可重複兩三次。\n- **旋轉、側彎先往不痛的一側做**，再試痛側。\n- **肌肉還在痙攣時，不在那個關節做矯正**；關節正在敏感疼痛時也一樣。\n- **急性腰痛最好的處理就是舒緩**，不適合做矯正手法。\n- 處理後若痠痛變嚴重，請客人馬上回來，不要拖。\n- 作者也提醒「整骨也要整肌」：錯位多半是周圍肌肉先失衡，只調骨頭不放鬆肌肉、不教運動，效果不會持久。\n這些和課堂「找問題 → 創造空間 → 矯正」（k-3steps）、急性腰閃先遠端與慢慢活動（p_acute）一致。","tags":["舒緩","熱敷","急性腰痛","創造空間","參考書"],"muscles":["erector","multifidus"],"points":[],"regions":["cspine","lspine"],"book":"zhengji"},{"id":"b-zhengji-lumbar-soft","cat":"手法","src":"參考書《整脊醫學》p.104、143–157","title":"腰部舒緩：牽拉不痛側的腿、壓肩推臀","body":"第九章有 6 種腰部舒緩與 20 種軟組織處理。挑推拿最用得上、又不需要頓力的：\n- **牽拉不痛側的腿**：客人仰臥，帶子以 8 字形套在不痛側的腳踝上方，術者往下拉。邊拉邊問：痛增加就停；痛減少就繼續；沒變化就稍加力。先拉雙腿，無效再拉單腿。\n- **壓肩推臀**（作者認為六種裡效果最好）：客人側臥、不痛側在下，上腿屈膝、腳背勾在下腿膝窩。術者一手把上肩輕輕帶向自己、轉到極限後固定，另一手把臀部往外推到極限，下腿伸直垂在床外，重複 7–8 次。\n- **棘突持續壓**：俯臥，豆狀骨疊手壓在棘突上 30–60 秒，上下幾節都壓。\n- **抱膝搖、握踝晃臀**：作者用在腰薦、薦髂關節痛。\n- **胸腰兩側縱向推抓**：側臥，沿脊椎兩側先往下壓再往上抓，皮膚先塗凡士林保護。\n- 書中也有用力猛拉、把人揹起來顛甩的方法，推拿不採用（見安全條目）。\n做完可用課堂的呼吸測試（k-breath-test）看卡住的節有沒有開始跟著呼吸動。相關肌：[[m:erector]]、[[m:ql]]、[[m:multifidus]]。","tags":["腰痛","舒緩","牽拉","壓肩推臀","參考書"],"muscles":["erector","ql","multifidus"],"points":[],"regions":["lspine","sacrum"],"book":"zhengji"},{"id":"b-zhengji-compression","cat":"神經","src":"參考書《整脊醫學》p.26–30、214","title":"壓到哪裡、出現什麼：從症狀推壓迫位置","body":"第二章依受壓的位置分辨症狀：\n|受壓位置|典型表現|\n|---|---|\n|脊髓|**不痛**；遠端或兩側有針刺感|\n|神經根的硬膜套|相關皮節出現反射痛；輕壓有針刺感、重壓反而不痛；之後麻木取代針刺感|\n|神經根內部|無力（與硬膜套受壓無關）|\n|神經主幹|不痛；遠端感覺異常，壓力越大越麻；力量變弱、反射消失|\n|小神經|不痛；管轄區域麻，與正常皮膚界線分明|\n- 運動纖維受壓 → 肌肉無力；感覺纖維受壓 → 感覺異常，壓得更重就變成感覺喪失。\n- **反射痛在同側**，不會跑到中線或對側；**兩側都痛、或痛從一側換到另一側，病源在中線**。\n- 作者認為背痛、頸痛多數來自小面關節而不是椎間盤；他也提出椎間孔變窄約三分之一開始刺激、約一半才算壓迫的說法。\n**推拿上的用法**：「不痛但無力」「兩側麻」「麻的範圍越來越大」都屬神經而不是肌肉問題（k-three），應先轉介（k-redflag）；單側、會隨姿勢改變的痛，才比較像軟組織與小面關節的問題。","tags":["神經壓迫","脊髓","神經根","轉介","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine"],"book":"zhengji"},{"id":"b-zhengji-hotspots","cat":"脊椎","src":"參考書《整脊醫學》p.99–100、233、236–237","title":"容易出問題的交界與胸椎痛源","body":"書中幾處提到「先摸哪裡」，整理如下：\n- **交界處最容易出狀況**：枕骨與 C1、C7–T1、T11–L1、L5–S1，以及薦髂關節，作者建議常規檢查。\n- **胸椎**：關節功能障礙是胸背反射痛的主要來源；觸痛與硬塊多在 T3–T4、T4–T5 之間；**T4 是上胸反射痛的主要痛源**，T9–T12 是下胸的痛源，T12–L1 也要特別注意；胸椎錯位以 T6–T12 最常見。\n- **臀部與大腿後側痛**：多來自薦髂關節與 T11、T12 到 L1 一帶；作者建議先處理薦髂，再處理 T12–L1。\n- 上胸痛常和頸部的病灶一起出現。\n- 作者也說：椎體裂傷的症狀可能拖三個月，肋骨裂傷約三週——外傷後的胸背痛要先排除骨折。\n**對照課堂**：課堂說旋轉的轉折點常在 T12–L1 或 T9–T10（k-turn）；本書再加上 T4 與 T3–T5 一帶，以及 C7–T1，摸背時可以列成必查點。觸診方式見「三指觸診」。\n相關肌：[[m:multifidus]]、[[m:erector]]。","tags":["胸椎","交界","痛源","T4","T12-L1","參考書"],"muscles":["multifidus","erector"],"points":[],"regions":["occ","cspine","tspine","lspine","sacrum"],"book":"zhengji"},{"id":"b-zhengji-ribs","cat":"脊椎","src":"參考書《整脊醫學》p.131–138","title":"肋骨：吸氣難看上肋，吐氣難看中肋","body":"第八章把肋骨分三段檢查：\n- **上肋（第 1–4 肋）**：術者手平放在客人胸前，食指尖放在鎖骨內端下方，請客人深吸氣，比較哪一側不舒服；或先微吸、再徹底吐氣，也能找出問題側。\n- **中肋（第 5–8 肋）**：術者食指、中指放在側胸的肋間，另一手拉客人的肘，讓上身轉向術者；轉動時手指可以摸到卡住的肋間。\n- **下肋（第 9–12 肋）**：同中肋的方法。\n作者的經驗規則：\n|呼吸的困難|多半是|\n|---|---|\n|吸氣難|第 1、2、3 肋|\n|吐氣難|第 5、6、7 肋|\n|吸、吐都難|第 4 肋|\n- 先處理肋骨還是對應的胸椎？作者說他讀過的書多數主張**先處理胸椎，再處理肋骨**。\n- 舒緩：俯臥，雙手垂直放在脊椎兩側的肋骨上，在吐氣快結束時柔和下壓，從肩一路往腰做。\n- 作者提到常有人把肋骨引起的胸痛當成心絞痛；但**胸痛合併冒冷汗、喘仍要先就醫**（k-redflag），不要反過來把心臟問題當肋骨處理。\n相關肌：[[m:scalene]]、[[m:diaphragm]]。","tags":["肋骨","呼吸","吸氣受限","吐氣受限","參考書"],"muscles":["scalene","diaphragm"],"points":[],"regions":["tspine","diaphragm"],"book":"zhengji"},{"id":"b-zhengji-scoliosis","cat":"脊椎","src":"參考書《整脊醫學》p.128–130、235","title":"側彎：量角度、分功能性與結構性","body":"- **量法**：X 光用 Cobb 角（彎曲最上、最下兩節的終板畫線求夾角）；旋轉程度看椎弓根（書中稱椎眼）往中線移了多少來分級。\n- **功能性還是結構性**：做書中示範的姿勢變換後，弧度變小 → 功能性，後天、較容易改善；弧度不變 → 結構性，多為先天、不易矯正。\n- **作者的處理分級**：25° 以下徒手矯正；25–60° 用整脊矯正床加背架（每天穿約 23 小時，定期調整、照 X 光）；60° 以上才考慮手術，他反對 60° 以下開刀。\n- 生長期是關鍵；作者說多數側彎在 10 歲前就被發現。\n- 薦椎也錯位時，先矯正薦椎，再處理側彎。\n**推拿上的用法**：用課堂的靜態／動態比較（k-static-dynamic）判斷是不是功能性，並先看底座薦椎（k-sac-base）。發育中的青少年、角度逐年增加、或合併呼吸受限，都要轉介骨科追蹤；推拿是輔助，不承諾改善多少度。\n相關肌：[[m:ql]]、[[m:erector]]、[[m:multifidus]]。\n!! 「25° 以下徒手就能痊癒」是作者的經驗說法，見「衝突比對」。","tags":["側彎","Cobb","功能性","結構性","轉介","參考書"],"muscles":["ql","erector","multifidus"],"points":[],"regions":["tspine","lspine","sacrum"],"book":"zhengji"},{"id":"b-zhengji-cranial","cat":"脊椎","src":"參考書《整脊醫學》p.45–66、215、237","title":"顱骨調整：吸氣時動，先鬆蝶骨周圍","body":"第四章是顱骨手法，圖說註明取自一位整脊師的顱骨調整著作。重點：\n- **呼吸時相**：作者說吸氣時顱骨各塊「分開」（擴展期），是調整顱骨與枕骨的最好時機；吐氣是鬆緩期，手放著不動。很多手法同時請客人吸氣時把腳背往頭的方向勾、吐氣時伸直。\n- **先檢查**：仰臥，沿眼眶上緣用拇指找 5 個壓痛點，印堂兩側再找 1 個；都不痛，作者認為顱骨沒有錯位，不必調。\n- **順序**：第一步先放鬆太陽穴一帶（蝶骨大翼周圍）的肌肉，把蝶骨「釋放」出來，其他顱骨才鬆得開；第二步拇指放前額兩側隆起處、其餘手指放太陽穴，讓頭部的神經血管順暢。\n- 力道「適可而止」，作者強調是「活動」而不是矯正。\n- 作者把枕骨與薦椎、蝶骨與尾椎看成上下兩端互相影響（書中稱薦枕幫浦）；顱神經相關的症狀，他主張先查 C1，再決定要不要調顱骨。\n**對照課堂**：課堂的頭骨網狀力學（k-skull-net）、薦椎呼吸波（k-sac-nut）同樣把頭與薦尾連在一起；本書提供可以操作的呼吸時相。眼眶附近只做極輕的接觸，不壓眼球。\n!! 書中說這些手法能降眼壓、改善腦震盪，屬未證實的療效說法，見「衝突比對」。","tags":["顱骨","蝶骨","呼吸","薦枕","參考書"],"muscles":["temporalis","subocc"],"points":[],"regions":["head","occ","sacrum"],"book":"zhengji"},{"id":"b-zhengji-exercise","cat":"骨盆","src":"參考書《整脊醫學》p.347–360","title":"依骨盆型態給的居家運動","body":"附錄「整脊運動醫療法」的前提：椎體與骨盆會錯位，主因是周圍肌肉先失衡；只調骨頭、不教運動，很快又歪回去。作者說輕微的錯位靠運動可以自己回來，矯正後做可讓效果持久。骨盆部分：\n|型態|書中動作（摘要）|目的|\n|---|---|---|\n|預備|抓住同側腳踝往上拉、腳往下壓做對抗，兩側各 5–6 次|伸展 [[m:rectus_fem]] 等股四頭肌與 [[m:sartorius]]|\n|AS（≈ 課堂 A）|仰臥雙腳離地數吋撐住；橋式抬臀；一腿伸直抬高到極限；患側直腿慢慢抬離地面|強化 [[m:rectus_abd]]、[[m:hamstrings]]，伸展臀部|\n|PI（≈ 課堂 P）|半蹲再站起；單膝跪地、另一腿前後擺；坐在床邊上身轉向健側停住|作者把股四頭肌、縫匠肌、膕繩肌、腹肌、臀肌的失衡列為後轉的原因|\n|單純側歪|側臥，兩腿併攏往上抬到極限停住|強化側邊|\n- 後面還有腰、胸、頸椎前凸、後凸、側彎、旋轉的運動，原則都是往反方向做、在極限停留。\n- 書中抬腿時要求閉氣；有高血壓、心臟病的客人改成**慢慢吐氣**完成動作。\n!! 課堂 A 的主角是股直肌、髂腰肌（k-angle1），本書 AS 的運動放在強化腹肌與膕繩肌——是「鬆前、強化後」的兩面。","tags":["居家運動","AS","PI","骨盆","參考書"],"muscles":["rectus_fem","sartorius","rectus_abd","hamstrings","glute_max"],"points":[],"regions":["pelvis","lspine"],"book":"zhengji"},{"id":"b-zhengji-caution","cat":"安全","src":"參考書《整脊醫學》p.20–22、128–130、152、155–156、182–183、206–207、214–216、232–235、238–318","title":"本書中需要謹慎看待的手法與說法","body":"本書是 1990 年代的整脊教材，有不少內容推拿師**不能照做**或**不能對外宣稱**：\n- **療效宣稱**：第十五章幾十種內科、婦科、兒科病都附「臨床治癒率」（多在 70–99%），並說照七個固定步驟大部分內科病可「根治」；第十四章也說矯正可治肝硬化、白血病、帶狀皰疹、痛風。這些沒有可靠證據。\n- **嬰幼兒**：哭鬧、食慾不好、睡不安，書中用指壓或拇指推動頸、胸椎處理——應請家長先就醫。\n- **尾椎體內矯正**：戴手套從肛門內撥動尾椎，屬侵入性處置。\n- **踩薦椎、揹背顛甩、夾踝猛拉**、兩人對拉後在痛處垂直下壓等，力量無法控制。\n- **腰椎滑脫**：用「拱背頂腰」處理往前滑脫。\n- **椎間盤突出超過 8 個月**：每週 4–5 次旋轉矯正，痛到無法矯正時先麻醉。\n- **顱骨與眼眶手法**：宣稱可降眼壓、治腦震盪。\n- **X 光**：作者要求頸椎矯正前一定要照；推拿師無法開單，需要影像判斷就轉介。\n書中也有值得留著的保守原則：骨質疏鬆、僵直性脊椎炎、血管硬化、骨頭開過刀、孕婦不做矯正；80 歲以上、高血壓、心臟病要特別小心；急性腰痛只做舒緩；摸到硬端就停。\n!! 各項的課堂依據與嚴重度見「衝突比對」；多數與《脊椎手療法圖解》的同名條目一致。","tags":["安全","禁忌","療效宣稱","侵入性","參考書"],"muscles":[],"points":[],"regions":["cspine","lspine","sacrum","head"],"book":"zhengji"},{"id":"b-zhengji-intro","cat":"人物與流派","src":"參考書《整脊醫學》","title":"參考書：《整脊醫學》導讀","body":"**苟亞博（Nai-Yen Kou）著**，大方廣出版社（台北），自序寫於 1992 年底；增訂版 1994 年 3 月；手邊版本為 2001 年再版（版權頁），書末附學生徐沐鑑 2001 年 5 月的跋。\n\n苟亞博把各國整脊學校的教科書與自己約十年的講義彙編成的整脊（chiropractic）教材，依顱骨、顳頜、頸、胸、肋、腰、薦髂與恥骨尾椎逐章介紹檢查、舒緩與衝擊矯正手法，英文代號沿用 NCC 與 Palmer–Gonstead 兩派，骨盆章的 X 光判讀圖採自 Gonstead。後半是臨床提示、內科病處方（附治癒率）、苟氏椎側痛源，以及附錄的 X 光檢查清單與「整脊運動醫療法」；其中有不少推拿師不能照做或不能對外宣稱的內容。頁碼用書上印的頁碼，PDF 頁＝印刷頁＋18。\n\n### 章節地圖\n- **前頁：作者照片、證書、序與自序**（PDF 第 1–36 頁（印刷頁至 p.18））：國際替代醫學會議與學位證書，自序說明全書由上百本整脊參考書與講義彙編。\n- **第一章 概論**（p.19–22）：整脊的歷史、Palmer 與重要學者，並列出作者主張的十一項療效。\n- **第二章 脊椎的結構與功能**（p.23–34）：椎體、椎間盤、椎間孔、小面關節，神經受壓部位與症狀的分辨，兄弟椎與體表定位。\n- **第三章 整脊基本手法的介紹**（p.35–44）：NCC 與 P-G 兩套英文代號、矯正手的接觸部位、直接與間接矯正、頸腰椎鎖定與硬端／軟端。\n- **第四章 顱骨調整手法**（p.45–66）：吸氣時顱骨擴展、眼眶上緣壓痛點檢查，先鬆蝶骨周圍再調額、頂、顳、枕骨。\n- **第五章 顳頜關節的矯正**（p.67–69）：向前下、向上外、向下外三種錯位的徒手矯正。\n- **第六章 頸椎**（p.70–97）：頸椎神經與病症表、X 光曲線角、檢查、矯正前禁忌與安全檢查、舒緩、C1–C8 各節手法與症狀。\n- **第七章 胸椎**（p.98–130）：胸椎痛源熱點、檢查與舒緩、立式坐式俯臥各種衝擊矯正、T1–T12 症狀、脊椎側彎。\n- **第八章 肋骨**（p.131–138）：上中下肋的檢查、吸吐受限與肋骨對應、肋骨舒緩與矯正。\n- **第九章 腰椎**（p.139–177）：腰薦角、腰椎檢查、6 種舒緩與 20 種軟組織處理、側臥鎖定矯正、L1–L5 症狀與肌力反射檢查。\n- **第十章 薦髂關節及薦椎、髂骨、恥骨與尾椎**（p.178–213）：薦髂關節特性與檢查、舒緩，薦椎兩型與髂骨四型的 X 光判讀、先後原則、AS／PI 矯正、長短腿、薦椎、恥骨、尾椎矯正與 S1–S5 症狀。\n- **第十一章 整脊醫學的病理摘要**（p.214–221）：錯位與疾病互為因果、交感／副交感與內臟、錯位致病機轉圖。\n- **第十二、十三章 儀器使用須知與牽引療法**（p.222–225）：熱療、電療、超音波的用法禁忌，頸腰椎牽引的重量與時間。\n- **整脊醫師手冊（觸診）**（p.226–231）：三指觸診法：棘突與兩側橫突的十種排列型。\n- **第十四章 臨床提示**（p.232–237）：零散的臨床經驗：疾病與節段、激痛點、禁忌、矯正次數與順序、骨盆移位徵象。\n- **第十五章 內科病症的臨床治療**（p.238–318）：治內科病的七個固定步驟與數十種疾病的矯正處方，均附治癒率。\n- **第十六章 痠痛病症的臨床與治療**（p.319–338）：批評以皮節找患椎，提出苟氏椎側痛源觸診與四肢疼痛反射表，附國內外病例。\n- **附錄：X 光檢查清單、整脊運動醫療法、參考書目、跋**（p.339–380）：看片子的檢查項目，依骨盆 AS／PI／側歪與各段脊椎型態設計的運動，以及學生的跋。\n\n### 本站整理的條目（21 則）\n- 苟亞博與《整脊醫學》：這本書從哪來（PDF 第 2–16 頁、p.17、p.19–22、p.191、p.374–380）\n- 兩套英文代號：NCC 與 Gonstead（p.35–37）\n- 髂骨四型的 X 光線索：寬窄、薦尾與閉孔（p.180、186–191）\n- 對照表：課堂三角度 ↔ 本書代號（p.35–37、186–196）\n- 長短腿：先看腳尖，再看髂骨 AS／PI（p.141、179、197–198、231、236）\n- 薦椎、髂骨都歪時，以誰為基準（p.189、235）\n- 本書的薦椎只有兩型：單側後旋與基底後移（p.186、191、199–203、235）\n- 薦髂關節的四個檢查（p.179–185）\n- 薦髂關節的舒緩：體重下壓與抱膝畫圈（p.153、157、181–183）\n- 恥骨一高一低：壓或托，再做等長對抗（p.204–205）\n- 硬端與軟端：到了極限先試一下（p.41–44、83–87、235）\n- 三指觸診：棘突與兩側橫突的十種排列（p.228–231）\n- 矯正前一定先舒緩：方向、時間與禁區（p.78、141、143、237、347）\n- 腰部舒緩：牽拉不痛側的腿、壓肩推臀（p.104、143–157）\n- 壓到哪裡、出現什麼：從症狀推壓迫位置（p.26–30、214）\n- 容易出問題的交界與胸椎痛源（p.99–100、233、236–237）\n- 肋骨：吸氣難看上肋，吐氣難看中肋（p.131–138）\n- 側彎：量角度、分功能性與結構性（p.128–130、235）\n- 顱骨調整：吸氣時動，先鬆蝶骨周圍（p.45–66、215、237）\n- 依骨盆型態給的居家運動（p.347–360）\n- 本書中需要謹慎看待的手法與說法（p.20–22、128–130、152、155–156、182–183、206–207、214–216、232–235、238–318）\n\n條目都是用自己的話整理重點並標註頁碼，示意圖為依書中內容重新繪製；細節請對照原書。","tags":["參考書","整脊醫學"],"book":"zhengji"},{"id":"b-zhengji-compare","cat":"原則","src":"參考書《整脊醫學》比對","title":"《整脊醫學》與課程的比對","body":"逐項比對《整脊醫學》與課堂資料。共 25 項：高 6、中 5、低 14（嚴重度）。\n「衝突」＝說法相反；「程度差異」＝方向相同但做法或強度不同；「用詞不同」＝同一件事不同名稱；「補充」＝課堂沒提到或一致的地方。\n\n### 【高】頸椎旋轉衝擊：安全檢查與硬端（程度差異）\n!! 與《脊椎手療法圖解》相同。後仰旋轉測試不能排除椎動脈風險，推拿師不做頸部快速旋轉扳動。「摸到硬端就停」這條值得保留，一般被動活動也適用。\n- **課堂：**「頸椎：椎動脈、交感神經與脊髓」：頸部不重壓前側，扳動前先放鬆周圍肌肉；「落枕／頸部轉動受限」：避免直接強力扳頸；「斜角肌、肋骨與椎動脈：偏頭痛的另一條線」：椎動脈與頭痛。\n- **本書：**矯正前要有 X 光；有血栓、血管硬化、肌肉痙攣者不做；後仰加旋轉維持 20–30 秒做安全檢查；轉到極限試硬端或軟端，軟端才發力，越過極限不超過 2–5°；C1、C2 純旋轉不鎖定。（p.75–77、83–87、236）\n\n### 【高】尾椎體內矯正（衝突）\n!! 侵入性處置，屬醫療行為，推拿不做。尾骨痛只做臀部、骨盆外部的軟組織放鬆；跌坐後劇痛先排除骨折。與《脊椎手療法圖解》同列為高。\n- **課堂：**「腰、薦、尾神經分布」：尾骨問題列為觀察；「需要先轉介的警訊」：大小便異常、會陰麻木先轉介。\n- **本書：**戴手套、塗凡士林，用食指從肛門內撥動尾椎與薦尾關節，作者認為效果比體外好。（p.206–207）\n\n### 【高】矯正治療內科、婦科病與治癒率（衝突）\n!! 沒有可靠證據，對外絕不能這樣宣稱，也不能讓客人因此延誤就醫。網站引用本書節段與臟腑的對應時，維持課堂寫法：「往哪裡找的線索，不是診斷」。\n- **課堂：**「內臟與胸椎：神經走短線、力學走長線」：胸椎與臟腑的對應屬老師觀點，不是醫學診斷，疾病應就醫；「經痛的推拿思路」、「子宮的四對韌帶」：婦科症狀請就醫。\n- **本書：**第十五章列數十種內科、婦科、兒科病的矯正處方，附 70–99% 的治癒率（含不孕、糖尿病、心臟病），並說照七個固定步驟大部分內科病可根治；第十四章說矯正可治肝硬化、白血病、帶狀皰疹、痛風，能止鼻血、經血。（p.20–22、214–216、232–235、238–318）\n\n### 【高】嬰幼兒的脊椎處理（衝突）\n!! 嬰幼兒哭鬧、吃睡不好可能是發燒、感染、腸胃等需要醫師評估的問題；推拿師不為嬰幼兒做脊椎推動，請家長先就醫。\n- **課堂：**「需要先轉介的警訊」、「操作禁忌與注意穴位」：一般安全原則（課堂沒有特別談嬰幼兒）。\n- **本書：**幼兒哭鬧不止、食慾不振、睡不安，作者歸因於頸胸椎錯位，用指壓 C1、T5 橫突或拇指推動 C1–C3、T4–T7，持續 2–3 週。（p.303–304）\n\n### 【高】椎間盤突出：長期旋轉矯正與麻醉下矯正（衝突）\n!! 與課堂相反，和《脊椎手療法圖解》同一段落相同。推拿只做周邊放鬆，麻醉下操作屬醫療行為。\n- **課堂：**「椎間盤型下背痛（慢性，痛側在上）」、「疑似神經根壓迫」、「椎間盤（慢性）與急性腰閃傷：痛側在上還是在下」：避免強力扭轉與重壓腰椎，有明顯神經症狀先轉介。\n- **本書：**超過 8 個月者長期每週 4–5 次旋轉式矯正；痛到無法矯正時先麻醉再矯正（書中自己也註明有書反對）；8 個月內用牽引。（p.234–235）\n\n### 【高】腰椎滑脫與高風險腰部手法（衝突）\n!! 滑脫屬結構不穩，推拿不在該節段施壓、不做後仰或衝擊；猛拉、揹背顛甩的力量無法控制，推拿不採用。\n- **課堂：**「各段脊椎的活動方向（小面關節）」：L4–L5 活動大；「椎間盤型下背痛（慢性，痛側在上）」：避免強力扭轉、重壓腰椎；「需要先轉介的警訊」。\n- **本書：**「拱背頂腰式」明寫多用於椎骨向前滑脫：客人坐著後仰、術者手頂在滑脫節的下一節；另有揹起客人顛甩後要他往天上蹬、夾踝順勢猛拉、兩人對拉後在痛處垂直下壓等。（p.152、155–156）\n\n### 【中】長短腳與第一角度 A／P（衝突）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」、「骨盆前傾（第一角度 A）」、「骨盆後傾（第一角度 P）」：A 側為長腳、P 側為短腿（筆記）；A 時坐骨結節較高、P 時坐骨較低。「骨盆第三角度：耳狀面外展（EX）與內收（IN）」、「骨盆第三角度 EX（耳狀面外展）」：③ EX（A＋EX）斜向上，等於把腳往上帶 → 短腿。\n- **本書：**患側短腿是同側髂骨 AS（作者譯為前升：往前轉並往上移）合併大轉子內收（仰臥腳尖向內）；長腿是 PI（後降）合併大轉子外張（腳尖向外）。X 光與觸診圖也說 AS、髂骨上移時同側坐骨、大轉子較高。（p.187–188、197–198、231）\n- **怎麼看：**兩邊的 A 與 AS 都是髂骨往前轉，坐骨較高這點也一致，但對腿長的結論相反。本書把 AS 理解成「轉加上移」，髖臼跟著上去 → 短；課堂筆記則和一般用旋轉軸推論的說法相同（髂骨前轉時髖臼往前下 → 仰臥看起來較長）。課堂自己的 ③ EX「斜向上 → 短腿」反而和本書邏輯一致。可能原因：「前上移位」與「前傾旋轉」混用，或量腿的姿勢不同（仰臥、俯臥、屈膝）。建議網站把「A 側為長腳」註明「課堂筆記，與《整脊醫學》相反」；臨床上一律實際量（仰臥看內踝、俯臥看足跟），再用髂後上棘與坐骨高低判型，不用腿長反推角度，並請老師確認量法。《脊椎手療法圖解》只說移位側較短，也沒有分方向。\n\n### 【中】EX／IN 的判定依據與方向（用詞不同）\n- **課堂：**「骨盆第二角度：EX（外轉）與 IN（內轉）」、「骨盆外轉（第二角度 EX）」、「骨盆內轉（第二角度 IN）」：俯臥以 S2 為中線，髂後上棘同高、離 S2 遠＝EX、近＝IN；「大轉子觸診：厚、薄判斷 EX／IN」：EX 側大轉子較厚。\n- **本書：**IN、EX 由骨盆正面 X 光判斷：IN 側髂翼較寬、薦椎下端偏離 IN 側、閉孔變窄；EX 側髂翼較窄、薦椎下端偏向 EX 側、閉孔變寬。p.180 的示意圖標出薦椎中線到兩側的距離 a、b（EX 側畫得略遠），並說兩側髂骨一體、總距離不變。書中沒有用髂後上棘觸診定義 IN／EX，也沒有單獨的 IN、EX 矯正法。（p.180、186–189）\n- **怎麼看：**本書沿用 Gonstead：命名看的是髂骨前面往內或往外轉，所以 X 光上髂翼變寬或變窄。若以垂直軸旋轉來想，髂骨前緣往內時，後方的髂後上棘會往外，與課堂「EX＝遠離 S2」可能剛好相反；但 p.180 的圖上 EX 側又畫得略遠，和課堂相合，單憑本書無法斷定。建議網站在第二角度註明「EX／IN 依課堂的髂後上棘定義，與 Gonstead 的 X 光定義不一定同向」；臨床至少用兩條線索互相確認（髂後上棘遠近＋大轉子厚薄＋仰臥腳尖方向），並請老師示範確認。《脊椎手療法圖解》由施力方向推得的對照與課堂一致，可作參考。\n\n### 【中】俯臥屈膝 90° 的足跟方向與股骨旋轉（衝突）\n- **課堂：**「俯臥屈膝 90°：足跟方向」、「大轉子觸診：厚、薄判斷 EX／IN」、「骨盆外轉（第二角度 EX）」：骨盆 EX 時腿較外轉，俯臥屈膝 90° 小腿往外倒、足跟偏外（筆記：俯臥膝背屈 90° 時較外轉）。\n- **本書：**用仰臥時的腳尖方向判斷股骨（大轉子）：腳尖向內＝大轉子內收（短腿），腳尖向外＝大轉子外張（長腿）；書中沒有俯臥屈膝 90° 看足跟的判讀。（p.197–198）\n- **怎麼看：**解剖上，俯臥屈膝 90° 時小腿往外倒、足跟偏外，是髖「內」旋；髖外旋時小腿會往內倒。網站寫「腿較外轉，所以足跟偏外」在描述上自相矛盾，可能是筆記整理時少了一層說明（例如老師說的是仰臥腳尖向外，或是「足跟偏外的那一側骨盆是 EX」而不是「腿外轉」）。本書仰臥「腳尖向外＝外張」在方向上是自洽的。建議向老師確認原意，網站暫時把這條標為待確認，並改用仰臥腳尖方向與大轉子厚薄互相比對。\n\n### 【中】踩踏薦椎（程度差異）\n- **課堂：**「用身體重量，垂直往下」：用身體重量垂直往下，但以手與前臂施力；「操作禁忌與注意穴位」：骨質疏鬆避免重手法。\n- **本書：**「抬雙腿踏薦」舒緩法：客人俯臥，術者抬高其雙腿，一腳踩在薦椎中下部往前下踏，重複 5–6 次。（p.182–183）\n- **怎麼看：**腳的力量難以控制，又讓腰椎過度後伸，骨質疏鬆、滑脫、孕婦都可能受傷。改用同章的「雙手垂直下壓」或課堂的前臂壓法。\n\n### 【中】脊椎側彎的處理分級（程度差異）\n- **課堂：**「薦椎是腰椎的底座」：側彎先看底座薦椎；「靜態位與動態位：姿勢一換就變？」：換姿勢就變屬肌肉主導。\n- **本書：**25° 以下徒手矯正即可痊癒；25–60° 用矯正床加背架；60° 以上才手術，作者反對 60° 以下開刀；薦椎錯位者先矯正薦椎。（p.128–130、235）\n- **怎麼看：**「先看薦椎」與課堂一致；「徒手可痊癒」「反對 60° 以下手術」是作者個人立場。發育中的青少年側彎要由骨科追蹤，推拿為輔助，不承諾改善角度。\n\n### 【低】S2 參考點、薦椎三軸與耳狀面斜軸的出處（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」–3：無名骨繞 S2 橫軸轉、以 S2 為中線判 EX／IN、第三角度沿耳狀面斜向；「薦椎的三條橫軸：S1、S2、S3」、「點頭、反點頭與呼吸波」：S1 呼吸軸、S2 旋轉軸、S3 斜軸，吸氣反點頭。\n- **本書：**骨盆章以 X 光與 ASIS、PSIS、坐骨、閉孔、薦椎下端為參考，代號沿用 NCC 與 Gonstead；沒有提到 S2 橫軸、三條橫軸、點頭／反點頭或呼吸波。只有顱骨章提到吸氣時顱骨擴展與薦枕幫浦；參考書目列有 Fryette 的整骨技術書。（p.35–37、45–47、186–203、215、374）\n- **怎麼看：**課堂骨盆分類的骨架（前後轉、內外轉、兩者組合）和本書相通，但 S2 參考線、三軸、耳狀面斜軸與 10 種薦椎卡法，較像整骨學派或老師、師叔自己的整合，不宜在網站寫成出自苟亞博。建議在 「台灣整脊與推拿的幾條脈絡（老師分享）」 或骨盆條目加一句來源說明。\n\n### 【低】薦椎錯位的分類與判斷（用詞不同）\n- **課堂：**「薦椎扭轉：Right on Right 的命名與自然擺動」、「非自然扭轉、單邊扭轉與薦椎的 10 種卡法」：自然擺動 R on R、L on L，非自然 L on R、R on L，加單邊點頭／反點頭共 10 種；「薦椎檢查三步驟」：俯臥托腿、看跟骨、抬小腿內外旋。\n- **本書：**薦椎只分兩類：單側往後（含往後下，P-L、PI-L）與基底往後（P）；兩類症狀相同，不能用症狀分，要靠 X 光（薦椎本身錯位時下端會彎）；另說薦椎以左側往前扭轉較多。（p.186、191、199、235）\n- **怎麼看：**本書分類比課堂粗，而且依賴 X 光。單側往後約對到課堂的單邊反點頭，基底往後對到雙側反點頭；斜軸扭轉在本書沒有對應。與《脊椎手療法圖解》的結論相同。臨床以課堂的觸診三步驟為主，本書的「先分薦椎還是髂骨」可以當前一步。\n\n### 【低】薦椎與髂骨誰先處理（程度差異）\n- **課堂：**「處理順序：差最多的先做、最緊的先做」：差最多的角度先做、最緊的肌肉先做；「從薦椎開始的全身檢查順序」：先看薦椎，沒歪看 S2 對髂後上棘，有歪先看轉子對髂骨；「髂腰橫韌帶與薦椎內壓：處理順序」：先解薦椎內壓，再到薦髂、髂腰韌帶。\n- **本書：**依髂骨型態決定基準：AS、IN、ASIN 等以髂骨為準先矯正薦椎；PI、EX、PIEX 等以薦椎為準先矯正髂骨。另有：側彎合併薦椎錯位先矯正薦椎；先處理骨盆再做腰椎；新舊問題同時先處理舊的。（p.189、235）\n- **怎麼看：**兩者都把薦椎與骨盆當地基，差在決定先後的依據：課堂看偏差大小與哪條最緊，本書看錯位型態。可先用課堂方法找最大偏差；若薦椎、髂骨同時有問題，再參考本書的表決定先放鬆哪邊。因 IN／EX 定義可能不同，套表前先確認方向。\n\n### 【低】第一角度的相關肌與運動方向（補充）\n- **課堂：**「骨盆第一角度：A（前傾）與 P（後傾）」、「骨盆前傾（第一角度 A）」、「骨盆後傾（第一角度 P）」：A 的主角為股直肌、髂腰肌，後側臀大肌、膕繩肌被拉長要日後強化；P 的主角為膕繩肌、臀大肌、腹直肌。\n- **本書：**附錄運動：AS 要強化腹肌、膕繩肌（抬腿、橋式）並伸展臀部；PI 列股四頭肌、縫匠肌、膕繩肌、腹肌、臀肌的失衡為原因，用半蹲、跪姿擺腿、坐姿轉身練習；預備動作伸展股四頭肌與縫匠肌。（p.348–354）\n- **怎麼看：**方向一致：A 是前側短、後側與腹肌弱。本書補上居家運動，課堂補上要先放鬆哪一條。PI 的肌肉清單較雜，以課堂的膕繩肌、臀大肌、腹直肌為主。與《經筋手療法圖解》「向前錯位與股四頭肌、向後錯位與膕繩肌有關」一致。\n\n### 【低】第三角度只有兩種組合？（補充）\n- **課堂：**「骨盆第三角度：耳狀面外展（EX）與內收（IN）」、「骨盆第三角度 EX（耳狀面外展）」、「骨盆第三角度 IN（耳狀面內收）」：③ EX＝A＋EX（又高又遠）、③ IN＝P＋IN（又低又近），沿耳狀面斜向，造成腰椎直接側彎；「急性腰閃傷（A＋IN，痛側在下）」：急性腰閃骨盆變 A＋IN；「髂腰橫韌帶與薦椎內壓：處理順序」：P＋EX 拉長髂腰韌帶。\n- **本書：**髂骨有 ASEX、ASIN、PIEX、PIIN 四種組合，各有 X 光特徵（閉孔最扁、最小、最大、最長）；沒有耳狀面斜軸的說法，也沒有說哪一種造成側彎。（p.187–190）\n- **怎麼看：**課堂第三角度只取四種組合中的兩種，並加上「沿耳狀面、造成直接側彎」的解釋，這部分不是出自本書。另外兩種組合課堂也有，只是放在急性腰閃與髂腰韌帶。網站可在第三角度條目補一句「其他兩種組合見…」，避免誤以為只有兩種。\n\n### 【低】長短腿的臨床份量（程度差異）\n- **課堂：**「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：短腿要先知道為什麼短再處理，不要直接拉腿。\n- **本書：**一處說約 7% 的人兩腿差 1.2 公分，不一定會痛、不必當病源；另幾處說長短腿不處理腰痛就不可能好、右腿短者約為左腿短的兩倍；也說頸椎錯位會造成長短腿。（p.141、179、197、235–236）\n- **怎麼看：**書中前後說法不一。較穩當的是課堂的態度：長短腿是線索不是診斷，先找原因（骨盆角度、股骨旋轉、足踝）；結構性的腿長差（先天、骨折後）不靠推拿處理，需要時建議鞋墊或轉介。\n\n### 【低】急性腰痛：先舒緩，不做矯正（補充）\n- **課堂：**「急性腰閃傷（A＋IN，痛側在下）」、「椎間盤（慢性）與急性腰閃傷：痛側在上還是在下」：急性腰閃先用遠端穴配合慢慢活動，局部不重壓。\n- **本書：**急性腰痛不適合矯正手法，應多用舒緩；急性腰痛最好的治療就是舒緩，每個動作 30–60 秒。（p.141、143）\n- **怎麼看：**一致。但同一章也有「頂薦提腰」「揹背顛甩」等標明用於急性扭傷的手法，推拿不採用（見安全條目）。\n\n### 【低】薦髂關節的檢查方法（補充）\n- **課堂：**「薦椎檢查三步驟」：俯臥托腿 → 看跟骨 → 抬小腿內外旋。\n- **本書：**站姿前彎（拇指移動較多側為患側）、仰臥垂直下壓兩側髂骨、仰臥屈髖用腋下壓膝做內外壓動、觸診硬塊與觸痛。（p.179–185）\n- **怎麼看：**互補：課堂偏向看薦椎往哪裡歪，本書偏向找哪一側卡住。站姿前彎在一般骨科檢查也常見，但單一檢查的準確度有限，要多個一起看。\n\n### 【低】恥骨高低的處理（補充）\n- **課堂：**「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：第三角度常伴鼠蹊痛、恥骨聯合高低；「骨盆第三角度 IN（耳狀面內收）」：③ IN 處理內收肌群，鼠蹊處力道放輕。\n- **本書：**恥骨上升：仰臥壓對側髂骨與患側膝；恥骨下降：腋下壓膝、手掌在恥骨下方往上托；之後都請客人抬腿、術者擋住做對抗 5–6 次。（p.204–205）\n- **怎麼看：**本書直接處理恥骨，課堂從角度與內收肌下手，可以合併。《經筋手療法圖解》是高側鬆上緣、低側鬆下緣，思路一致。孕婦、產後恥骨聯合痛先就醫，不做下壓。\n\n### 【低】孕婦能不能做調整（補充）\n- **課堂：**「懷孕、產後與骨盆」、「操作禁忌與注意穴位」：孕期避免重按 LI4、SP6 等穴與腹部、腰薦部。\n- **本書：**作者屬於「不贊成孕婦做矯正」的一派，連頸部、上胸的輕微矯正也不做。（p.235）\n- **怎麼看：**方向一致，本書更保守。孕婦只做輕柔放鬆，避開腹部與腰薦重壓。與《脊椎手療法圖解》相同。\n\n### 【低】神經壓迫的症狀與三分法（補充）\n- **課堂：**「三分法：肌肉、骨頭、還是神經？」：神經問題「主動不足、不痛」；「需要先轉介的警訊」：進行性無力、大小便異常先轉介。\n- **本書：**脊髓受壓不痛、遠端或兩側針刺感；硬膜套受壓有皮節反射痛；神經根內部受壓無力；神經幹受壓不痛但麻、反射消失；反射痛在同側，兩側痛表示病源在中線。（p.29–30）\n- **怎麼看：**一致，本書把「不痛的神經問題」再細分，正好補強三分法；兩側症狀、無力加重要先轉介。\n\n### 【低】配合呼吸的時機（補充）\n- **課堂：**「配合呼吸做整復」、「呼吸淺／橫膈緊」：吸氣準備、吐氣施力；「點頭、反點頭與呼吸波」：吸氣時薦椎反點頭。\n- **本書：**脊椎、肋骨的矯正在吐氣將盡時發力；顱骨則在吸氣（擴展期）時操作、吐氣時手放著不動，並配合吸氣勾腳背、吐氣伸腳背。（p.45–47、115–117、137、163）\n- **怎麼看：**脊椎部分一致；顱骨的時機相反，是因為作用的組織與目的不同，不算衝突。\n\n### 【低】肋骨與呼吸受限（補充）\n- **課堂：**「呼吸相關肌：背部三段與前側」：呼吸相關肌；「呼吸淺／橫膈緊」：呼吸淺、橫膈緊。\n- **本書：**吸氣困難多為第 1–3 肋、吐氣困難多為第 5–7 肋、吸吐都難為第 4 肋；多數書主張先矯正胸椎再矯正肋骨。（p.134）\n- **怎麼看：**可當成「呼吸卡在哪」的觸診起點。《經筋手療法圖解》把第 3–10 肋分成吸氣受限、吐氣受限並依此決定推的方向，兩書可合用。胸痛合併冒汗、喘先排除心臟問題。\n\n### 【低】苟亞博的著作（用詞不同）\n- **課堂：**「台灣整脊與推拿的幾條脈絡（老師分享）」：苟亞博，可參考其著作《整脊醫學》，以及《肌動學》《經穴大全》等書。\n- **本書：**學生的跋說，苟亞博把《整脊醫學》與《整復醫學》兩本書的出版權交給他，稱這兩本最能代表老師。（p.378）\n- **怎麼看：**手邊的《經穴大全》（out/jingxue.json）作者是坂元大海、原島廣至，不是苟亞博；《肌動學》也未見他署名。建議網站改寫成「苟亞博著有《整脊醫學》《整復醫學》；老師另推薦《肌動學》《經穴大全》作參考」。\n","tags":["參考書","衝突","比對"],"book":"zhengji"},{"id":"k-1012-cuff-vs-frozen","cat":"頸肩","src":"課堂 1012（錄音 0:45:18–0:50:58）","title":"旋轉肌袖問題 vs 五十肩：怎麼分","body":"老師用「主動／被動」加上「有沒有不痛的姿勢」來分肩痛（錄音 1012-1 約 0:45:18–0:50:58）。\n\n**旋轉肌袖**（[[m:supraspinatus]]、[[m:infraspinatus]]、[[m:teres_minor]]、[[m:subscap]]）的工作是在動作中穩定肱骨頭，所以它出問題時是**動到才痛**：\n- 只有某些特定角度會痛，換個角度就不痛。\n- 客人找得到固定不痛的休息姿勢，表示那個姿勢沒用到那條肌肉，這很合理。\n- 多半是肌腱有小撕裂，不是大撕裂。\n\n**五十肩、肌腱炎（肱二頭肌、肱三頭肌肌腱炎）、肩夾擠**這類慢性發炎：\n- 組織發炎後沾黏，**主動做不到、被動也做不到，兩種都會痛**。\n- 休息、睡覺時也痛、會脹：發炎讓局部循環變差，血送得進去、靜脈回流不好（細節：錄音辨識不清，待確認）。\n\n|類型|主動|被動|休息姿勢|\n|---|---|---|---|\n|旋轉肌袖|特定角度痛|較不受限|找得到不痛的位置|\n|五十肩／肌腱炎／夾擠|受限且痛|受限且痛|休息、夜間也痛|\n\n老師說這是臨床上最重要的鑑別之一；急性傷沒處理好，可能拖成慢性。","tags":["旋轉肌袖","五十肩","主動被動","鑑別","夜間痛"],"muscles":["supraspinatus","infraspinatus","teres_minor","subscap","biceps","triceps"],"points":["SI11","SI9"],"regions":["shoulder"]},{"id":"k-1012-shoulder-joints","cat":"頸肩","src":"課堂 1012（錄音 0:39:38–0:58:06）","title":"肩的真關節與假關節","body":"老師從胸骨開始往外，一個一個講肩的關節（錄音 1012-1 約 0:39:38–0:47:17、0:54:32–0:58:06）：\n- **胸鎖關節**：鎖骨內端接胸骨柄，屬於**馬鞍形關節**，可以往好幾個方向轉。老師舉例：大拇指根部（腕掌關節）也是馬鞍關節。正面最容易看到、摸到。\n- **肩鎖關節（肩峰鎖骨關節）**：鎖骨外端靠到肩峰，靠幾組韌帶穩定；摸的時候一定要兩邊比較。\n- **肩胛胸廓關節**：肩胛骨只是貼在胸廓上滑動，沒有真正的關節面，老師稱它「假關節」。所以肩胛很容易被肌肉拉走，嚴重時就是翼狀肩胛（天使翼，與 [[m:serratus]] 有關）。\n- **盂肱關節**：肩胛骨的關節盂接肱骨頭，也就是一般俗稱的「肩關節」。關節盂和前方的**喙突**都屬於肩胛骨，所以肩胛一轉，盂肱關節就跟著轉。\n- 肩的任何一個動作，都要這幾個關節配合好，才做得到應有的角度。\n\n**評估提醒**：要看肩胛骨本身的問題時，先把「跟著肩胛轉的盂肱關節」這個因素排除，再往內看肩鎖、胸鎖。","tags":["胸鎖關節","肩鎖關節","肩胛胸廓關節","盂肱關節","馬鞍關節"],"muscles":["serratus"],"points":[],"regions":["shoulder","scap"]},{"id":"k-1012-sc-protrude","cat":"頸肩","src":"課堂 1012（錄音 0:56:13–1:01:50；2:07:08–2:18:38）","title":"胸鎖關節突出：鎖骨被往內擠","body":"（錄音 1012-1 約 0:56:13–1:01:50）\n- 正常時，兩側胸鎖關節的高低、旋轉面差不多。\n- 一側**胸鎖關節往前突出**，代表那側鎖骨被擠壓：肩膀（肩胛、肱骨）往前、往內走，把鎖骨推向胸骨，內端就頂出來。常同時有高低肩。\n- **處理思路**：不要直接去壓突出的地方。**先做肩關節（肱骨）外轉那一組**，讓肩膀往後回來一點，鎖骨的擠壓解除，突出就會減少。反過來，肱骨內轉會讓它更突出。\n- 生活例子：工作時要一直往前遞東西給人的人，肩膀長期往前，容易出現這種狀況。\n- 課堂實作（約 2:07:08–2:18:38）：放鬆鎖骨下方與 [[m:pec_major]]，再帶肩膀往後上、然後往前下活動；做完用手指再摸胸大肌有沒有變鬆（細節：錄音辨識不清，待確認）。\n\n對照既有筆記：[[m:pec_major]] 讓肱骨內轉、[[m:pec_minor]] 讓肩胛前傾；鎖骨前突時，內端關節面同向往前滑（k-shoulder-complex）。","tags":["胸鎖關節","鎖骨","高低肩","肱骨外轉","胸大肌"],"muscles":["pec_major","pec_minor","infraspinatus","teres_minor"],"points":["LU2"],"regions":["shoulder","scap"]},{"id":"k-1012-scap-rot-first","cat":"評估","src":"課堂 1012（錄音 1:12:59；1:31:13–1:41:19）","title":"看肩胛：先看旋轉，再判斷高低","body":"（錄音 1012-1 約 1:12:59、1:31:13–1:41:19）\n老師示範肩胛骨的六個動作（上提／下壓、前凸／後縮、向上旋轉／向下旋轉），再讓同學互看肩胛。判斷順序：\n1. 讓客人在**自然、放鬆**的狀態下看，不要讓他刻意擺姿勢。\n2. 先看有沒有**向上或向下旋轉**（上角、下角的連線是否平行）。\n3. 沒有旋轉問題時，**前凸、後縮不太影響高低**；這時兩側的高低差，才算真正的上提或下壓。\n4. 有旋轉時，高低可能是旋轉帶出來的，不能直接判成上提。\n5. 再換姿勢比較（坐→趴），看差異有沒有改變，判斷跟下面有沒有關係（見 k-scap-pelvis）。\n\n對應肌肉（既有筆記）：上提＝[[m:trap_u]]、[[m:levator]]；向上旋轉＝[[m:trap_u]]、[[m:trap_l]]、[[m:serratus]]；向下旋轉＝[[m:rhomboid]]、[[m:pec_minor]]。","tags":["肩胛","向上旋轉","上提","高低肩","望診"],"muscles":["trap_u","levator","trap_l","serratus","rhomboid","pec_minor"],"points":[],"regions":["scap"]},{"id":"k-1012-humerus-mimic","cat":"頸肩","src":"課堂 1012（錄音 1:03:37–1:10:54）","title":"肱骨頭前移與模仿客人姿勢","body":"（錄音 1012-1 約 1:03:37–1:10:54）\n- 以**肱骨頭**的圓頭當觀察點：客人放鬆時，看肱骨頭有沒有往前跑。肱骨內轉、肱骨頭前移時，往前拉的一定有 [[m:pec_major]]。\n- 肩往前（前凸）時要分兩種：肩胛骨整個被帶走，或肩胛還在、肱骨自己內轉（對照 k-scap6）。\n- **模仿**：老師強調，任何人的姿勢都可以先用自己的身體模仿一次。擺出客人的姿勢，感覺哪裡在出力、哪裡被拉長、後面是不是要有另一組肌肉來平衡。想不出答案就繼續模仿、繼續找；學習本身也是從模仿開始。\n- 例：脊椎往一側彎時，[[m:subscap]] 這類內轉肌和背側肌群會被迫一起出力（錄音辨識不清，待確認）。\n- 看遠端時也看鎖骨的走向，是否往前、往下。\n- 找到主問題並先把它「解鎖」，後面的局部就好做了。","tags":["肱骨","內轉","胸大肌","模仿","評估思路"],"muscles":["pec_major","subscap"],"points":[],"regions":["shoulder","scap"]},{"id":"k-1012-bone-indicator","cat":"原則","src":"課堂 1012（錄音 2:39:02–2:50:10）","title":"骨頭是指標：先放回骨頭再談肌肉","body":"（錄音 1012-1 約 2:39:02–2:50:10）\n這段老師一再強調「**骨頭是指標**」：\n- 骨頭位置偏了，就是確定的證據：它真的移位了。人體繞著中心軸，肌肉兩兩相對；骨頭一偏，一定是一組緊、一組被拉長。\n- **處理思路**：先讓骨頭輕輕地、稍微回到原位。骨頭回來以後，原本被拉長的那一組肌肉才有機會恢復收縮力，緊的那一組也會跟著鬆。\n- 跨關節的地方，骨頭就是**支點**。支點一變，周邊肌肉的鬆緊和受傷位置都跟著變；長期被拉緊的肌肉，支點沒改就很難放掉。\n- 脊柱在 X、Y、Z 三度空間裡活動，要用空間去想，不要只看平面。\n- 拮抗肌（例如肱二頭肌、肱三頭肌）一邊出力，另一邊就要放鬆；放不掉時，可能整塊骨頭被帶走，等於支點被改掉。\n- 結論：以骨頭為主，用骨頭當指標去推周邊肌肉、軟組織怎麼變，而不是只從肌肉去回推骨頭。","tags":["骨頭指標","支點","拮抗肌","三度空間","原則"],"muscles":["biceps","triceps"],"points":[],"regions":[]},{"id":"k-1012-back-layers","cat":"手法","src":"課堂 1012（錄音 0:05:03；2:51:46–2:55:36）","title":"背部肌肉分層：深層用時間換力量","body":"（錄音 1012-1 約 0:05:03、2:51:46–2:55:36）\n- 背部的肌肉分好幾層（課堂說四層）。斜方肌（[[m:trap_u]]、[[m:trap_m]]、[[m:trap_l]]）在最外層，往內有 [[m:rhomboid]]、[[m:erector]]，最深層是連在橫突與棘突之間的旋轉肌、[[m:multifidus]] 這類小肌肉（各層細節錄音辨識不清，待確認，可對照解剖書）。\n- 肌肉本身延展性好、耐受力強，但肌腱拉過頭會斷裂。\n- **手法原則**：越深層的肌肉，不是靠加大力氣，而是**用時間換取**：力道小一點、停留久一點，讓組織慢慢放開。一般的肌肉痠痛，小力持續壓就夠了。\n- 背部看似簡單，老師提醒不要小看：每一位客人都要想清楚為什麼這樣推、要推到哪一層，把判斷和動作連起來。","tags":["背部肌肉","分層","深層","持續壓","力道"],"muscles":["trap_u","trap_m","trap_l","rhomboid","erector","multifidus"],"points":[],"regions":["tspine","lspine"]},{"id":"k-1012-self-protect","cat":"手法","src":"課堂 1012（錄音 0:26:28–0:28:20）","title":"推拿第一要義：保護自己","body":"（錄音 1012-1 約 0:26:28–0:28:20）\n- 老師問：推拿的第一個要義是什麼？答案是**保護自己**。\n- 學手法、練基本功，第一件事是不要讓自己的**大拇指**受傷；大拇指最常用，也最容易過勞。\n- 先為自己**創造操作空間**：站位、床的高度、和客人的距離都擺好，再施力。\n- 課堂上老師提醒一位同學：剛才「眼裡只有患者，沒有自己」，只顧著做，自己的姿勢就跑掉了。\n- 呼應既有原則：用身體重量垂直往下，不是用手臂、手指硬出力（見 k-weight）。\n- 補充（一般建議）：拇指痠時，可以改用掌根、肘或指節分擔，不要讓拇指過伸硬壓。","tags":["保護自己","大拇指","姿勢","基本功"],"muscles":[],"points":[],"regions":[]},{"id":"k-1012-next-day","cat":"原則","src":"課堂 1012（錄音 0:52:43–0:54:32）","title":"效果要看回去之後，不是當下","body":"（錄音 1012-1 約 0:52:43–0:54:32，另見 0:30:08）\n- 做完當下覺得鬆、不痛，不代表真的好了。要看的是**回去之後**：明天、後天恢復正常生活時，是持續變好，還是又慢慢痛回來。\n- 隔一兩天又痛回來，代表主問題還沒解，或是生活中的姿勢、動作又把它拉回去，要回頭重新評估：是不是只做了局部，沒處理上面或下面的變因。\n- 肩關節的任何動作都要好幾個關節一起配合；只有局部變好、整體配合沒恢復，就容易復發。\n- 老師也提到：客人的生活習性如果不改，效果很難維持（約 0:30:08）。\n- 實務建議：下次見面先問這幾天的變化，再決定這次從哪裡下手。","tags":["療效評估","復發","追蹤","生活習慣"],"muscles":[],"points":[],"regions":["shoulder"]},{"id":"k-1012-pneumothorax","cat":"安全","src":"課堂 1012（錄音 0:13:49–0:15:35）","title":"肩胛內緣與背部：小心氣胸","body":"（錄音 1012-1 約 0:13:49–0:15:35，錄音辨識不清，待確認）\n- 老師提到：背部、尤其是**肩胛骨內緣**一帶，從皮膚到胸腔（肋間、肺）的距離最淺。針灸如果直直刺得太深，可能造成**氣胸**，所以背部的穴位多半斜刺。\n- 對推拿的提醒（補充）：肩胛內緣到脊椎之間（例如 [[p:BL43]] 膏肓一帶）肋間比較薄，不要用尖銳的器具，或用指尖、肘尖往肋間縫裡猛戳。加壓要壓在肌肉和骨頭上，不要往肋骨之間鑽。\n- 補充（一般臨床）：做完若出現呼吸急促、胸痛、單側呼吸困難，要立刻就醫。","tags":["氣胸","肩胛內緣","背部","針灸","安全"],"muscles":["rhomboid"],"points":["BL43"],"regions":["scap","tspine"]},{"id":"k-1012-sinew-plane","cat":"經筋","src":"課堂 1012（錄音 0:15:35–0:18:50；2:43:06–2:46:32）","title":"經絡是點與線，經筋是面","body":"（錄音 1012-1 約 0:15:35–0:18:50、2:43:06–2:46:32）\n- 經絡（經脈）用穴位來說明：一個一個點，串成一條線。\n- 經筋是這條線旁邊的**所有肌肉、軟組織**。十二經筋就是十二經脈所濡養的肌肉軟組織，所以經筋呈現的是「面」。\n- 處理時只要掌握經絡的大方向，看的是那條線周邊的一整片筋肉。\n- 力學上，**直線的拉力最大**；散在一片區域的小問題，通常影響不大。\n- 後段老師背了經筋的走法：起於四肢末端（爪甲）、結於關節、上於頸項、終於頭面。也提到經絡「出入臟腑、以次相傳」，以及十二經流注順序（肺、大腸、胃、脾、心、小腸⋯，錄音只辨識出前段）。\n- 經筋調和，經筋所在的肌肉軟組織與經絡才能得到正常的氣血供應。","tags":["經筋","經絡","點線面","流注"],"muscles":[],"points":[],"regions":[]},{"id":"k-1012-ankle-ev","cat":"踝足","src":"課堂 1012（錄音 0:06:44–0:08:24；0:18:50–0:20:43）","title":"踝內外翻受限：一組太緊拉住","body":"（錄音 1012-1 約 0:06:44–0:08:24、0:18:50–0:20:43）\n- 腳踝受傷（扭傷）以後，膝蓋會跟著被扭轉，接著出現長短腳。這時要前、後、左、右互相印證，不要只看一個方向。\n- 踝的翻轉：[[m:peroneus]]（腓骨長、短肌）把腳往**外翻**拉；[[m:tib_post]] 是**內翻**的主要肌肉。\n- **判斷**：請客人做內翻、外翻。某一個方向**出不去**，代表另一側有一組肌肉太緊、把它拉住。例如外翻做不出來，就去找內翻那一組。\n- 也可能不是肌肉，而是經筋或關節本身的問題，要再分辨（見三分法 k-three）。\n- 膝外側的問題、膝的扭轉，要往下看踝、往上看骨盆（見 k-knee-order）。","tags":["踝扭傷","內翻","外翻","長短腳","膝扭轉"],"muscles":["peroneus","tib_post"],"points":[],"regions":["ankle","knee"]},{"id":"k-1012-pelvis-spine","cat":"脊椎","src":"課堂 1012（錄音 0:20:43–0:26:28）","title":"脊椎的偏，多由骨盆扭轉帶出","body":"（錄音 1012-1 約 0:20:43–0:26:28，錄音辨識不清，待確認）\n- 老師提到：不管是 S 型側彎合併逆向旋轉，還是單一側的側彎，**先不用急著管脊椎本身怎麼偏**。\n- 因為所有的力量都是經過**骨盆**去扭轉脊椎；上面怎麼轉是一件事，下面怎麼來是另一件事，要分開看。\n- 判斷主問題：痛在腳、上面沒問題 → 主問題在下面。痛在上面 → 要看膝關節、股骨外轉等下面的變動有沒有往上傳。\n- 所以先找主問題（多半在骨盆與下肢）並把它解掉，脊椎的偏移常會跟著改變，再回頭處理剩下的局部。\n- 與「先把地基擺正」（k-effective）、「四大平衡」（k-four）的觀念一致。","tags":["側彎","旋轉","骨盆","主問題"],"muscles":[],"points":[],"regions":["pelvis","lspine","tspine"]},{"id":"k-1012-palp-layers","cat":"評估","src":"課堂 1012（錄音 0:08:24–0:13:49；1:49:58）","title":"觸診分層：外面軟，裡面硬","body":"（錄音 1012-1 約 0:08:24–0:13:49、1:49:58）\n- 觸診時先輕輕放上去，再一層一層往深處壓。外層軟軟的，壓深一點才摸到硬的肌肉，代表問題在深層。\n- 外面鬆、裡面緊很常見，不能只摸表面就說沒事。實作時老師也要同學「外面軟的，看裡面有沒有緊的」。\n- 很少看到兩邊都緊，常見的是一邊緊、一邊鬆；鬆的那邊往往是被拉長的（見 k-stretch）。\n- 有些肌肉變緊，是為了抓住骨頭、不讓它跑出去（保護性緊繃）；摸到時要想想它在保護什麼。\n- 老師也提到：輕壓時如果有特別的反彈感，可能和神經有關（錄音辨識不清，待確認）。","tags":["觸診","深層","一緊一鬆","保護性緊繃"],"muscles":[],"points":[],"regions":[]},{"id":"k-1012-serious-dz","cat":"安全","src":"課堂 1012（錄音 1012-2 6:39–14:37）","title":"重大疾病的客人：推拿的定位","body":"（錄音 1012-2 約 6:39–14:37，課後問答，錄音辨識不清，待確認）\n課後有同學問：家人有腦部病變（血腫、水腫後短期記憶變差），或有白血病，推拿可以怎麼做。老師回答的重點：\n- 推拿**改變不了疾病本身**（例如造血功能、血液疾病），定位是輔助：讓身體放鬆、減少緊繃、讓血液循環順暢。\n- 有心悸、背部不舒服的人，可以幫他在呼吸時把胸廓打開，增加呼吸量。\n- 腦部問題的個案，老師提到可從下肢內側（腎經偏下段、靠後側）著手，並注意做哪一側（細節辨識不清）。\n- 補充（一般臨床）：這類客人一定以醫師治療為主，先確認病情穩定。出現新的神經症狀、出血傾向、發燒時，先就醫（見 k-redflag）。血液疾病常有血小板低、容易瘀青，手法要特別輕。","tags":["重大疾病","轉介","輔助","呼吸","腎經"],"muscles":[],"points":[],"regions":["diaphragm"]},{"id":"k-1012-tcm-life","cat":"中醫基礎","src":"課堂 1012（錄音 0:28:20–0:34:02）","title":"治療也包括生活習性與情志","body":"（錄音 1012-1 約 0:28:20–0:34:02，本段辨識不清，多為老師的觀點分享，待確認）\n- 老師提到：中醫的治療不只看局部。經絡會調節身體的升降，也會影響一個人的生活習性和脾氣；反過來，情緒也會傷臟腑（課堂舉「喜傷心、思傷脾」，其他句辨識不清）。\n- 所以客人的作息、工作姿勢、生活習慣不改，推完回去又會回來，要讓客人理解並願意調整。\n- 職業病是常見來源：長期的工作姿勢，就是一股固定的拉力。\n- 經筋調和以後，它所在的肌肉軟組織和經過的經絡，才能得到正常的氣血供應。\n- 經絡「出入臟腑、以次相傳」（與 k-meridian-theory 相同）。","tags":["情志","生活習慣","職業病","經絡"],"muscles":[],"points":[],"regions":[]},{"id":"k-1012-review","cat":"原則","src":"課堂 1012","title":"課堂 1012 重點與比對","body":"這堂課以肩為主軸：從胸鎖、肩鎖、肩胛胸廓到盂肱關節，一個一個講肩複合體的關節，並示範肩胛六個動作的看法（先看旋轉再判高低、坐→趴比較靜態位）。肩痛的部分講旋轉肌袖和五十肩、肌腱炎怎麼用主動／被動與休息痛來分，也講胸鎖關節突出時先做肱骨外轉。原則面強調「骨頭是指標」、推拿要先保護自己、深層肌用時間換力量、效果要看隔天；另有骨盆與肩胛的分組實作，以及課後關於重大疾病的問答。\n\n本堂錄音（1012）由語音辨識轉成逐字稿，再整理成 16 則條目；辨識不清處已標「待確認」，建議對照自己的筆記。\n\n### 對既有條目的補充\n- 「坐→臥看肩胛：問題在肩還是在骨盆？」：課堂再次說明並示範：先記住坐／站時肩胛的位置，再趴下比一次靜態位（趴著時肌肉不出力）。只要位置有移動，就代表上面的結構和下面有因果關係。示範中，一位同學坐姿的肩胛向上旋轉在趴下後幾乎不見，因此推測和下半身有關。（0:37:35–0:39:38；1:41:19–1:43:03）\n- 「看肩胛骨：上角、下角是否平行」：補充判斷順序：盂肱關節會跟著肩胛轉，要先排除。先看有沒有向上／向下旋轉；沒有旋轉時，前凸、後縮不太影響高低，這時的高低差才算真正的上提或下壓。要在客人自然放鬆時看。（0:54:32–0:56:13；1:36:12–1:41:19）\n- 「肩複合體：五個關節、韌帶與鎖骨的滑動」：課堂補充：胸鎖關節是馬鞍形關節（和大拇指腕掌關節一樣）；肩胛胸廓關節沒有真正的關節面，老師稱「假關節」；盂肱關節是俗稱的「肩關節」，關節盂與喙突都屬於肩胛骨；肩鎖關節靠韌帶穩定，觸診要兩側比較。另加入胸鎖關節突出的處理思路（先做肱骨外轉），見 k-1012-sc-protrude。（0:39:38–0:58:06）\n- 「肩胛骨的六個動作與翼狀肩胛」：課堂逐一示範六個動作（上提、下壓、前凸、後縮、向上旋轉、向下旋轉），並讓學員互相觀察；再次區分「肩胛整個被帶走」和「肱骨被胸大肌帶成內轉、肱骨頭前移」。（1:12:59；1:31:13–1:34:35；1:03:37–1:05:23）\n- 「旋轉肌袖撕裂為什麼常在關節旁」：補充鑑別：旋轉肌袖問題只有特定角度會痛、找得到不痛的休息姿勢，多為小撕裂；五十肩、肌腱炎、夾擠這類慢性發炎沾黏則主動、被動都受限且痛，休息、夜間也痛。見 k-1012-cuff-vs-frozen。（0:45:18–0:50:58）\n- 「神經、肌肉、骨頭互為因果」：老師這次明確偏向「骨頭是指標」：以骨頭位置為主，推周邊肌肉怎麼變。骨頭先輕輕回位，被拉長的那組肌肉才能恢復收縮性。骨頭是支點，支點改變會改變肌肉的鬆緊。（2:39:02–2:50:10）\n- 「經筋是什麼？」：補充「點、線、面」的說法：經絡用穴位表達，是點串成的線；經筋是這條線旁邊所有的肌肉軟組織，是面。直線的拉力最大。（0:15:35–0:18:50）\n- 「經筋的起、結、佈、散與足趾對應」：課堂背誦經筋走法：起於爪甲（四肢末端）、結於關節、上於頸項、終於頭面，與筆記一致；另提到十二經流注順序「肺、大腸、胃、脾、心、小腸⋯」（錄音只辨識出前段）。（2:43:06–2:46:32）\n- 「踝關節韌帶、足的分區與踝的動作肌」：補充用法：外翻主要是腓骨長、短肌，內翻主要是脛後肌。做內外翻時某方向出不去，就找另一側太緊的那一組；踝傷之後要注意膝的扭轉和長短腳。（0:06:44–0:08:24；0:18:50–0:20:43）\n- 「用身體重量，垂直往下」：新增「推拿第一要義是保護自己」：不要讓大拇指受傷，先為自己創造操作空間，不要眼裡只有患者。（0:26:28–0:28:20）\n- 「需要先轉介的警訊」：課堂提到：剛脫臼或骨折時，先幫忙看一下、送醫院；長期的肌腱撕裂，臨床上也有 PRP 等醫療處置，推拿只能順著目前能到的角度慢慢做，不能硬拉（錄音辨識不清，待確認）。（2:23:41–2:25:54）\n- 「骨盆第三角度：耳狀面外展（EX）與內收（IN）」：實作時再次確認：骨盆第三角度 IN 的處理對象是內收肌群。（2:20:12）\n- 「臀部深層肌群：外轉肌與內轉肌」：實作提示：處理臀後六肌時，從大轉子出發，大拇指撐開順著肌肉方向按（錄音辨識不清，待確認）。（2:35:07）\n- 「靜態位與動態位：姿勢一換就變？」：補充原理：趴著時肌肉都不出力，看到的是骨頭本身的位置。站、坐（動態位）時才出現的偏差，是某些肌肉在出力撐著。（0:37:35–0:39:38；1:41:19）\n\n### 與既有資料不一致之處\n- **【中】被動也痛＝骨／關節？**：既有資料 「三分法：肌肉、骨頭、還是神經？」 把「主動、被動都會痛」歸在骨頭／韌帶；「肩痛／旋轉肌袖、五十肩」 也寫「關節被動也受限且痛 → 骨／關節問題」。；本堂 老師把五十肩、肱二頭／三頭肌腱炎、肩夾擠等慢性發炎沾黏，也歸為主動、被動都受限且痛。（0:47:17–0:49:22）。不完全矛盾：沾黏屬軟組織，但表現像關節受限。建議在 「三分法：肌肉、骨頭、還是神經？」 加一列「慢性發炎沾黏（五十肩等）：主被動皆痛、休息痛」，避免誤判成骨頭錯位。\n- **【低】脊椎偏移要不要先處理**：既有資料 「脊椎旋轉的轉折點」：用觸摸找出旋轉的轉折點，固定下面一節、轉上面一節，逐節往上調整。；本堂 側彎、逆向旋轉時「先不用管脊椎怎麼偏」，力量都是經過骨盆去扭轉脊椎，要先找下面的主問題。（0:20:43–0:24:54）。多半是處理順序不同，不是方法衝突（先骨盆、後脊椎，和 「有效矯正：先把地基擺正」 一致）。這段錄音辨識很差，待確認。\n- **【低】旋轉肌袖穩定的是誰**：既有資料 「盂肱關節（GH）：動作、肌肉、神經與滑動方向」、「旋轉肌袖撕裂為什麼常在關節旁」：旋轉肌袖穩定的是盂肱關節中的肱骨頭。；本堂 錄音聽起來是「旋轉肌袖代表穩定肩胛骨的肌肉」，後面又說「穩定肱骨、肩胛骨活動的關節」。（0:45:18–0:47:17）。應該是口誤或辨識錯誤，原意多半是穩定肱骨與肩胛之間的盂肱關節。以既有資料為準。\n- **【低】胸鎖關節的自由度**：既有資料 「肩複合體：五個關節、韌帶與鎖骨的滑動」：胸鎖關節是馬鞍狀、3 個自由度。；本堂 錄音聽起來是馬鞍形關節「三個或三個以上」的旋轉方向。（0:39:38–0:41:39）。多半是辨識或口語誤差；以 3 個自由度為準。\n\n### 課堂討論的個案（已去識別化）\n- 課堂舉例：工作時要一直往前遞東西給人的人，肩膀長期往前、鎖骨被往內擠，胸鎖關節突出；處理時先做肱骨外轉（約 1:00:00–1:01:50）。\n- 課堂示範：一位同學坐姿時肩胛向上旋轉，趴下後差異變小，所以推測和下半身（骨盆、下肢）有關，再往下檢查（約 1:41:19–1:43:03）。\n- 同學練習回饋：受試者右側肩胛略高、左側外翻；只處理大腿前側和骨盆第二角度（右側沒有直接處理肩），兩側肩胛就比較平衡，大腿前側原本很粗的組織摸起來明顯變細。因為趴下時角度會變，推測問題在右腳（約 2:31:48–2:33:32）。\n- 一位同學提到受過的傷幾乎都在左側，右肩只有一處舊傷；老師提醒身體不可能完全平衡（約 1:56:39–1:58:21，辨識不清）。\n- 課後問答：學員家人腦部血腫／水腫後短期記憶變差，問可以怎麼做；老師提到下肢內側腎經偏下段，並注意做哪一側（1012-2 約 6:39–10:54，辨識不清，應以醫療為主）。\n- 課後問答：學員家人有白血病，會心悸、背部不適；老師表示推拿無法改變血液疾病，以放鬆、血循順暢、幫助胸廓打開呼吸為主（1012-2 約 10:54–14:37）。\n","tags":["課堂","1012","比對"]}]);

    async run(kind, payload, onStatus) {

      if (!s) { onStatus(FB ? '請先登入才能使用 AI 辨識。' : '這個檢視無法使用 Claude（未登入或未開放），請改用文字輸入。'); return null; }

      if (kind === 'image') {
        if (!Auth._lim || !Auth._lim.images) { onStatus('這個檢視不能傳送圖片給 ' + AI_NAME + '。'); return null; }

        const f = payload[0]; if (f.size > Auth._lim.audio.maxBytes) { onStatus('錄音檔太大（上限約 ' + Math.round(Auth._lim.audio.maxBytes / 1e6) + ' MB），請先剪成較短的片段。'); return null; }

        opts.files = [f];

  //  7. 會員後台（Firebase 版；擁有者與管理員）
  // =====================================================================
  const fmtTime = (t) => { if (!t) return '—'; const d = new Date(t); return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const ROLE_NAME = { owner: '擁有者', admin: '管理員', member: '會員', blocked: '已停用' };
  const Admin = {
    rows: [], loading: false, loaded: false, q: '', sort: 'last', err: '', caseN: {},
    roleOf(uid) { if (BACKEND && uid === BACKEND.ownerUid) return 'owner'; const r = BACKEND.roles(); if ((r.admins || []).includes(uid)) return 'admin'; if ((r.blocked || []).includes(uid)) return 'blocked'; return 'member'; },
    async load() {
      if (!FB || !Auth.isAdmin) { this.render(); return; }
      this.loading = true; this.err = ''; this.render();
      try { this.rows = await BACKEND.listProfiles(); } catch (e) { this.err = '讀取會員資料失敗：' + (e && e.message || e); }
      this.loading = false; this.loaded = true; this.render();
      // 個案數（背景載入）
      Promise.all(this.rows.map(async (p) => { try { this.caseN[p.id] = (await BACKEND.casesOf(p.id)).filter((c) => c.kind === 'case').length; } catch (e) { } })).then(() => this.render());
    },
    async setRole(uid, role) {
      try { await BACKEND.setRole(uid, role); toast('已將權限改為「' + ROLE_NAME[role] + '」'); } catch (e) { toast('變更失敗：' + (e && e.message || e)); }
      this.render();
    },
    render() {
      const root = $('#p-admin'); if (!root) return; clear(root);
      root.ap(h('div', { class: 'sec-h' }, h('h2', null, '會員後台'), h('span', { class: 'muted small' }, this.rows.length ? this.rows.length + ' 位會員' : ''), h('span', { class: 'sp' }),
        FB && Auth.isAdmin ? h('button', { class: 'btn sm', onclick: () => this.load() }, '重新整理') : null));
      if (!FB || !Auth.isAdmin) { root.ap(h('div', { class: 'lock-card' }, h('div', { class: 'lock-ic' }, '鎖'), h('h3', null, '只有管理員可以使用後台'))); return; }
      root.ap(h('p', { class: 'lead' }, '會員用 Google 帳號登入即自動註冊。你可以在這裡看每位會員的基本資料與登入時間、調整權限，並查看他們的投稿與個案。'));
      if (this.err) root.ap(h('div', { class: 'alert' }, this.err));
      if (this.loading && !this.loaded) { root.ap(h('div', { class: 'empty' }, '讀取會員資料…')); return; }
      const now = Date.now(); const week = this.rows.filter((p) => now - (p.lastLogin || 0) < 7 * 864e5).length;
      const subsBy = {}; Subs.all.forEach((u) => (subsBy[u.uid] = Object.values(u.items)));
      const totalCases = Object.values(this.caseN).reduce((a, b) => a + b, 0);
      root.ap(h('div', { class: 'stat-row' },
        [['會員', this.rows.length], ['管理員', this.rows.filter((p) => ['owner', 'admin'].includes(this.roleOf(p.id))).length], ['7 天內登入', week], ['待審核投稿', Subs.pendingCount()], ['個案總數', totalCases]].map(([k, v]) => h('div', { class: 'stat card pad' }, h('div', { class: 'eyebrow' }, k), h('b', null, v)))));
      root.ap(h('div', { class: 'row', style: { margin: '12px 0' } },
        h('input', { class: 'fsearch', style: { flex: '1 1 220px', margin: 0 }, placeholder: '搜尋姓名或 Email…', value: this.q, oninput: (e) => { this.q = e.target.value.trim(); this.drawList(); } }),
        h('label', { class: 'small row', style: { gap: '6px' } }, '排序', h('select', { class: 'inp', onchange: (e) => { this.sort = e.target.value; this.drawList(); } },
          [['last', '最近登入'], ['first', '最早註冊'], ['name', '姓名']].map(([v, t]) => h('option', { value: v, selected: this.sort === v }, t))))));
      this.listEl = h('div', { class: 'mem-list' }); root.ap(this.listEl); this.drawList();
      root.ap(h('p', { class: 'small muted', style: { marginTop: '14px' } }, '權限說明：管理員可直接發佈／修改知識條目、審核投稿、查看所有會員的個案並調整其他會員權限；會員可投稿與使用自己的個案紀錄；已停用的帳號只能瀏覽。擁有者固定為網站建立者，無法被變更。'));
    },
    drawList() {
      const E = clear(this.listEl); const q = this.q.toLowerCase();
      const subsBy = {}; Subs.all.forEach((u) => (subsBy[u.uid] = Object.values(u.items)));
      let rows = this.rows.filter((p) => !q || String(p.name || '').toLowerCase().includes(q) || String(p.email || '').toLowerCase().includes(q));
      rows.sort((a, b) => this.sort === 'name' ? String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant') : this.sort === 'first' ? (a.created || 0) - (b.created || 0) : (b.lastLogin || 0) - (a.lastLogin || 0));
      if (!rows.length) { E.ap(h('div', { class: 'empty' }, this.rows.length ? '沒有符合的會員。' : '還沒有會員登入過。')); return; }
      rows.forEach((p) => {
        const role = this.roleOf(p.id); const subs = subsBy[p.id] || []; const pend = subs.filter((x) => x.status === 'pending').length;
        const sel = h('select', { class: 'inp', 'aria-label': '權限', disabled: role === 'owner' || p.id === Auth.id, onchange: (e) => this.setRole(p.id, e.target.value) },
          (role === 'owner' ? ['owner'] : ['admin', 'member', 'blocked']).map((r) => h('option', { value: r, selected: role === r }, ROLE_NAME[r])));
        E.ap(h('div', { class: 'mem card pad' },
          h('div', { class: 'row', style: { gap: '10px', alignItems: 'center' } },
            p.photo ? h('img', { class: 'mem-av', src: p.photo, alt: '', referrerpolicy: 'no-referrer' }) : h('span', { class: 'mem-av acct-av' }, (p.name || '?').slice(0, 1)),
            h('div', { style: { minWidth: 0, flex: '1 1 160px' } }, h('b', null, p.name || '（未提供姓名）'), p.id === Auth.id ? h('span', { class: 'badge j', style: { marginLeft: '6px' } }, '你') : null, h('div', { class: 'small muted clip' }, p.email || '')),
            h('span', { class: 'badge ' + (role === 'owner' || role === 'admin' ? 'j' : role === 'blocked' ? 't' : '') }, ROLE_NAME[role]), sel),
          h('dl', { class: 'kv mem-kv' },
            h('dt', null, '註冊'), h('dd', null, fmtTime(p.created)),
            h('dt', null, '最後登入'), h('dd', null, fmtTime(p.lastLogin) + (p.lastLogin ? '（' + relDays(p.lastLogin) + '）' : '')),
            h('dt', null, '登入次數'), h('dd', null, p.logins || 0),
            h('dt', null, '投稿'), h('dd', null, subs.length + ' 則' + (pend ? '（待審 ' + pend + '）' : '')),
            h('dt', null, '個案'), h('dd', null, this.caseN[p.id] == null ? '…' : this.caseN[p.id] + ' 位')),
          h('div', { class: 'row', style: { marginTop: '6px' } },
            h('button', { class: 'btn sm', onclick: () => { showTab('cases'); Cases.setScope('all', p.id); } }, '看個案'),
            subs.length ? h('button', { class: 'btn sm', onclick: () => { Subs.showDone = true; KB.openSource('審核佇列'); } }, '看投稿') : null)));
      });
    },
  };
  function relDays(t) { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前'; }

  // =====================================================================
  //  啟動
  // =====================================================================
  function boot() {
    const nav = $('#tabs'); TABS.forEach(([id, n], i) => nav.ap(h('button', { class: 'tab', role: 'tab', 'data-tab': id, 'aria-selected': 'false', onclick: () => showTab(id) }, h('span', { class: 'n' }, '0' + (i + 1)), n, id === 'cases' ? h('span', { class: 'tab-lock', 'aria-hidden': 'true' }, '鎖') : null)));
    Assess.build($('#p-assess')); Chain.build($('#p-chain')); Sim.build($('#p-sim')); V3.build($('#p-v3d')); KB.build($('#p-kb'));
    Notes.listeners.push(() => { KB.renderList(); if (!KB.editing) KB.renderDetail(); Assess.renderRight(); });
    Subs.listeners.push(() => { if (curTab === 'admin' && Admin.loaded) Admin.render(); KB.renderFilters(); if (KB.special() === 'sub') { KB.renderList(); if (!KB.editing) KB.renderDetail(); } Acct.render(); });
    Auth.listeners.push(() => { Acct.render(); KB.refresh(); if (Cases.mode === 'loading' || (Cases.mode === 'db' && Auth.ownWrite === false && !Cases.writeFail)) Cases.init(); else Cases.render(); const t = $('.tab[data-tab="cases"] .tab-lock'); if (t) t.hidden = !!(Auth.id || Auth.dev); const at = $('.tab[data-tab="admin"]'); if (at) at.hidden = !(FB && Auth.isAdmin); if (curTab === 'admin') { if (FB && Auth.isAdmin) Admin.load(); else if (Auth.ready) showTab('assess'); } });
    document.addEventListener('click', () => { if (Acct.open) { Acct.open = false; Acct.render(); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Acct.open) { Acct.open = false; Acct.render(); } });
    const hash = (location.hash || '').slice(1); const start = TABS.some((t) => t[0] === hash) ? hash : store.get('tab', 'assess');
    Acct.render();
    { const at = $('.tab[data-tab="admin"]'); if (at) at.hidden = true; }
    showTab(TABS.some((t) => t[0] === start) ? start : 'assess');
    Auth.init().then(() => { Notes.init(); Subs.init(); Cases.init(); });
  }
  window.APP = { Assess, Chain, Sim, V3, KB, Notes, Subs, Auth, Cases, TX, Admin, showTab };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

</body>
