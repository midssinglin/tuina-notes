<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%222%22 width=%2228%22 height=%2228%22 rx=%225%22 fill=%22none%22 stroke=%22%23bd3d28%22 stroke-width=%223%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23bd3d28%22%3E%E6%95%B4%3C/text%3E%3C/svg%3E">
<title>推拿整復手札</title>
<meta name="description" content="推拿整復課程的評估、連鎖、模擬、3D 與知識庫工具">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>/* 版面概念：診間用的工具書——左側輸入、右側判讀；淡青瓷紙色、墨色字，朱色代表「緊」、靛色代表「被拉長／弱」 */
:root {
  --bg: #eff2ee; --surface: #fafbf8; --surface2: #e5eae4; --ink: #1c2724; --ink2: #475550; --ink3: #74827c; --line: #d2d9d3;
  --jade: #23705d; --jade-soft: #d5e7df; --tight: #bd3d28; --tight-soft: #f5dcd5; --weak: #3254a0; --weak-soft: #dbe3f3;
  --warn: #9b640c; --warn-soft: #f4e6c9; --skin3d: #d2b8a3;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #171f1c; --surface2: #212b27; --ink: #e2e9e5; --ink2: #b0beb8; --ink3: #7f8e88; --line: #2c3833;
    --jade: #5cb79b; --jade-soft: #1c3830; --tight: #ec7660; --tight-soft: #3d221c; --weak: #8aa6ea; --weak-soft: #1c2742;
    --warn: #e2aa4c; --warn-soft: #3a2d16; --skin3d: #9c8574; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #171f1c; --surface2: #212b27; --ink: #e2e9e5; --ink2: #b0beb8; --ink3: #7f8e88; --line: #2c3833;
  --jade: #5cb79b; --jade-soft: #1c3830; --tight: #ec7660; --tight-soft: #3d221c; --weak: #8aa6ea; --weak-soft: #1c2742;
  --warn: #e2aa4c; --warn-soft: #3a2d16; --skin3d: #9c8574; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

/* ---------- 頂欄 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px var(--gut) 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; }
.brand h1 { font-size: 22px; letter-spacing: 0.06em; font-weight: 700; }
.brand .seal { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid var(--tight); color: var(--tight); font-family: var(--f-display); font-size: 13px; border-radius: 4px; transform: translateY(-2px); }
.brand small { color: var(--ink3); font-size: 12px; letter-spacing: 0.04em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 14px 11px; font-size: 15px; color: var(--ink2); border-bottom: 2.5px solid transparent; white-space: nowrap; letter-spacing: 0.04em; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--jade); font-weight: 700; }
.tab .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); margin-right: 5px; }

main { max-width: 1320px; margin: 0 auto; padding: 18px var(--gut) 60px; }
.panel[hidden] { display: none !important; }
.lead { color: var(--ink2); max-width: 70ch; margin: 2px 0 14px; font-size: 14px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 4px; }
.sec-h h2 { font-size: 24px; }

/* ---------- 共用元件 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 14px 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; line-height: 1.35; color: var(--ink); }
button.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--jade-soft); border-color: var(--jade); color: var(--ink); }
.chip .sd { font-family: var(--f-mono); font-size: 11px; background: var(--jade); color: var(--surface); border-radius: 4px; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink3); }
.btn.pri { background: var(--jade); border-color: var(--jade); color: var(--surface); font-weight: 600; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.badge { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.badge.t { background: var(--tight-soft); color: var(--tight); }
.badge.w { background: var(--weak-soft); color: var(--weak); }
.badge.j { background: var(--jade-soft); color: var(--jade); }
.badge.y { background: var(--warn-soft); color: var(--warn); }
.side-b { font-family: var(--f-mono); font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 5px; border: 1px solid currentColor; }
.alert { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); font-size: 14px; }
.alert b { color: var(--warn); }
.muted { color: var(--ink3); }
.small { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sp { flex: 1; }
hr.thin { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.link { background: none; border: 0; padding: 0; color: var(--jade); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.ex-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; }

/* ---------- 評估 ---------- */
.fgroup + .fgroup { margin-top: 14px; }
.fgroup h3 { font-size: 15px; margin-bottom: 7px; display: flex; gap: 8px; align-items: baseline; }
.fgroup h3 .muted { font-family: var(--f-body); font-weight: 400; font-size: 12px; }
.fgroup.red .chip.on { background: var(--warn-soft); border-color: var(--warn); }
.fsearch { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 11px; margin-bottom: 10px; }
.pat { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; }
.pat-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pat-h h4 { font-size: 16.5px; }
.meter { height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; width: 70px; }
.meter i { display: block; height: 100%; background: var(--jade); border-radius: 3px; }
.mlist { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .nm { font-weight: 600; }
.mrow .why { grid-column: 2 / 4; font-size: 13px; color: var(--ink2); }
.rank { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); width: 1.6em; text-align: right; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.res-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.res-h h3 { font-size: 16px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.t { background: var(--tight); } .dot.w { background: var(--weak); } .dot.j { background: var(--jade); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink3); }

/* ---------- 連鎖 ---------- */
.chain-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .chain-wrap { grid-template-columns: minmax(0, 1fr); } }
.chain-svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.chain-svg .body { fill: var(--surface2); stroke: var(--line); }
.chain-svg .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.chain-svg .edge.out { stroke: var(--tight); stroke-width: 2.2; }
.chain-svg .edge.in { stroke: var(--weak); stroke-width: 2.2; stroke-dasharray: 5 4; }
.chain-svg .node circle { fill: var(--surface); stroke: var(--ink3); stroke-width: 1.5; cursor: pointer; }
.chain-svg .node.sel circle { fill: var(--jade); stroke: var(--jade); }
.chain-svg .node.out circle { stroke: var(--tight); stroke-width: 2.5; }
.chain-svg .node.in circle { stroke: var(--weak); stroke-width: 2.5; }
.chain-svg .node text { font-size: 10.5px; fill: var(--ink2); pointer-events: none; font-family: var(--f-body); }
.chain-svg .node.sel text { fill: var(--ink); font-weight: 700; }
.edge-item { padding: 10px 0; border-top: 1px dashed var(--line); }
.edge-item:first-child { border-top: 0; }
.edge-item .to { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid var(--tight); vertical-align: middle; margin-right: 6px; }
.legend i.in { border-top: 2.5px dashed var(--weak); }

/* ---------- 模擬 ---------- */
.sim-wrap { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr) minmax(0, 330px); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .sim-wrap { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); } .sim-res { grid-column: 1 / -1; } }
@media (max-width: 760px) { .sim-wrap { grid-template-columns: minmax(0, 1fr); } }
.ctl { padding: 12px 14px; }
.ctl h3 { font-size: 15px; margin-bottom: 8px; }
.ctl + .ctl { border-top: 1px solid var(--line); }
.slider { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.slider .lab { color: var(--ink2); }
.slider output { font-family: var(--f-mono); font-size: 12px; text-align: right; color: var(--ink2); }
.slider input[type=range] { width: 100%; accent-color: var(--jade); }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin: -2px 3.6em 4px 4.6em; padding-left: 8px; }
.mslider { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; }
.mslider input { width: 100%; accent-color: var(--tight); }
.mslider.head { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); }
.selectbox { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; }
.views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.views figure { margin: 0; }
.views figcaption { font-size: 12px; color: var(--ink3); text-align: center; font-family: var(--f-mono); letter-spacing: 0.06em; }
.pose { width: 100%; height: auto; display: block; }
.pose .bone { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.4; }
.pose .soft { fill: var(--surface2); stroke: none; }
.pose .ln { stroke: var(--ink2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.pose .spine { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.pose .plumb { stroke: var(--jade); stroke-width: 1; stroke-dasharray: 4 4; }
.pose .ref { stroke: var(--ink3); stroke-width: 0.8; stroke-dasharray: 2 3; }
.pose .hot { fill: var(--tight); }
.pose .cool { fill: var(--weak); }
.pose .mk { fill: var(--ink); }
.pose text { font-size: 10px; fill: var(--ink2); font-family: var(--f-body); }
.pose .warn { stroke: var(--tight); stroke-width: 2; fill: none; }
.region-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.region-row:first-child { border-top: 0; }
.sev { display: flex; gap: 3px; margin-top: 4px; }
.sev i { width: 14px; height: 5px; border-radius: 2px; background: var(--surface2); }
.sev i.on { background: var(--tight); }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 13.5px; padding: 3px 0; }
.bar .track { grid-column: 1 / -1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 3px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- 3D ---------- */
.v3-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 14px; height: calc(100vh - 150px); min-height: 520px; }
@media (max-width: 900px) { .v3-wrap { grid-template-columns: minmax(0, 1fr); height: auto; } }
.v3-stage { position: relative; border-radius: var(--r); overflow: hidden; background: radial-gradient(ellipse at 50% 35%, var(--surface) 0%, var(--bg) 75%); border: 1px solid var(--line); min-height: 520px; }
@media (max-width: 900px) { .v3-stage { height: 68vh; } }
.v3-stage canvas { display: block; touch-action: none; }
.v3-tools { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.v3-tools > * { pointer-events: auto; }
.v3-tools .btn { background: color-mix(in srgb, var(--surface) 88%, transparent); }
.v3-tools .btn.on { background: var(--jade-soft); border-color: var(--jade); }
.v3-hint { position: absolute; left: 12px; bottom: 26px; right: 12px; font-size: 12px; color: var(--ink3); pointer-events: none; }
@media (max-width: 600px) { .v3-hint { display: none; } }
.b3-credit { position: absolute; left: 12px; bottom: 8px; font-size: 10.5px; color: var(--ink3); opacity: .85; pointer-events: none; }
.b3-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; color: var(--ink2); }
.b3-ld-t { font-weight: 700; font-size: 15px; }
.b3-ld-s { font-size: 12px; color: var(--ink3); text-align: center; max-width: 80%; }
.b3-ld-bar { width: min(260px, 60%); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.b3-ld-bar i { display: block; height: 100%; width: 0; background: var(--jade); transition: width .2s; }
.v3-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
@media (min-width: 901px) { .v3-side { overflow: hidden; } }
.v3-list { overflow: auto; min-height: 140px; flex: 1; }
@media (max-width: 900px) { .v3-list { max-height: 340px; } }
.v3-list .grp { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink3); padding: 8px 12px 4px; position: sticky; top: 0; background: var(--surface); }
.v3-item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px; font-size: 14px; border-radius: 6px; }
.v3-item:hover { background: var(--surface2); }
.v3-item.on { background: var(--jade-soft); }
.v3-item .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.v3-item .en { color: var(--ink3); font-size: 12px; margin-left: auto; font-family: var(--f-mono); }
.v3-info { max-height: 46vh; overflow: auto; }
@media (max-width: 900px) { .v3-info { max-height: none; } }
.v3-info h3 { font-size: 19px; }
.kv { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 4px 10px; font-size: 13.5px; margin-top: 8px; }
.kv dt { color: var(--ink3); }
.kv dd { margin: 0; }
.b3-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.b3-label { position: absolute; left: 0; top: 0; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; white-space: nowrap; margin: -24px 0 0 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.b3-label.pt { border-color: var(--jade); }
.b3-label.mu { border-color: var(--tight); }
.tension-key { display: flex; gap: 12px; font-size: 12px; color: var(--ink2); align-items: center; }

/* ---------- 知識庫 ---------- */
.kb-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.kb-search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-size: 16px; }
.kb-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.kb-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
@media (max-width: 900px) { .kb-layout { grid-template-columns: minmax(0, 1fr); } }
.kb-list { display: flex; flex-direction: column; gap: 8px; }
.kb-item { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; }
.kb-item:hover { border-color: var(--ink3); }
.kb-item.on { border-color: var(--jade); box-shadow: inset 3px 0 0 var(--jade); }
.kb-item h4 { font-size: 15.5px; font-family: var(--f-body); font-weight: 700; }
.kb-item p { margin: 3px 0 0; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kb-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.kb-detail { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; }
@media (max-width: 900px) { .kb-detail { position: static; max-height: none; } }
.kb-detail h3 { font-size: 21px; margin: 4px 0 8px; }
.prose { font-size: 15px; max-width: 68ch; }
.prose p { margin: 0 0 10px; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 1.3em; }
.prose li { margin: 2px 0; }
.prose strong { color: var(--ink); }
.prose .ref { display: inline; }
.prose table { border-collapse: collapse; font-size: 13.5px; margin: 6px 0 12px; }
.prose td, .prose th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.tblwrap { overflow-x: auto; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.form { display: grid; gap: 10px; }
.form label { font-size: 13px; color: var(--ink2); display: grid; gap: 4px; }
.form input, .form textarea, .form select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
.form textarea { min-height: 150px; resize: vertical; line-height: 1.55; }
.pick { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); }
.pick input { border: 0 !important; padding: 2px 4px !important; }
.pick-res { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; max-height: 120px; overflow: auto; }

<script>/* ===== Firebase 後端（GitHub Pages 版）=====
 * 在這個版本裡，用 Firebase Auth（Google 登入）+ Firestore + Firebase AI Logic（Gemini）
 * 提供與 claude.ai 執行環境相同的 window.claude.use('db' | 'user' | 'sample') 介面，
 * 主程式 app.js 不需要知道自己跑在哪裡。另外提供 window.TN_BACKEND 給登入、後台使用。
 */
(function () {
  'use strict';
  const C = window.TN_FB; if (!C) return;
  const B = 'https://www.gstatic.com/firebasejs/' + (C.sdk || '12.19.0') + '/';
  let fb = null;

  const boot = (async () => {
    const [A, Au, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const app = A.initializeApp(C.config);
    const auth = Au.getAuth(app);
    const db = F.initializeFirestore(app, { ignoreUndefinedProperties: true });
    const user = await new Promise((res) => { const un = Au.onAuthStateChanged(auth, (u) => { un(); res(u); }); });
    const roles = { admins: [], blocked: [] };
    try { const r = await F.getDoc(F.doc(db, 'config/roles')); if (r.exists()) Object.assign(roles, r.data()); } catch (e) { }
    if (user) {
      // 會員資料：第一次登入即註冊；之後每次載入更新最後登入時間
      try {
        const ref = F.doc(db, 'profiles/' + user.uid); const cur = await F.getDoc(ref);
        const base = { name: user.displayName || '', email: user.email || '', photo: user.photoURL || '', lastLogin: Date.now() };
        if (!cur.exists()) await F.setDoc(ref, Object.assign(base, { created: Date.now(), logins: 1 }));
        else {
          const last = cur.data().lastLogin || 0;
          // 30 分鐘內重新整理不算新的一次登入
          await F.setDoc(ref, Object.assign(base, Date.now() - last > 30 * 60e3 ? { logins: F.increment(1) } : {}), { merge: true });
        }
      } catch (e) { console.warn('profile', e); }
    }
    fb = { A, Au, F, app, auth, db, user, roles };
    return fb;
  })().catch((e) => { console.error('Firebase 初始化失敗', e); return null; });

  // ---------- Firestore → claude db 介面 ----------
  const CODE = { 'permission-denied': 'invalid_argument', unauthenticated: 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', unavailable: 'unavailable' };
  const err = (e) => { const o = new Error((e && e.message) || 'error'); o.code = CODE[e && e.code] || 'unavailable'; return o; };
  const wrapDoc = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  function docRef(path) {
    const { F, db } = fb; const r = F.doc(db, path);
    return {
      id: r.id, path,
      async get() { try { return wrapDoc(await F.getDoc(r)); } catch (e) { throw err(e); } },
      async set(b) { try { await F.setDoc(r, b); } catch (e) { throw err(e); } },
      async update(b) { try { await F.updateDoc(r, b); } catch (e) { throw err(e); } },
      async delete() { try { await F.deleteDoc(r); } catch (e) { throw err(e); } },
      onSnapshot(cb, ecb) { return F.onSnapshot(r, (s) => cb(wrapDoc(s)), (e) => ecb && ecb(err(e))); },
      collection(c) { return colRef(path + '/' + c); },
    };
  }
  function colRef(path) {
    const { F, db } = fb; const c = F.collection(db, path);
    return {
      path,
      doc(id) { return docRef(path + '/' + (id || F.doc(c).id)); },
      async add(b) { try { const r = await F.addDoc(c, b); return docRef(path + '/' + r.id); } catch (e) { throw err(e); } },
      async get() { try { const s = await F.getDocs(c); return { docs: s.docs.map(wrapDoc), size: s.size }; } catch (e) { throw err(e); } },
      onSnapshot(cb, ecb) { return F.onSnapshot(c, (s) => cb({ docs: s.docs.map(wrapDoc), size: s.size }), (e) => ecb && ecb(err(e))); },
    };
  }
  const dbNS = { doc: (p) => docRef(p), collection: (p) => colRef(p) };

  // ---------- 身分 ----------
  const uid = () => (fb && fb.user ? fb.user.uid : null);
  const isOwner = () => !!(uid() && C.ownerUid && uid() === C.ownerUid);
  const isAdmin = () => isOwner() || !!(uid() && (fb.roles.admins || []).includes(uid()));
  const userNS = {
    async me() { const u = fb.user; return { id: uid(), name: (u && u.displayName) || '', avatarUrl: (u && u.photoURL) || '', color: '#23705d', email: (u && u.email) || null, isOwner: isOwner(), canEdit: isAdmin(), blocked: !!(uid() && (fb.roles.blocked || []).includes(uid())) }; },
    async id() { return uid(); }, async isOwner() { return isOwner(); }, async canEdit() { return isAdmin(); }, async can() { return null; },
    async profiles(ids) {
      const out = {};
      await Promise.all(ids.map(async (i) => { try { const s = await fb.F.getDoc(fb.F.doc(fb.db, 'profiles/' + i)); out[i] = { id: i, name: s.exists() ? (s.data().name || s.data().email || '') : '' }; } catch (e) { out[i] = { id: i, name: '' }; } }));
      return out;
    },
  };

  // ---------- AI（Firebase AI Logic → Gemini）----------
  let sampleP = null;
  function sampleNS() {
    if (sampleP) return sampleP;
    sampleP = (async () => {
      if (C.recaptchaKey) {
        // App Check（reCAPTCHA v3）：只在管理員使用 AI 時才載入
        const AC = await import(B + 'firebase-app-check.js');
        AC.initializeAppCheck(fb.app, { provider: new AC.ReCaptchaV3Provider(C.recaptchaKey), isTokenAutoRefreshEnabled: true });
      }
      const AI = await import(B + 'firebase-ai.js');
      const ai = AI.getAI(fb.app, { backend: new AI.GoogleAIBackend() });
      const models = [].concat(C.models || ['gemini-2.5-flash']);
      const toPart = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res({ inlineData: { data: String(fr.result).split(',')[1], mimeType: blob.type || 'application/octet-stream' } }); fr.onerror = rej; fr.readAsDataURL(blob); });
      let mi = 0;
      const run = async (prompt, opts, json) => {
        const files = Array.from((opts && (opts.images || opts.files)) || []);
        const parts = [{ text: String(prompt) }].concat(await Promise.all(files.map(toPart)));
        for (;;) {
          const model = AI.getGenerativeModel(ai, { model: models[mi], generationConfig: json ? { responseMimeType: 'application/json' } : {} });
          try { const r = await model.generateContent(parts); return r.response.text(); }
          catch (e) {
            const m = String((e && e.message) || e);
            if (/not found|404|is not supported|unknown model/i.test(m) && mi < models.length - 1) { mi++; continue; }
            const o = new Error(m); o.code = /quota|429|exhaust|rate/i.test(m) ? 'rate_limited' : /403|permission|not been used|disabled|API key|not enabled/i.test(m) ? 'not_granted' : /image|mime|unsupported/i.test(m) ? 'image_rejected' : 'unavailable';
            console.warn('AI', m); throw o;
          }
        }
      };
      const s = async (p, o) => ({ text: await run(p, o, false), truncated: false });
      s.json = async (p, o) => { const t = await run(p, o, true); return JSON.parse(String(t).replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '')); };
      s.limits = async () => ({ inputBytes: 1e6, images: { maxCount: 4, maxBytes: 7e6, mediaTypes: ['image/jpeg', 'image/png', 'image/webp'] }, audio: { maxBytes: 15e6 } });
      return s;
    })().catch((e) => { console.warn('AI 模組載入失敗', e); return null; });
    return sampleP;
  }

  window.claude = {
    async use(name) {
      const f = await boot; if (!f) return null;
      if (name === 'db') return dbNS;
      if (name === 'user') return userNS;
      if (name === 'sample') return f.user && isAdmin() ? sampleNS() : null; // AI 只開放管理員
      return null;
    },
  };

  // ---------- 登入、後台 ----------
  window.TN_BACKEND = {
    kind: 'firebase', ready: boot, ownerUid: C.ownerUid || '',
    async signIn() { const f = await boot; const p = new f.Au.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await f.Au.signInWithPopup(f.auth, p); location.reload(); },
    async signOut() { const f = await boot; await f.Au.signOut(f.auth); location.reload(); },
    roles() { return fb ? fb.roles : { admins: [], blocked: [] }; },
    async listProfiles() { const f = await boot; const s = await f.F.getDocs(f.F.collection(f.db, 'profiles')); return s.docs.map((d) => Object.assign({ id: d.id }, d.data())); },
    async casesOf(u) { const f = await boot; const s = await f.F.getDocs(f.F.collection(f.db, 'data/users/' + u)); return s.docs.map((d) => Object.assign({ id: d.id }, d.data())); },
    async setRole(u, role) {
      const f = await boot; const r = f.roles; const rm = (k) => (r[k] = (r[k] || []).filter((x) => x !== u));
      rm('admins'); rm('blocked'); if (role === 'admin') r.admins.push(u); if (role === 'blocked') r.blocked.push(u);
      await f.F.setDoc(f.F.doc(f.db, 'config/roles'), { admins: r.admins, blocked: r.blocked, updated: Date.now(), by: uid() });
    },
  };
})();
</script>
<script>/* ===== 3D 動作示範：動作庫 =====
   pose(t, J, R) 回傳「左側」各骨骼群組的變換（右側由引擎鏡像）。t：0→1。

- 骨折：輕壓斷裂線，痛會「鑽進去」，輕敲也痛；分開放性、閉鎖性、粉碎性（像蘋果摔在地上外表沒破但裡面碎了）。` },
  { id: 'k-posture-injury', cat: '評估', src: '課堂 0921', title: '姿態性 vs 損傷性', tags: ['外傷', '姿勢', '判斷'],
    body: `面對同一個症狀（例如腰椎間盤突出、頸部痛），先分類：
- **姿態性**：長期姿勢造成肌肉長期收縮 → 拉動骨頭錯位 → 局部血液循環與供養變差、神經血管受擠壓 → 症狀。身體的歪是「合理的代償」，可以一路從腳、膝、骨盆、脊椎找出平衡鏈。
- **損傷性**：撞擊、跌倒後，肌肉為了保護骨頭瞬間攣縮；會有明顯的角度受限，常有一條肌肉「假死」沒有作用。歪的方向不一定合乎全身代償邏輯。
- 先做局部逐一檢查，判斷屬哪一類，再決定先整體平衡還是先處理局部損傷。` },
  { id: 'k-order', cat: '原則', src: '課堂 0810、0817', title: '處理順序：差最多的先做、最緊的先做', tags: ['順序', '三個角度', '重新評估'],
    body: `- 骨盆三個角度**不是按順序做**，先量哪一個角度差最多，就先處理那個角度。
- 每個角度裡面，**先做最緊的那條肌肉**。
- 做完立刻重新量：處理一個角度後，其他角度常會跟著改變（例如第三角度處理完可能變成第二角度的問題）。
- 單純 A、單純 P、兩邊一樣 EX 都不會痛；混合、不對稱才會痛。
- 臨床上很多問題不是兩三次就能解決，選你最有把握的角度先做。` },
  { id: 'k-effective', cat: '原則', src: '課堂 0921', title: '有效矯正：先把地基擺正', tags: ['地基', '頸椎', '矯正'], regions: ['foot', 'pelvis', 'cspine'],
    body: `老師的比喻：脊椎是蓋在地基上的房子。
- 先讓支撐點（腳、踝、膝、骨盆）站在正確的位置，再去矯正頸椎，才叫「有效矯正」；地基歪，上面調好也會被拉回去。
- 為什麼有時先處理腳底？腳底是力量傳導最後落地的地方，承擔全身所有的歪；只調上面、腳底不能配合，力量又會傳回去。
- 側彎加上旋轉時，壓力常集中在 L4（第四腰椎），容易造成椎間盤問題與坐骨神經症狀。` },
  { id: 'k-contract', cat: '原則', src: '課堂 0907', title: '起點、止點；向心與離心收縮', tags: ['起止點', '近端', '遠端'],
    body: `- 靠近身體中心的一端叫**近端**（肌肉的**起點**），遠離的一端叫**遠端**（**止點**）。骨頭也分近端、遠端（例如股骨近端、股骨遠端）。
- **向心收縮**：起點不動、止點往起點靠近（例如仰臥起坐把上身捲起）。
- **離心收縮**：肌肉一邊用力一邊被拉長（擋住重量慢慢放下）。
- 知道起止點，才知道肌肉緊的時候會把骨頭往哪裡拉。` },

  // ================= 評估 =================
  { id: 'k-look', cat: '評估', src: '課堂 0727-2', title: '望診：站姿與俯臥的外觀', tags: ['望診', '觸診', '臀翹', '長短腳'], regions: ['pelvis'],
    body: `**站姿**
- 骨盆前傾（A）：臀部翹、腰椎前凸增加。
- 骨盆後傾（P）：臀部扁平、腰椎變平。
- 很多長輩背駝、O 型腿、臀平——不只是老化，是長期姿勢與肌肉造成。
**俯臥**
- 觀察兩側足跟高低：足跟高的那側，代表那側的跟骨被帶高（除非跟骨本身斷過）。
- 看臀部最高點、腰窩深淺是否對稱。
望診看外觀明顯的變化，觸診（摸骨性標誌）確認。` },
  { id: 'k-sacrum-check', cat: '薦椎', src: '課堂筆記（薦椎）', title: '薦椎檢查三步驟', tags: ['薦椎', '俯臥', '內旋', '外旋', '長短腳'], muscles: ['piriformis', 'multifidus'], points: ['BL31', 'BL32'], regions: ['sacrum'],
    body: `1. **俯臥托腿**：客人趴著，把腿托起，脊椎被撐起、肌肉放鬆，就能看到最真實的薦椎狀況。
2. **上半身放下、把小腿頂起成屈膝**：看兩側跟骨是否一樣高（薦椎歪了就會長短腳）。
3. **把小腿抬起做內旋、外旋（往旁邊打開）**：較打不開的那一側，可能是
   - ① 薦髂關節卡住
   - ② 髖關節卡住
   - ③ 髖關節附近肌肉緊繃
很多時候是骨盆（無名骨）先歪，薦椎卡在中間跟著歪；薦椎是腰椎的底座，薦椎卡住會影響腰椎旋轉。` },
  { id: 'k-troch', cat: '評估', src: '課堂 0810', title: '大轉子觸診：厚、薄判斷 EX／IN', tags: ['大轉子', '觸診', '第二角度', 'EX', 'IN'], muscles: ['piriformis', 'tfl_itb', 'glute_med'], regions: ['hip', 'pelvis'],
    body: `客人側臥或俯臥、自然放鬆，從大轉子旁邊往上摸到骨頭的最高點，順著骨頭輪廓上下、左右感覺它的「厚度」。
- 手要先放鬆再摸，手指張開輕輕進去，確實上下都摸到骨頭才算數；可以閉眼感覺。
- **EX（外轉）側：大轉子摸起來比較厚**（大轉子的寬面轉向你）。
- **IN（內轉）側：摸起來比較薄、尖**。
- 兩側比較，不要只摸一邊。
- 搭配俯臥屈膝 90° 看足跟：EX 側足跟偏外。` },
  { id: 'k-heel90', cat: '評估', src: '課堂 0810', title: '俯臥屈膝 90°：足跟方向', tags: ['足跟', '外轉', '內轉', '俯臥'], regions: ['hip'],
    body: `客人俯臥，膝彎曲 90°、腳背屈。
- 骨盆 EX（外轉）時腿較外轉，小腿會往外倒，**足跟偏向外**（筆記：俯臥膝背屈 90° 時較外轉）。
- 同時看足跟離臀部的距離：**較近的一側多為第一角度 A**（筆記）。
- 也要比較兩側：哪一邊比較外、比較內。
- 配合大轉子厚薄、薦結節韌帶的緊度（EX 側較緊、滑動性差）一起判斷。` },
  { id: 'k-slr', cat: '評估', src: '課堂 0810', title: '直腿抬高：真假坐骨神經痛', tags: ['坐骨神經', '梨狀肌', 'SLR', '鑑別'], muscles: ['piriformis', 'hamstrings'], points: ['GB30', 'BL54'], regions: ['hip', 'lspine'],
    body: `客人仰臥，你把他的腿伸直慢慢抬高：
- **45° 之後開始痛、60–70° 之間最痛、超過 70° 反而不痛** → 強烈懷疑**梨狀肌症候群（假性坐骨神經痛）**。
- 很低的角度就有放射痛到小腿、腳，或伴隨麻木無力 → 較像神經根問題，建議轉介。（補充：一般臨床鑑別）
**坐骨神經**：由 L4、L5、S1–S3 合成，從臀部梨狀肌下方（少數穿過肌腹）出來，沿大腿後側下行，到膕窩分成脛神經與腓總神經。
股骨外轉、骨盆 EX 時梨狀肌被拉緊，擠壓坐骨神經；股骨內轉時內收、內轉肌群一起用力，梨狀肌被拉長。` },
  { id: 'k-knee-order', cat: '膝', src: '課堂 0907', title: '膝痛的追查順序：1 上、2 下、3 局部', tags: ['膝', '順序', '受害者'], regions: ['knee', 'hip', 'ankle', 'pelvis'],
    body: `1. **先看上面**：股骨與骨盆（骨盆三個角度、股骨內外轉）。
2. **再看下面**：脛骨、距骨、踝關節、足弓。
3. 前兩者都沒問題，才處理**膝關節本身**（半月板、韌帶、肌肉）。
- 1 有問題就先處理 1，2 有問題就處理 2，處理完再回頭看 3 剩下什麼。
- 膝是受害者：踝扭傷後角度不夠，或股骨被骨盆帶著轉，膝都會被扭。` },

  // ================= 骨盆 =================
  { id: 'k-pelvis-anat', cat: '骨盆', src: '課堂 0727-2', title: '骨盆組成與重量傳遞', tags: ['無名骨', '髂骨', '坐骨', '恥骨', '耳狀面', '重量'], regions: ['pelvis', 'sacrum', 'pubis', 'foot'],
    body: `- **無名骨（髖骨）**由髂骨、坐骨、恥骨三塊組成，幼兒時是分開的，成長後癒合成一塊。薦椎五節在小時候也是分開的，之後癒合。
- 薦椎兩側有**耳狀面**，與髂骨構成**薦髂關節**；前方左右恥骨以**恥骨聯合**相連（軟骨連結）。
- **重量路徑**：脊椎 → 薦椎 → 耳狀面（薦髂關節）→ 髂骨 → 髖臼 → 股骨 → 脛骨 → 足弓。站立時重量把薦椎往下壓，骨盆把它「扣住」；足弓的彈性像避震器把力量分散。
- 身體的角度改變，重量壓下來的角度就跟著改變，所以要觀察客人工作與日常的姿態。` },
  { id: 'k-angle1', cat: '骨盆', src: '課堂 0727-2、0810、0907', title: '骨盆第一角度：A（前傾）與 P（後傾）', tags: ['第一角度', 'A', 'P', '前傾', '後傾', 'S2'], muscles: ['iliopsoas', 'rectus_fem', 'erector', 'hamstrings', 'glute_max', 'rectus_abd'], regions: ['pelvis', 'lspine'],
    body: `無名骨繞著 S2 的橫軸往前或往後轉。
- **A（Anterior，前傾）**：髂後上棘較 S2 高、坐骨結節較高；臀翹、腰椎前凸增加，L5 下關節突被頂出去、小面關節受壓；俯臥屈膝時足跟離臀部較近；**A 側為長腳**（筆記）。
- **P（Posterior，後傾）**：髂後上棘變低；臀平、腰椎變平；**P 側為短腿**（筆記）。
- 筆記的相關肌：**A＝附著在髂骨的股直肌（＊重點）及股四頭（股中間、股外側、股內側）、髂肌、腰大肌；P＝附著在坐骨結節的半腱肌、半膜肌、股二頭肌長頭（短頭）**。
- P 的外觀（筆記）：臀部下垂、坐骨較低、短腿；髂後上棘較低；俯臥屈膝時足跟離臀部較遠。
- 臨床上**兩側通常不一樣**：常見一邊 A、一邊 P（因為中間有薦椎，不會兩邊同步）。
**A 的主角肌肉**：[[m:rectus_fem]]（股四頭肌中唯一跨過髖關節、起於髂前下棘的一條）與 [[m:iliopsoas]]（腰大肌從腰椎繞過髖臼前方止於小轉子）；內收肌等是協同肌。
**P 的主角**：[[m:hamstrings]]、[[m:glute_max]]、[[m:rectus_abd]]。
腰椎前凸過大時，前面的拉力（腰大肌等）太大，不要只推後面的腰。` },
  { id: 'k-angle2', cat: '骨盆', src: '課堂 0810、0817、筆記', title: '骨盆第二角度：EX（外轉）與 IN（內轉）', tags: ['第二角度', 'EX', 'IN', '旋轉', '臀後六肌', '外轉', '內轉'], muscles: ['glute_med', 'glute_min', 'tfl_itb', 'deep_rot', 'piriformis'], points: ['GB29', 'GB30'], regions: ['pelvis', 'hip', 'lspine'],
    body: `俯臥時以 S2 為中線，看髂後上棘：**同一條水平線上（高低不變），只是離 S2 遠或近**。
- **EX（外轉）**：遠離 S2（筆記：「圓、垂直」）；俯臥屈膝 90° 時腿較外轉、**大轉子較厚**。
- **IN（內轉）**：靠近 S2；大轉子較薄、尖。
- 第二角度會造成**脊椎逆向旋轉**（筆記）。
**肌肉（筆記）**
- **② EX**：[[m:glute_med]]、[[m:glute_min]]、[[m:tfl_itb]]。
- **② IN**：**臀後六肌**＝[[m:piriformis]]、閉孔內肌、閉孔外肌、上孖肌、下孖肌、股方肌（見 [[m:deep_rot]]）。
做法：找到最緊的那條，順著肌肉方向垂直下壓；做完重新量 EX/IN。
課堂提醒：第二角度與第三角度的 EX 肌肉相同，**做法不同**。` },
  { id: 'k-angle3', cat: '骨盆', src: '課堂 0817、筆記', title: '骨盆第三角度：耳狀面外展（EX）與內收（IN）', tags: ['第三角度', '耳狀面', '外展', '內收', '短腿', '側彎', '鼠蹊痛', '恥骨'], muscles: ['glute_med', 'glute_min', 'tfl_itb', 'adductors', 'ql'], points: ['GB29', 'LR10', 'KI11'], regions: ['pelvis', 'lspine', 'pubis', 'knee'],
    body: `第三角度是**骨盆沿耳狀面的外展（EX）與內收（IN）**。耳狀面是斜的（稍微斜斜向上），所以無名骨沿著它移動時，會同時帶出第一角度與第二角度的成分：
- **③ EX（外展）**：髂後上棘離 S2「**又高又遠**」＝第一角度 **A**（高）＋第二角度 **EX**（遠）。
- **③ IN（內收）**：髂後上棘「**又低又近**」＝第一角度 **P**（低）＋第二角度 **IN**（近）。
- 第三角度造成**腰椎直接側彎**（沒有旋轉；筆記：脊椎向同側側彎）；常伴**鼠蹊痛**、恥骨聯合高低。
- 筆記：**P＋EX 時髂腰韌帶被拉長**。
- 課堂：③ EX 斜向上時，股骨不動等於把腳往上帶 → **短腿**。要知道「為什麼短」再處理，不要直接拉腿。
**肌肉（筆記）**
- **③ EX**：[[m:glute_med]]、[[m:glute_min]]、[[m:tfl_itb]]（與 ② EX 相同，做法不同）。
- **③ IN**：[[m:adductors]]——內收大肌、內收長肌、內收短肌、恥骨肌、股薄肌。
**三個角度對照**
|角度|動作|髂後上棘（相對 S2）|脊椎|相關肌（筆記）|
|---|---|---|---|---|
|第一|A 前傾／P 後傾（繞 S2）|A 較高、P 較低|前凸／變平|A：腰大肌、股直肌；P：半腱（半膜）肌、股二頭長頭|
|第二|EX 外轉／IN 內轉|同高，EX 遠、IN 近|旋轉|EX：臀中、臀小、闊筋膜張肌；IN：臀後六肌|
|第三|EX 外展／IN 內收（沿耳狀面）|EX 又高又遠（A＋EX）；IN 又低又近（P＋IN）|側彎（無旋轉）|EX：臀中、臀小、闊筋膜張肌；IN：內收大長短肌、恥骨肌、股薄肌|
處理順序不是 1→2→3，而是**先看哪一個角度差最多**，處理完再重新量，其他角度常會跟著改變。` },
  { id: 'k-pregnancy', cat: '骨盆', src: '課堂 0727-2、0914', title: '懷孕、產後與骨盆', tags: ['懷孕', '鬆弛素', '恥骨聯合', '婦科'], regions: ['pelvis', 'pubis', 'sacrum'],
    body: `- 懷孕初期起母體會分泌**鬆弛素（課堂稱催產激素）**，韌帶變鬆，讓骨盆在生產時能撐開。
- 如果一邊肌肉比較緊，撐開時緊的一邊拉不開、鬆的一邊被拉開 → 骨盆歪、恥骨聯合痛、坐骨神經被壓。
- 產後韌帶仍鬆，骨盆容易維持在歪斜的位置。
- 老師的經驗談（0914）：子宮透過子宮薦骨韌帶連到薦椎，骨盆、薦椎歪斜時周邊循環可能受影響，與經痛等婦科不適有關聯。此為臨床經驗觀點，婦科問題仍應就醫。
- 補充：孕期避免重按 [[p:LI4]]、[[p:SP6]]、[[p:GB21]]、[[p:BL60]]、[[p:BL67]] 與腹部、腰薦部。` },
  { id: 'k-transitional', cat: '脊椎', src: '課堂 0727-2', title: '移行椎：腰椎薦椎化、薦椎腰椎化', tags: ['L5', 'S1', '腰椎數目'],
    body: `- 一般腰椎 5 節、薦椎 5 節癒合成一塊。
- **腰椎薦椎化**：L5 與薦椎癒合 → 看起來只有 4 節腰椎。
- **薦椎腰椎化**：S1 沒有癒合 → 看起來有 6 節腰椎。
- 臨床上真的會遇到，數節段、找 L4、L5 時要注意（以兩側髂嵴最高點連線約平 L4 作參考）。` },
  { id: 'k-hipligs', cat: '骨盆', src: '課堂 0817-2', title: '髖關節的三條韌帶', tags: ['髖關節', '韌帶', 'Y 韌帶'], regions: ['hip'],
    body: `穩定髖關節（股骨頭與髖臼）的三條主要韌帶：
- **髂股韌帶**（Y 字形韌帶，人體最強韌的韌帶之一，限制過度伸髖）
- **坐股韌帶**
- **恥股韌帶**
處理髖關節時，韌帶與肌肉要一起考慮；韌帶被長期拉長或縮短，股骨的位置與轉動就會改變。` },
  { id: 'k-hip-rot', cat: '骨盆', src: '課堂 0810、筆記', title: '臀部深層肌群：外轉肌與內轉肌', tags: ['臀後六肌', '外轉', '內轉', '梨狀肌', '坐骨神經'], muscles: ['piriformis', 'deep_rot', 'glute_med', 'glute_min', 'tfl_itb', 'glute_max'], points: ['GB30', 'GB29'],
    body: `- **臀後六肌（深層外轉肌）**：[[m:piriformis]]、上孖肌、閉孔內肌、下孖肌、閉孔外肌、股方肌（[[m:deep_rot]]）。位在股骨旋轉軸後方，對股骨是**外轉**肌。
- **內轉肌**：[[m:glute_med]]前束、[[m:glute_min]]、[[m:tfl_itb]]，位在旋轉軸前方。
- 注意：課堂筆記以**骨盆**的角度命名——② 骨盆 EX 處理臀中、臀小、闊筋膜張肌；② 骨盆 IN 處理臀後六肌（見第二角度）。肌肉對股骨的作用與對骨盆的影響方向不同，不要混在一起記。
- [[m:glute_max]] 最外層，把整個臀部包起來，負責伸髖、外旋等多種動作。
- 坐骨神經從梨狀肌下方穿出；觸摸時從大轉子出發、手指張開輕輕撥開找。
- 拉筋（伸展）也會動到這些深層肌肉。` },

  // ================= 薦椎 =================
  { id: 'k-sac-axes', cat: '薦椎', src: '課堂筆記（薦椎）', title: '薦椎的三條橫軸：S1、S2、S3', tags: ['軸', '重心', 'PSIS', '呼吸軸', '斜軸'], regions: ['sacrum'], points: ['BL28'],
    body: `**薦椎三大橫軸（上、中、下）**
- **S1：呼吸軸**——呼吸帶動薦椎的軸心。點頭與反點頭由 S1 推動。
- **S2：薦椎本身的旋轉軸**——人體的重心所在。摸到**髂後上棘（PSIS）就是 S2 的高度**；站立時假想的鉛垂線通過 S2。真正的點頭、反點頭發生在 S2。
- **S3：斜軸**——無名骨旋轉時，與薦椎形成的旋轉軸；走路時骨盆沿此軸旋轉（前提是骨盆是正的）。` },
  { id: 'k-sac-nut', cat: '薦椎', src: '課堂筆記（薦椎）', title: '點頭、反點頭與呼吸波', tags: ['Nutation', 'Counternutation', '呼吸', '橫膈'], muscles: ['diaphragm'], regions: ['sacrum', 'diaphragm'],
    body: `- **點頭（Nutation）**：薦椎上端（薦岬）往前下。
- **反點頭（Counternutation）**：薦椎上端往後。
**呼吸波（Breathing wave）**
- 吸氣時橫膈膜下降，底下形成正壓空間；重心往下走，兩個坐骨相對靠近，薦椎微微向後（上面薦岬往後），骨盆下口變大，讓橫膈有空間下來。
- 吐氣時相反。
- 所以：**吸氣 → 薦椎反點頭；吐氣 → 薦椎點頭**（由 S1 推動）。
整復時配合呼吸可以更省力（見手法篇）。` },
  { id: 'k-sac-torsion', cat: '薦椎', src: '課堂筆記（薦椎）', title: '薦椎扭轉：Right on Right 的命名與自然擺動', tags: ['扭轉', 'R on R', 'L on L', '斜軸', '走路'], regions: ['sacrum', 'pelvis', 'lspine'],
    body: `**扭轉分兩類**：向前扭轉、向後（反）扭轉。
**自然擺動**：走路時下肢的力量往上傳到無名骨，再傳到薦椎。腳踩住的地方就會「踩住」那條斜軸：
- 假設右腳是支撐腳 → 踩住右斜軸；左腳往前跨（骨盆由後轉到前），薦椎沿著斜軸向前轉——這是向前的動作。
**命名方式**：「沿著右斜軸向右轉」＝ **Right on Right**（旋轉方向 on 斜軸）。
- 所以自然擺動是 **Right on Right、Left on Left**。
- 步伐異常、慣性時，可能卡在 Right on Right 彈不回來 → 骨盆阻滯（Block，骨盆卡住）。
筆記另記：Right on Right、Right on Left 觸診都可見「左上凹、右上凸」的表現，需配合其他檢查區分。` },
  { id: 'k-sac-10', cat: '薦椎', src: '課堂筆記（薦椎）', title: '非自然扭轉、單邊扭轉與薦椎的 10 種卡法', tags: ['翹腳', '半躺', '單邊', '10 種'], regions: ['sacrum'], muscles: ['piriformis', 'multifidus', 'ql'],
    body: `**非自然擺動**：翹腳、蹺二郎腿、半躺、坐姿不良（股骨後翻）等，會拉扯薦椎**向後扭轉**——這不是人體自然的動作。會有兩種：**Left on Right、Right on Left**（沿斜軸向後扭轉）。
**單邊扭轉**：做伸展或某些運動的需求造成肌肉失衡，整個無名骨是被拉扯的，不是沿著斜軸，所以可能是單邊：單邊向前點頭、單邊向後反點頭。
**薦椎卡住的 10 種變化**
- 向前點頭（彈不回來）
- 向後反點頭
- Right on Right
- Left on Left
- Right on Left
- Left on Right
- 右邊單邊向前點頭
- 右邊單邊向後反點頭
- 左邊單邊向前點頭
- 左邊單邊向後反點頭
可在「模擬」頁選擇這些狀態，看對骨盆與腰椎的影響。` },
  { id: 'k-si-joint', cat: '薦椎', src: '課堂筆記（薦椎）', title: '薦髂關節：一半滑液、一半纖維', tags: ['薦髂關節', '演化', '韌帶'], regions: ['sacrum', 'pelvis'],
    body: `- 四足動物時期重心在前，薦髂關節比較偏滑液關節的設計（可以動）。
- 人直立之後，為了承受體重，薦髂關節變成**部分纖維、部分滑液**：前下部是滑液關節，後上部是纖維（韌帶）連結。
- 所以它能動的角度很小，但會卡；卡住時周圍韌帶與 [[m:piriformis]]、[[m:multifidus]] 常一起緊。` },
  { id: 'k-sac-base', cat: '薦椎', src: '課堂 0727-2', title: '薦椎是腰椎的底座', tags: ['L5', '側彎', '小面關節'], regions: ['sacrum', 'lspine'],
    body: `- 第五腰椎的下關節突坐在薦椎上方兩個凹槽（上關節突）裡，像兩個卡榫，防止 L5 往前滑。
- **薦椎歪了，插在上面的腰椎一定跟著轉、跟著歪。**很多腰椎側彎是從骨盆、薦椎來的。
- 只敲腰椎矯正側彎，老師不認同；要先看底座。` },

  // ================= 脊椎 =================
  { id: 'k-turn', cat: '脊椎', src: '課堂 0810', title: '脊椎旋轉的轉折點', tags: ['旋轉', '轉折點', 'S 型', '胸腰交界'], regions: ['lspine', 'tspine'],
    body: `- 下面腰椎往一個方向轉，上面胸椎常往反方向代償，形成 S 型；要用觸摸找出「轉折點」（旋轉方向改變的那一節）。
- 轉折點常在胸腰交界（T12–L1），或 T9–T10 附近。
- 調整時：固定下面一節、轉上面一節；若上面也有轉動，要一節一節往上找。
- 胸椎可分上、中、下段：中段較直，下段與腰椎相連。` },
  { id: 'k-cervical', cat: '脊椎', src: '課堂 0914、0921', title: '頸椎：椎動脈、交感神經與脊髓', tags: ['頸椎', '椎動脈', '交感神經', 'C6'], regions: ['cspine'],
    body: `- 頸椎橫突有孔，**椎動脈**由此上行到腦；頸椎錯位、肌肉緊會影響血流。
- 頸部有交感神經鏈，緊繃可能與心跳、血壓、睡眠等自律神經症狀有關（課堂提到，屬可能影響）。
- 脊髓從頸椎一路往下約到 L1–L2，再往下是馬尾神經；頸椎外傷要特別小心。
- **手法安全**：頸部不要重壓前側（頸動脈、頸動脈竇），扳動前先放鬆周圍肌肉。` },
  { id: 'k-baby', cat: '脊椎', src: '課堂 0727-2', title: '脊柱曲線的發展', tags: ['嬰兒', '頸曲', '腰曲'],
    body: `- 嬰兒剛出生脊柱只有一個 C 形後彎。
- 開始抬頭 → 形成頸椎前凸；開始爬、站立、走路 → 形成腰椎前凸。
- 股骨頸角度也隨著爬、站、走慢慢形成。
所以成人的曲線是承重與動作的結果，姿勢長期改變，曲線也會跟著改。` },
  { id: 'k-scm-lever', cat: '頸肩', src: '課堂 0810', title: '胸鎖乳突肌的槓桿：為什麼會頭前傾', tags: ['頭前傾', '胸鎖乳突肌', '支點'], muscles: ['scm', 'subocc'], regions: ['cspine', 'occ'],
    body: `- [[m:scm]] 從胸骨、鎖骨斜向後上到乳突。以頸椎為支點，它緊縮時會把頭往前下拉，同時讓上頸部往後仰——形成「頭前傾、下巴往前凸」。
- 同樣的道理，肌肉附著點與支點的位置決定了它緊縮時的方向；例如股骨外側的 [[m:tfl_itb]] 在旋轉軸前方，所以它是內轉肌。
- 頭前傾時枕下肌群縮短，常見後頭痛、頭暈。` },

  // ================= 頸肩、上肢 =================
  { id: 'k-scap6', cat: '頸肩', src: '課堂 0810', title: '肩胛骨的六個動作與翼狀肩胛', tags: ['肩胛骨', '上提', '下壓', '前引', '後縮', '上迴旋', '翼狀'], muscles: ['trap_u', 'levator', 'serratus', 'rhomboid', 'pec_minor', 'trap_l'], regions: ['scap'],
    body: `肩胛骨貼在肋骨上，不是靠關節固定，靠肌肉懸吊，所以容易被拉走。六個動作：
- 上提／下壓
- 前引（前凸）／後縮
- 上迴旋／下迴旋
**翼狀肩胛（天使翼）**：肩胛內緣翹起，常見 [[m:serratus]] 無力。筆記：後縮問題「不易發現」，大部分其實是前鋸肌無力。
**判斷**：圓肩時要分清楚是肩胛骨整個被拉走（肱骨跟著走），還是肩胛骨正常、肱骨被 [[m:pec_major]] 拉成內轉。
- [[m:pec_minor]] 拉緊 → 肩胛骨前傾、被往前下拉。
- [[m:pec_major]] 拉緊 → 肱骨內轉。` },
  { id: 'k-clav', cat: '頸肩', src: '課堂 0727-2', title: '鎖骨與肩胛骨的連動', tags: ['鎖骨', '肩胛', '聯動', '骨折'], regions: ['scap', 'shoulder'],
    body: `- 鎖骨和肩胛骨是相對運動的：舉手時鎖骨上旋、肩胛骨上提並上迴旋。看動作時要留意這些聯動。
- 鎖骨骨折常見；斷裂處輕壓會「鑽痛」，摸起來像沙子在裡面滑動。` },
  { id: 'k-tos', cat: '頸肩', src: '課堂 0727、補充', title: '手麻：鎖骨下、胸小肌與斜角肌（胸廓出口）', tags: ['手麻', '胸廓出口', '臂神經叢'], muscles: ['scalene', 'pec_minor', 'pec_major'], points: ['ST12', 'HT1', 'PC6'], regions: ['cspine', 'shoulder', 'wrist'],
    body: `- 從頸部出來的臂神經叢與鎖骨下動、靜脈，要經過：前、中斜角肌之間 → 鎖骨與第一肋之間 → [[m:pec_minor]] 下方，才到手臂。
- 這些地方的肌肉緊（[[m:scalene]]、胸小肌，加上胸大肌的兩層關係）都可能造成手麻、手冷、無力。
- 胸小肌附著在喙突，連到肩胛骨：圓肩、肩胛前傾的人更容易壓到。
- 補充鑑別：麻在拇指到中指、夜間加重、甩手緩解，也要考慮腕隧道（[[p:PC6]]、[[p:PC7]]）。` },
  { id: 'k-cuff', cat: '頸肩', src: '課堂 0907', title: '旋轉肌袖撕裂為什麼常在關節旁', tags: ['旋轉肌袖', '五十肩', '撕裂', '肩痛'], muscles: ['supraspinatus', 'infraspinatus', 'teres_minor', 'subscap'], points: ['SI11', 'LI15'], regions: ['shoulder', 'scap'],
    body: `- 旋轉肌袖由 [[m:supraspinatus]]、[[m:infraspinatus]]、[[m:teres_minor]]、[[m:subscap]] 組成。
- 檢查出來的撕裂多在**靠近關節處**；常是肌肉長期不平衡、某一條一直被拉扯，最後在最弱的地方撕裂，很多人最後走向手術。
- 例：工作需要手一直外旋（或內旋），角度原本 180° 只剩 150°，硬要到 180° 就會在肌腱處產生撕裂感。先把緊的那條放鬆、恢復角度，再談局部。
- 半脫位（關節位置不對但未脫臼）：找到會痛的角度，以骨頭平衡為主。` },

  // ================= 膝 =================
  { id: 'k-knee-anat', cat: '膝', src: '課堂 0907', title: '膝關節：靠軟組織穩定的關節', tags: ['膝關節', '髕骨', '種子骨', '腓骨'], muscles: ['rectus_fem', 'vastus_lat', 'vastus_med', 'hamstrings', 'gastroc'], regions: ['knee'],
    body: `- 由**股骨遠端、脛骨近端、髕骨**（種子骨，幫肌腱改變方向、增加力臂）構成；**腓骨不直接參與**膝關節，只是依附在脛骨旁。
- 不像肩、髖有深的凹凸可以固定，膝關節的穩定幾乎全靠軟組織：股四頭肌、韌帶（前後十字、內外側副韌帶、髕韌帶）、半月板。
- 因為容易被帶著滑動、扭轉，所以容易受傷——膝是受害者。
- 股四頭肌四條在膝前合成肌腱，跨過髕骨成為髕韌帶，止於脛骨粗隆。` },
  { id: 'k-acl', cat: '膝', src: '課堂 0907', title: '前十字與後十字韌帶', tags: ['ACL', 'PCL', '十字韌帶'], regions: ['knee'],
    body: `- **前十字韌帶**：防止脛骨相對股骨**往前滑**。斷裂時脛骨可被拉得往前很多。
- **後十字韌帶**：防止脛骨**往後滑**。
- 兩者互相配合，往後時後十字先拉住，前十字也有些作用。
- 有斷裂疑慮（外傷後腫脹、不穩、「卡嗒」聲）請轉介。` },
  { id: 'k-meniscus', cat: '膝', src: '課堂 0907、0914', title: '半月板：越彎越痛，內側最常受傷', tags: ['半月板', '卡住', '關節鼠'], points: ['SP9', 'KI10'], regions: ['knee'],
    body: `- 半月板在脛骨平台上，內側 C 形、外側較圓（筆記：內側較偏內、外側較偏外）。
- **內側半月板最容易受傷**，外側很少；撕裂的特徵是**膝越彎曲越痛**，是強烈的痛。
- 完全伸直時，膕肌與韌帶會把外側半月板往後拉，避免被夾住。
- 膝會「卡住」的三個常見原因：①半月板 ②關節鼠 ③軟組織碎片。
- 膕斜韌帶、弓狀韌帶發炎會造成膝後痛，容易被誤認。` },
  { id: 'k-popliteus', cat: '膝', src: '課堂 0907', title: '膕肌：膝彎 30° 開始旋轉', tags: ['膕肌', '解鎖', '脛骨旋轉'], points: ['BL40'], regions: ['knee'],
    body: `- 自己試：摸著脛骨慢慢彎膝，**大約 30° 之後脛骨開始內外旋轉**；伸直到底時再轉回來鎖住。
- 這個旋轉（解鎖）主要由**膕肌**負責：起於股骨外側、膝關節上方，斜向內下止於脛骨後面。
- 膝關節要轉的時候轉不了，常因膕肌緊；先把它放鬆再看膝的問題。` },
  { id: 'k-varus', cat: '膝', src: '課堂 0907', title: 'O 型腿、X 型腿：股骨與脛骨夾角', tags: ['膝內翻', '膝外翻', 'O 型腿', 'X 型腿', '夾角'], muscles: ['tfl_itb', 'adductors', 'vastus_med'], regions: ['knee', 'hip', 'ankle'],
    body: `- 股骨頸與股骨幹夾角約 125–130°；股骨與脛骨在膝外側的夾角約 **170–175°**（正常會有一點外翻角）。
- 課堂整理：**夾角小於約 165° → 膝外翻（X 型腿）；大於 180° → 膝內翻（O 型腿）**。
- 角度只是參考指標，重點是左右對稱與否。
- 膝角度改變會讓股骨旋轉、骨盆跟著代償（髖臼方向、EX/IN）；反過來骨盆、股骨的旋轉也會改變膝角度。` },
  { id: 'k-pes', cat: '膝', src: '課堂 0914', title: '鵝足：三條肌腱的共同止點', tags: ['鵝足', '縫匠肌', '股薄肌', '半腱肌'], muscles: ['sartorius', 'adductors', 'hamstrings'], points: ['SP9'], regions: ['knee'],
    body: `- **鵝足**＝ [[m:sartorius]]、股薄肌（[[m:adductors]] 之一）、半腱肌（[[m:hamstrings]] 之一）在脛骨內側上端的共同止點。
- 這裡接近肌腱附著處：**推拿不可多、不可重，不要局部大力**，壓斷只會更糟。
- 從三條肌肉的肌腹往上（大腿內側、骨盆起點）放鬆；它們的起點大多在骨盆，所以骨盆位置改變會拉緊或拉鬆它們。` },
  { id: 'k-itb', cat: '膝', src: '課堂 0810、0907', title: '跑者膝：髂脛束不是元兇', tags: ['跑者膝', '髂脛束', '闊筋膜張肌', '股骨旋轉'], muscles: ['tfl_itb', 'vastus_lat', 'glute_max'], points: ['GB31', 'GB33'], regions: ['knee', 'hip'],
    body: `- [[m:tfl_itb]] 的肌腹在髂前上棘外下方（褲縫一帶），往下變成白色的髂脛束，經過股骨外髁止於脛骨外側。部分 [[m:glute_max]] 也延伸進來。
- 股骨正常擺動時，髂脛束在外髁上滑動沒有問題；**股骨內轉或外轉後角度改變**，跑步、騎車時就反覆摩擦發炎。
- 要調整的是股骨／骨盆的角度（EX/IN），不是一直推膝外側；髂脛束的起止點沒改變，推松了也會回來。` },
  { id: 'k-quads', cat: '膝', src: '課堂 0907', title: '股四頭肌：股直肌最重要', tags: ['股四頭肌', '股直肌', '橫撥', '前傾'], muscles: ['rectus_fem', 'vastus_lat', 'vastus_med'], points: ['ST32'], regions: ['knee', 'pelvis'],
    body: `- 股四頭肌：[[m:rectus_fem]]、股中間肌、[[m:vastus_lat]]、[[m:vastus_med]]。
- **只有股直肌跨過髖關節**（起於髂前下棘），其他三條起於股骨。所以骨盆 A（前傾）與股直肌關係最大，課堂先教處理股直肌。
- 從大腿前面正中往深處壓會很痠（股直肌下是股中間肌）。` },

  // ================= 踝足 =================
  { id: 'k-arch', cat: '踝足', src: '課堂 0914', title: '足弓：三點承重與舟狀骨', tags: ['足弓', '舟狀骨', '拱心石', '三點'], muscles: ['tib_post', 'tib_ant', 'plantar', 'peroneus'], points: ['KI2', 'SP4', 'KI1'], regions: ['foot', 'ankle'],
    body: `- 站立時腳底理想上是**三點承重**：腳跟、大拇趾根（第 1 蹠骨頭）、小趾根（第 5 蹠骨頭）。
- 足弓像拱橋，**舟狀骨是內側縱弓的拱心石**；拱心石一塌，整個拱就塌陷。
- 足底筋膜、[[m:tib_post]]、[[m:tib_ant]]、[[m:peroneus]] 一起撐住足弓；脛前肌無力時足弓塌、走路跑步最痛。
- 很多足底筋膜炎是足弓結構改變的結果。` },
  { id: 'k-flat', cat: '踝足', src: '課堂 0907', title: '扁平足：鞋墊只是幫助', tags: ['扁平足', '鞋墊', '避震'], muscles: ['tib_post', 'tib_ant', 'gastroc'], regions: ['foot', 'knee'],
    body: `- 足弓是彈簧，塌陷後避震效果變差，衝擊往上傳到膝、髖、腰。
- 平常不痛、走久了痛，是因為彈性不夠、肌肉疲勞。
- 鞋墊只是幫助；判斷是否有效：穿三個月到半年後，赤腳的足弓有沒有改善？沒有的話只是代償。
- 要訓練脛前肌、脛後肌等撐起足弓的肌肉。` },
  { id: 'k-ankle-chain', cat: '踝足', src: '課堂 0907、0921', title: '踝扭傷後的代償：從腳傳到肩', tags: ['扭傷', '代償', '投手', '距骨'], muscles: ['peroneus', 'gastroc', 'soleus'], points: ['GB40', 'BL60'], regions: ['ankle', 'knee', 'lspine', 'shoulder'],
    body: `- 內、外踝由脛骨與腓骨構成，下面是**距骨**；脛骨的不平衡會影響距骨，距骨影響最大。
- 踝扭傷後（尤其沒好好處理），活動角度變小，例如本來 90° 只剩 75°；上面的膝就要用旋轉補，腰要多轉，轉不夠再由肩、手代償。
- 課堂舉例：投手腳踝受傷後，旋轉力學改變，後來肩、手肘接連受傷。
- 所以要改變一個人的力學，常要從腳踝的角度看起。` },
  { id: 'k-foot-last', cat: '踝足', src: '課堂 0921', title: '腳底是全身歪斜的最後吸收者', tags: ['腳底', '平衡', '支撐'], regions: ['foot'],
    body: `- 上面所有的歪，最後都由腳底做「逆向的吸收與平衡」。
- 所以腳底的磨損、胼胝、壓力點可以反推上面的問題；但腳底也是結果之一。
- 學員問：為何有時先處理腳底？因為力量最後落在腳底，若腳底不能配合，上面調好也會被傳回來。` },

  // ================= 經筋 =================
  { id: 'k-sinew-rule', cat: '經筋', src: '課堂筆記（經筋）', title: '經筋之病：寒熱與陰陽', tags: ['經筋', '寒', '熱', '反折', '拘急'],
    body: `- **寒**則筋**反折、拘急**。
- **熱**則筋**鬆弛不收**，陰萎不用。
- **陽（背側）急**：背筋拘急，身體向後反張（反弓）。
- **陰（腹側）急**：腹部拘急，前屈而不能伸直。
經筋的病多在「所過之處」：沿著它走的路線出現拘急、轉筋、疼痛。` },
  { id: 'k-sinew-vs', cat: '經筋', src: '課堂 0817、0914', title: '經筋與經脈；問題常在兩經交界', tags: ['經筋', '經脈', '交界', '筋膜'], regions: ['hip', 'knee'],
    body: `- 老師的用法：**經筋負責身體架構的穩定**；**經脈負責運行氣血**。
- 臨床上經絡出問題，常不是單一一條，而是**兩條經的交界之間**，例如大腿外後側的膽經與膀胱經之間。
- 經絡、肌肉、筋膜都是立體的；穴位常落在肌肉與肌肉之間、筋膜交疊處。
- 五行（金木水火土）的部分老師不另外教，可自行參考經穴書籍。` },
  { id: 'k-sinew-hand-yin', cat: '經筋', src: '課堂筆記（經筋）', title: '手三陰經筋（肺、心包、心）', tags: ['手太陰', '手厥陰', '手少陰', '息賁', '伏梁'], regions: ['shoulder', 'tspine'],
    body: `|經筋|循行（筆記）|病候|
|---|---|---|
|[[s:LU]]|大拇指 → 魚際後 → 肘中 → 入腋下 → 出缺盆；胸裡 → 賁門下 → 脇肋|疼痛劇烈、時轉息賁（呼吸急迫）、脇部拘急、吐血|
|[[s:PC]]|中指 → 上肘 → 結腋下 → 前後挾脇；入腋 → 佈胸中 → 結賁|胸痛、咳嗽、嘔逆、呼息急迫|
|[[s:HT]]|小指內側 → 尺骨小頭 → 肘內 → 腋 → 交太陰 → 入乳後 → 胸中 → 臍|筋急、堅伏梁於心下成伏梁症；若又吐血膿者為不治之症|` },
  { id: 'k-sinew-hand-yang', cat: '經筋', src: '課堂筆記（經筋）', title: '手三陽經筋（大腸、三焦、小腸）', tags: ['手陽明', '手少陽', '手太陽', 'C2'], regions: ['cspine', 'shoulder', 'head'],
    body: `|經筋|循行（筆記）|病候|
|---|---|---|
|[[s:LI]]|食指 → 腕 → 肘外 → 上肩高骨；繞肩胛 → 脊；上頸 → 上頰 → 顴骨（目內眥）；頭角 → 對側下頷|下齒齦痛|
|[[s:TE]]|第四指 → 腕 → 肘 → 上肩 → 頸；合小腸：下頷角 → 舌根；耳前 → 眼外眥 → 額角|舌捲縮、痙痛|
|[[s:SI]]|小指 → 腕 → 肘內髁後 → 腋下；腋後 → 經肩胛 → 沿頸（足太陽前）→ 乳突 → 入耳中；出耳上 → 下巴 → 眼外眥|腋下後方痛、耳鳴、視物模糊需久閉方清、筋拘緊則頸腫、生瘡化膿|
**筆記重點：手三陽與 C2 的關係很大。**` },
  { id: 'k-sinew-foot-yin', cat: '經筋', src: '課堂筆記（經筋）', title: '足三陰經筋（腎、脾、肝）', tags: ['足少陰', '足太陰', '足厥陰', '鼠蹊', '抽搐'], regions: ['pubis', 'lspine'],
    body: `|經筋|循行（筆記）|病候|
|---|---|---|
|[[s:KI]]|起小趾下 → 內踝下 → 上行至脛骨內髁下；上行 → 陰器 → 入裡循脊旁至頸部（枕骨大孔）|痙：四肢抽搐|
|[[s:SP]]|拇趾內側 → 內踝 → 股內髁 → 大腿內側上行 → 外生殖器 → 上腹結臍 → 循腹裡 → 肋骨 → 散胸中；著脊|鼠蹊痛、臍兩旁痛、腹內痛、肋軟骨痛|
|[[s:LR]]|起拇趾 → 結內踝前 → 股內髁 → 外生殖器（恥骨下肢）|房勞過度 → 陰萎不舉；傷於寒 → 陰縮；傷於熱 → 縱長不舉|` },
  { id: 'k-sinew-foot-yang', cat: '經筋', src: '課堂筆記（經筋）', title: '足三陽經筋（膀胱、胃、膽）', tags: ['足太陽', '足陽明', '足少陽', '口角歪斜', '維筋相交'], regions: ['lspine', 'head', 'knee'],
    body: `|經筋|循行（筆記）|病候|
|---|---|---|
|[[s:BL]]|小趾 → 足外 → 跟骨 → 坐骨粗隆 → 沿脊 → 肩胛、腋下 → 出缺盆 → 乳突、顴骨|脊反張、肩痛|
|[[s:ST]]|起中三趾：斜外 → 腓骨頭 → 轉子前外側 → 肋 → 脊；直上 → 脛骨 → 膝 → 髂前上棘（合膽經）；陰器 → 缺盆 → 口旁 → 鼻旁|陰囊腫大、口角歪斜、上齒齦痛；寒 → 眼不能閉，熱 → 不能張目；合太陽小腸 → 口角歪斜|
|[[s:GB]]|第四趾 → 外踝 → 腓骨 → 直上季脇空軟處；後 → 尾骶骨；腋前乳後 → 缺盆；出腋 → 缺盆 → 耳後 → 耳上 → 額角 → 下頷 → 顴骨、眼眶|偏頭痛；維筋相交（陰陽蹻平衡）：左額角傷 → 右足不能行|
筆記另記：胃經「左：腸、右：胃」。` },

  // ================= 經絡穴位 =================
  { id: 'k-headache', cat: '經絡穴位', src: '課堂筆記（頭痛）', title: '頭痛分經', tags: ['頭痛', '前額', '偏頭痛', '後頭', '巔頂'], points: ['ST8', 'GB8', 'BL10', 'GV20', 'LI4', 'LR3'], regions: ['head'],
    body: `|部位|所屬|
|---|---|
|前額痛|胃（陽明）|
|偏頭痛（側頭）|膽（少陽）|
|後頭痛|膀胱（太陽）|
|巔頂痛|肝|
|由中心向外（往耳）|腎|
|重著、悶痛|脾|
- 另一頁筆記的說法：前額痛 → 胃；側邊痛 → 膽；後腦（枕骨）→ 膀胱；後腦（內）→ 脾；重著 → 腎；頭頂中心 → 肝。兩頁對「脾、腎」的歸屬不同，請以老師講解為準。
配穴參考（補充）：前額 [[p:ST8]]、[[p:LI4]]；偏頭 [[p:GB8]]、[[p:TE5]]；後頭 [[p:BL10]]、[[p:BL60]]；巔頂 [[p:GV20]]、[[p:LR3]]。也要檢查頸部肌肉的轉移痛（上斜方 → 太陽穴；枕下肌群 → 頭兩側；胸鎖乳突肌 → 前額、眼眶）。` },
  { id: 'k-sanhuang', cat: '經絡穴位', src: '課堂筆記', title: '三黃（筆記）', tags: ['黃連', '黃芩', '大黃', '中藥'],
    body: `筆記記載：
- **黃連**：腸子
- **黃芩**：中焦
- **大黃**：頭部受創（降顱壓）、上焦
中藥屬醫療用藥，使用請由中醫師辨證處方，推拿師不自行建議客人服用。` },
  { id: 'k-ashi', cat: '經絡穴位', src: '課堂 0727', title: '阿是穴', tags: ['阿是穴', '痛點'],
    body: `- 阿是穴沒有固定位置：在痛點周圍的前後左右，按下去會疼痛（客人會「啊！是這裡」）的點。
- 常與肌肉的激痛點、肌肉交界的緊點重疊；按之前先想它是不是「被拉長的痛」，避免只追著痛點按。` },
  { id: 'k-four-points', cat: '經絡穴位', src: '補充：經穴通識', title: '四總穴與常用遠端配穴', tags: ['四總穴', '遠端', '配穴'], points: ['ST36', 'BL40', 'LU7', 'LI4', 'PC6', 'TE6', 'SI3', 'GV26'],
    body: `**四總穴歌**：肚腹三里留、腰背委中求、頭項尋列缺、面口合谷收。
- 腹部：[[p:ST36]]
- 腰背：[[p:BL40]]
- 頭項：[[p:LU7]]
- 面口：[[p:LI4]]
常見增補：心胸內關謀（[[p:PC6]]）、脇肋支溝取（[[p:TE6]]）。
推拿應用：急性疼痛時先按遠端穴，同時請客人慢慢活動患處（例如落枕按 [[p:SI3]]、急性閃腰掐 [[p:GV26]]），再處理局部。` },
  { id: 'k-eight', cat: '經絡穴位', src: '補充：經穴通識', title: '八會穴', tags: ['八會', '筋會', '骨會'], points: ['GB34', 'BL11', 'GB39', 'BL17', 'CV17', 'LU9', 'LR13', 'CV12'],
    body: `|會|穴位|推拿上的意義|
|---|---|---|
|筋會|[[p:GB34]]|全身筋緊、抽筋常用|
|骨會|[[p:BL11]]|頸胸交界、骨病|
|髓會|[[p:GB39]]|落枕遠端配穴|
|血會|[[p:BL17]]|約平肩胛下角|
|氣會|[[p:CV17]]|胸悶、開胸|
|脈會|[[p:LU9]]|勿重壓動脈|
|臟會|[[p:LR13]]|脇腹|
|腑會|[[p:CV12]]|胃腹|` },
  { id: 'k-landmarks', cat: '經絡穴位', src: '補充：經穴通識', title: '背部定位的骨性標誌', tags: ['定位', 'C7', 'T7', 'L4', 'PSIS', '肩胛'], points: ['GV14', 'GV12', 'GV9', 'BL23', 'BL25', 'BL28'], regions: ['tspine', 'lspine', 'sacrum'],
    body: `|標誌|對應|
|---|---|
|低頭最突出的棘突|C7（[[p:GV14]]）|
|兩側肩胛岡內端連線|約平 T3（[[p:GV12]]）|
|兩側肩胛下角連線|約平 T7（[[p:GV9]]、[[p:BL17]]）|
|第 12 肋尖端（不是肋弓下緣）|約平 L2，有時 L3（[[p:BL23]]）|
|兩側髂嵴最高點連線|約平 L4（[[p:BL25]]）|
|髂後上棘（PSIS）|S2（[[p:BL28]]，薦椎評估基準）|
膀胱經背部第一側線在棘突旁 1.5 寸，第二側線 3 寸；夾脊在棘突旁 0.5 寸。` },
  { id: 'k-cun', cat: '經絡穴位', src: '補充：經穴通識', title: '骨度分寸：怎麼量「寸」', tags: ['寸', '骨度', '同身寸'],
    body: `- **同身寸**：以客人自己的手指量——拇指寬約 1 寸；食指到小指四指併攏（第二指節）約 3 寸。
- **骨度分寸**（把一段距離固定分成幾寸）：
|部位|分寸|
|---|---|
|臍中 → 恥骨聯合上緣|5 寸|
|劍胸聯合 → 臍中|8 寸|
|兩乳頭之間|8 寸|
|腋前紋頭 → 肘橫紋|9 寸|
|肘橫紋 → 腕橫紋|12 寸|
|股骨大轉子 → 膝中（膕橫紋）|19 寸|
|脛骨內髁下緣 → 內踝尖|13 寸|
|膝中 → 外踝尖|16 寸|` },

  // ================= 手法 =================
  { id: 'k-fiber', cat: '手法', src: '課堂 0907', title: '順纖維＝放鬆；橫向撥＝破壞', tags: ['撥法', '推法', '順纖維', '沾黏'],
    body: `- **順著肌肉纖維方向推、拉 → 放鬆**。
- **橫向撥動肌肉 → 「破壞」**：把沾黏、硬塊撥開（類似震波的道理：先打散組織，讓身體重新修復）。
- 橫向撥開之後，一定要再**順著纖維方向推回、理順**，不要只撥不理。
- 靠近肌腱附著處、骨頭表面不要大力橫撥。` },
  { id: 'k-weight', cat: '手法', src: '課堂 0810、0817-2', title: '用身體重量，垂直往下', tags: ['施力', '重量', '垂直', '保護自己'],
    body: `- 要加壓時，手臂打直、**垂直對準**要處理的組織，用身體的重量往下，不是用手臂的力量。
- 先讓自己的手放鬆，才摸得到東西；手僵硬什麼都感覺不到。
- 保護自己：姿勢擺好再施力，客人突然動時要能穩住。
- 每個人的手法習慣不同，「回去用你自己的方式就好」，重點是角度、方向、層次對。` },
  { id: 'k-breath', cat: '手法', src: '課堂 0817-2、筆記', title: '配合呼吸做整復', tags: ['呼吸', '吐氣', '脊椎'], regions: ['diaphragm', 'sacrum'],
    body: `- 呼吸對整骨非常好用，尤其是脊椎：吸氣時脊椎、肋骨會動，吐氣時身體放鬆、你比較省力。
- 一般做法：吸氣時準備、找到位置；**吐氣時施力**。
- 薦椎本身也隨呼吸動（吸氣反點頭、吐氣點頭），可利用這個時機。` },
  { id: 'k-heavy', cat: '手法', src: '課堂 0914', title: '輕重之分：實則重、虛則輕', tags: ['力道', '虛實'],
    body: `- 推拿要依客人的狀況決定輕重：**實證、壯實的人可以重；虛弱的人要輕**。
- 痠就是有按到，不一定要痛；慢慢加壓找到「很痠但不想逃」的程度。
- 局部發炎、靠近肌腱附著、骨質疏鬆、年長者都要減輕。` },
  { id: 'k-space', cat: '手法', src: '課堂 0921', title: '先把關節周圍的空間打開', tags: ['關節', '牽引', '空間'],
    body: `- 骨頭要回到正確位置，先把旁邊的空間弄開（放鬆周圍肌肉、輕微牽引拉開），骨頭自然比較容易回去。
- 卡得太緊時硬塞會塞不回去。
- 必要時沿著關節面做牽引，再配合角度。` },
  { id: 'k-techniques', cat: '手法', src: '補充：推拿通識', title: '推拿基本手法一覽', tags: ['揉', '拿', '按', '點', '撥', '滾', '推', '擦', '搓', '抖', '拔伸'],
    body: `|手法|做法|常用部位|
|---|---|---|
|揉法|掌根或指腹貼住皮膚帶動皮下做小圓|全身、穴位|
|拿法|拇指與其餘四指相對提捏肌肉|肩井、頸後、四肢|
|按法、點法|指腹、指節或肘垂直下壓、停留|穴位、深層肌|
|撥法（彈撥）|橫向肌纖維撥動|肌腹硬結、條索|
|滾法|手背尺側在體表滾動|肩背、腰臀、大腿|
|推法|順纖維方向直線推進|背部、四肢|
|擦法|快速來回摩擦生熱|腰骶、背部|
|搓法、抖法|雙手搓動或牽拉抖動肢體|收尾放鬆|
|拔伸（牽引）|沿肢體長軸拉開關節|頸、腰、四肢關節|` },

  // ================= 安全 =================
  { id: 'k-redflag', cat: '安全', src: '補充：一般臨床', title: '需要先轉介的警訊', tags: ['轉介', '警訊', '骨折', '馬尾'],
    body: `出現以下情況，先請客人就醫，推拿暫停或只做遠端放鬆：
- 外傷後劇痛、變形、腫脹，局部骨頭壓痛或敲擊痛（疑骨折）。
- 夜間痛、休息不緩解，合併發燒、體重減輕、癌症病史。
- 大小便失禁或解不出來、會陰（鞍區）麻木（馬尾症候群）。
- 進行性無力、肌肉萎縮、走路越來越不穩。
- 胸痛合併冒冷汗、喘；突發劇烈頭痛、口齒不清、單側無力（心血管、中風）。
- 主動動不了但不痛（神經問題，見三分法）。` },
  { id: 'k-caution-points', cat: '安全', src: '補充：經穴通識', title: '操作禁忌與注意穴位', tags: ['孕婦', '禁忌', '頸動脈'], points: ['LI4', 'SP6', 'GB21', 'BL60', 'BL67', 'ST9', 'LU9'],
    body: `- **孕婦**：避免重按 [[p:LI4]]、[[p:SP6]]、[[p:GB21]]、[[p:BL60]]、[[p:BL67]]，以及腹部、腰薦部。
- **頸前**：[[p:ST9]]（頸動脈、頸動脈竇）不重壓；缺盆、腋窩、膕窩、腹股溝有大血管神經，力道要輕。
- **動脈搏動處**：[[p:LU9]] 等輕按即可。
- 骨質疏鬆、抗凝血藥物、皮膚破損或感染處、急性發炎腫脹處避免重手法。` },


  // ================= 0928 整復流程 =================
  { id: 'k-3steps', cat: '原則', src: '課堂 0928', title: '整復三步驟：找問題 → 創造空間 → 矯正', tags: ['整復', '矯正', '空間', '流程'], regions: ['lspine', 'tspine', 'cspine'],
    body: `1. **找出問題**：先分清楚是骨頭、軟組織還是神經的問題（見三分法），並確定是哪一節、往哪個方向。
2. **創造空間**：骨頭要回去，先把它周圍的空間弄出來——放鬆兩旁的肌肉、把卡住的關節面稍微拉開，給它可以移動的路。
3. **矯正**：了解那塊骨頭的作用與運動方向，利用骨頭彼此鎖定的角度，順著它可以走的方向帶回去（配合吐氣）。
- 創造空間不是為了推骨頭，是「讓它能過去」。
- 被拉長的肌肉本來就已經被拉緊了，不要再一直幫它拉長。` },
  { id: 'k-smooth', cat: '評估', src: '課堂 0928', title: '摸脊椎：排列應該平滑圓順', tags: ['觸診', '棘突', '錯位', '粗糙'], regions: ['lspine', 'tspine', 'cspine'],
    body: `- 正常的棘突、關節排列應該**平滑、順著弧度走**；沿著脊椎由上往下摸，若某一節突出、凹陷、有「粗糙」或頂手的感覺，代表那一節可能錯位或卡住。
- 比較左右兩側：一側摸起來比較厚、比較硬、有顆粒感，常是那側的深層肌（[[m:multifidus]]）緊。
- 手指要放鬆，用力越大感覺越差。` },
  { id: 'k-breath-test', cat: '評估', src: '課堂 0928', title: '用呼吸測試椎體能不能動', tags: ['呼吸', '椎體', '卡住', '測試'], regions: ['lspine', 'sacrum', 'diaphragm'],
    body: `- 客人俯臥，你的手指（或掌根）輕抵某一節棘突。
- 請他吸氣：正常時腰椎椎體會跟著呼吸往上走（薦椎則往下、往後），你的手會感覺到它在動；吐氣時回來。
- 吸氣時那一節**不跟著走**、或被頂住，代表它卡住（可能被上下鎖住或周圍肌肉拉住）。
- 吸氣時順勢往上推一下：若上下幾節一起跟著動，代表連在一起；若只有這節不動，問題就在這節。
- 確定卡住後，先創造空間，再配合吐氣矯正。` },
  { id: 'k-facets', cat: '脊椎', src: '課堂 0928、補充：肌動學', title: '各段脊椎的活動方向（小面關節）', tags: ['小面關節', '腰椎', '胸椎', '頸椎', '旋轉'], regions: ['lspine', 'tspine', 'cspine'],
    body: `要矯正前，一定要知道那一段骨頭「可以往哪裡走」：
|節段|關節面方向|主要活動|
|---|---|---|
|腰椎|接近前後（矢狀面）|前彎、後仰為主，旋轉很少|
|胸椎|像屋瓦一片疊一片|旋轉、側彎較多；有肋骨限制|
|頸椎|斜向、關節小|各方向都多，上頸（C1–C2）以旋轉為主|
**筆記：小面關節與水平面的夾角**
|節段|夾角|主要貢獻|
|---|---|---|
|頸椎|45°|旋轉|
|胸椎|60°（接近冠狀面）|側彎|
|腰椎|90°（接近矢狀面）|彎曲／伸直|
**Fryette 規則（脊椎生物力學，筆記）**
- 上頸椎：側彎與旋轉**反向**。
- 頸椎（C2 以下）：側彎與旋轉**同向**。
- 胸、腰椎在**正中位置**：側彎與旋轉**反向**。
- 胸、腰椎在**極端屈曲**：側彎與旋轉**同向**。
- 脊椎的活動單元：1 個椎體（椎間盤）＋ 2 個小面關節，重量配置約 **6：4**。
- 脊髓止於 T12–L1，L1 以下分出馬尾神經；L5–S1 的壓迫可能壓到 L5 或 S1 神經根。
- L5 被薦椎上關節突卡住（防止前滑），L4–L5 活動較大，所以椎間盤突出常在 L4–L5。
- 交感神經緊繃會讓人睡不著（入睡需要副交感作用）；脊椎周圍放鬆、順暢，有助睡眠。` },
  { id: 'k-triangle', cat: '原則', src: '課堂 0928', title: '神經、肌肉、骨頭互為因果', tags: ['神經', '肌肉', '骨頭', '因果'],
    body: `- 神經控制肌肉，肌肉帶動骨頭；但骨頭歪了也會讓肌肉變緊、壓迫神經。三者**互為因果**，像一個三角形，沒有絕對的誰先誰後。
- 所以處理時要回到主問題：先找出這次是骨頭、軟組織還是神經在主導，再決定從哪一角切入。
- 學習時先接受一套理論、照著做，做不通時再思考為什麼，而不是一次換一個方法。` },
  { id: 'k-sinew-def', cat: '經筋', src: '課堂 0928', title: '經筋是什麼？', tags: ['經筋', '定義', '十二經脈', '軟組織'],
    body: `- **十二經筋＝十二經脈所濡養的肌肉、軟組織**。經脈是通道，經筋是它灌溉的那一片筋肉。
- 所以經筋的循行與肌肉、筋膜的走向高度重疊，「結」多在骨節、關節附近（肌腱附著處）。
- 經絡、針灸常用的觀念：**左病右治、上病下治**——例如左側問題取右側穴、上面的痛取下面的穴（參考足少陽經筋「維筋相交」）。` },


  { id: 'k-limb-rot', cat: '踝足', src: '課堂 0928-2', title: '下肢旋轉、足內外翻與 O／X 型腿', tags: ['O 型腿', 'X 型腿', '旋前', '旋後', '內翻', '外翻', '高弓'], muscles: ['tib_post', 'peroneus', 'tfl_itb', 'adductors'], regions: ['foot', 'ankle', 'knee', 'hip'],
    body: `|下肢整體|足踝|常見結果|
|---|---|---|
|完全**內轉**|足**外翻**、旋前（足弓塌）|**X 型腿**|
|完全**外轉**|足**內翻**、旋後（足弓高）|**O 型腿**、高弓足、用腳外側走|
- 女生股骨與脛骨的夾角本來就比較小（常小於 175°），比男生更容易 X 型腿。
- 足弓的前、中、後段拉力改變，足跟就跟著旋前或旋後，彈性變差 → 足底筋膜容易痛。
- 判斷時要分清楚：是腳掌與踝的問題、還是整條下肢內外轉的問題，或是兩者互相影響。可以自己站站看：腳外側承重時，是不是連帶膝往外、髖外轉？` },
  { id: 'k-scap-look', cat: '頸肩', src: '課堂 0928-2', title: '看肩胛骨：上角、下角是否平行', tags: ['肩胛骨', '高低', '下角', '鎖骨', '胸鎖關節'], muscles: ['trap_u', 'levator', 'rhomboid', 'serratus'], regions: ['scap', 'tspine'],
    body: `- 肩胛骨與肋骨之間沒有真正的關節，跟鎖骨協同作用；所以很容易被肌肉拉高、拉低、往前翻。
- 客人坐姿或站姿，比較兩側**上角**與**下角**的連線是否水平（兩下角連線約平 T7）。例：上角左高右低、下角也左高右低 → 整塊左側上提；若上角高但下角低 → 有旋轉（上迴旋／下迴旋）。
- 看肩胛內緣的弧度與深度：一邊比較斜、一邊比較直，常是旋轉造成。
- 前面配合看鎖骨與胸鎖關節：有沒有凸出、凹陷、下垂；若一側胸鎖關節卡住，力量傳不過去，痛常在另一邊。` },
  { id: 'k-static-dynamic', cat: '評估', src: '課堂 0928-2、0921', title: '靜態位與動態位：姿勢一換就變？', tags: ['靜態', '動態', '核心', '坐姿', '站姿', '俯臥'],
    body: `- 同一個客人，分別看**站姿、坐姿、俯臥**（完全放鬆）時骨盆、肩胛、脊椎的位置。
- 三種姿勢下歪斜都一樣 → 偏向結構性（骨頭卡住、長期縮短）。
- 換了姿勢就改變、放鬆某組肌肉後骨頭立刻「跑」到另一個位置 → 代表**肌肉與核心的拉力**在主導，要從肌肉著手。
- 例：手臂交叉放鬆後再看，肩胛高低變了，表示剛剛是肌肉在撐。
- 課堂也提到：可能一邊正常、另一邊 A（前傾），要兩側分開評估。` },
  { id: 'k-va', cat: '脊椎', src: '課堂 0928-2', title: '斜角肌、肋骨與椎動脈：偏頭痛的另一條線', tags: ['椎動脈', '斜角肌', '偏頭痛', '肋骨', 'C2'], muscles: ['scalene', 'scm', 'subocc'], regions: ['cspine', 'head', 'tspine'],
    body: `- [[m:scalene]]：前、中斜角肌止於第 1 肋，後斜角肌止於第 2 肋，起於頸椎橫突。肋骨跟著胸椎旋轉時，斜角肌一邊變緊一邊變鬆，就把頸椎往一側拉，或讓頭轉向。
- **椎動脈**走在頸椎橫突孔裡（約 C6 以上），往上匯成基底動脈供應腦部。頸椎被扭轉、拉歪時，供血可能受影響，部分偏頭痛、頭後鈍痛與此有關，一直解決不了的頭痛可往這裡查。
- 也可能沿著膀胱經往下：肩胛、脊椎側彎、甚至腳外側的問題，都可能牽連到頭。` },
  { id: 'k-chains', cat: '經筋', src: '課堂 0928-2（老師個人觀點）', title: '經絡與肌筋膜鏈的對照', tags: ['肌筋膜鏈', '前鏈', '後鏈', '側鏈', '螺旋', '胃經', '膀胱經', '膽經'], muscles: ['scm', 'pec_minor', 'rectus_abd', 'rectus_fem', 'tib_ant', 'erector', 'hamstrings', 'gastroc', 'tfl_itb'], regions: ['cspine', 'pelvis', 'knee', 'ankle'],
    body: `老師的個人認知：經絡的走向與肌肉的「機械連結」很接近，可以互相對照。
|鏈|肌肉連結（課堂）|對應經絡|
|---|---|---|
|前側鏈|[[m:scm]] → [[m:pec_minor]] → [[m:rectus_abd]] → [[m:rectus_fem]]（股四頭）→ [[m:tib_ant]]（足三里是起點附近）|胃經（足陽明）|
|後側鏈|枕下、[[m:erector]] → [[m:hamstrings]] → [[m:gastroc]] → 足底|膀胱經（足太陽）|
|側鏈|顳側、側頸 → 側胸腹 → [[m:tfl_itb]] → 腓骨肌|膽經（足少陽）|
|內側／深層|內收肌、髂腰肌，沿脊柱兩旁|肝經、腎經|
- 例：前側鏈太緊（骨盆 A），脛前肌也會緊，足背屈太緊、腳尖翹起壓不下去。
- 經絡交叉、螺旋的走法也可以在肌肉上找到相對應的連結。` },

  // ================= 筆記補充（第二批）=================
  { id: 'k-nerve-c', cat: '神經', src: '課堂筆記（頸椎 8 對神經）', title: '頸椎 8 對神經與症狀位置', tags: ['頸椎', 'C1', 'C5', 'C6', 'C7', 'C8', '手麻', '高爾夫球肘', '神經'], muscles: ['subocc', 'scalene', 'forearm_flex'], regions: ['cspine', 'shoulder', 'elbow', 'wrist', 'head'],
    body: `頸椎有 7 節但有 **8 對神經**（C8 從 C7 與 T1 之間出來）。筆記整理（課堂觀點，用來推估要往哪一節找，不是醫學診斷）：
|神經|筆記中的對應位置／症狀|
|---|---|
|C1|頭頂（痠、痛、麻）、高血壓、地中海禿、睡眠品質不好|
|C2|顏面（眼耳口鼻）；但頸椎造成的較少，胸椎較多|
|C3|喉嚨|
|C4|肩膀（筆記也記：流鼻血）|
|C5|手臂陰面延伸到手掌心|
|C6|第 1、2 指，第 3 指一半|
|C7|第 2、3、4 指|
|C8|第 4、5 指，第 3 指一半（高爾夫球肘）|
- 找法（筆記）：**肩**從肩窩開始，每 1 個指幅一對神經；**腕**從橈側開始，每一個面一對神經。
- 會影響到手的有 **C5、C6、C7、C8 與 T1、T2、T3、T5**（見「胸椎神經與手臂」）。
- 手麻還要分清楚是不是斜角肌、胸小肌壓迫（[[r:cspine]] → 胸廓出口），三分法先判斷是不是神經。` },
  { id: 'k-nerve-t', cat: '神經', src: '課堂筆記（胸椎神經）', title: '胸椎神經與手臂：T1、T2、T3、T5', tags: ['胸椎', 'T1', 'T2', 'T3', 'T5', '網球肘', '手麻', '神經'], muscles: ['forearm_ext', 'triceps', 'infraspinatus'], regions: ['tspine', 'shoulder', 'elbow', 'wrist'],
    body: `筆記中的胸椎神經走向（課堂觀點）：
- **T1**：肩峰 → 手肘內側 → 手腕內側。
- **T2**：肩峰後 2 指、肩胛骨稜線下緣 → 肘尖 → 手指末梢（**5 指同時麻**）。
- **T3**：再往後 2 指 → 腋下 → 肘窩（**網球肘**）→ 手會腫脹。
- **T5**：半身痠麻，手腕以下、腳踝以下，**遊走性痠痛**。
- 小結：會影響到手的有 **C5、C6、C7、C8、T1、T2、T3、T5**。手肘外側痛除了前臂伸肌（[[m:forearm_ext]]），也可往 T3 一帶查。` },
  { id: 'k-nerve-ls', cat: '神經', src: '課堂筆記（腰薦神經）', title: '腰、薦、尾神經分布', tags: ['腰椎', '薦椎', 'L4', 'L5', 'S1', '坐骨神經', '尾骨', '痔瘡', '神經'], muscles: ['hamstrings', 'piriformis', 'adductors'], points: ['BL40', 'GB30'], regions: ['lspine', 'sacrum', 'hip', 'knee', 'ankle', 'foot'],
    body: `筆記整理（課堂觀點）：
|神經|分布|
|---|---|
|L1|大腿上面一段|
|L2|大腿中間一段|
|L3|髕骨下緣一段|
|L4|大腿內側 → 小腿內側 → 前面 2 隻半腳趾|
|L5|大腿後側 → 小腿後側 → 中間 3 隻腳趾|
|S1|大腿外側 → 小腿外側 → 後面 2 隻半腳趾|
|S2|繞回後側 → 腳趾末梢|
|S3|走鼠蹊，腳腫脹|
|S4|走前側、偏內 45°|
|S5|走前側、偏外 45°|
|Co（尾骨）|出問題時：痔瘡、肛門痛、很怕痛、摸到都痛（筆記舉例：Co3 裂）|
- 搭配三分法與直腿抬高判斷是不是神經（見「直腿抬高：真假坐骨神經痛」）；有大小便異常、會陰麻木、進行性無力時先轉介。` },
  { id: 'k-viscera', cat: '神經', src: '課堂筆記（內臟，老師觀點）', title: '內臟與胸椎：神經走短線、力學走長線', tags: ['內臟', '胸椎', 'T3', 'T5', 'T6', 'T7', '高血壓', '糖尿病', '情緒'], regions: ['tspine', 'head'],
    body: `以下是老師的臨床觀點（筆記），用來提醒「往哪裡找」，**不是醫學診斷，相關疾病仍應就醫**：
- **器官在哪，正後方就是它的主神經**。
- **神經走短線，力學走長線**：神經影響靠近的節段；力學（骨頭、筋膜的牽拉）會一路傳很遠。
- T3 壓迫：躁鬱；T5 壓迫：憂鬱（加重壓迫）。
- T5、T6、T7：高血壓、糖尿病。
- T5、T6：眼耳口鼻、顏面、免疫系統、肝膽脾胃、小腦萎縮與失智、容易瘀青、健忘、內耳不平衡；筆記並對應頭骨的百會、薦椎的 S3。
**另一頁筆記：胸椎節段與臟腑**
|節段|筆記|
|---|---|
|T1|血壓|
|T2、T3|肺|
|T4|膽|
|T5|肝|
|T6|胃|
|T7|胰、十二指腸|
|T8|皮膚、抗體|
|T9|腎、副腎|
|T10–T12|造血功能|
- 經部（筆記）：上頸椎 → 小腸；上胸椎 → 大腸；眼 → 小腸；鼻 → 大腸；口 → 三焦。
- 膈神經：胃脹、打嗝；另記喉返神經、迷走神經。
- 筆記中不同頁的節段對應不完全一致（例如肝在 T5 或 T9），屬於老師的臨床經驗，請以課堂講解為準。` },
  { id: 'k-family', cat: '脊椎', src: '課堂筆記（詠因、父母椎力學）', title: '父母椎、兄弟椎與全家福力學', tags: ['父母椎', '兄弟椎', '全家福', '尾骨', '薦椎', '裂縫'], regions: ['sacrum', 'lspine', 'cspine', 'tspine'],
    body: `老師的力學模型（筆記）：
- **薦椎的裂縫**：①摔傷 ②遺傳。
- **父母椎力學**：1 個父親（**Co1**）娶 5 個老婆（**S1–S5**），生 25 個孩子（上面的脊椎）。神經方面：1 個媽媽管 5 個孩子——
|薦椎|對應的節段（筆記圖）|
|---|---|
|S1|C1–C5|
|S2|C6–C8、T1–T2|
|S3|T3–T7|
|S4|T8–T12|
|S5|L1–L5|
- **兄弟椎力學**：**C1↔L5、C2↔L4、C3↔L3、C4↔L2、C5↔L1**（起在下、止在上）。頸部問題可以往下找它的兄弟。
- **神經學**：壓迫神經，產生症狀。
- **全家福力學**：一塊骨頭裡分成 5 個小板塊，每塊再分 33 格，(33＋33)×5＝**330 格（肌束）**，向上拉到 C1–C5；**Co1→S1、Co2→S2、Co3→S3**。
- 頭外的腱膜層經過裂縫、穿過板障到蜘蛛網膜，延伸到腦神經纖維 → 脊髓 → 周邊神經（內部循環）。
- 筆記：**S1 呼吸軸、S2 質量（重心）中心、S3 骨盆（薦椎）軸**（見薦椎三軸）。` },
  { id: 'k-skull-net', cat: '脊椎', src: '課堂筆記（頭骨網狀力學）', title: '頭骨網狀力學：顱縫與身體的對應', tags: ['頭骨', '顱縫', '人字縫', '矢狀縫', '冠狀縫', '鱗狀縫', '髮穴', '太極線'], regions: ['head', 'sacrum'],
    body: `老師的頭顱骨觀點（筆記圖整理，部分字跡不清以課堂為準）：
- **頭顱骨跟薦尾對脊柱一樣：薦尾是源頭，脊椎是末梢**。
- 顱縫對應身體的面：**鱗狀縫 → 身體側邊；冠狀縫 → 對側邊；矢狀縫、人字縫 → 背側邊**。
- 人字縫上排列 C、T、L、S、Co 的對應位置；圖中標出 S4、Co3、C1 等點，以及經過頂骨孔的「太極線」與前囟。
- **髮穴（頭皮上的敏感點）一般都是身體的問題點，以尾骨居多**。
- 太極線 → 腰窩（筆記字跡不清）。` },
  { id: 'k-disc-acute', cat: '脊椎', src: '課堂筆記（椎間盤、急性腰閃傷）', title: '椎間盤（慢性）與急性腰閃傷：痛側在上還是在下', tags: ['椎間盤', '肩上型', '肩下型', '閃到腰', '滑膜嵌頓', '髂腰韌帶', '側彎'], muscles: ['ql', 'erector', 'multifidus', 'iliopsoas'], points: ['BL40', 'SI3', 'GV26'], regions: ['lspine', 'pelvis', 'sacrum'],
    body: `|類型|來源|外觀|
|---|---|---|
|**椎間盤（慢性）**|肩上型、肩下型（突出物在神經根上方或下方）|**痛側在上**|
|**急性腰閃傷（急性）**|髂腰橫韌帶、腰椎滑膜嵌頓、肌肉拉傷|對側臀部後突、**向痛側側彎**、骨盆變 **A＋IN**，**痛側在下**|
- 先看客人站姿往哪邊歪，就能初步分出是椎間盤還是急性閃傷。
- 急性期：遠端穴（[[p:BL40]]、[[p:SI3]]、[[p:GV26]]）配合慢慢活動，局部不重壓。
- 椎間盤合併明顯神經症狀（直腿抬高很低就放射、麻木、無力）請先轉介。` },
  { id: 'k-scap-pelvis', cat: '評估', src: '課堂筆記（骨盆＆肩胛）', title: '坐→臥看肩胛：問題在肩還是在骨盆？', tags: ['肩胛骨', '骨盆', '坐姿', '臥姿', '檢查流程', '由下往上'], muscles: ['lat', 'ql'], regions: ['scap', 'pelvis', 'sacrum', 'foot'],
    body: `- **坐姿轉臥姿，肩胛相對位置不變、骨盆是正位** → 問題在**肩關節**。
- **坐姿轉臥姿，肩胛相對位置改變** → 跟**骨盆**有關。
**檢查流程（筆記）**
坐著、臥著看肩胛變動跟骨盆有沒有關 → **薦椎** ← **骨盆**（A、P、EX、IN、③EX、③IN，取最大角度）← **股骨** ← **脛腓** ← **距骨** ← **足跟（後足）** ← **中足、前足**。
- 力的路徑：中軸力線 → 骨盆分力 → 股骨 → … → 足底，再回傳往上 → 薦髂與骨盆環。` },
  { id: 'k-ankle-lig', cat: '踝足', src: '課堂筆記（踝／足）', title: '踝關節韌帶、足的分區與踝的動作肌', tags: ['踝', '三角韌帶', '距腓韌帶', '跟腓韌帶', '距骨', '舟狀骨', '骰骨', '脾經', '腎經', '肝經'], muscles: ['tib_ant', 'gastroc', 'soleus', 'peroneus', 'tib_post'], points: ['SP5', 'KI3', 'LR4', 'GB40'], regions: ['ankle', 'foot'],
    body: `**踝＝脛骨、腓骨、距骨**。
**內側：三角韌帶（內韌帶）與經絡（筆記）**
|韌帶|對應|
|---|---|
|脛舟韌帶|脾經（會影響到鼠蹊韌帶）|
|脛跟韌帶|腎經|
|脛距前韌帶|肝經|
|脛距後韌帶|影響膀胱經|
**外側韌帶**：前距腓韌帶、後距腓韌帶、跟腓韌帶。
**足的分區**：後足＝跟骨；中足＝距骨、舟狀骨、骰骨；前足＝楔形骨、蹠骨（筆記分法）。
**踝的動作肌**
- 背屈：[[m:tib_ant]]
- 蹠屈：[[m:gastroc]]、[[m:soleus]]
- 外翻：[[m:peroneus]]（腓骨長、短肌）
- 內翻：[[m:tib_post]]
在 3D 模型開啟「骨骼」可以點選距骨、舟狀骨、骰骨等看位置。` },
  { id: 'k-elbow', cat: '上肢', src: '課堂筆記（肘）', title: '肘：旋前、旋後的肌肉與骨間膜', tags: ['旋前', '旋後', '高爾夫球肘', '網球肘', '骨間膜', '橈骨'], muscles: ['pronator', 'supinator', 'biceps', 'brachiorad', 'forearm_flex', 'forearm_ext'], regions: ['elbow', 'wrist'],
    body: `|動作|主要|次要|連到|
|---|---|---|---|
|**旋前**|[[m:pronator]]（旋前圓肌、旋前方肌）|橈側屈腕肌、掌長肌、[[m:brachiorad]]|屈腕肌群 → **肱骨內上髁**（高爾夫球肘）|
|**旋後**|[[m:supinator]]、[[m:biceps]]|橈側伸腕肌、伸拇長肌、伸食指肌、[[m:brachiorad]]|伸肌群 → **肱骨外上髁**（網球肘）|
- **骨間膜**：把腕部往上傳的力量平分，再傳到肱骨；**腕部的力約 80% 走橈骨**。
- 手肘痛也要往上看神經（C8 → 高爾夫球肘、T3 → 網球肘，見神經分類）。
**神經卡壓（筆記）**
- **正中神經**可能被卡的地方：頸椎 → 前、中斜角肌 → 鎖骨（鎖骨下肌）→ 肩關節 → 胸小肌 → 肱二頭肌 → 旋前圓肌 → 手腕隧道（腕隧道症候群）。手麻要沿這條路一段一段找。
- **橈神經**損傷會**垂腕**；橈神經會穿過 [[m:supinator]]。
- 橈骨的支撐力學比較大（約 80%），尺骨約 20%，透過骨間膜的分力平衡再傳到肱骨。` },
  { id: 'k-knee-more', cat: '膝', src: '課堂筆記（膝關節）', title: '膝關節補充：角度、半月板、膕肌、交鎖', tags: ['X 型腿', 'O 型腿', '半月板', '鵝足', '膕肌', '交鎖', '十字韌帶', '關節囊', '髕骨'], muscles: ['popliteus', 'sartorius', 'adductors', 'hamstrings'], points: ['BL40', 'SP9', 'LR8'], regions: ['knee', 'hip', 'ankle'],
    body: `- **角度**：股骨頸約 125°；股骨與脛骨夾角約 170–175°。**< 175° 為 X 型（膝外翻），> 175° 為 O 型（膝內翻）**（筆記）。
- **半月板**：**內 C 外 O**。功能：增加本體感覺、減少關節活動時的壓力、潤滑關節軟骨、維持穩定與協調。**內側半月板較容易破裂**。
  - 內半月板：中部與內側副韌帶相連；內側副韌帶—內側關節囊—半膜肌肌腱相連。
  - 外半月板：屈膝時 [[m:popliteus]] 與膕弓韌帶把半月板往後拉，避免被擠壓；股二頭肌長頭與外側副韌帶有分支同腱。
- **鵝足**：縫匠肌、股薄肌、半腱肌。
- **髕骨**是人體最大的種子骨。
- [[m:popliteus]] 會拉到內側半月板，後十字韌帶也容易受膕肌影響；**膝伸直最後 30° 時脛骨向外轉約 10°**（鎖住膝）。
- **前後十字韌帶**防止脛骨前後移位；韌帶檢查移位**超過 0.8 cm＝韌帶斷裂損傷**（筆記），請轉介。
- **關節囊**：避震、潤滑關節、本體感覺。
- **急性充血／積水**：結構＋循環（鼠蹊韌帶）一起看。
- **膝交鎖（螺旋交鎖）**：十字韌帶損傷、軟骨剝落（關節鼠）、髕骨不在滑軌上。` },
  { id: 'k-shoulder-joints', cat: '頸肩', src: '課堂筆記（肩）', title: '肩的關節與肩胛骨動作肌', tags: ['胸鎖關節', '肩鎖關節', '肩胛胸廓', '盂肱關節', '肩胛', '上提', '下壓', '前突', '後縮', '上旋', '下旋', '滾動', '滑動'], muscles: ['trap_u', 'trap_m', 'trap_l', 'levator', 'rhomboid', 'serratus', 'pec_minor', 'lat', 'subscap', 'deltoid'], regions: ['shoulder', 'scap'],
    body: `**肩的關節（胸骨、鎖骨、肩胛骨、肋骨）**
- 胸鎖關節 → 馬鞍關節
- 肩峰鎖骨關節
- 肩胛胸廓關節 → 平面關節（相關：豎脊肌、胸髂肋肌、[[m:subscap]]、[[m:serratus]]）
- 盂肱關節；[[m:deltoid]]
**肩胛骨的動作肌（筆記）**
|動作|肌肉|
|---|---|
|上提|[[m:trap_u]]、[[m:levator]]、[[m:rhomboid]]|
|下壓|[[m:trap_l]]、[[m:lat]]、鎖骨下肌、[[m:pec_minor]]|
|前突|[[m:serratus]]|
|後縮|[[m:trap_m]]、[[m:rhomboid]]|
|向上旋轉|[[m:trap_u]]、[[m:trap_l]]、[[m:serratus]]|
|向下旋轉|[[m:rhomboid]]、[[m:pec_minor]]|
- **只要會動的骨頭（杵臼關節）都是先滾動再滑動**。` },
  { id: 'k-meridian-theory', cat: '經筋', src: '課堂筆記（經絡、經筋、營衛、痹症）', title: '經絡與經筋、營衛、痹症與四季', tags: ['經絡', '經筋', '營衛', '痹症', '行痹', '痛痹', '著痹', '四季', '張介賓'], regions: ['head'],
    body: `- **經絡**：出入臟腑，營行表裡，以次相傳。
- **經筋**：肝主筋，其華在爪；盛於輔骨，結於肘腕，係於肌肉，上於頸項，終於頭面——「連綴百骸，維絡周身，各有定位」（張介賓）。
- **十二經筋為十二經絡所濡養的肌肉軟組織**；「有諸內必行於外」。
- **營**行脈中，屬陰（肺、寅時起）；**衛**行脈外，屬陽。
**經筋 → 痹症**：風勝為**行痹**、寒勝為**痛痹**、濕勝為**著痹**。
|季節|五行・臟|所主|筆記|
|---|---|---|---|
|春（正、二、三月）|木・肝|筋|春痹 → 脹、多飲、頻尿|
|夏（四、五、六月）|火・心|血脈|夏痹 → 舍於心（噫氣、灼津液、心煩）|
|長夏|土・脾|肌肉||
|秋（七、八、九月）|金・肺|皮|秋痹 → 肺氣不降：嘔吐|
|冬（十、十一、十二月）|水・腎|骨|冬痹 → 骨失養而萎，不能站立，「脊以代頭、尻以代踵」|` },

  // ================= 筆記補充（第三批）=================
  { id: 'k-principles2', cat: '原則', src: '課堂筆記', title: '臨床大原則：誰跟著誰走', tags: ['大方向', '跟著走', '虛', '最容易出狀況', 'T4', 'T12', 'T1', '枕下', '全息'], regions: ['pelvis', 'scap', 'sacrum', 'occ', 'tspine', 'lspine'],
    body: `- **症狀越嚴重，越要考慮大方向**（先看整體結構，不要只盯著痛點）。
- **最容易出狀況的地方**：腰薦、T4、T12、T1、枕下。
- **虛的人**：縱取、點放（手法輕、點到為止）。
- **誰跟著誰走（筆記）**
  - 腳跟著骨盆走；肩胛跟著骨盆走；手跟著肩膀走。
  - 薦椎跟著枕骨走；臉跟著結構走。
- 骨性對應：**鎖骨 → 恥骨 → 腓骨 → 顴骨**。
- **骨頭只要有變動，一定一緊一鬆**；緊的那邊就影響血循、氣滯。
- 「經之所過，病之所治」；「病在外，必傷於內」；查：全息一律。` },
  { id: 'k-eval-0903', cat: '評估', src: '課堂筆記 9/3', title: '評估流程：正面 → 臥姿，腳 → 骨盆 → 薦椎', tags: ['評估', '長短腳', '骨盆', '薦椎', '摸脖子', '坐著抬腿', '甲亢'], muscles: ['glute_max', 'hamstrings', 'erector'], regions: ['pelvis', 'sacrum', 'foot', 'scap', 'cspine'],
    body: `**流程（筆記）**
1. 正面開始：看長短腳。
2. 臥著再看長短腳。
3. 骨盆 → 薦椎。
- 順序原則：**腳 → 骨盆 → 薦椎**。
- **摸脖子**：判斷經絡的走向。
- **正面（站／坐）看**：足踝、骨盆、肩胛。**臥姿做**：薦髂、矯正。
- 實戰從正面看；測量時臥著看骨盆（檢查）。
**坐著抬腿的肌肉啟動順序（筆記）**：臀大肌 → 股二頭肌 → 對側豎脊肌 → 同側豎脊肌。
- 腹腔問題：看骨盆、腳的經絡、腹腔內。
- 筆記：甲亢 → T2–T4。` },
  { id: 'k-breath-muscles', cat: '脊椎', src: '課堂筆記（呼吸）', title: '呼吸相關肌：背部三段與前側', tags: ['呼吸', '後下鋸肌', '後上鋸肌', '旋轉肌', '橫膈', '斜角肌', '二腹肌'], muscles: ['erector', 'multifidus', 'ext_oblique', 'int_oblique', 'rectus_abd', 'iliopsoas', 'ql', 'scalene', 'diaphragm'], regions: ['tspine', 'diaphragm', 'cspine'],
    body: `**背部**
- **下段：後下鋸肌**——吸氣時往上推（作用是吐氣時下拉肋骨）。
- **上段：後上鋸肌**——吸氣時往下推。
- **中段**：脊柱兩旁凹窩的細筋＆對側髂肋肌（淺）；脊柱兩旁凹窩找突出一丸的筋結（旋轉肌，深）。
**前側**
- 髂棘到肋骨：[[m:ext_oblique]]、[[m:int_oblique]]、腹橫肌、[[m:rectus_abd]]。
- 膈肌角腰部（T12、L1 脊柱前）：[[m:iliopsoas]]（腰大肌）、[[m:ql]] 都會影響（[[m:diaphragm]]）。
- 鎖骨下、第 2 肋骨：**前斜角肌**（最多）（[[m:scalene]]）。
- 二腹肌前腹：下頜按著，嘴巴開合，合起來時往上梳。` },
  { id: 'k-menstrual', cat: '中醫基礎', src: '課堂筆記', title: '經痛的推拿思路', tags: ['經痛', '錐狀肌', '子宮圓韌帶', '氣不足', '血不足', '血崩'], muscles: ['rectus_abd', 'adductors'], points: ['SP6', 'CV4', 'BL32'], regions: ['pelvis', 'pubis', 'sacrum'],
    body: `- 經痛處理：**骨盆、錐狀肌、子宮圓韌帶（斜拔）**。
- 經前痛：氣不足；經期痛：血不足；經後痛：氣血兩虛。
- 血崩：耳上一／兩橫指（筆記註：中腦、小腦）。
- 婦科症狀仍應就醫；孕期禁忌穴見「懷孕、產後與骨盆」。` },
  { id: 'k-five', cat: '中醫基礎', src: '課堂筆記', title: '五行對照表與相生相剋', tags: ['五行', '肝', '心', '脾', '肺', '腎', '相生', '相剋', '相侮', '情志'],
    body: `|五行|臟|竅|體|色|味|志|液|氣|化|
|---|---|---|---|---|---|---|---|---|---|
|木|肝|目|筋（爪）|青|酸|怒|淚|風|生|
|火|心|舌|脈（面）|紅|苦|喜|汗|熱|長|
|土|脾|口（唇）|肌|黃|甘|思|涎|濕|化|
|金|肺|鼻|皮毛|白|辛|悲（憂）|涕|燥|收|
|水|腎|耳|骨（髮）|黑|鹹|恐|唾|寒|藏|
- 簡記：水—腎→耳→骨；木—肝→目→筋；火—心→舌→血；金—肺→鼻→皮毛；土—脾→口→肌。
- 筆記：肝 → 筋（肌腱韌帶）→ 白；脾 → 肌肉 → 紅；腎 → 骨 → 黑。
- 筋 → 木 → 肝；水（腎）生木（肝）。**腎水不足，無法滋肝**（肝火旺、心火旺）；心腎不交 → 交泰丸。
- **相生相剋無大疾，相侮必重病**。` },
  { id: 'k-tongue', cat: '中醫基礎', src: '課堂筆記', title: '舌診速查', tags: ['舌診', '舌尖紅', '舌苔', '齒痕', '脾濕', '肝火'],
    body: `|舌象|對應|

  { id: 'k-sinew-terms', cat: '經筋', src: '課堂筆記（經筋）', title: '經筋的起、結、佈、散與足趾對應', tags: ['經筋', '起', '結', '佈', '散', '足趾', '五爪', '點到線', '面到片'], regions: ['foot'],
    body: `- 肝主筋，其華在爪：**起於五爪，盛於輔骨，結於肘腕，係於關節，上於頸項，終於頭面**（點到線）。

- **經筋**：聯綴百骸，維絡周身，各有定位——屬**陽**，指一切的功能活動；受十二經脈所濡養的肌肉軟組織（面到片）。

|結|結聚——關節、氣節|

**足趾與經筋（筆記）**
|位置|經筋|

**手三陰的「結」（筆記）**：肺經筋入缺盆、結於膈、散於脅肋；心包經筋經膈、結於膈下；心經筋經膈、結於臍（由臍入裡）。` },
  { id: 'k-back-shu', cat: '經絡穴位', src: '課堂筆記（膀胱經）', title: '背俞穴與脊椎節段對照', tags: ['背俞穴', '膀胱經', '大杼', '膈俞', '肝俞', '腎俞', '八髎', '節段'], points: ['BL11', 'BL12', 'BL13', 'BL14', 'BL15', 'BL16', 'BL17', 'EX-B3', 'BL18', 'BL19', 'BL20', 'BL21', 'BL22', 'BL23', 'BL24', 'BL25', 'BL26', 'BL27', 'BL28', 'BL31', 'BL32', 'BL33', 'BL34'], regions: ['tspine', 'lspine', 'sacrum'],

  { id: 'k-spinal-canal', cat: '神經', src: '課堂筆記', title: '硬脊膜、椎管與 BBB', tags: ['硬脊膜', '椎管', 'BBB', '轉移痛', '麻痛'], regions: ['cspine', 'tspine', 'lspine'],

  // ================= 筆記補充（第四批）=================
  { id: 'k-gh', cat: '頸肩', src: '課堂筆記（傳）', title: '盂肱關節（GH）：動作、肌肉、神經與滑動方向', tags: ['盂肱關節', 'GH', '屈曲', '伸直', '外展', '內收', '外轉', '內轉', '腋神經', '肌皮神經', '橈神經', '肩胛上神經', '滑動', '大結節', '小結節'], muscles: ['deltoid', 'biceps', 'triceps', 'lat', 'teres_major', 'supraspinatus', 'pec_major', 'infraspinatus', 'teres_minor', 'subscap'], regions: ['shoulder'],
    body: `|動作|肌肉（神經）|
|---|---|
|屈曲（前屈）|[[m:deltoid]] 前束（腋）、[[m:biceps]]（肌皮）、喙肱肌（肌皮）、[[m:pec_major]] 鎖骨頭|
|伸直|[[m:deltoid]] 後束（腋）、[[m:triceps]] 長頭（橈）、[[m:lat]]（胸背）、[[m:teres_major]]（肩胛下）、胸大肌|
|外展|[[m:deltoid]] 中束（腋）、[[m:supraspinatus]]（肩胛上）、前三角肌|
|內收|喙肱肌（肌皮）、[[m:pec_major]]（胸）、[[m:lat]]（胸背）、大圓肌|
|外轉|[[m:infraspinatus]]（肩胛上）、[[m:teres_minor]]（腋）、三角肌後束（腋）|
|內轉|[[m:subscap]]（肩胛下）、[[m:lat]]（胸背）、[[m:teres_major]]（肩胛下）、[[m:pec_major]]（胸）、前三角肌|
**肱骨頭的滑動方向（凹凸定律）**
|肱骨頭滑動|對應動作|
|---|---|
|向前|伸直、外轉、水平外展|
|向後|屈曲、內轉、水平內收|
|向下|外展|
|向上|內收|
- 喙肱肌的功效：把手臂拉靠近中線。
- 肱骨大結節連的是外轉肌（棘上、棘下、小圓），小結節連的是內轉肌（肩胛下）。
- **旋轉肌袖**＝棘上、棘下、小圓、肩胛下肌：穩定肱骨於盂肱關節、驅動肱骨內外轉。` },
  { id: 'k-shoulder-complex', cat: '頸肩', src: '課堂筆記（傳）', title: '肩複合體：五個關節、韌帶與鎖骨的滑動', tags: ['GH', 'SC', 'AC', 'ST', '肱上關節', '喙鎖韌帶', '胸鎖關節', '馬鞍', '脫臼', '肩夾擠', '翼狀肩胛'], muscles: ['supraspinatus', 'biceps', 'deltoid', 'serratus'], regions: ['shoulder', 'scap'],
    body: `**肩關節的五個關節**：盂肱關節（GH）、胸鎖關節（SC）、肩峰鎖骨關節（AC）、肱上關節（suprahumeral joint）、肩胛胸廓關節（ST，唯一沒有關節面）。
- **只要肱骨有動，鎖骨與肩胛一定連動**；ST 的動作＝SC＋AC。
- **防止肩關節脫臼**：韌帶——喙肱韌帶、盂肱韌帶、肱橫韌帶、囊狀韌帶；肌腱——[[m:supraspinatus]]、[[m:biceps]] 長頭。
- 「斜方韌帶」＋「圓錐韌帶」合稱**喙鎖韌帶**。
- **AC 的動作**：上下旋轉、水平旋轉、前後傾斜。
**胸鎖關節（SC）：馬鞍狀、3 個自由度**
- 韌帶：胸鎖韌帶（前部份、後部份、骨間）、鎖骨間韌帶（U 形）、肋胸韌帶、肋鎖韌帶。
- 軸：矢狀軸 → 上抬／下降；垂直軸 → 前突／後縮；鎖骨長軸 → 旋轉。
|鎖骨動作|關節面滑動|
|---|---|
|向上|向下滑動|
|向下|向上滑動|
|前突|前滑動|
|後縮|後滑動|
|旋轉|旋轉|
- 規則：鎖骨上下動時關節面**反向**滑動；前突後縮時**同向**滑動。
**肩夾擠症候群（筆記）**：初期 → [[m:deltoid]]；中期 → [[m:supraspinatus]]；深層 → 肩鎖相對位置（滑動）。
- [[m:serratus]] 無力 → 翼狀肩胛（天使翼）。` },
  { id: 'k-st-nerves', cat: '頸肩', src: '課堂筆記（傳）', title: '肩胛胸廓關節（ST）：動作、肌肉與神經', tags: ['肩胛胸廓', 'ST', '副神經', '肩胛背神經', '長胸神經', '胸神經', '上提', '下壓'], muscles: ['trap_u', 'trap_m', 'trap_l', 'levator', 'rhomboid', 'serratus', 'pec_minor', 'lat'], regions: ['scap'],
    body: `|肩胛動作|肌肉（神經）|
|---|---|
|上提|[[m:trap_u]]（副）、[[m:levator]]（肩胛背）、[[m:rhomboid]] 輔助（肩胛背）|

|下轉|[[m:levator]]、[[m:rhomboid]]（肩胛背）、[[m:pec_minor]]（胸）|
- 附著在肩胛骨的肌肉（筆記）：斜方肌上中下、提肩胛肌、大小菱形肌、闊背肌、大小圓肌、喙肱肌、胸小肌、鎖骨下肌、棘上下肌、前鋸肌、肩胛下肌、肱二頭肌、三角肌。` },
  { id: 'k-nerve-test', cat: '神經', src: '課堂筆記', title: '神經節段快速檢查（C／T／L／S）', tags: ['神經', '肌節', '皮節', '乳頭', 'T4', 'T10', '臍', 'L3', 'S1', '尾骨', '膈神經', '迷走神經'], regions: ['cspine', 'tspine', 'lspine', 'sacrum'],
    body: `|節段|檢查動作或位置（筆記）|
|---|---|
|C1、C2|點頭|
|C3|側彎|
|C4|聳肩|
|C5|肩外展|
|C6|橈神經區|

- 另一頁筆記：L5 神經支配沿小腿外側到足背；L5–S1 的壓迫可能壓到 L5 或 S1。
- 膈神經：胃脹、打嗝；另記喉返神經、迷走神經。肋間神經（筆記：C2、T1–T3）。` },
  { id: 'k-iliolumbar', cat: '薦椎', src: '課堂筆記（師叔）', title: '髂腰橫韌帶與薦椎內壓：處理順序', tags: ['髂腰韌帶', '髂腰橫韌帶', '薦椎', '內壓', '腰椎滑脫', '坐骨神經', '腹內壓', 'P+EX'], muscles: ['erector', 'ql', 'iliopsoas', 'piriformis', 'hamstrings'], regions: ['sacrum', 'lspine', 'pelvis', 'ankle'],
    body: `**髂腰橫韌帶**：髂骨與腰椎橫突連接的韌帶，影響腰椎側彎、旋轉。
**處理順序（師叔）**
1. 薦椎 S1、S2、S3 的內壓要解除。
2. 薦椎旁邊的溝槽、[[m:erector]] 解除。
3. 薦髂關節與副側韌帶解除。
4. 才能解到髂腰橫韌帶 → 腰椎。
**內外壓的主要肌肉**
|部位|肌肉|
|---|---|
|骨盆外壓|[[m:ql]]|
|骨盆內壓|[[m:iliopsoas]]（髂腰肌）|
|薦椎外壓|[[m:erector]]|
|薦椎內壓|[[m:iliopsoas]]：附著小轉子造成 X 型腿；轉子一動拉動 [[m:piriformis]]，梨狀肌再拉薦椎|
**坐骨神經的兩條線**
- 腰椎線：股二頭肌 → 薦結節（韌帶）→ 副側韌帶 → 髂腰橫韌帶 → 腰椎側彎、旋轉（L4、L5）。
- 梨狀肌線：骨盆。
**其他筆記**
- **P＋EX 時髂腰韌帶被拉長**；腰椎往前滑脫（L3、L4）時髂腰韌帶也被拉長。
- 側屈、旋轉、下壓是髂腰韌帶的加重因子；髂腰韌帶會造成腹內壓：往上 → 脊柱側彎，往下 → 髂骨咬死、影響跟骨。
- 髂腰韌帶影響：同側外踝、對側內踝。
- **後枕骨與薦椎**：枕骨 —（膀胱經，像一條繩子）— 薦椎。枕骨的三角 ↔ 薦椎的三角；鎖骨的三角 ↔ 恥骨的三角。
- 骨頭支撐結構，造成腔壓；鼠蹊痛要注意骨盆（薦椎角度）。` },
  { id: 'k-eval-order', cat: '評估', src: '課堂筆記（我）', title: '從薦椎開始的全身檢查順序', tags: ['檢查順序', '薦椎', 'S2', '轉子', '腓骨後移位', '脛骨前移位', '距骨', '胸椎 8 9 10', '頭狀骨'], regions: ['sacrum', 'pelvis', 'hip', 'knee', 'ankle', 'foot', 'lspine', 'tspine', 'scap'],
    body: `1. **先看薦椎有沒有歪斜**。
2. 沒歪 → 看 S2 對出去的髂後上棘（髂骨對薦椎）。

window.KB_ITEMS.push(...[{"id":"b-overview","cat":"原則","src":"參考書比對","title":"參考書與課程理論：衝突總覽","body":"目前已整理 5 本參考書（《經筋手療法圖解》、《四肢手療法（圖解）》、《經穴大全》、《脊椎手療法圖解》、《整脊醫學》），共比對 110 項：衝突 27、程度差異 23、用詞不同 16、補充 44。\n\n### 取捨原則\n- **安全優先**：書中涉及衝擊性矯正、脫位整復、放血或對婦科／攝護腺疾病的療效宣稱，一律以課堂的「先轉介、只做周邊放鬆」為準。\n- **定位以現行標準為準**：穴位定位以 WHO／WPRO 標準（《經穴大全》）為準，本站的穴位資料已依此修正。\n- **用詞不同不等於衝突**：書以股骨動作命名（內旋／外旋肌），課堂以髂骨相對 S2 的位置命名（EX／IN），對應的肌肉其實一致。\n- 有疑問時，用課堂的主動／被動測試與觸診實際確認，再決定處理哪一側。\n\n### 嚴重度「高」\n- **滑脫椎體的衝擊手法**（《經筋手療法圖解》p.181（另見 p.178））：滑脫屬結構不穩（峽部斷裂或退化），衝擊性手法可能加重滑移或壓迫神經根、馬尾；現代臨床指引不支持以徒手衝擊「歸位」。推拿師不操作，先轉介影像與醫師評估，推拿只做周邊肌肉放鬆。\n- **侵入性處置（膝窩放血）**（《經筋手療法圖解》p.276）：放血屬醫療行為，推拿師不得操作，也有感染與出血風險。可保留本書的觀察（足跟痛與膝窩、足太陽路線相關），改成輕柔的膝窩與小腿後側放鬆。\n- **骨盆不對稱與婦科、攝護腺疾病；骨盆腔深壓**（《經筋手療法圖解》p.188、207–210）：課堂說的是「可能關聯」，本書寫成直接因果，沒有研究支持，不能用來對客人解釋病因。骨盆腔深壓接近髂血管、膀胱與生殖器官，涉及隱私，需事先說明並取得同意；孕婦、經期大量出血、腹部術後、疑似腫瘤者禁止。\n- **神經根問題用脊椎扳法處理**（《四肢手療法（圖解）》p.11、182–183、304–305）：以觸診橫突位置判斷神經根受壓缺乏可靠性，真正的神經根病變（椎間盤突出、狹窄）用扭轉衝擊手法可能加重，馬尾症狀更是急症。推拿師遇到放射痛、麻木無力、反射改變時依課堂轉介；腰旁軟組織放鬆可以做，扳法交給有執照且經影像評估的人員。\n- **脫位的徒手整復**（《四肢手療法（圖解）》p.27–30、90–91、218–226、319–320）：脫位常合併骨折、血管神經損傷，復位前需要影像，髖脫位更需醫院處理。課堂原則較站得住：推拿師只需認得外觀、固定並轉介，不操作復位。\n- **頸椎旋轉衝擊與「安全檢查」**（《脊椎手療法圖解》p.35–37、40–47、323）：本書比課堂多了禁忌清單，這部分值得保留。但後仰旋轉測試對頸動脈剝離、椎基底動脈問題的偵測力很差：通過不代表安全，持續的後仰旋轉本身也可能誘發症狀。頸部高速旋轉扳動有罕見但嚴重的中風風險，推拿師不做；頸部以軟組織放鬆、溫和牽引（本書的毛巾牽引）為限。出現頭暈、視覺異常、說話不清時停止並轉介。\n- **S4–S5：大小便失控、肛門麻木**（《脊椎手療法圖解》p.244）：這組症狀是脊椎急症的典型表現，延誤可能造成永久的大小便與性功能障礙，必須當天轉介急診。不能當成矯正的適應症。課堂的處理方式正確。\n- **經肛門的尾骨矯正**（《脊椎手療法圖解》p.306）：屬侵入性處置，有感染、黏膜受傷與法律責任問題，在台灣不屬於推拿或民俗調理的範圍。同一頁作者也說：不是近期撞擊造成的尾骨痛，放鬆內外側軟組織就能改善。推拿只做臀部與薦尾韌帶的體外放鬆；近期撞傷或疑骨折要轉介。\n- **乾針、水針處理激痛點**（《脊椎手療法圖解》p.321）：針刺與注射屬醫療行為，推拿師不做。書中可直接採用的是拇指按壓 5 秒、冰塊橫推不超過 3 分鐘這類非侵入方法。\n- **矯正可治癒內科疾病的宣稱**（《脊椎手療法圖解》p.319–321）：這些說法沒有可靠的研究支持，照著說可能延誤客人就醫，也可能觸犯醫療廣告相關法規。網站與對客人說明時只能用課堂的口徑：「可能有關、當作找問題的線索」，並建議就醫。\n- **椎間盤突出：長期旋轉矯正與麻醉下矯正**（《脊椎手療法圖解》p.321–322）：反覆高頻率的旋轉衝擊可能加重突出或神經根壓迫；麻醉下矯正失去病人的保護反應，是醫院內的醫療處置。推拿依課堂原則：有神經症狀先轉介，只做周邊放鬆與溫和牽引。\n- **腰椎滑脫的腰薦按壓法**（《脊椎手療法圖解》p.230）：滑脫是峽部斷裂或退化造成的不穩定，從後往前壓會增加往前滑的力，再加頓力風險更高。與《經筋手療法圖解》的滑脫頓壓法同屬高風險，推拿師不在滑脫節段施壓；先轉介影像確認，只做周邊肌肉放鬆與核心訓練建議。\n- **頸椎旋轉衝擊：安全檢查與硬端**（《整脊醫學》p.75–77、83–87、236）：與《脊椎手療法圖解》相同。後仰旋轉測試不能排除椎動脈風險，推拿師不做頸部快速旋轉扳動。「摸到硬端就停」這條值得保留，一般被動活動也適用。\n- **尾椎體內矯正**（《整脊醫學》p.206–207）：侵入性處置，屬醫療行為，推拿不做。尾骨痛只做臀部、骨盆外部的軟組織放鬆；跌坐後劇痛先排除骨折。與《脊椎手療法圖解》同列為高。\n- **矯正治療內科、婦科病與治癒率**（《整脊醫學》p.20–22、214–216、232–235、238–318）：沒有可靠證據，對外絕不能這樣宣稱，也不能讓客人因此延誤就醫。網站引用本書節段與臟腑的對應時，維持課堂寫法：「往哪裡找的線索，不是診斷」。\n- **嬰幼兒的脊椎處理**（《整脊醫學》p.303–304）：嬰幼兒哭鬧、吃睡不好可能是發燒、感染、腸胃等需要醫師評估的問題；推拿師不為嬰幼兒做脊椎推動，請家長先就醫。\n- **椎間盤突出：長期旋轉矯正與麻醉下矯正**（《整脊醫學》p.234–235）：與課堂相反，和《脊椎手療法圖解》同一段落相同。推拿只做周邊放鬆，麻醉下操作屬醫療行為。\n- **腰椎滑脫與高風險腰部手法**（《整脊醫學》p.152、155–156）：滑脫屬結構不穩，推拿不在該節段施壓、不做後仰或衝擊；猛拉、揹背顛甩的力量無法控制，推拿不採用。\n\n### 嚴重度「中」\n- **半月板哪一側容易受傷**（《經筋手療法圖解》p.245，衝突）\n- **經筋循行的範圍**（《經筋手療法圖解》p.9–16，衝突）\n- **伸髖受限側的腳跟高低 vs 長短腳**（《經筋手療法圖解》p.218，用詞不同）\n- **骨盆評估要不要分方向**（《經筋手療法圖解》p.193–196，程度差異）\n- **腰椎側彎的來源**（《經筋手療法圖解》p.167、172–174，程度差異）\n- **椎間盤突出的轉介與手法**（《經筋手療法圖解》p.175–178，程度差異）\n- **坐骨神經痛的鑑別**（《經筋手療法圖解》p.199–202，補充）\n- **高血壓與胸腔壓力**（《經筋手療法圖解》p.283–284，程度差異）\n- **受限時該處理哪一側的肌肉**（《四肢手療法（圖解）》p.176、206、300–305（各章同一邏輯），衝突）\n- **X／O 型腿的處理方向**（《四肢手療法（圖解）》p.257–270，衝突）\n- **評估順序：局部 → 神經源，還是地基 → 局部**（《四肢手療法（圖解）》p.11、77、117、175、244、299，程度差異）\n- **腱鞘囊腫壓破**（《四肢手療法（圖解）》p.132–133，衝突）\n- **髖內旋／外旋與骨盆 EX／IN 的命名方向**（《四肢手療法（圖解）》p.174、206–217，用詞不同）\n- **肩外展無力的來源**（《四肢手療法（圖解）》p.8，補充）\n- **腓總神經的按壓安全**（《四肢手療法（圖解）》p.239–240，補充）\n- **SP11 箕門的高度**（《經穴大全》p.63，衝突）\n- **皮節能不能用來決定矯正節段**（《脊椎手療法圖解》p.4–6，程度差異）\n- **L4、L5、S1 的皮節走向**（《脊椎手療法圖解》p.216、222、240，衝突）\n- **矯正前的 X 光**（《脊椎手療法圖解》p.35、313–319，補充）\n- **孕婦能不能做脊椎調整**（《脊椎手療法圖解》p.321，程度差異）\n- **評估與處理的順序**（《脊椎手療法圖解》p.115、322–323，程度差異）\n- **長短腳與第一角度 A／P**（《整脊醫學》p.187–188、197–198、231，衝突）\n- **EX／IN 的判定依據與方向**（《整脊醫學》p.180、186–189，用詞不同）\n- **俯臥屈膝 90° 的足跟方向與股骨旋轉**（《整脊醫學》p.197–198，衝突）\n- **踩踏薦椎**（《整脊醫學》p.182–183，程度差異）\n- **脊椎側彎的處理分級**（《整脊醫學》p.128–130、235，程度差異）\n\n各書的完整比對見：「《經筋手療法圖解》與課程的比對」、「《四肢手療法（圖解）》與課程的比對」、「《經穴大全》與課程的比對」、「《脊椎手療法圖解》與課程的比對」、「《整脊醫學》與課程的比對」。","tags":["參考書","衝突","比對","總覽"]},{"id":"b-jingjin-author","cat":"人物與流派","src":"參考書《經筋手療法圖解》PDF 第
