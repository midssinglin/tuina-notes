<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd3d28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>推拿整復手札</title>
<meta name="description" content="推拿整復課程的評估、連鎖、模擬、3D 與知識庫工具">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>/* 版面概念：診間用的工具書——左側輸入、右側判讀；淡青瓷紙色、墨色字，朱色代表「緊」、靛色代表「被拉長／弱」 */
:root {
  --bg: #eff2ee; --surface: #fafbf8; --surface2: #e5eae4; --ink: #1c2724; --ink2: #475550; --ink3: #74827c; --line: #d2d9d3;
  --jade: #23705d; --jade-soft: #d5e7df; --tight: #bd3d28; --tight-soft: #f5dcd5; --weak: #3254a0; --weak-soft: #dbe3f3;
  --warn: #9b640c; --warn-soft: #f4e6c9; --skin3d: #d2b8a3;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #171f1c; --surface2: #212b27; --ink: #e2e9e5; --ink2: #b0beb8; --ink3: #7f8e88; --line: #2c3833;
    --jade: #5cb79b; --jade-soft: #1c3830; --tight: #ec7660; --tight-soft: #3d221c; --weak: #8aa6ea; --weak-soft: #1c2742;
    --warn: #e2aa4c; --warn-soft: #3a2d16; --skin3d: #9c8574; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #171f1c; --surface2: #212b27; --ink: #e2e9e5; --ink2: #b0beb8; --ink3: #7f8e88; --line: #2c3833;
  --jade: #5cb79b; --jade-soft: #1c3830; --tight: #ec7660; --tight-soft: #3d221c; --weak: #8aa6ea; --weak-soft: #1c2742;
  --warn: #e2aa4c; --warn-soft: #3a2d16; --skin3d: #9c8574; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

/* ---------- 頂欄 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px var(--gut) 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; }
.brand h1 { font-size: 22px; letter-spacing: 0.06em; font-weight: 700; }
.brand .seal { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid var(--tight); color: var(--tight); font-family: var(--f-display); font-size: 13px; border-radius: 4px; transform: translateY(-2px); }
.brand small { color: var(--ink3); font-size: 12px; letter-spacing: 0.04em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 14px 11px; font-size: 15px; color: var(--ink2); border-bottom: 2.5px solid transparent; white-space: nowrap; letter-spacing: 0.04em; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--jade); font-weight: 700; }
.tab .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); margin-right: 5px; }

main { max-width: 1320px; margin: 0 auto; padding: 18px var(--gut) 60px; }
.panel[hidden] { display: none !important; }
.lead { color: var(--ink2); max-width: 70ch; margin: 2px 0 14px; font-size: 14px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 4px; }
.sec-h h2 { font-size: 24px; }

/* ---------- 共用元件 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 14px 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; line-height: 1.35; color: var(--ink); }
button.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--jade-soft); border-color: var(--jade); color: var(--ink); }
.chip .sd { font-family: var(--f-mono); font-size: 11px; background: var(--jade); color: var(--surface); border-radius: 4px; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink3); }
.btn.pri { background: var(--jade); border-color: var(--jade); color: var(--surface); font-weight: 600; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.badge { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.badge.t { background: var(--tight-soft); color: var(--tight); }
.badge.w { background: var(--weak-soft); color: var(--weak); }
.badge.j { background: var(--jade-soft); color: var(--jade); }
.badge.y { background: var(--warn-soft); color: var(--warn); }
.side-b { font-family: var(--f-mono); font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 5px; border: 1px solid currentColor; }
.alert { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); font-size: 14px; }
.alert b { color: var(--warn); }
.muted { color: var(--ink3); }
.small { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sp { flex: 1; }
hr.thin { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.link { background: none; border: 0; padding: 0; color: var(--jade); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.ex-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; }

/* ---------- 評估 ---------- */
.fgroup + .fgroup { margin-top: 14px; }
.fgroup h3 { font-size: 15px; margin-bottom: 7px; display: flex; gap: 8px; align-items: baseline; }
.fgroup h3 .muted { font-family: var(--f-body); font-weight: 400; font-size: 12px; }
.fgroup.red .chip.on { background: var(--warn-soft); border-color: var(--warn); }
.fsearch { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 11px; margin-bottom: 10px; }
.pat { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; }
.pat-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pat-h h4 { font-size: 16.5px; }
.meter { height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; width: 70px; }
.meter i { display: block; height: 100%; background: var(--jade); border-radius: 3px; }
.mlist { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .nm { font-weight: 600; }
.mrow .why { grid-column: 2 / 4; font-size: 13px; color: var(--ink2); }
.rank { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); width: 1.6em; text-align: right; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.res-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.res-h h3 { font-size: 16px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.t { background: var(--tight); } .dot.w { background: var(--weak); } .dot.j { background: var(--jade); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink3); }

/* ---------- 連鎖 ---------- */
.chain-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .chain-wrap { grid-template-columns: minmax(0, 1fr); } }
.chain-svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.chain-svg .body { fill: var(--surface2); stroke: var(--line); }
.chain-svg .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.chain-svg .edge.out { stroke: var(--tight); stroke-width: 2.2; }
.chain-svg .edge.in { stroke: var(--weak); stroke-width: 2.2; stroke-dasharray: 5 4; }
.chain-svg .node circle { fill: var(--surface); stroke: var(--ink3); stroke-width: 1.5; cursor: pointer; }
.chain-svg .node.sel circle { fill: var(--jade); stroke: var(--jade); }
.chain-svg .node.out circle { stroke: var(--tight); stroke-width: 2.5; }
.chain-svg .node.in circle { stroke: var(--weak); stroke-width: 2.5; }
.chain-svg .node text { font-size: 10.5px; fill: var(--ink2); pointer-events: none; font-family: var(--f-body); }
.chain-svg .node.sel text { fill: var(--ink); font-weight: 700; }
.edge-item { padding: 10px 0; border-top: 1px dashed var(--line); }
.edge-item:first-child { border-top: 0; }
.edge-item .to { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid var(--tight); vertical-align: middle; margin-right: 6px; }
.legend i.in { border-top: 2.5px dashed var(--weak); }

/* ---------- 模擬 ---------- */
.sim-wrap { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr) minmax(0, 330px); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .sim-wrap { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); } .sim-res { grid-column: 1 / -1; } }
@media (max-width: 760px) { .sim-wrap { grid-template-columns: minmax(0, 1fr); } }
.ctl { padding: 12px 14px; }
.ctl h3 { font-size: 15px; margin-bottom: 8px; }
.ctl + .ctl { border-top: 1px solid var(--line); }
.slider { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.slider .lab { color: var(--ink2); }
.slider output { font-family: var(--f-mono); font-size: 12px; text-align: right; color: var(--ink2); }
.slider input[type=range] { width: 100%; accent-color: var(--jade); }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin: -2px 3.6em 4px 4.6em; padding-left: 8px; }
.mslider { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; }
.mslider input { width: 100%; accent-color: var(--tight); }
.mslider.head { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); }
.selectbox { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; }
.views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.views figure { margin: 0; }
.views figcaption { font-size: 12px; color: var(--ink3); text-align: center; font-family: var(--f-mono); letter-spacing: 0.06em; }
.pose { width: 100%; height: auto; display: block; }
.pose .bone { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.4; }
.pose .soft { fill: var(--surface2); stroke: none; }
.pose .ln { stroke: var(--ink2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.pose .spine { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.pose .plumb { stroke: var(--jade); stroke-width: 1; stroke-dasharray: 4 4; }
.pose .ref { stroke: var(--ink3); stroke-width: 0.8; stroke-dasharray: 2 3; }
.pose .hot { fill: var(--tight); }
.pose .cool { fill: var(--weak); }
.pose .mk { fill: var(--ink); }
.pose text { font-size: 10px; fill: var(--ink2); font-family: var(--f-body); }
.pose .warn { stroke: var(--tight); stroke-width: 2; fill: none; }
.region-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.region-row:first-child { border-top: 0; }
.sev { display: flex; gap: 3px; margin-top: 4px; }
.sev i { width: 14px; height: 5px; border-radius: 2px; background: var(--surface2); }
.sev i.on { background: var(--tight); }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 13.5px; padding: 3px 0; }
.bar .track { grid-column: 1 / -1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 3px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- 3D ---------- */
.v3-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 14px; height: calc(100vh - 150px); min-height: 520px; }
@media (max-width: 900px) { .v3-wrap { grid-template-columns: minmax(0, 1fr); height: auto; } }
.v3-stage { position: relative; border-radius: var(--r); overflow: hidden; background: radial-gradient(ellipse at 50% 35%, var(--surface) 0%, var(--bg) 75%); border: 1px solid var(--line); min-height: 520px; }
@media (max-width: 900px) { .v3-stage { height: 68vh; } }
.v3-stage canvas { display: block; touch-action: none; }
.v3-tools { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.v3-tools > * { pointer-events: auto; }
.v3-tools .btn { background: color-mix(in srgb, var(--surface) 88%, transparent); }
.v3-tools .btn.on { background: var(--jade-soft); border-color: var(--jade); }
.v3-hint { position: absolute; left: 12px; bottom: 26px; right: 12px; font-size: 12px; color: var(--ink3); pointer-events: none; }
@media (max-width: 600px) { .v3-hint { display: none; } }
.b3-credit { position: absolute; left: 12px; bottom: 8px; font-size: 10.5px; color: var(--ink3); opacity: .85; pointer-events: none; }
.b3-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; color: var(--ink2); }
.b3-ld-t { font-weight: 700; font-size: 15px; }
.b3-ld-s { font-size: 12px; color: var(--ink3); text-align: center; max-width: 80%; }
.b3-ld-bar { width: min(260px, 60%); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.b3-ld-bar i { display: block; height: 100%; width: 0; background: var(--jade); transition: width .2s; }
.v3-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
@media (min-width: 901px) { .v3-side { overflow: hidden; } }
.v3-list { overflow: auto; min-height: 140px; flex: 1; }
@media (max-width: 900px) { .v3-list { max-height: 340px; } }
.v3-list .grp { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink3); padding: 8px 12px 4px; position: sticky; top: 0; background: var(--surface); }
.v3-item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px; font-size: 14px; border-radius: 6px; }
.v3-item:hover { background: var(--surface2); }
.v3-item.on { background: var(--jade-soft); }
.v3-item .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.v3-item .en { color: var(--ink3); font-size: 12px; margin-left: auto; font-family: var(--f-mono); }
.v3-info { max-height: 46vh; overflow: auto; }
@media (max-width: 900px) { .v3-info { max-height: none; } }
.v3-info h3 { font-size: 19px; }
.kv { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 4px 10px; font-size: 13.5px; margin-top: 8px; }
.kv dt { color: var(--ink3); }
.kv dd { margin: 0; }
.b3-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.b3-label { position: absolute; left: 0; top: 0; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; white-space: nowrap; margin: -24px 0 0 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.b3-label.pt { border-color: var(--jade); }
.b3-label.mu { border-color: var(--tight); }
.tension-key { display: flex; gap: 12px; font-size: 12px; color: var(--ink2); align-items: center; }

/* ---------- 知識庫 ---------- */
.kb-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.kb-search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-size: 16px; }
.kb-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.kb-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
@media (max-width: 900px) { .kb-layout { grid-template-columns: minmax(0, 1fr); } }
.kb-list { display: flex; flex-direction: column; gap: 8px; }
.kb-item { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; }
.kb-item:hover { border-color: var(--ink3); }
.kb-item.on { border-color: var(--jade); box-shadow: inset 3px 0 0 var(--jade); }
.kb-item h4 { font-size: 15.5px; font-family: var(--f-body); font-weight: 700; }
.kb-item p { margin: 3px 0 0; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kb-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.kb-detail { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; }
@media (max-width: 900px) { .kb-detail { position: static; max-height: none; } }
.kb-detail h3 { font-size: 21px; margin: 4px 0 8px; }
.prose { font-size: 15px; max-width: 68ch; }
.prose p { margin: 0 0 10px; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 1.3em; }
.prose li { margin: 2px 0; }
.prose strong { color: var(--ink); }
.prose .ref { display: inline; }
.prose table { border-collapse: collapse; font-size: 13.5px; margin: 6px 0 12px; }
.prose td, .prose th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.tblwrap { overflow-x: auto; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.form { display: grid; gap: 10px; }
.form label { font-size: 13px; color: var(--ink2); display: grid; gap: 4px; }
.form input, .form textarea, .form select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
.form textarea { min-height: 150px; resize: vertical; line-height: 1.55; }
.pick { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); }
.pick input { border: 0 !important; padding: 2px 4px !important; }
.pick-res { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; max-height: 120px; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 640px) {
  .brand small { display: none; }
  .brand h1 { font-size: 19px; white-space: nowrap; }
  .top-in { gap: 0 12px; }
  .tabs { margin-left: 0; width: 100%; }
  .tab { padding: 8px 10px 10px; font-size: 14.5px; flex: 1 0 auto; }
  .tab .n { display: none; }
  .sec-h h2 { font-size: 21px; }
  .sim-wrap > .card:nth-child(2) { order: -1; }
  .jump { display: inline-flex !important; }
}
.jump { display: none; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

/* ---------- 帳號 ---------- */
.acct { position: relative; padding-bottom: 6px; align-self: center; }
.acct-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px 3px 3px; max-width: 220px; }
.acct-btn:hover { border-color: var(--ink3); }
.acct-btn img, .acct-av { width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover; }
.acct-av { display: grid; place-items: center; background: var(--jade-soft); color: var(--jade); font-family: var(--f-display); font-size: 12px; }
.acct-av.off { background: var(--surface2); color: var(--ink3); }
.acct-t { display: grid; text-align: left; line-height: 1.15; min-width: 0; }
.acct-t b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-t small { font-size: 11px; color: var(--ink3); white-space: nowrap; }
.acct-t small.role-owner, .acct-t small.role-admin { color: var(--jade); }
.acct-t small.role-member { color: var(--warn); }
.acct-pop { position: absolute; right: 0; top: calc(100% + 4px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.16); z-index: 40; }
.acct-pop h4 { font-size: 17px; margin: 2px 0 4px; }
.acct-pop p { margin: 0; }
.acct-rights { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 5px; font-size: 13.5px; }
.acct-rights li { display: flex; gap: 8px; align-items: baseline; }
.acct-ok { font-family: var(--f-mono); font-size: 12px; width: 16px; flex: none; text-align: center; }
.acct-ok.y { color: var(--jade); } .acct-ok.n { color: var(--ink3); }
.tab-lock { font-family: var(--f-display); font-size: 10px; border: 1px solid var(--ink3); color: var(--ink3); border-radius: 3px; padding: 0 2px; margin-left: 4px; vertical-align: 2px; }
@media (max-width: 640px) {
  .brand { order: 0; } .acct { order: 1; margin-left: auto; padding-bottom: 4px; } .tabs { order: 2; }
  .acct-t small { display: none; } .acct-btn { padding-right: 9px; max-width: 120px; }
}

/* ---------- 鎖定、輔助輸入 ---------- */
.lock-card { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 20px; background: var(--surface); max-width: 560px; }
.lock-card h3 { font-size: 20px; margin: 8px 0 6px; }
.lock-ic { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1.5px solid var(--ink3); color: var(--ink2); border-radius: 6px; font-family: var(--f-display); }
.ai-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 2px; padding: 8px 10px; border-radius: 8px; background: var(--surface2); }
.ai-bar .btn.on { background: var(--tight-soft); border-color: var(--tight); color: var(--tight); }
.ai-status { min-height: 1.2em; color: var(--jade); margin-top: 4px; }
.alert.info { background: var(--jade-soft); border-left-color: var(--jade); }
.chip.sm { padding: 2px 9px; font-size: 12.5px; }
.chip .cnt { font-family: var(--f-mono); font-size: 11px; background: var(--tight); color: var(--surface); border-radius: 999px; padding: 0 6px; }
.chip.src.lock::before { content: "鎖"; font-family: var(--f-display); font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 2px; opacity: .6; }
.kb-filters.sub { align-items: center; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tx-lab { margin-left: 8px; }
.tx-sel select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; }
.tx-note { margin: 0 0 4px; }
.kb-item.tx h4 { font-size: 14px; }
.kb-item.tx p { -webkit-line-clamp: 3; }
.kb-hint { text-align: left; border: 1px dashed var(--jade); background: var(--jade-soft); border-radius: var(--r); padding: 8px 12px; font-size: 13.5px; }
.tx-text { font-size: 15px; line-height: 1.85; }
.tx-lecs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.tx-lec { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; }
.tx-lec:hover, .tx-lec.on { border-color: var(--jade); }
.tx-mini { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.tx-mini:hover { border-color: var(--jade); }

/* ---------- 個案 ---------- */
.case-layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .case-layout { grid-template-columns: minmax(0, 1fr); } }
.case-item { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 11px; margin-bottom: 6px; }
.case-item:hover { border-color: var(--ink3); }
.case-item.on { border-color: var(--jade); box-shadow: inset 3px 0 0 var(--jade); }
.case-item.appt { display: flex; gap: 10px; align-items: baseline; background: var(--jade-soft); border-color: transparent; }
.case-item.appt .when { font-size: 12.5px; color: var(--jade); }
.case-item .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-main h3 { font-family: var(--f-display); }
.case-main .kv { grid-template-columns: 5.5em minmax(0, 1fr); }
.pre { white-space: pre-wrap; }
.visit { border-left: 2px solid var(--line); padding: 4px 0 4px 12px; margin: 10px 0; }
.visit p { margin: 4px 0 0; }
.visit-form { margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--surface2); }
.visit-form textarea { min-height: 70px; }

.kb-filters[hidden] { display: none !important; }
.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.ai-status:empty { display: none; }

/* ---------- 後台 ---------- */
.tab[hidden], .btn[hidden] { display: none !important; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat b { font-family: var(--f-display); font-size: 26px; display: block; margin-top: 2px; }
.mem-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .mem-list { grid-template-columns: minmax(0, 1fr); } }
.mem-av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; }
.mem-kv { grid-template-columns: 5em minmax(0, 1fr); font-size: 13px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 7px 8px; font-size: 13.5px; color: var(--ink2); }
.seg button.on { background: var(--jade-soft); color: var(--ink); font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }

/* ---------- 知識庫示意圖 ---------- */
.kb-fig { margin: 10px 0 14px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.kb-fig svg { display: block; width: 100%; height: auto; max-height: 420px; }
.kb-fig figcaption { font-size: 12.5px; color: var(--ink3); margin-top: 6px; }
.kb-fig .f-ink { stroke: var(--ink); fill: none; }
.kb-fig .f-ink2 { stroke: var(--ink2); fill: none; }
.kb-fig .f-line { stroke: var(--line); fill: none; }
.kb-fig .f-jade { stroke: var(--jade); fill: none; }
.kb-fig .f-jadef { fill: var(--jade-soft); stroke: var(--jade); }
.kb-fig .f-tight { stroke: var(--tight); fill: none; }
.kb-fig .f-tightf { fill: var(--tight-soft); stroke: var(--tight); }
.kb-fig .f-weak { stroke: var(--weak); fill: none; }
.kb-fig .f-weakf { fill: var(--weak-soft); stroke: var(--weak); }
.kb-fig .f-bone { fill: var(--surface2); stroke: var(--ink3); }
.kb-fig text { fill: var(--ink2); font-size: 12px; font-family: var(--f-body); }
.kb-fig text.t { fill: var(--ink); font-weight: 700; }
.kb-fig text.r { fill: var(--tight); } .kb-fig text.b { fill: var(--weak); } .kb-fig text.j { fill: var(--jade); }
.kb-conflict { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; }

/* ---------- 評估 v2：分站、人形圖、處理建議 ---------- */
.as-steps { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; padding: 2px; scroll-margin-top: 80px; }
.as-steps::-webkit-scrollbar { display: none; }
.as-step { flex: 1 0 auto; min-width: 104px; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px; }
.as-step .no { grid-row: 1 / 3; font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink3); }
.as-step .nm { font-weight: 700; font-family: var(--f-display); font-size: 14.5px; }
.as-step .sub { grid-column: 2; font-size: 11.5px; color: var(--ink3); white-space: nowrap; }
.as-step .cnt { grid-row: 1 / 3; grid-column: 3; font-family: var(--f-mono); font-size: 11px; background: var(--jade); color: var(--surface); border-radius: 999px; padding: 0 7px; }
.as-step .cnt.red { background: var(--warn); }
.as-step.on { border-color: var(--jade); background: var(--jade-soft); }
.as-step.on .no { background: var(--jade); border-color: var(--jade); color: var(--surface); }
.as-intro h3 { font-size: 17px; }
.as-intro p { margin: 4px 0 10px; color: var(--ink2); }
.as-vas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; }
.as-vas input[type=range] { flex: 1 1 160px; accent-color: var(--tight); }
.as-fig { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; position: relative; }
.as-fig.one { grid-template-columns: minmax(0, 220px); justify-content: center; }
.as-fig figure { margin: 0; text-align: center; }
.as-fig svg { width: 100%; max-height: 360px; display: block; margin: 0 auto; }
.as-fig figcaption { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.fig-body ellipse, .fig-body path { fill: var(--surface2); stroke: var(--line); stroke-width: 1.2; }
.fig-prop { fill: none; stroke: var(--ink3); stroke-width: 1.2; stroke-dasharray: 3 3; }
.fig-table { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.fig-spine { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 2 3; }
.fig-line { fill: none; stroke: var(--ink3); stroke-width: 1; }
.fig-dot { fill: var(--surface); stroke: var(--jade); stroke-width: 1.6; cursor: pointer; transition: r .12s; }
.fig-dot:hover, .fig-dot:focus-visible, .fig-dot.hl { r: 8.5; stroke-width: 2.4; outline: none; }
.fig-dot.on { fill: var(--tight); stroke: var(--tight); }
.as-pick { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); display: grid; gap: 6px; }
.as-rows { display: flex; flex-direction: column; gap: 4px; }
.as-row { display: grid; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.as-row .lb { font-size: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.as-row .hw { font-size: 12.5px; color: var(--ink3); }
.as-row .sd { font-family: var(--f-mono); font-size: 11px; background: var(--jade); color: var(--surface); border-radius: 4px; padding: 0 5px; }
.as-row.on { background: var(--jade-soft); border-color: var(--jade); }
.fgroup.red .as-row.on { background: var(--warn-soft); border-color: var(--warn); }
.as-nav { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
.as-sum .chip.sm { padding: 1px 8px; }
.care { border-left: 3px solid var(--jade); padding: 2px 0 2px 10px; }
.chip.ev { background: var(--surface2); border-color: transparent; font-size: 12px; }
.rec-tabs { margin: 4px 0 10px; overflow-x: auto; }
.rec-tabs button { white-space: nowrap; }
.rec-item { border-top: 1px dashed var(--line); padding: 8px 0; display: grid; gap: 2px; }
.rec-item:first-child { border-top: 0; }
.plan { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14px; }
.plan li::marker { font-family: var(--f-mono); color: var(--jade); }
details.det { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); }
details.det summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
details.det[open] summary { margin-bottom: 6px; }
details.det .prose p { margin: 4px 0; }
@media (max-width: 640px) { .as-fig { grid-template-columns: 1fr 1fr; } .as-step { min-width: 92px; } }
.as-pick[hidden] { display: none; }

/* ---------- 多選比較、神經、皮節 ---------- */
.cmp-bar .x { border: 0; background: none; padding: 0 0 0 4px; color: var(--ink3); font-size: 14px; line-height: 1; }
.cmp-chip { gap: 5px; }
.cmp-box { margin-top: 14px; }
.cmp-wrap { overflow-x: auto; margin-bottom: 10px; }
.cmp-tbl { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.cmp-tbl th, .cmp-tbl td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.cmp-tbl tr:first-child th { background: var(--surface2); white-space: nowrap; }
.cmp-tbl th[scope=row] { background: var(--surface2); white-space: nowrap; font-weight: 600; color: var(--ink2); }
.cmp-tbl td { min-width: 180px; max-width: 320px; }
.sim-cmp { margin-top: 16px; }
.b3-label.cmp { font-weight: 700; }
.confirm { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.confirm ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.confirm li .badge { font-size: 10.5px; }
.as-steps { max-width: 100%; min-width: 0; }
.kb-meta { flex-wrap: wrap; min-width: 0; }
.kb-meta .badge { white-space: normal; overflow-wrap: anywhere; }
.pat .badge, .rec-item .badge, .care .badge { white-space: normal; overflow-wrap: anywhere; }

/* ---------- AI 問答 ---------- */
.ask-form textarea { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); resize: vertical; min-height: 96px; }
.ask-modes { max-width: 420px; }
.ask-out { margin-top: 14px; }
.ask-card .ask-q { font-weight: 600; margin: 6px 0 8px; white-space: pre-wrap; }
.ask-refs { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; align-items: flex-start; }

/* ---------- 頂欄狀態（離線、更新、安裝） ---------- */
.netbar { display: flex; gap: 6px; align-items: center; align-self: center; padding-bottom: 6px; }
.netbar:empty { display: none; }
.net-off { background: var(--warn-soft); color: var(--warn); }
.tab-cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--tight); color: #fff; font-size: 11px; line-height: 18px; text-align: center; vertical-align: 2px; }
.gate-card { margin: 8px 0 24px; }
.pend-card { border-left: 4px solid var(--tight); }
.pend-row { padding: 8px 0; border-top: 1px solid var(--line); gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- 評估：快速篩檢 ---------- */
.as-mode { max-width: 320px; margin: 0 0 10px; }
.quick-box { border-color: var(--jade); }
.quick-box .badge { font-size: 11px; }

/* ---------- 對話框 ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(20, 28, 25, .55); display: grid; place-items: start center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top)) 12px 24px; }
.modal { width: min(1100px, 100%); background: var(--surface); }

/* ---------- 姿勢照片量測 ---------- */
.pos-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 10px; }
@media (max-width: 760px) { .pos-wrap { grid-template-columns: 1fr; } }
.pos-stage { position: relative; }
.pos-cv { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--surface2); touch-action: none; cursor: crosshair; }
.pos-loupe { position: absolute; left: 8px; top: 8px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--tight); background: #fff; pointer-events: none; }
.pos-list { margin: 4px 0; padding-left: 22px; font-size: 14px; }
.pos-list li.done { color: var(--ink3); }
.pos-list li.done::after { content: ' ✓'; color: var(--jade); }
.pos-list li.cur { font-weight: 700; color: var(--tight); }
.pos-list li.skip { color: var(--ink3); }
.pos-list .link { margin-left: 6px; }
.pos-next { background: var(--tight-soft); padding: 6px 10px; border-radius: 6px; }
.pos-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pos-tbl th, .pos-tbl td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.pos-tbl th { font-weight: 500; color: var(--ink2); }
.pos-tbl tr.lv1 td:last-child { color: var(--warn); }
.pos-tbl tr.lv2 td:last-child { color: var(--tight); font-weight: 700; }
.pos-hist { display: grid; gap: 10px; }
.pos-rec { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.pos-rec img { width: 110px; border-radius: 6px; border: 1px solid var(--line); }

/* ---------- 練習 ---------- */
.prac-q h3 { font-size: 19px; margin-bottom: 8px; }
.prac-ctx { background: var(--surface2); padding: 10px 12px; border-radius: 8px; font-size: 15px; white-space: pre-wrap; }
.prac-opts { display: grid; gap: 8px; margin-top: 12px; }
.prac-opt { display: flex; gap: 10px; align-items: baseline; text-align: left; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 15.5px; }
.prac-opt:hover:not(:disabled) { border-color: var(--jade); }
.prac-opt .mono { color: var(--ink3); font-size: 13px; }
.prac-opt.right { border-color: var(--jade); background: var(--jade-soft); font-weight: 700; }
.prac-opt.wrong { border-color: var(--tight); background: var(--tight-soft); }
.prac-opt:disabled { cursor: default; color: var(--ink); }
.prac-fb { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border-left: 4px solid var(--jade); background: var(--surface2); }
.prac-fb.ng { border-left-color: var(--tight); }
.prac-fb p { margin: 4px 0 0; }
.prac-stat td, .prac-stat th { text-align: center; }

/* ---------- 逐字稿校對 ---------- */
.tx-edit { width: 100%; font-size: 15px; line-height: 1.7; }
.tx-fixbox { margin-top: 10px; }
.tx-ai { margin-top: 10px; border-left: 4px solid var(--weak); }
.tx-orig { border-left: 3px solid var(--line); padding-left: 10px; margin: 6px 0; }
.tab.locked { color: var(--ink3); opacity: .75; }
.tab.locked[aria-selected="true"] { opacity: 1; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="seal" aria-hidden="true">整</span><h1>推拿整復手札</h1><small>課堂筆記・錄音整理・評估工具</small></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="功能"></nav>
  <div class="acct" id="acct"></div>
</div></header>
<main>
  <section class="panel" id="p-assess"></section>
  <section class="panel" id="p-ask" hidden></section>
  <section class="panel" id="p-chain" hidden></section>
  <section class="panel" id="p-sim" hidden></section>
  <section class="panel" id="p-v3d" hidden></section>
  <section class="panel" id="p-kb" hidden></section>
  <section class="panel" id="p-practice" hidden></section>
  <section class="panel" id="p-cases" hidden></section>

<script>/* ===== Firebase 後端（GitHub Pages 版）=====
 * 在這個版本裡，用 Firebase Auth（Google 登入）+ Firestore + Firebase AI Logic（Gemini）
 * 提供與 claude.ai 執行環境相同的 window.claude.use('db' | 'user' | 'sample') 介面，
 * 主程式 app.js 不需要知道自己跑在哪裡。另外提供 window.TN_BACKEND 給登入、後台使用。
 */
(function () {
  'use strict';
  const C = window.TN_FB; if (!C) return;
  const B = 'https://www.gstatic.com/firebasejs/' + (C.sdk || '12.19.0') + '/';
  let fb = null;

  const T = (p, ms) => Promise.race([p, new Promise((res) => setTimeout(() => res('timeout'), ms))]);
  const boot = (async () => {
    const [A, Au, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const app = A.initializeApp(C.config);
    const auth = Au.getAuth(app);
    // 離線快取：讀過的條目、個案存在這台裝置；離線時的修改會在連線後自動上傳
    let db;
    try { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true }); }
    const user = await new Promise((res) => { const un = Au.onAuthStateChanged(auth, (u) => { un(); res(u); }); });
    const roles = { admins: [], blocked: [] }; let rolesFresh = false;
    if (user) {
      try {
        const r = await T(F.getDoc(F.doc(db, 'config/roles')), 8000);
        if (r !== 'timeout') { if (r.exists()) Object.assign(roles, r.data()); rolesFresh = !r.metadata.fromCache; }
      } catch (e) { console.warn('roles', e); }
      // 會員資料：第一次登入即註冊（＝送出申請）；之後每次載入更新最後登入時間。離線時不等待。
      (async () => {
        try {
          const ref = F.doc(db, 'profiles/' + user.uid); const cur = await F.getDoc(ref);
          const base = { name: user.displayName || '', email: user.email || '', photo: user.photoURL || '', lastLogin: Date.now() };
          if (!cur.exists()) await F.setDoc(ref, Object.assign(base, { created: Date.now(), logins: 1 }));
          else {
            const last = cur.data().lastLogin || 0;
            // 30 分鐘內重新整理不算新的一次登入
            await F.setDoc(ref, Object.assign(base, Date.now() - last > 30 * 60e3 ? { logins: F.increment(1) } : {}), { merge: true });
          }
        } catch (e) { console.warn('profile', e); }
      })();
    }
    fb = { A, Au, F, app, auth, db, user, roles, rolesFresh, keyMissing: false };
    // 第一次啟用批准制：現有會員全部直接批准（只由管理員執行一次）
    if (rolesFresh && isAdmin() && !Array.isArray(roles.approved)) {
      try {
        const s = await F.getDocs(F.collection(db, 'profiles'));
        roles.approved = s.docs.map((d) => d.id).filter((id) => !(roles.blocked || []).includes(id));
        await saveRoles();
        console.info('已批准現有會員', roles.approved.length);
      } catch (e) { console.warn('migrate approved', e); }
    }
    reconcile().catch((e) => console.warn('gate', e));
    return fb;
  })().catch((e) => { console.error('Firebase 初始化失敗', e); return null; });

  async function saveRoles() {
    const r = fb.roles;
    await fb.F.setDoc(fb.F.doc(fb.db, 'config/roles'), { admins: r.admins || [], blocked: r.blocked || [], approved: r.approved || [], ai: r.ai || 'member', updated: Date.now(), by: uid() });
  }

  // ---------- 批准狀態 → 內容金鑰 ----------
  function status() {
    if (!fb || !fb.user) return 'guest';
    if (isAdmin()) return 'approved';
    if ((fb.roles.blocked || []).includes(uid())) return 'blocked';
    return (fb.roles.approved || []).includes(uid()) ? 'approved' : 'pending';
  }
  async function reconcile() {
    const G = window.TN_GATE; if (!G || !fb) return;
    const st = status();
    if (st !== 'approved') {
      // 只有確定（線上讀到角色表，或已登出）才收回金鑰；離線時維持原狀
      if (fb.user && !fb.rolesFresh) return;
      if (await G.has()) await G.forget();
      if (!window.TN_LOCKED) G.reloadOnce();
      return;
    }
    const rec = await G.kv.get('content');
    if (rec && rec.kid === G.KID && rec.uid === uid() && !window.TN_LOCKED) return;
    const { F, db } = fb; let d = null;
    try { const s = await T(F.getDoc(F.doc(db, 'secure/content')), 10000); if (s !== 'timeout' && s.exists()) d = s.data(); } catch (e) { console.warn('secure', e); }
    // 擁有者：用這台瀏覽器的交換私鑰解開建置時附上的內容金鑰，寫進 secure/content
    const drop = C.keyDrop;
    if ((!d || d.kid !== G.KID) && isOwner() && drop && drop.kid === G.KID) {
      try { const k = await G.xchgUnwrap(drop.w); await F.setDoc(F.doc(db, 'secure/content'), { k, kid: drop.kid, at: Date.now(), by: uid() }); d = { k, kid: drop.kid }; console.info('內容金鑰已設定'); }
      catch (e) { console.warn('keyDrop', e); }
    }
    if (d && d.kid === G.KID && d.k) { await G.adopt(d.k, d.kid, uid()); if (window.TN_LOCKED) G.reloadOnce(); }
    else { fb.keyMissing = true; window.dispatchEvent(new Event('tn-gate')); }
  }

  // ---------- Firestore → claude db 介面 ----------
  const CODE = { 'permission-denied': 'invalid_argument', unauthenticated: 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', unavailable: 'unavailable' };
  const err = (e) => { const o = new Error((e && e.message) || 'error'); o.code = CODE[e && e.code] || 'unavailable'; return o; };
  const wrapDoc = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  function docRef(path) {
    const { F, db } = fb; const r = F.doc(db, path);
    return {
      id: r.id, path,
      async get() { try { return wrapDoc(await F.getDoc(r)); } catch (e) { throw err(e); } },
      async set(b) { try { await F.setDoc(r, b); } catch (e) { throw err(e); } },
      async update(b) { try { await F.updateDoc(r, b); } catch (e) { throw err(e); } },
      async delete() { try { await F.deleteDoc(r); } catch (e) { throw err(e); } },
      onSnapshot(cb, ecb) { return F.onSnapshot(r, (s) => cb(wrapDoc(s)), (e) => ecb && ecb(err(e))); },
      collection(c) { return colRef(path + '/' + c); },
    };
  }
  function colRef(path) {
    const { F, db } = fb; const c = F.collection(db, path);
    return {
      path,
      doc(id) { return docRef(path + '/' + (id || F.doc(c).id)); },
      async add(b) { try { const r = await F.addDoc(c, b); return docRef(path + '/' + r.id); } catch (e) { throw err(e); } },
      async get() { try { const s = await F.getDocs(c); return { docs: s.docs.map(wrapDoc), size: s.size }; } catch (e) { throw err(e); } },
      onSnapshot(cb, ecb) { return F.onSnapshot(c, (s) => cb({ docs: s.docs.map(wrapDoc), size: s.size }), (e) => ecb && ecb(err(e))); },
    };
  }
  const dbNS = { doc: (p) => docRef(p), collection: (p) => colRef(p) };

  // ---------- 身分 ----------
  const uid = () => (fb && fb.user ? fb.user.uid : null);
  const isOwner = () => !!(uid() && C.ownerUid && uid() === C.ownerUid);
  const isAdmin = () => isOwner() || !!(uid() && (fb.roles.admins || []).includes(uid()));
  const userNS = {
    async me() { const u = fb.user; return { id: uid(), name: (u && u.displayName) || '', avatarUrl: (u && u.photoURL) || '', color: '#23705d', email: (u && u.email) || null, isOwner: isOwner(), canEdit: isAdmin(), blocked: !!(uid() && (fb.roles.blocked || []).includes(uid())), approved: status() === 'approved' }; },
    async id() { return uid(); }, async isOwner() { return isOwner(); }, async canEdit() { return isAdmin(); }, async can() { return null; },
    async profiles(ids) {
      const out = {};
      await Promise.all(ids.map(async (i) => { try { const s = await fb.F.getDoc(fb.F.doc(fb.db, 'profiles/' + i)); out[i] = { id: i, name: s.exists() ? (s.data().name || s.data().email || '') : '' }; } catch (e) { out[i] = { id: i, name: '' }; } }));
      return out;
    },
  };

  // ---------- AI（Firebase AI Logic → Gemini）----------
  let sampleP = null;
  function sampleNS() {
    if (sampleP) return sampleP;
    sampleP = (async () => {
      if (C.recaptchaKey) {
        // App Check（reCAPTCHA Enterprise／v3）：使用 AI 時才載入
        const AC = await import(B + 'firebase-app-check.js');
        const P = C.recaptchaType === 'v3' ? AC.ReCaptchaV3Provider : AC.ReCaptchaEnterpriseProvider;
        AC.initializeAppCheck(fb.app, { provider: new P(C.recaptchaKey), isTokenAutoRefreshEnabled: true });
      }
      const AI = await import(B + 'firebase-ai.js');
      const ai = AI.getAI(fb.app, { backend: new AI.GoogleAIBackend() });
      const models = [].concat(C.models || ['gemini-2.5-flash']);
      const toPart = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res({ inlineData: { data: String(fr.result).split(',')[1], mimeType: blob.type || 'application/octet-stream' } }); fr.onerror = rej; fr.readAsDataURL(blob); });
      let mi = 0;
      const run = async (prompt, opts, json) => {
        const files = Array.from((opts && (opts.images || opts.files)) || []);
        const parts = [{ text: String(prompt) }].concat(await Promise.all(files.map(toPart)));
        for (;;) {
          const model = AI.getGenerativeModel(ai, { model: models[mi], generationConfig: json ? { responseMimeType: 'application/json' } : {} });
          try { const r = await model.generateContent(parts); return r.response.text(); }
          catch (e) {
            const m = String((e && e.message) || e);
            if (/not found|404|is not supported|unknown model/i.test(m) && mi < models.length - 1) { mi++; continue; }
            const o = new Error(m); o.code = /quota|429|exhaust|rate/i.test(m) ? 'rate_limited' : /403|permission|not been used|disabled|API key|not enabled/i.test(m) ? 'not_granted' : /image|mime|unsupported/i.test(m) ? 'image_rejected' : 'unavailable';
            console.warn('AI', m); throw o;
          }
        }
      };
      const s = async (p, o) => ({ text: await run(p, o, false), truncated: false });
      s.json = async (p, o) => { const t = await run(p, o, true); return JSON.parse(String(t).replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '')); };
      s.limits = async () => ({ inputBytes: 1e6, images: { maxCount: 4, maxBytes: 7e6, mediaTypes: ['image/jpeg', 'image/png', 'image/webp'] }, audio: { maxBytes: 15e6 } });
      return s;
    })().catch((e) => { console.warn('AI 模組載入失敗', e); return null; });
    return sampleP;
  }

  window.claude = {
    async use(name) {
      const f = await boot; if (!f) return null;
      if (name === 'db') return dbNS;
      if (name === 'user') return userNS;
      // AI：管理員一律可用；一般會員依後台設定（config/roles.ai：'member' 開放 AI 問答，'admin' 只限管理員）。AI 新增條目在介面上仍只限管理員。
      if (name === 'sample') return f.user && status() === 'approved' && (isAdmin() || (fb.roles.ai || 'member') === 'member') ? sampleNS() : null;
      return null;
    },
  };

  // ---------- 登入、後台 ----------
  window.TN_BACKEND = {
    kind: 'firebase', ready: boot, ownerUid: C.ownerUid || '',
    async signIn() { const f = await boot; const p = new f.Au.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await f.Au.signInWithPopup(f.auth, p); location.reload(); },
    async signOut() { const f = await boot; if (window.TN_GATE) await window.TN_GATE.forget(); await f.Au.signOut(f.auth); location.reload(); },
    roles() { return fb ? fb.roles : { admins: [], blocked: [], approved: [] }; },
    status() { return status(); },
    keyMissing() { return !!(fb && fb.keyMissing); },
    rolesFresh() { return !!(fb && fb.rolesFresh); },
    async listProfiles() { const f = await boot; const s = await f.F.getDocs(f.F.collection(f.db, 'profiles')); return s.docs.map((d) => Object.assign({ id: d.id }, d.data())); },
    async casesOf(u) { const f = await boot; const s = await f.F.getDocs(f.F.collection(f.db, 'data/users/' + u)); return s.docs.map((d) => Object.assign({ id: d.id }, d.data())); },
    // role：admin 管理員／member 已批准會員／pending 待批准／blocked 停用
    async setRole(u, role) {
      const f = await boot; const r = f.roles; const rm = (k) => (r[k] = (r[k] || []).filter((x) => x !== u));
      rm('admins'); rm('blocked'); rm('approved');
      if (role === 'admin') { r.admins.push(u); r.approved.push(u); }
      if (role === 'member') r.approved.push(u);
      if (role === 'blocked') r.blocked.push(u);
      await saveRoles();
    },
    aiAccess() { return (fb && fb.roles.ai) || 'member'; },
    async setAiAccess(v) { const f = await boot; f.roles.ai = v === 'admin' ? 'admin' : 'member'; await saveRoles(); },
    // 內容金鑰（擁有者）
    async keyInfo() {
      const f = await boot; let d = null;
      try { const s = await f.F.getDoc(f.F.doc(f.db, 'secure/content')); d = s.exists() ? s.data() : null; } catch (e) { return { err: e.code || e.message, bundle: window.TN_GATE && window.TN_GATE.KID }; }
      return { kid: d && d.kid, at: d && d.at, bundle: window.TN_GATE && window.TN_GATE.KID, drop: !!C.keyDrop };
    },
    async xchgPublic() { return window.TN_GATE.xchgPublic(); },
    recheck() { return reconcile(); },
  };
})();
</script>
<script>/* ===== 3D 動作示範：動作庫 =====
   pose(t, J, R) 回傳「左側」各骨骼群組的變換（右側由引擎鏡像）。t：0→1。
   J：關節中心（真實模型座標，左側），R：rot(點, 軸, 角度)、mul(...)、tr(位移)、axis(a,b)。
   movers：主動肌（紅）；antag：被拉長的拮抗肌（藍）；opp：表示該肌在對側。 */
window.JOINTS = {"shoulder": [0.1643, 1.3249, -0.0104], "elbow": [0.2097, 1.0545, -0.0174], "latEpi": [0.2403, 1.0644, -0.0251], "medEpi": [0.177, 1.0587, -0.018], "radHead": [0.2308, 1.0406, -0.0149], "ulnHead": [0.2382, 0.8226, 0.0278], "wrist": [0.2562, 0.8208, 0.0293], "sc": [0.0101, 1.3396, 0.0438], "scapC": [0.1165, 1.3135, -0.0435], "acromion": [0.167, 1.3561, -0.0276], "hip": [0.0801, 0.8202, 0.0106], "knee": [0.0725, 0.4229, -0.015], "femLat": [0.1137, 0.4317, -0.0153], "femMed": [0.0321, 0.4376, -0.0187], "ankle": [0.073, 0.0577, -0.0171], "latMall": [0.1042, 0.0404, -0.0358], "medMall": [0.0475, 0.0693, -0.0218], "talus": [0.073, 0.0517, -0.0171], "calc": [0.0808, 0.0212, -0.0734], "mt1": [0.0677, 0.0126, 0.0967], "mt5": [0.1279, 0.0016, 0.0726], "si": [0.0511, 0.8939, -0.0212], "psis": [0.0433, 0.9125, -0.0682], "asis": [0.1179, 0.9117, 0.0676], "vC1": [0.0, 1.48, 0.0068], "vC2": [0.0, 1.4682, 0.0046], "vC3": [0.0, 1.4495, 0.0036], "vC4": [0.0, 1.4353, 0.0035], "vC5": [0.0, 1.4199, 0.0028], "vC6": [0.0, 1.4048, 0.0006], "vC7": [0.0, 1.3926, -0.0054], "vS2": [0.0, 0.8941, -0.0256], "spS2": [0.0, 0.8941, -0.062]};
(function () {
  const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
  const ARM = ['humerus', 'ulna', 'radius', 'hand'], FORE = ['ulna', 'radius', 'hand'], GIRDLE = ['clavicle', 'scapula', 'humerus', 'ulna', 'radius', 'hand'];
  const LEG = ['femur', 'patella', 'tibia', 'fibula', 'talus', 'foot'], SHANK = ['patella', 'tibia', 'fibula', 'talus', 'foot'];
  const set = (o, keys, M) => { keys.forEach((k) => { o[k] = M; }); return o; };
  const NECK = ['C7', 'C6', 'C5', 'C4', 'C3', 'C2', 'C1'];
  function neckChain(J, R, axis, total, frac) {
    const o = {}; let M = R.mul();
    NECK.forEach((v) => { M = R.mul(M, R.rot(J['v' + v], axis, total * frac[v])); o[v] = M; });
    o.skull = M; return o;
  }
  // 肩肱節律：外展時肩胛上旋（約 2：1）

  // 骨盆：無名骨變換＋同側下肢跟著髖臼平移

    const o = { hip: M }; set(o, LEG, R.tr(R.moved(M, J.hip))); return o;
  }
  window.MOTION_POSES = { pelvis };
  window.MOTIONS = [
    // ---------- 肩胛胸廓關節 ST ----------
    { id: 'st_elev', group: '肩胛胸廓關節（ST）', name: '肩胛上提（聳肩）', max: '約 12°（繞胸鎖關節）', view: { at: 'acromion', dir: [0.2, 0.15, 1], dist: 0.9 },

    { id: 'st_prot', group: '肩胛胸廓關節（ST）', name: '肩胛前突（外展）', max: '約 15°', view: { at: 'scapC', dir: [0.3, 0.9, 0.2], dist: 1.0 },
      movers: ['serratus', 'pec_minor'], antag: ['rhomboid', 'trap_m'], kb: ['k-st-nerves', 'k-scap6'],

      pose: (t, J, R) => set({}, GIRDLE, R.rot(J.sc, Y, -15 * t)) },
    { id: 'st_ret', group: '肩胛胸廓關節（ST）', name: '肩胛後縮（內收）', max: '約 10°', view: { at: 'scapC', dir: [0.2, 0.9, -0.3], dist: 1.0 },
      movers: ['trap_m', 'rhomboid', 'trap_u'], antag: ['serratus', 'pec_minor'], kb: ['k-st-nerves'],
      note: '筆記：後縮＝中斜方、菱形肌（上斜方）。後縮問題不易發現，大部分其實是前鋸肌無力。',
      pose: (t, J, R) => set({}, GIRDLE, R.rot(J.sc, Y, 10 * t)) },
    { id: 'st_up', group: '肩胛胸廓關節（ST）', name: '肩胛向上旋轉', max: '約 30°', view: { at: 'scapC', dir: [0.15, 0.1, -1], dist: 1.0 },
      movers: ['trap_u', 'trap_l', 'serratus'], antag: ['rhomboid', 'pec_minor', 'levator'], kb: ['k-st-nerves'],
      note: '筆記：向上旋轉＝上斜方、下斜方、前鋸肌。手臂外展超過 90° 一定要肩胛上旋配合。',
      pose: (t, J, R) => { const c = R.rot(J.sc, Z, 8 * t); const s = R.mul(c, R.rot(J.scapC, Z, 24 * t)); const o = { clavicle: c }; return set(o, ['scapula'].concat(ARM), s); } },
    { id: 'st_down', group: '肩胛胸廓關節（ST）', name: '肩胛向下旋轉', max: '約 12°', view: { at: 'scapC', dir: [0.15, 0.1, -1], dist: 1.0 },
      movers: ['rhomboid', 'pec_minor', 'levator'], antag: ['trap_u', 'serratus'], kb: ['k-st-nerves'],

  // =====================================================================

  const Notes = {
    list: [], mode: 'loading', listeners: [],

      if (Auth.db) {
        this.mode = 'db';
        Auth.db.collection('notes').onSnapshot((snap) => {
          this.list = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
          this.emit();
        }, () => { this.mode = 'local'; this.loadLocal(); });
        return;
      }
      this.mode = 'local'; this.loadLocal();
    },
    loadLocal() { this.list = Auth.dev ? store.get('notes', []) : []; this.emit(); },
    emit() { this.listeners.forEach((f) => f()); },
    async save(note) {
      if (!Auth.canPublish()) { toast('只有管理員可以直接發佈'); return false; }
      note.updated = Date.now(); if (!note.created) note.created = note.updated; if (Auth.id && !note.by) note.by = Auth.id;
      if (this.mode === 'db') {
        const body = Object.assign({}, note); delete body.id;
        Object.keys(body).forEach((k) => body[k] === undefined && delete body[k]);
        try {
          if (note.id) await Auth.db.doc('notes/' + note.id).set(body);
          else { const r = await Auth.db.collection('notes').add(body); note.id = r.id; }
          return true;
        } catch (e) {
          if (e && e.code === 'invalid_argument') { toast('沒有權限寫入知識庫'); return false; }
          if (e && e.code === 'quota_exceeded') { toast('資料庫已滿，請刪除部分條目'); return false; }
          toast('儲存失敗，請稍後再試'); return false;
        }
      }

      if (!note.id) note.id = 'n' + Date.now().toString(36); const i = L.findIndex((x) => x.id === note.id);

    },
    async remove(id) {
      if (!Auth.canPublish()) { toast('只有管理員可以刪除'); return false; }
      if (this.mode === 'db') { try { await Auth.db.doc('notes/' + id).delete(); return true; } catch (e) { toast('刪除失敗'); return false; } }

  };

  // =====================================================================
  //  投稿與審核（kbsub/<uid> 一人一份；管理員可讀寫全部）
  // =====================================================================
  const Subs = {
    mine: {}, all: [], names: {}, listeners: [], showDone: false,
    init() {
      const db = Auth.db; if (!db || !Auth.id && !Auth.isAdmin) return;
      if (Auth.isAdmin) {
        db.collection('kbsub').onSnapshot(async (snap) => {
          this.all = snap.docs.map((d) => ({ uid: d.id, items: (d.data() || {}).items || {} }));
          const need = this.all.map((x) => x.uid).filter((u) => !(u in this.names));
          if (need.length) Object.assign(this.names, await Auth.names(need));
          this.emit();
        }, () => { });
      } else if (Auth.id) {
        db.doc('kbsub/' + Auth.id).onSnapshot((d) => { this.mine = d.exists ? ((d.data() || {}).items || {}) : {}; this.emit(); }, () => { });
      }
    },
    emit() { this.listeners.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },
    pendingCount() { return Auth.isAdmin ? this.all.reduce((n, x) => n + Object.values(x.items).filter((i) => i.status === 'pending').length, 0) : 0; },
    rows() {
      if (Auth.isAdmin) {
        const out = []; this.all.forEach((u) => Object.entries(u.items).forEach(([sid, it]) => out.push(Object.assign({ uid: u.uid, sid }, it))));
        return out.filter((x) => this.showDone || x.status === 'pending').sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || (b.updated || 0) - (a.updated || 0));
      }
      return Object.entries(this.mine).map(([sid, it]) => Object.assign({ uid: Auth.id, sid }, it)).sort((a, b) => (b.updated || 0) - (a.updated || 0));
    },
    get(uid, sid) {
      if (uid === Auth.id && this.mine[sid]) return Object.assign({ uid, sid }, this.mine[sid]);
      const u = this.all.find((x) => x.uid === uid); return u && u.items[sid] ? Object.assign({ uid, sid }, u.items[sid]) : null;
    },
    async write(uid, items) {
      try { await Auth.db.doc('kbsub/' + uid).set({ items, updated: Date.now() }); return true; }
      catch (e) {
        if (e && e.code === 'invalid_argument') { if (uid === Auth.id && !Auth.isAdmin) { Auth.ownWrite = false; Auth.emit(); } toast('你的帳號對這個頁面只有檢視權限，無法送出'); return false; }
        if (e && e.code === 'quota_exceeded') { toast('投稿空間已滿，請先刪除舊的投稿'); return false; }
        toast('送出失敗，請稍後再試'); return false;
      }
    },
    async submit(entry) {
      if (!Auth.canSubmit()) { toast('需要登入並有投稿權限'); return null; }
      const sid = entry.sid || 's' + Date.now().toString(36);
      const items = JSON.parse(JSON.stringify(this.mine)); const prev = items[sid] || {};
      const body = Object.assign({}, entry); delete body.sid;
      items[sid] = Object.assign(body, { status: 'pending', reason: '', created: prev.created || Date.now(), updated: Date.now() });
      return (await this.write(Auth.id, items)) ? sid : null;
    },
    async withdraw(sid) { const items = JSON.parse(JSON.stringify(this.mine)); delete items[sid]; return this.write(Auth.id, items); },
    async setStatus(uid, sid, status, reason, noteId) {
      const u = this.all.find((x) => x.uid === uid); if (!u || !u.items[sid]) return false;
      const items = JSON.parse(JSON.stringify(u.items));
      Object.assign(items[sid], { status, reason: reason || '', reviewed: Date.now(), noteId: noteId || null, updated: Date.now() });
      return this.write(uid, items);
    },
    async purge(uid, sid) { const u = this.all.find((x) => x.uid === uid); if (!u) return false; const items = JSON.parse(JSON.stringify(u.items)); delete items[sid]; return this.write(uid, items); },
  };
  const ST_LABEL = { pending: ['待審核', 'y'], approved: ['已發佈', 'j'], rejected: ['已退回', 't'] };

  // =====================================================================
  //  AI 輔助（圖片辨識、文字整理）與語音輸入
  // =====================================================================
  const AI = {
    schema() {
      const mus = window.MUSCLES.map((m) => m.id + '=' + m.name.replace(/（.*?）/g, '')).join('；');
      const pts = window.POINTS.map((p) => p.id + '=' + p.name).join('；');
      const regs = window.CHAIN_NODES.map((n) => n.id + '=' + n.name).join('；');
      return '只輸出一個 JSON 物件，不要其他文字：{"title": 字串（24 字內）, "cat": 從 [' + CATS.slice(1).join('、') + '] 選一個, "body": 字串（markdown：段落、「- 」清單、**粗體**、| 表格 |；忠於原文，不要自行補充原文沒有的內容，看不清或聽不清的地方寫「（不清）」）, "tags": 字串陣列（最多 6 個，知識點或部位關鍵字）, "muscles": 只能用肌肉清單的 id, "points": 只能用穴位清單的 id, "regions": 只能用部位清單的 id}\n'
        + '肌肉清單：' + mus + '\n穴位清單：' + pts + '\n部位清單：' + regs;
    },
    clean(o) {
      if (!o || typeof o !== 'object') return null;
      const arr = (v) => (Array.isArray(v) ? v.map(String) : []);
      return {
        title: String(o.title || '').slice(0, 60), cat: CATS.includes(o.cat) && o.cat !== '全部' ? o.cat : '原則', body: String(o.body || ''),
        tags: arr(o.tags).slice(0, 8), muscles: arr(o.muscles).filter((x) => MU[x]), points: arr(o.points).filter((x) => PT[x]), regions: arr(o.regions).filter((x) => NODE[x]),
      };
    },
    async run(kind, payload, onStatus) {
      const s = await Auth.sampler();
      if (!s) { onStatus(FB ? '請先登入才能使用 AI 辨識。' : '這個檢視無法使用 Claude（未登入或未開放），請改用文字輸入。'); return null; }
      const head = '你是推拿整復課程的筆記整理助理，使用繁體中文（台灣用語）。';
      let prompt, opts = { modelTier: 'default' };
      if (kind === 'image') {
        if (!Auth._lim || !Auth._lim.images) { onStatus('這個檢視不能傳送圖片給 ' + AI_NAME + '。'); return null; }
        prompt = head + '附上的是課堂筆記或講義的照片。請辨識上面的文字與圖示重點，整理成一則知識庫條目。圖示（例如骨骼、箭頭、表格）用文字描述。\n' + this.schema();
        opts.images = payload.slice(0, Auth._lim.images.maxCount || 1);
      } else if (kind === 'audio') {
        if (!Auth._lim || !Auth._lim.audio) { onStatus('這個版本不能辨識錄音檔。'); return null; }
        const f = payload[0]; if (f.size > Auth._lim.audio.maxBytes) { onStatus('錄音檔太大（上限約 ' + Math.round(Auth._lim.audio.maxBytes / 1e6) + ' MB），請先剪成較短的片段。'); return null; }
        prompt = head + '附上的是一段課堂或個人錄音（中文，可能夾雜台語或口語）。請先聽寫重點，修正明顯的辨識錯誤，再整理成一則知識庫條目；只寫錄音裡真的講到的內容。\n' + this.schema();
        opts.files = [f];
      } else {
        prompt = head + '下面是使用者輸入的文字（可能來自語音輸入或逐字稿，會有錯字或口語）。請修正明顯錯字、去掉口語贅詞，整理成一則知識庫條目，但不要改變原意。\n' + this.schema() + '\n\n原文：\n' + String(payload).slice(0, 12000);
      }
      onStatus(FB ? (kind === 'image' ? 'AI 正在辨識照片…' : kind === 'audio' ? 'AI 正在聽錄音並整理…（較長的錄音需要一兩分鐘）' : 'AI 正在整理文字…') : kind === 'image' ? 'Claude 正在辨識照片…（使用你自己的 Claude 額度）' : 'Claude 正在整理文字…（使用你自己的 Claude 額度）');
      try { const r = await s.json(prompt, opts); const c = this.clean(r); onStatus(c ? '已填入表單，請檢查後再送出。' : '辨識結果格式不對，請再試一次。'); return c; }
      catch (e) {
        const code = e && e.code;
        onStatus(code === 'not_granted' ? (FB ? 'AI 功能尚未啟用，請管理員到 Firebase 開啟 AI Logic。' : '你沒有允許這個頁面使用 Claude。') : code === 'rate_limited' ? AI_NAME + ' 使用次數暫時到上限，請稍後再試。' : code === 'image_rejected' ? '這張圖片無法讀取（格式或大小不符）。' : code === 'cancelled' ? '已取消。' : '辨識失敗，請稍後再試。');
        return null;
      }
    },
  };
  const Voice = {
    rec: null, on: false,
    supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
    toggle(ta, btn, say) {

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { say('這個瀏覽器不支援網頁語音辨識。手機可直接用鍵盤上的麥克風（語音輸入）說到「內容」欄。'); return; }
      const r = new SR(); r.lang = 'zh-TW'; r.continuous = true; r.interimResults = true;
      const base = ta.value; let fin = '';
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t + '。'; else interim += t; }
        ta.value = base + (base && !/\n$/.test(base) ? '\n' : '') + fin + interim; ta.dispatchEvent(new Event('input'));

/* 安裝成 App、離線使用 */
(function () {
  if (!('serviceWorker' in navigator) || !/^https:$|^http:$/.test(location.protocol)) return;
  if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      const ask = (w) => { window.TN_UPDATE = () => w.postMessage('skipWaiting'); window.dispatchEvent(new Event('tn-update')); };
      if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
      setInterval(() => reg.update().catch(() => null), 30 * 60e3);
    }).catch((e) => console.warn('service worker', e));
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.TN_UPDATING && !reloaded) { reloaded = true; location.reload(); } });
  });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.TN_INSTALL = e; window.dispatchEvent(new Event('tn-install')); });
})();

/* ===== 內容閘門（GitHub Pages 版）=====
 * 課程內容（評估規則、知識庫、詳解、逐字稿…）以 AES-GCM 加密成 content.bin / tx.bin。
 * 解密金鑰存在 Firestore secure/content，只有管理員批准的會員讀得到（firestore.rules 把關）。
 * 讀到後以「不可匯出」的 CryptoKey 存在這台裝置的 IndexedDB，之後離線也能開。
 * 沒有金鑰（訪客、待批准、已停用）時只載入 3D 圖譜需要的公開資料。
 */
(function () {
  'use strict';
  const KID = window.TN_KID || '';
  const IDB = 'tn-gate';
  const open = () => new Promise((res, rej) => { const r = indexedDB.open(IDB, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  const kv = {
    get: (k) => tx('readonly', (s) => s.get(k)).catch(() => null),
    set: (k, v) => tx('readwrite', (s) => s.put(v, k)),
    del: (k) => tx('readwrite', (s) => s.delete(k)).catch(() => null),
  };
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64e = (u) => { let s = ''; new Uint8Array(u).forEach((c) => (s += String.fromCharCode(c))); return btoa(s); };
  const enc = new TextEncoder(); const dec = new TextDecoder();

  // 檔案格式：'TN1\n' + kid(8) + iv(12) + AES-GCM(gzip(內容))，kid 當作附加驗證資料
  async function decryptBuf(buf, key) {
    const u = new Uint8Array(buf);
    if (dec.decode(u.slice(0, 4)) !== 'TN1\n') throw new Error('格式錯誤');
    const kid = u.slice(4, 12), iv = u.slice(12, 24), ct = u.slice(24);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: kid }, key, ct);
    const ds = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).text();
  }
  async function fetchBuf(url) { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.arrayBuffer(); }
  async function cached() { const rec = await kv.get('content'); return rec && rec.kid === KID && rec.key ? rec : null; }
  async function text(url) { const rec = await cached(); if (!rec) throw new Error('沒有內容金鑰'); return decryptBuf(await fetchBuf(url), rec.key); }

  const STUB = {
    FINDINGS: [], PATTERNS: [], CHAIN_NODES: [], CHAIN_EDGES: [], STATIONS: [], LANDMARKS: {}, CARE_RULES: [], FINDING_ALIASES: {},
    KB_ITEMS: [], KB_FIGS: {}, KB_BOOKS: [], DETAIL: { pt: {}, mu: {}, bn: {}, sn: {} }, TECHS: [], TECH_GROUPS: [], NERVE_DATA: {}, NERVE_INFO: {},
  };
  function stub() {
    Object.entries(STUB).forEach(([k, v]) => { if (window[k] == null) window[k] = v; });
    if (!window.migrateFindings) window.migrateFindings = (s) => s || {};
    if (!window.boneIdOf) window.boneIdOf = () => null;
  }

  const reloadOnce = () => {
    try { const t = +sessionStorage.getItem('tn_gate_reload') || 0; if (Date.now() - t < 15000) return false; sessionStorage.setItem('tn_gate_reload', String(Date.now())); } catch (e) { }
    location.reload(); return true;
  };

  window.TN_GATE = {
    KID, kv, text,
    async json(url) { return JSON.parse(await text(url)); },
    // 匯入 base64 原始金鑰，存成不可匯出的 CryptoKey
    async adopt(rawB64, kid, uid) {
      const key = await crypto.subtle.importKey('raw', b64d(rawB64), 'AES-GCM', false, ['decrypt']);
      await kv.set('content', { key, kid, uid: uid || null, at: Date.now() });
    },
    async forget() { await kv.del('content'); },
    async has() { return !!(await cached()); },
    reloadOnce, b64e, b64d,
    // 擁有者交換金鑰：在這台瀏覽器產生 RSA 金鑰對，私鑰不可匯出；建置時用公鑰包住內容金鑰
    async xchgPublic() {
      let rec = await kv.get('xchg');
      if (!rec) {
        const kp = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, false, ['decrypt', 'encrypt']);
        const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
        rec = { priv: kp.privateKey, pub: JSON.stringify({ kty: pub.kty, n: pub.n, e: pub.e }), at: Date.now() };
        await kv.set('xchg', rec);
      }
      return rec.pub;
    },
    async xchgUnwrap(wrappedB64) {
      const rec = await kv.get('xchg'); if (!rec) throw new Error('這台瀏覽器沒有交換金鑰');
      const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, rec.priv, b64d(wrappedB64));
      return b64e(raw);
    },
  };

  (async () => {
    let ok = false;
    try {
      const rec = await cached();
      if (rec) {
        const js = decryptBuf(await fetchBuf('content.bin'), rec.key);
        (0, eval)(await js); ok = true;
      }
    } catch (e) {
      console.warn('內容解密失敗', e);
      // 金鑰不對（例如換過金鑰）就丟掉，等登入後重新取得
      if (e && e.name === 'OperationError') await kv.del('content');
    }
    window.TN_LOCKED = !ok;
    stub();
    window.TN_START();
  })();
})();
</script>
