<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>參考書 PDF 檢視</title>
<style>
  :root { --bg: #f4f1ea; --ink: #23201c; --ink3: #8a8378; --line: #ddd5c6; --jade: #23705d; --surface: #fffdf8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --ink: #ece7dd; --ink3: #9c958a; --line: #3a3732; --jade: #6fc2a9; --surface: #24221f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header b { margin-right: auto; font-size: 14px; }
  button, input { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  button { cursor: pointer; } input { width: 72px; text-align: center; }
  #msg { padding: 24px 16px; text-align: center; color: var(--ink3); }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
  canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .pg { position: relative; } .pg span { position: absolute; right: 6px; bottom: 4px; font-size: 12px; color: #777; }
  #find { display: none; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #find.on { display: block; }
  #find .row { display: flex; gap: 8px; } #find input { flex: 1; width: auto; text-align: left; font-size: 16px; }
  #find h4 { margin: 10px 0 4px; font-size: 13px; color: var(--ink3); font-weight: 600; }
  #find ol { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: auto; }
  #find li button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 4px; font-size: 14px; }
  #find li b { color: var(--jade); margin-right: 6px; } #find mark { background: #f3d97a; color: #000; }
  #fmsg { font-size: 13px; color: var(--ink3); margin-top: 6px; }
  @media (max-width: 600px) { header { gap: 6px; padding: 6px 8px; } header b { flex-basis: 100%; font-size: 13px; } button { padding: 6px 10px; } input { width: 60px; } }
</style>
</head>
<body>
<header>
  <b id="title">參考書 PDF</b>
  <button id="prev" aria-label="上一頁">‹</button>
  <input id="num" type="number" min="1" aria-label="頁碼"> <span id="tot"></span>
  <button id="next" aria-label="下一頁">›</button>
  <button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button>
  <button id="fbtn" aria-label="搜尋這本書" aria-expanded="false">🔍 搜尋</button>
  <a id="orig" target="_blank" rel="noopener" style="font-size:13px;color:var(--jade)">在雲端硬碟開啟</a>
</header>
<div id="find" role="region" aria-label="搜尋與本站引用頁">
  <div class="row"><input id="fq" type="search" placeholder="搜尋書中文字（有文字層的 PDF 才找得到）" aria-label="搜尋文字"><button id="fgo">搜尋</button></div>
  <div id="fmsg"></div>
  <ol id="fres"></ol>
  <h4 id="ch" hidden>本站引用過的頁（點了跳頁）</h4>
  <ol id="cites"></ol>
</div>
<div id="msg">載入中…</div>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  // 參數放在 # 後面（不會送到任何伺服器）：id＝Google 雲端硬碟檔案 ID、page＝頁碼、key＝Google API 金鑰（只開 Drive API、限本網站使用）、t＝書名
  var P = {}; location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) P[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $('msg').textContent = t; $('msg').hidden = !t; };
  if (P.t) { $('title').textContent = P.t; document.title = P.t; }
  if (!P.id || !P.key) { msg('缺少檔案或金鑰設定，請回知識庫「📖」確認。'); return; }
  $('orig').href = 'https://drive.google.com/file/d/' + encodeURIComponent(P.id) + '/view';
  if (!window.pdfjsLib) { msg('PDF 元件載入失敗，請檢查網路後重新整理。'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(P.id) + '?alt=media&key=' + encodeURIComponent(P.key);
  var doc = null, cur = Math.max(1, parseInt(P.page || '1', 10) || 1), scale = 1.4, rendered = {};
  function render(n) {
    if (!doc || n < 1 || n > doc.numPages || rendered[n]) return Promise.resolve();
    rendered[n] = 1;
    return doc.getPage(n).then(function (pg) {
      var dpr = window.devicePixelRatio || 1; var vp = pg.getViewport({ scale: scale * dpr });
      var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + 'px';
      var wrap = document.createElement('div'); wrap.className = 'pg'; wrap.id = 'p' + n; wrap.appendChild(c);
      var s = document.createElement('span'); s.textContent = n; wrap.appendChild(s);
      var after = null; Object.keys(rendered).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) { if (k > n && !after) after = document.getElementById('p' + k); });
      $('pages').insertBefore(wrap, after);
      return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    });
  }
  function go(n) {
    if (!doc) return; n = Math.min(doc.numPages, Math.max(1, n)); cur = n; $('num').value = n;
    var el = document.getElementById('p' + n);
    var p = el ? Promise.resolve() : render(n).then(function () { return render(n + 1); });
    p.then(function () { var e = document.getElementById('p' + n); if (e) e.scrollIntoView({ block: 'start' }); });
  }
  function rerender() { rendered = {}; $('pages').innerHTML = ''; go(cur); }
  $('prev').onclick = function () { go(cur - 1); }; $('next').onclick = function () { go(cur + 1); };
  $('num').onchange = function () { go(parseInt($('num').value, 10) || 1); };
  $('zin').onclick = function () { scale = Math.min(3, scale + 0.2); rerender(); }; $('zout').onclick = function () { scale = Math.max(0.6, scale - 0.2); rerender(); };
  window.addEventListener('scroll', function () {
    if (!doc) return; if (window.innerHeight + window.scrollY > document.body.scrollHeight - 400) { var mx = Math.max.apply(null, Object.keys(rendered).map(Number)); if (mx < doc.numPages) render(mx + 1); }
  });
  // 掃描書的 PDF 多半沒有線性化，pdf.js 會從頭讀到尾；改成「平行分段下載整本＋存在瀏覽器快取」，第二次開就是秒開
  var meta = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(P.id) + '?fields=size,name,md5Checksum&supportsAllDrives=true&key=' + encodeURIComponent(P.key);
  function getAll(size, ver) {
    var ck = 'https://tn-pdf.local/' + P.id + '/' + (ver || size);
    var cacheP = window.caches ? caches.open('tn-pdf').catch(function () { return null; }) : Promise.resolve(null);
    return cacheP.then(function (c) {
      return (c ? c.match(ck) : Promise.resolve(null)).then(function (hit) {
        if (hit) { msg('從瀏覽器快取開啟…'); return hit.arrayBuffer(); }
        var CH = 8 << 20, N = Math.ceil(size / CH), parts = new Array(N), done = 0, next = 0;
        function one() { if (next >= N) return Promise.resolve(); var i = next++; var b0 = i * CH, b1 = Math.min(size, b0 + CH) - 1;
          return fetch(url, { headers: { Range: 'bytes=' + b0 + '-' + b1 } }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
            .then(function (ab) { parts[i] = new Uint8Array(ab); done += ab.byteLength; msg('第一次開啟，下載中 ' + Math.round(done / size * 100) + '%（' + Math.round(done / 1048576) + ' / ' + Math.round(size / 1048576) + ' MB）；之後會存在這台裝置，秒開'); return one(); }); }
        var w = []; for (var k = 0; k < Math.min(6, N); k++) w.push(one());
        return Promise.all(w).then(function () { var all = new Uint8Array(size), o = 0; parts.forEach(function (p) { all.set(p, o); o += p.length; });
          if (c) c.put(ck, new Response(all.slice(0), { headers: { 'Content-Type': 'application/pdf' } })).catch(function () {});
          return all.buffer; });
      });
    });
  }
  // 搜尋：有文字層的 PDF 逐頁比對；掃描書沒有文字層，改看「本站引用過的頁」
  var TXT = {}, scanned = null, job = 0;
  function pageText(n) { if (TXT[n] != null) return Promise.resolve(TXT[n]); return doc.getPage(n).then(function (pg) { return pg.getTextContent(); }).then(function (tc) { var t = tc.items.map(function (i) { return i.str; }).join('').replace(/\s+/g, ' '); TXT[n] = t; return t; }); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function search() {
    var q = $('fq').value.trim(); var my = ++job; var R = $('fres'); R.innerHTML = ''; if (!q || !doc) { $('fmsg').textContent = doc ? '' : '書還在載入，等一下再搜尋。'; return; }
    if (scanned) { $('fmsg').textContent = '這本是掃描書，沒有文字層，無法搜尋文字；可以用下面「本站引用過的頁」。'; return; }
    var n = 1, hits = 0, chars = 0, qs = q.replace(/\s+/g, ' ');
    (function next() {
      if (my !== job) return;
      if (n > doc.numPages || hits >= 200) { $('fmsg').textContent = hits ? '找到 ' + hits + ' 處' + (hits >= 200 ? '（只列前 200 處）' : '') : '找不到「' + q + '」。'; return; }
      $('fmsg').textContent = '搜尋中… 第 ' + n + ' / ' + doc.numPages + ' 頁，已找到 ' + hits + ' 處';
      pageText(n).then(function (t) {
        chars += t.length;
        if (n === Math.min(8, doc.numPages) && chars < 30) { scanned = true; $('fmsg').textContent = '這本是掃描書，沒有文字層，無法搜尋文字；可以用下面「本站引用過的頁」。'; return; }
        var i = t.indexOf(qs), pg = n;
        while (i >= 0 && hits < 200) { hits++; var a = Math.max(0, i - 24), sn = esc(t.slice(a, i)) + '<mark>' + esc(qs) + '</mark>' + esc(t.slice(i + qs.length, i + qs.length + 24));
          var li = document.createElement('li'); li.innerHTML = '<button type="button"><b>p.' + pg + '</b>' + sn + '</button>'; li.firstChild.onclick = (function (p) { return function () { go(p); }; })(pg); R.appendChild(li); i = t.indexOf(qs, i + qs.length); }
        n++; setTimeout(next, 0);
      }).catch(function () { n++; setTimeout(next, 0); });
    })();
  }
  $('fbtn').onclick = function () { var on = $('find').classList.toggle('on'); $('fbtn').setAttribute('aria-expanded', on ? 'true' : 'false'); if (on) $('fq').focus(); };
  $('fgo').onclick = search; $('fq').onkeydown = function (e) { if (e.key === 'Enter') search(); };
  (function () { var L = []; try { L = JSON.parse(localStorage.getItem('tn-cites-' + (P.bk || '')) || '[]'); } catch (e) { L = []; }
    if (!L.length) return; $('ch').hidden = false; $('ch').textContent = '本站引用過的頁（' + L.length + ' 處，點了跳頁）';
    L.forEach(function (c) { var li = document.createElement('li'); li.innerHTML = '<button type="button"><b>p.' + c[0] + '</b>' + esc(c[1]) + '</button>'; li.firstChild.onclick = function () { if (!doc) { cur = c[0]; $('fmsg').textContent = '書載入完會開到第 ' + c[0] + ' 頁。'; return; } go(c[0]); }; $('cites').appendChild(li); }); })();
  fetch(meta).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (m) {
    if (!P.t && m.name) { $('title').textContent = m.name; document.title = m.name; }
    return getAll(+m.size, m.md5Checksum);
  }).then(function (buf) {
    msg('排版中…'); return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  }).then(function (d) {
    doc = d; $('tot').textContent = '/ ' + d.numPages; msg(''); go(cur);
  }).catch(function (e) {
    var s = String(e && (e.message || e));
    var back = '　可以先按右上「在雲端硬碟開啟」，手動翻到第 ' + cur + ' 頁。';
    if (/Failed to fetch|NetworkError|Load failed/.test(s)) {
      // 下載被 Google 限流或網路擋住時，改用雲端硬碟內建預覽（不能自動跳頁，但能直接看）
      msg('直接下載被 Google 暫時擋住，已改用雲端硬碟預覽；請在下方往下捲到第 ' + cur + ' 頁（過一陣子再開，通常就能自動跳頁）。');
      var f = document.createElement('iframe'); f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(P.id) + '/preview';
      f.style.cssText = 'width:100%;height:calc(100vh - 120px);border:0;background:#fff'; f.allow = 'autoplay';
      $('pages').appendChild(f); return;
    }
    msg((/403|401/.test(s) ? '無法讀取：請確認這個檔案已設成「知道連結的任何人都能查看」，以及 API 金鑰已啟用 Google Drive API、允許本網站使用。' : /404/.test(s) ? '找不到檔案：連結可能已失效或檔案被移除。' : /Failed to fetch/.test(s) ? 'Google 雲端硬碟暫時拒絕下載（短時間內下載量太大時會限流，通常過一陣子就恢復）。' : '載入失敗：' + s) + back);
  });
})();
</script>
</body>
</html>
